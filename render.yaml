services:
  - type: web
    name: imageforge
    runtime: node
    # Starter ($7/mo, 0.5 vCPU / 512MB): always-on, no 750-hour monthly cap and
    # no spin-down cold starts. Sophie's call, Aug 2026. If this service is
    # Blueprint-managed, a sync applies it; otherwise set the instance type in
    # the dashboard (Settings -> General -> Instance Type) and this keeps the
    # repo from reverting it later.
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    # A DEPLOY MUST NOT KILL A DRAW (2026-09-02). Render sends the old
    # instance SIGTERM 60s after the new one is up and SIGKILL after this
    # many seconds; server.js holds on SIGTERM while anything is drawing or
    # cutting (shutdown-hold.js). 300 is Render's maximum without a support
    # ticket. Also set live by API the same night — this keeps a Blueprint
    # sync from reverting it.
    maxShutdownDelaySeconds: 300
    envVars:
      # Set the values in the Render dashboard — never commit real keys.
      - key: OPENAI_API_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
