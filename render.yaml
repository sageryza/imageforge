services:
  - type: web
    name: imageforge
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # Set the values in the Render dashboard — never commit real keys.
      - key: OPENAI_API_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
