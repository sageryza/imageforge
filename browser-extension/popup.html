<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 280px; margin: 0; padding: 14px;
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #2b2b2b; background: #faf8f3; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  p.sub { color: #6b6459; margin: 0 0 12px; font-size: 12px; }
  label { display: block; font-weight: 600; margin: 10px 0 3px; }
  input { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #e2ded5;
    border-radius: 6px; font-size: 13px; background: #fff; }
  button { margin-top: 14px; width: 100%; border: none; border-radius: 6px; background: #c98b3a;
    color: #fff; font-weight: 600; font-size: 14px; padding: 10px; cursor: pointer; }
  #saved { color: #2f7d4f; font-size: 12px; margin-top: 8px; min-height: 14px; }
</style>
</head>
<body>
  <h1>🌿 Send to Deck Factory</h1>
  <p class="sub">On midjourney.com, click the floating button to send the images on the page into this batch.</p>

  <label for="endpoint">App URL</label>
  <input id="endpoint" type="text" placeholder="https://imageforge-q125.onrender.com">

  <label for="token">Studio token</label>
  <input id="token" type="password" placeholder="your STUDIO_TOKEN">

  <label for="batch">Batch name</label>
  <input id="batch" type="text" placeholder="houseplants">

  <label for="keyword">Keyword (optional)</label>
  <input id="keyword" type="text" placeholder="calathea">

  <button id="save">Save</button>
  <div id="saved"></div>

  <script src="popup.js"></script>
</body>
</html>
