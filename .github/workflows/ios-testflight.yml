name: iOS TestFlight

# Builds the ImageForge app on a cloud macOS runner, signs it with the App Store
# Connect API key, and uploads it to TestFlight. No local Mac required.
#
# MANUAL ONLY for now (workflow_dispatch): TestFlight builds currently run from
# the `ImageForge TestFlight` workflow in the memory-library-react repo, which
# already holds the App Store Connect secrets. This workflow is kept here ready
# to take over once the three secrets are added to THIS repo — at which point you
# can re-add a `push` trigger for auto-builds. It is intentionally not on `push`
# so it can't auto-fail (red X) while the secrets are absent.
#
# Requires three repo secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (.p8, base64).
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: 5XR23N2CBH
      APP_NAME: "ImageForge"
      # Firebase pulls in ~14 SPM packages, so `xcodebuild -showBuildSettings`
      # is slow; give fastlane room instead of its 3s default.
      FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
      FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Apple requires builds made with the iOS 26 SDK (Xcode 26+). Select the
      # newest Xcode on the runner and fail fast if it's older than 26.
      - name: Select newest Xcode (need 26+)
        run: |
          echo "Installed Xcodes:"; ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Selecting $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          MAJOR=$(xcodebuild -version | sed -n 's/^Xcode \([0-9]*\).*/\1/p')
          if [ "$MAJOR" -lt 26 ]; then
            echo "::error::App Store needs Xcode 26+, but newest on this runner is $MAJOR"
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build & upload to TestFlight
        working-directory: ios
        run: fastlane beta
