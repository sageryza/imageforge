<h1>First three scenes v1 — the cafe, the accident, the ride</h1>
<div class="card"><h2>The cafe</h2>
<textarea id="t1" data-key="scene1.t" spellcheck="false">Seedance 2.0 Mini · Atlas · 480p · 3:4 · shortest length that fits the clip. Photorealistic, natural skin, restrained color, no captions, no music. References by slot only, never described in the prompt. Hot sunny day. Robert: brown baseball cap, dark sunglasses (left on the cafe table from A005 on), very oversized baggy sweatpants. Woman: frumpy frock, dark bangs, chipped black nail polish, no bag.

A001 · Woman across the street · 8s
Open: Robert approaches cafe in brown cap and dark glasses; woman remains behind a parked car on opposite pavement.
Shoot: Medium Robert POV across road: a small guarded glimpse of woman watching, then hold on his wary reaction.
Say: Robert VO: There was that woman again. Short, kind of - stubby looking - and wearing a frock that could only be described as frumpy.
End: She stays across the street, not beside him. Robert remains outside cafe.

A003 · Script at table by door · 8s
Open: Robert at table immediately beside exit, cap and sunglasses worn, one latte and manuscript on table.
Shoot: Settles the script, takes one sip, then looks through window before reading.
Say: Robert VO: I doubted anyone would recognize me today. And if they did, they’d probably just run away in horror.
End: Latte lowered, script untouched; gaze outside.

A004 · Overturned waistbands · 10s
Open: Robert watching through cafe window.
Shoot: His window POV: several adults pass with inside-out rolled waistbands; focus the phone man crossing, gesticulating while talking.
Say: nothing
End: Phone man entering crossing, glasses intact, phone at ear.

A005 · Fogged sunglasses · 7s
Open: Robert at table; man crossing outside.
Shoot: Close-up latte steam fogs glasses. Robert removes them to table and turns toward barista for a napkin.
Say: nothing
End: Sunglasses on cafe table; cap stays on head; Robert turned away from window.

A006 · Screech and aftermath · 8s
Open: Robert turned from street, sunglasses on table.
Shoot: Offscreen tire screech. He whips back; through window reveal phone man already on road, car stopped about two feet to his left. Do not depict impact.
Say: nothing
End: Man on roadway, glasses askew; Robert reacting at table.</textarea>

<div class="card"><h2>The accident</h2>
<textarea id="t2" data-key="scene2.t" spellcheck="false">Seedance 2.0 Mini · Atlas · 480p · 3:4 · shortest length that fits the clip. Photorealistic, natural skin, restrained color, no captions, no music. References by slot only, never described in the prompt. Hot sunny day. Robert: brown baseball cap, dark sunglasses (left on the cafe table from A005 on), very oversized baggy sweatpants. Woman: frumpy frock, dark bangs, chipped black nail polish, no bag.

A007 · Robert reaches the man · 10s
Open: Robert rises beside cafe door; injured man outside.
Shoot: Single tracked movement: Robert pushes cafe door open and hurries to man. Hit-and-run car leaves in background, unidentifiable plate.
Say: nothing
End: Robert beside man; cap on, sunglasses left inside; broken phone a few feet away.

A008 · Heaven · 10s
Open: Robert hovering uncertainly over responsive man; shattered phone on roadway.
Shoot: Low medium at man: his arm twitches toward broken phone, then eyes focus on Robert.
Say: Pedestrian: Robert Pattinson? Am I - in heaven?
End: Man remains on road, conscious enough to speak; Robert unsure.

A010 · License plate question · 15s
Open: Robert beside injured man; woman has approached.
Shoot: Two-shot angled toward woman: Robert asks; she gapes, then offers uncertain fragments.
Say: Robert: Hey! Did you see the plate of the guy who hit him? / Woman: Oh yeah - kind of - it was - J. 7. 9.
End: Woman still mid-answer after J. 7. 9.; Robert waits, victim unchanged.

A011 · Uncertain numbers · 15s
Open: Woman mid-answer; neither has moved victim.
Shoot: Hold woman as she revises the fragments; Robert cuts through confusion.
Say: Woman: Or…9…7…J…something like that / Robert: We have to get him to a hospital. / Woman: Oh, alright. I can take him.
End: Woman offers to drive, Robert still by victim.

A013 · Awkward lift · 12s
Open: Victim on road; Robert kneels near shoulders.
Shoot: Medium full-body: Robert supports and awkwardly hoists upper body toward nearby sidewalk, visibly straining. Sparse cars pause; he waves them onward. He silently mouths exactly: “it’s handled, it’s being handled.” Do not add an audible line.
Say: Robert VO: Oh, sure I went to the gym every morning. Or at least it looked like I did.
End: Victim at curb with Robert supporting upper body.

A016 · She takes charge · 12s
Open: Wagon stationary, driver door open; victim at curb.
Shoot: Woman begins patiently dragging/supporting man toward rear curb-side door; Robert protests, sirens distant.
Say: Robert: Wait! What are you doing? The ambulance is on its way. / Woman: Are they?
End: Victim between sidewalk and rear door; no loading completed yet.

A017 · Into the rear seat · 15s
Open: Woman supporting man by rear curb-side door; Robert close by.
Shoot: She states urgency, then loads him alone into rear seat with effort, non-graphic. This loading position is a marked production assumption.
Say: Woman: We have to get him to a hospital.
End: Man lies/reclines in rear seat; rear door closed; woman returns to driver side.

A018 · Are you coming · 8s
Open: Woman waiting beside open driver door; injured man in rear.
Shoot: Woman asks; Robert looks toward distant sirens and hesitates, weighing responsibility rather than attraction.
Say: Woman: Are you coming?
End: Robert starts toward right front passenger door.</textarea>

<div class="card"><h2>The ride</h2>
<textarea id="t3" data-key="scene3.t" spellcheck="false">Seedance 2.0 Mini · Atlas · 480p · 3:4 · shortest length that fits the clip. Photorealistic, natural skin, restrained color, no captions, no music. References by slot only, never described in the prompt. Hot sunny day. Robert: brown baseball cap, dark sunglasses (left on the cafe table from A005 on), very oversized baggy sweatpants. Woman: frumpy frock, dark bangs, chipped black nail polish, no bag.

A019 · Front passenger seat · 10s
Open: Woman at left driver door; Robert at right front passenger door.
Shoot: Both get in their respective front seats. Tight interior establishes cracked leather and mustard stains. Doors close.
Say: nothing
End: Woman driving position LEFT, Robert front passenger RIGHT, victim in rear.

A020 · Stubborn belt · 12s
Open: Wagon stationary or just beginning departure; Robert handling passenger belt.
Shoot: He unsuccessfully pulls belt, gives up; woman offers instruction without looking at him.
Say: Woman: The seat belt works, you just have to yank it a couple times. / Robert: Ok, thanks.
End: Robert belt unfastened, no fastening shown; driver hands ready on wheel.

A023 · Edward kissed bella · 10s
Open: Robert holds ragged annotated page over passenger lap.
Shoot: Close exact page words, underlines/arrows; Robert reads top line with dawning alarm. Any exact readable page insert can be composited, not hallucinated.
Say: Robert: What’s thisEdward kissed bella / Robert VO: Oh no. Oh no. This couldn’t be happening. This was a bad dream.
End: Page remains in Robert hand; woman looking ahead.

A024 · Her name · 12s
Open: Robert in right passenger seat with page, woman driving.
Shoot: Medium interior, his false casualness against her fixed forward gaze.
Say: Robert: Hey - you! Um - sorry, I didn’t quite catch your name / Woman: Paige
End: She has answered Paige; no reciprocal question.

A025 · How far to hospital · 10s
Open: Woman white-knuckled at wheel; Robert sees her nervousness.
Shoot: Two close angles without crossing seating axis; she briefly glances at him, eyes widen, returns gaze to road.
Say: Robert: Err…how far is the hospital? / Woman: Oh, it’s not far
End: Car continues; victim last known in rear. No hospital arrival supplied.</textarea>

<script>
(function(){
var CHAT='og-scripts-critique', SHEET='first-scenes-v1', LIMIT=8000;
function post(b){ return fetch('/api/chatfeed/verdict',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}); }
function wire(ta,sv){
  var key=ta.dataset.key, timer;
  function fit(){ var h=ta.scrollHeight; if(Math.abs(h-ta.offsetHeight)>2){ ta.style.height='auto'; ta.style.height=ta.scrollHeight+'px'; } }
  function bad(m){ sv.textContent=m; sv.classList.add('bad'); } function good(m){ sv.textContent=m; sv.classList.remove('bad'); }
  // A SAVE IS READ BACK, NEVER TRUSTED: nothing is cut on the way out; over LIMIT the box refuses and says by how much; after every save the sheet is re-read.
  function save(t){ if(t.length>LIMIT){ bad('NOT SAVED — '+(t.length-LIMIT)+' characters over the box limit of '+LIMIT); return; }
    post({chat:CHAT,sheet:SHEET,item:key,text:t}).then(function(r){return r.json();}).then(function(j){
      return fetch('/api/chatfeed/verdict?chat='+encodeURIComponent(CHAT)+'&sheet='+encodeURIComponent(SHEET)).then(function(r){return r.json();}).then(function(d){ var kept=(d.texts||{})[key]; if(typeof kept==='string' && kept.length<t.length) throw new Error('short'); good('saved'); });
    }).catch(function(e){ bad(e && e.message==='short' ? 'NOT SAVED WHOLE — the server kept less than you typed; copy your text somewhere safe' : 'not saved'); }); }
  ta.addEventListener('input',function(){ fit(); sv.textContent='…'; clearTimeout(timer); timer=setTimeout(function(){ save(ta.value); },700); });
  ta.__fit=fit; setTimeout(fit,0);
}
var tas=[].slice.call(document.querySelectorAll('textarea'));
tas.forEach(function(ta){ wire(ta, document.getElementById('sv'+ta.id.slice(1))); });
// her edit wins over the posted words
fetch('/api/chatfeed/verdict?chat='+encodeURIComponent(CHAT)+'&sheet='+encodeURIComponent(SHEET)).then(function(r){return r.json();}).then(function(d){
  var T=d.texts||{}; tas.forEach(function(ta){ var k=ta.dataset.key; if(typeof T[k]==='string' && T[k].trim()){ ta.value=T[k]; ta.__fit(); } });
}).catch(function(){});
window.addEventListener('load',function(){ tas.forEach(function(ta){ ta.__fit(); }); });
})();
</script>
