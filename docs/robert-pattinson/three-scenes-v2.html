<div class="wrap">
<h1>Three scenes v2 — the cupcake, the valentine, the guard</h1>
<div class="card"><h2>One cupcake on the floor</h2>
<textarea id="t1" data-key="scene1.t" spellcheck="false">Seedance 2.0 Mini · Atlas · 480p · 3:4 · shortest length that fits the clip. Photorealistic, natural skin, restrained color, no captions, no music. References by slot only, never described in the prompt. Ralphs, storm outside, both damp. Robert: long black coat. Woman: frumpy coat, glasses, dark bangs. Cupcakes: 24-pack, yellow bases, white icing, sparse pink and purple sprinkles.

E010 · One cupcake between them · 12s
Open: Both seated, source 24-pack sealed in bag; Robert has candles/matches nearby.
Shoot: Woman slides bag within reach; Robert removes pack, opens shrieking lid and places ONE cupcake exactly between them.
Say: nothing
End: Open tray 23 remaining beside pair, one intact cupcake centered; no candle yet.

E011 · First candle setup · 8s
Open: One cupcake between them, open pack 23 remaining; candle and matchbox nearby.
Shoot: Continuity insertion: Robert puts one small candle in cupcake and lights it with match; safely extinguishes spent match.
Say: nothing
End: One lit candle between faces, matchbox and spent match on floor; store lights remain on.

E012 · Make a wish · 8s
Open: Candle lit between them; tray 23+one; she gazes contentedly, he expectant.
Shoot: Close Robert looking across flame, eyes bright as in restaurant.
Say: Robert: Now, Make a wish.
End: He waits; she has not spoken or blown candle out.

E013 · Knees touch · 10s
Open: Both seated directly opposite, knees close but not touching, candle safely offset from knees; flame lit.
Shoot: Woman looks at their knees without speaking. Robert unconsciously scoots forward a little until knees meet; waits for wish.
Say: nothing
End: Knees touching, candle still lit, no kiss, no magical flash.

E014 · What did you wish · 15s
Open: Knees touching, both still seated; flame lit.
Shoot: His impatience meets her embarrassed hesitation; let her answer emerge slowly.
Say: Robert: What did you wish for? / Woman: I wished… / Robert: Yes? / Woman: I wished for…for our knees to touch,
End: She has admitted wish, blushing; knees stay touching.

E015 · Unconscious movements · 10s
Open: Knees touching, admission made, candle lit.
Shoot: Robert smacks his own face once, exasperated at ambiguous proof rather than furious at her.
Say: Robert: Right, of course, And me with my unconscious movements.
End: Hand lowered; he is ready to try again.</textarea>
<div class="sv" id="sv1"></div></div>
<div class="card"><h2>The valentine</h2>
<textarea id="t2" data-key="scene2.t" spellcheck="false">Seedance 2.0 Mini · Atlas · 480p · 3:4 · shortest length that fits the clip. Photorealistic, natural skin, restrained color, no captions, no music. References by slot only, never described in the prompt. Earlier day, a separate fan. Robert as himself, no disguise.

V001 · Scissors reveal · 8s
Open: Earlier day. Separate adult fan holds scissors and magazine pieces; Robert faces her.
Shoot: Close hands: scissors cut a Robert photo for the white-doily valentine of magazine cutouts (“the awful doilie thing”). Robert’s initial alarm eases slightly.
Say: nothing
End: Scissors remain in fan’s hand; completed collage remains with her.

V002 · Valentine handover · 8s
Open: Fan has finished collage; Robert stands facing her.
Shoot: She offers the collage. He accepts and produces an unconvincingly beaming smile. Fan’s background babbling is indistinct, not invented dialogue.
Say: Robert: Thank you.
End: Robert holds valentine; fan withdraws.

V003 · Valentine on white fridge · 6s
Open: Robert home, collage in one hand; plain white fridge empty at the chosen position.
Shoot: Close hand fixes the collage to the fridge with the chosen magnet.
Say: nothing
End: Valentine mounted straight at fixed height; hand leaves.

V004 · A private laugh · 6s
Open: A later moment in same earlier recollection; valentine still mounted.
Shoot: Medium from farther back: Robert passes the fridge, notices valentine and gives a short private laugh.
Say: nothing
End: Valentine remains mounted, no rearrangement.

V005 · Eventually discarded · 7s
Open: Another later moment; valentine still on fridge.
Shoot: Close hand removes valentine, retains magnet on fridge, drops collage into adjacent bin.
Say: nothing
End: Valentine in bin; fridge no longer displays it. End recollection.</textarea>
<div class="sv" id="sv2"></div></div>
<div class="card"><h2>The guard</h2>
<textarea id="t3" data-key="scene3.t" spellcheck="false">Seedance 2.0 Mini · Atlas · 480p · 3:4 · shortest length that fits the clip. Photorealistic, natural skin, restrained color, no captions, no music. References by slot only, never described in the prompt. Ralphs, storm outside, both damp. Robert: long black coat. Woman: frumpy coat, glasses, dark bangs. Cupcakes: 24-pack, yellow bases, white icing, sparse pink and purple sprinkles.

E005 · Flood warning · 12s
Open: Woman with shopping bag near checkout, Robert away; storm intensifies.
Shoot: Hold her listening, then look through storefront at palm fronds falling near parked wagon. Announcement is tinny PA, not a visible speaker.
Say: PA voice: Flood Warning. Please stay put. Do not travel unless absolutely necessary.
End: One frond near wagon; entrance not yet permanently jammed.

E006 · Candles returned · 12s
Open: Woman near exit with bag; guard at entrance.
Shoot: Robert returns carrying birthday candles and drawer matchbox, moves toward exit and pleads; guard raises hand to stop him.
Say: Robert: But…we need to leave, / Guard: No. Absolutely not.
End: Exit physically blocked by guard; Robert still has candles/matches.

E007 · Cullen recognition · 15s
Open: Guard between Robert and exit, hand raised; woman behind Robert with bag.
Shoot: Guard recognizes him with self-satisfaction and folds arms, not aggression. Robert visibly contracts into himself.
Say: Guard: Wait a second, You’re that Cullen guy. My daughter’s always talking about you. I seen you on the TV, why, it was just last week, I think.
End: Robert trapped and recognized; guard arms folded.

E008 · Slunk away · 12s
Open: Robert facing guard, recognition landed; woman following.
Shoot: He abandons attempted correction, turns and retreats into snack aisle; woman follows with bag.
Say: Robert: Oh no, that’s not. Oh, this is not good. not good at all.
End: Away from entrance among chips and graham crackers, near juice shelves.</textarea>

<script>
(function(){
var CHAT='og-scripts-critique', SHEET='three-scenes-v2', LIMIT=8000;
function post(b){ return fetch('/api/chatfeed/verdict',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}); }
function wire(ta,sv){
  var key=ta.dataset.key, timer;
  function fit(){ var h=ta.scrollHeight; if(Math.abs(h-ta.offsetHeight)>2){ ta.style.height='auto'; ta.style.height=ta.scrollHeight+'px'; } }
  function bad(m){ sv.textContent=m; sv.classList.add('bad'); } function good(m){ sv.textContent=m; sv.classList.remove('bad'); }
  // A SAVE IS READ BACK, NEVER TRUSTED: nothing is cut on the way out; over LIMIT the box refuses and says by how much; after every save the sheet is re-read.
  function save(t){ if(t.length>LIMIT){ bad('NOT SAVED — '+(t.length-LIMIT)+' characters over the box limit of '+LIMIT); return; }
    post({chat:CHAT,sheet:SHEET,item:key,text:t}).then(function(r){return r.json();}).then(function(j){
      return fetch('/api/chatfeed/verdict?chat='+encodeURIComponent(CHAT)+'&sheet='+encodeURIComponent(SHEET)).then(function(r){return r.json();}).then(function(d){ var kept=(d.texts||{})[key]; if(typeof kept==='string' && kept.length<t.length) throw new Error('short'); good('saved'); });
    }).catch(function(e){ bad(e && e.message==='short' ? 'NOT SAVED WHOLE — the server kept less than you typed; copy your text somewhere safe' : 'not saved'); }); }
  ta.addEventListener('input',function(){ fit(); sv.textContent='…'; clearTimeout(timer); timer=setTimeout(function(){ save(ta.value); },700); });
  ta.__fit=fit; setTimeout(fit,0);
}
var tas=[].slice.call(document.querySelectorAll('textarea'));
tas.forEach(function(ta){ wire(ta, document.getElementById('sv'+ta.id.slice(1))); });
// her edit wins over the posted words
fetch('/api/chatfeed/verdict?chat='+encodeURIComponent(CHAT)+'&sheet='+encodeURIComponent(SHEET)).then(function(r){return r.json();}).then(function(d){
  var T=d.texts||{}; tas.forEach(function(ta){ var k=ta.dataset.key; if(typeof T[k]==='string' && T[k].trim()){ ta.value=T[k]; ta.__fit(); } });
}).catch(function(){});
window.addEventListener('load',function(){ tas.forEach(function(ta){ ta.__fit(); }); });
})();
</script>
