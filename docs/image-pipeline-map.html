<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The image pipeline</title>
<link rel="stylesheet" href="/compare.css">
<style>
  /* The blush board + road language is the content pipeline's (v8, the
     s-curve-content-pipeline chat). This is its IMAGE sibling: the same road,
     the same cut-out drawings, exploded out of that map's abbreviated image
     stops (WINDOW / WOODEN / GOLD / WTR WASH) into the six the picture work
     really walks, plus the lap. Keep the family looking like one thing — if
     the road changes there, change it here. Geometry notes are in
     docs/image-pipeline.md. */
  :root {
    --blush: #f7ebe7; --blush2: #ecd7d2; --track: #e0c6bf;
    --road: #f1dfda; --edge: #d9bcb4;
    --goldfill: #c9a961; --blushink: #6f5450;
  }
  h1 {
    font: 600 21px/1.25 -apple-system, 'Helvetica Neue', sans-serif;
    letter-spacing: .045em; text-transform: uppercase; margin-bottom: 10px;
  }
  /* the hairline tabs (the account-row pattern). The 56px reserve is
     load-bearing — this row sits inside the pill's band; the sliding line
     measures (100% - 56px)/4 because an abspos child resolves against the
     PADDING box, and there are FOUR tabs. */
  .tabs {
    position: relative; display: flex; border-bottom: 1px solid #e6d2cd;
    margin: 0 0 14px; padding-right: 56px;
  }
  .tab {
    flex: 1 1 0; min-width: 0; padding: 7px 4px 9px;
    border: none; background: none; cursor: pointer;
    font: 10px/1 -apple-system, sans-serif; letter-spacing: .08em;
    text-transform: uppercase; color: var(--ink2);
    -webkit-tap-highlight-color: transparent;
  }
  .tab.on { color: var(--ink); }
  .tabs::after {
    content: ''; position: absolute; left: 0; bottom: -1px; height: 2px;
    width: calc((100% - 56px) / 4); background: var(--ink);
    transform: translateX(0); transition: transform .2s ease;
  }
  .tabs[data-on="1"]::after { transform: translateX(100%); }
  .tabs[data-on="2"]::after { transform: translateX(200%); }
  .tabs[data-on="3"]::after { transform: translateX(300%); }
  .board {
    position: relative; background: var(--blush); border: 1px solid #e6d2cd;
    border-radius: 6px; padding: 8px 2px 10px;
  }
  .board svg { display: block; width: 100%; height: auto; }
  .stoplist { display: flex; flex-direction: column; gap: 6px; }
  .seg {
    font: 600 10px/1 -apple-system, sans-serif; letter-spacing: .12em;
    text-transform: uppercase; color: #8a6238; margin: 10px 2px 2px;
  }
  .stop {
    position: relative; display: flex; align-items: center; gap: 10px;
    background: var(--blush); border: 1.5px solid var(--track);
    border-radius: 6px; padding: 9px 30px 9px 10px;
    color: inherit; text-decoration: none;
  }
  .stop svg.g { flex: 0 0 40px; width: 40px; height: 40px; }
  .stop img.th { flex: 0 0 40px; width: 40px; height: 40px; object-fit: cover; border-radius: 4px; }
  .stop .nm {
    font: 600 11px/1.2 -apple-system, sans-serif; letter-spacing: .09em;
    text-transform: uppercase; color: var(--blushink);
  }
  .stop .what { font: 12px/1.35 Georgia, serif; color: var(--ink2); }
  /* a stage with no tool (or only a partial one) reads differently — dashed */
  .stop.none { border-style: dashed; }
  /* the lap row is inset under the stop it cycles with, and carries a join
     mark, so the list reads the way the map does */
  .stop.feed { margin-left: 20px; }
  .stop.feed::before {
    content: ''; position: absolute; left: -14px; top: 50%;
    width: 12px; height: 1.5px; background: var(--track);
  }
  .stop .tag {
    font: 700 8.5px/1 -apple-system, sans-serif; letter-spacing: .08em;
    text-transform: uppercase; color: var(--rose); border: 1px solid var(--rose);
    border-radius: 3px; padding: 2px 4px; margin-left: 6px; display: inline-block;
    vertical-align: 1px;
  }
  .gap { border: 1.5px solid var(--track); border-radius: 6px; padding: 8px 10px; margin: 6px 0; }
  .gap .f { font: 600 12px/1.3 -apple-system, sans-serif; color: var(--ink); }
  .gap .who { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 4px; }
  .gap .w {
    font: 600 9px/1 -apple-system, sans-serif; letter-spacing: .06em;
    text-transform: uppercase; color: var(--blushink);
    border: 1px solid var(--track); border-radius: 3px; padding: 3px 5px;
  }
  .gap .w.no { color: var(--rose); border-color: var(--rose); }
  .gap.hole { border-color: var(--rose); }
</style>

<div class="wrap">
  <h1>The image pipeline v1</h1>

  <div class="tabs" id="tabs" data-on="0" data-nostop>
    <button class="tab on" data-tab="0" type="button">Map</button>
    <button class="tab" data-tab="1" type="button">Stops</button>
    <button class="tab" data-tab="2" type="button">Gaps</button>
    <button class="tab" data-tab="3" type="button">Wardrobe</button>
  </div>

  <div id="view-map">
    <div class="board" data-item="image-map" data-nostop>
      <svg id="path" viewBox="0 0 440 495" role="img" aria-label="the image pipeline map"></svg>
    </div>
  </div>

  <div id="view-stops" hidden>
    <div class="stoplist" id="stoplist" data-nostop></div>
  </div>

  <div id="view-gaps" hidden>
    <div id="gaplist" data-nostop></div>
  </div>

  <div id="view-rack" hidden>
    <div class="stoplist" id="racklist" data-nostop></div>
  </div>
</div>

<script src="/compare.js"></script>
<script>
(function () {
  var SVG = 'http://www.w3.org/2000/svg';
  var C = { node: '#ecd7d2', road: '#f1dfda', edge: '#d9bcb4',
            gold: '#c9a961', ink: '#6f5450' };

  /* Every stop on the ROAD, in walking order, with `at` = where it sits along
     the path as a FRACTION of total length. THE POSITIONS ARE CHOSEN, NOT
     EVENLY SPREAD (the family rule): the road extremes land on 0.2 / 0.4 /
     0.6 / 0.8, and 0.4 / 0.8 are the LEFT extremes with the wide gutter
     beside them. WINDOW is pinned to 0.40 because the lap needs that gutter
     for RED WORDS; GOLD is pinned to 0.80 because the out-arrow needs it for
     the projects. `none` = the stage is real but no tool (or only a partial
     one) is built. The walker on this road is the PROMPT — the pictures are
     its footprints — which is why the road ends at the bank, not the picture. */
  var STOPS = [
    { id: 'words',    label: 'WORDS',    art: 'words',    at: 0.01, none: 'no tool',
      what: 'the content prompt gets written — what is in the picture, no style yet. a chat writes it with you today' },
    { id: 'window',   label: 'WINDOW',   art: 'window',   at: 0.40, none: 'pastel only', href: '/vector',
      what: 'her spec verbatim: one low sheet cut into four frames, each literally half a cent — does the idea read?' },
    { id: 'wardrobe', label: 'WARDROBE', art: 'wardrobe', at: 0.60, href: '/playground',
      what: 'the settled content tries on styles, 2¢ a fitting — the content half never changes, only the hanger' },
    { id: 'wooden',   label: 'WOODEN',   art: 'wooden',   at: 0.73, href: '/playground',
      what: 'medium, 6¢ — the chosen telling rendered properly. often the keeper (the NDE watercolours live here)' },
    { id: 'gold',     label: 'GOLD',     art: 'gold',     at: 0.80, href: '/playground',
      what: 'high, 25¢ — the only expensive call on the road. the picture leaves for its project here' },
    { id: 'treasury', label: 'TREASURY', art: 'treasury', at: 0.99, none: 'per-image only',
      what: 'the prompt banked: content half, style half, refs, size, quality — the rebuild recipe. the picture is a cache' },
  ];

  /* THE LAP — the only loop on any of the three maps. A probe comes back, the
     words change, the window runs again. Drawn as a cycle between WINDOW and
     a gutter node, because the reword pass is a real place the work goes. */
  var LAP = {
    id: 'redwords', label: 'RED WORDS', art: 'redwords', none: 'no tool',
    what: 'the lap — reword, run the window again. every changed word should show red, writing-room style; nothing records it for prompts yet',
  };

  /* what flows INTO the first stop (the family's left-gutter gesture) */
  var SOURCES = ['chat', 'mic', 'book'];

  function el(n, a) {
    var e = document.createElementNS(SVG, n);
    for (var k in a) e.setAttribute(k, a[k]);
    return e;
  }

  /* ── the road ──────────────────────────────────────────────────────────
     v8's path verbatim — bowls joined at the centre line, tangent horizontal
     at every join and vertical at every extreme, drawn as a ROAD (the same
     path stroked twice, edges under surface). Only B changed: six stops need
     less height than ten. Do NOT re-derive the sweep flags — moving the
     start alone leaves the bowls curling the old way and the S comes out
     backwards. CX 270 on a 440 board keeps the wide left gutter. */
  var CX = 270, A = 140, B = 40, Y0 = 58, R = 22;
  var D = 'M' + (CX - A) + ' ' + Y0
        + 'A' + A + ' ' + B + ' 0 0 0 ' + CX + ' ' + (Y0 + B)
        + 'A' + A + ' ' + B + ' 0 1 1 ' + CX + ' ' + (Y0 + 3 * B)
        + 'A' + A + ' ' + B + ' 0 1 0 ' + CX + ' ' + (Y0 + 5 * B)
        + 'A' + A + ' ' + B + ' 0 1 1 ' + CX + ' ' + (Y0 + 7 * B)
        + 'A' + A + ' ' + B + ' 0 1 0 ' + CX + ' ' + (Y0 + 9 * B)
        + 'A' + A + ' ' + B + ' 0 0 1 ' + (CX + A) + ' ' + (Y0 + 10 * B);
  var svg = document.getElementById('path');

  /* The drawings are the content pipeline's own cut-outs — already made,
     already paid for, transparent background. Reusing them is what makes
     this map read as the same pipeline seen closer up. The two frames
     (wooden, gold) were repainted onto cut-outs for v8 for exactly these
     two stops. */
  var V = 'https://storage.googleapis.com/deckfactory-43176.firebasestorage.app/vector/';
  var CUT = V + 'pipeline-icons-cut/';
  var CUT2 = V + 'pipeline-icons-2-cut/';
  var ART = {
    words:    CUT2 + 'zine-cut.png',
    window:   CUT + 'window-cut.png',
    redwords: CUT2 + 'journal-cut.png',
    wardrobe: CUT2 + 'brush-cut.png',
    wooden:   V + 'pipeline-frames/wooden-wood-cut.png',
    gold:     V + 'pipeline-frames/gold-gilt-cut.png',
    treasury: CUT + 'inbox-cut.png',
    chat:     CUT2 + 'chat-cut.png',
    mic:      CUT2 + 'mic-cut.png',
    book:     CUT + 'book-cut.png',
    reel:     CUT + 'reel-cut.png',
    screen:   CUT2 + 'screen-cut.png',
  };

  // a cut-out drawing, fitted inside a box of side `s` and never cropped
  function cell(g, url, cx, cy, s) {
    g.appendChild(el('image', {
      href: url, x: cx - s / 2, y: cy - s / 2, width: s, height: s,
      preserveAspectRatio: 'xMidYMid meet',
    }));
  }

  function node(g, st, p, r) {
    var R2 = r || R;
    if (st.none) g.appendChild(el('rect', {
      x: p.x - R2, y: p.y - R2, width: R2 * 2, height: R2 * 2, rx: 5,
      fill: 'none', stroke: C.gold, 'stroke-width': 2, 'stroke-dasharray': '5 4' }));
    cell(g, ART[st.art], p.x, p.y, R2 * 2.1);
  }

  function label(p, txt, dy) {
    var lx = Math.max(52, Math.min(388, p.x));
    var t = el('text', { x: lx, y: p.y + (dy || R + 13), 'text-anchor': 'middle',
      fill: C.ink, 'paint-order': 'stroke', stroke: '#f7ebe7', 'stroke-width': 3 });
    t.style.font = '600 9.5px -apple-system, sans-serif';
    t.style.letterSpacing = '.07em';
    t.textContent = txt;
    return t;
  }

  // a small solid arrowhead at (x, y): dir 'left' points at smaller x
  function arrow(x, y, dir) {
    var s = dir === 'left' ? 1 : -1;
    return el('path', {
      d: 'M' + x + ' ' + y + 'l' + (7 * s) + ' -4v8z',
      fill: C.edge,
    });
  }

  function draw() {
    svg.textContent = '';
    svg.appendChild(el('path', { d: D, fill: 'none', stroke: C.edge, 'stroke-width': 27, 'stroke-linecap': 'round' }));
    svg.appendChild(el('path', { d: D, fill: 'none', stroke: C.road, 'stroke-width': 22, 'stroke-linecap': 'round' }));

    var track = el('path', { d: D, fill: 'none', stroke: 'none' });
    svg.appendChild(track);
    var L = track.getTotalLength();
    var pts = STOPS.map(function (st) {
      var p = track.getPointAtLength(st.at * L);
      return { x: p.x, y: p.y };
    });

    /* the sources come in from the left (the family gesture) */
    var p0 = pts[0], SX = 26, SR = 15;
    var src = [{ y: p0.y - 26 }, { y: p0.y + 12 }, { y: p0.y + 50 }];
    src.forEach(function (s) {
      svg.appendChild(el('path', {
        d: 'M' + (SX + SR + 1) + ' ' + s.y + 'Q' + (p0.x - 26) + ' ' + s.y + ' ' + (p0.x - R - 1) + ' ' + p0.y,
        fill: 'none', stroke: C.edge, 'stroke-width': 1.5 }));
    });
    src.forEach(function (s, i) {
      var g = el('g', {});
      cell(g, ART[SOURCES[i]], SX, s.y, SR * 2.1);
      svg.appendChild(g);
    });

    /* THE LAP — window ⇄ red words, a visible cycle in the left gutter.
       Two curves with arrowheads, one each way, so it reads as going around. */
    var wi = 1, wp = pts[wi], FX = 44, FR = 15;
    var midX = (wp.x - R + FX + FR) / 2;
    svg.appendChild(el('path', {
      d: 'M' + (wp.x - R - 1) + ' ' + (wp.y - 9)
       + 'Q' + midX + ' ' + (wp.y - 32) + ' ' + (FX + FR + 8) + ' ' + (wp.y - 9),
      fill: 'none', stroke: C.edge, 'stroke-width': 1.5 }));
    svg.appendChild(arrow(FX + FR + 2, wp.y - 9, 'left'));
    svg.appendChild(el('path', {
      d: 'M' + (FX + FR + 1) + ' ' + (wp.y + 9)
       + 'Q' + midX + ' ' + (wp.y + 32) + ' ' + (wp.x - R - 8) + ' ' + (wp.y + 9),
      fill: 'none', stroke: C.edge, 'stroke-width': 1.5 }));
    svg.appendChild(arrow(wp.x - R - 2, wp.y + 9, 'right'));
    var lg = el('g', {});
    node(lg, LAP, { x: FX, y: wp.y }, FR);
    svg.appendChild(lg);
    var lt = el('text', { x: FX, y: wp.y + FR + 15, 'text-anchor': 'middle',
      fill: C.ink, 'paint-order': 'stroke', stroke: '#f7ebe7', 'stroke-width': 3 });
    lt.style.font = '600 8.5px -apple-system, sans-serif';
    lt.style.letterSpacing = '.06em';
    lt.textContent = LAP.label;
    svg.appendChild(lt);

    /* THE OUT-ARROW at GOLD — the finished picture leaves for its project;
       the road walks on to the treasury without it. Same gutter, reversed
       direction: the arrows point AWAY from the road. */
    var gi = 4, gp = pts[gi], DX = 34, DR = 15;
    var dst = [{ y: gp.y - 24, art: 'reel' }, { y: gp.y + 24, art: 'screen' }];
    dst.forEach(function (d) {
      svg.appendChild(el('path', {
        d: 'M' + (gp.x - R - 1) + ' ' + gp.y
         + 'Q' + (DX + 48) + ' ' + d.y + ' ' + (DX + DR + 8) + ' ' + d.y,
        fill: 'none', stroke: C.edge, 'stroke-width': 1.5 }));
      svg.appendChild(arrow(DX + DR + 2, d.y, 'left'));
    });
    dst.forEach(function (d) {
      var g = el('g', {});
      cell(g, ART[d.art], DX, d.y, DR * 2.1);
      svg.appendChild(g);
    });
    var dt = el('text', { x: DX + 12, y: gp.y + 24 + DR + 15, 'text-anchor': 'middle',
      fill: C.ink, 'paint-order': 'stroke', stroke: '#f7ebe7', 'stroke-width': 3 });
    dt.style.font = '600 8.5px -apple-system, sans-serif';
    dt.style.letterSpacing = '.06em';
    dt.textContent = 'THE PROJECTS';
    svg.appendChild(dt);

    STOPS.forEach(function (st, i) {
      var g = el('g', { 'data-go': st.href || '' });
      if (st.href) g.style.cursor = 'pointer';
      node(g, st, pts[i]);
      svg.appendChild(g);
      // TREASURY sits at the road's very end where the label would clip below
      // the board — lift its label above the node instead
      svg.appendChild(label(pts[i], st.label, st.id === 'treasury' ? -(R + 7) : 0));
    });
  }

  svg.addEventListener('click', function (e) {
    var g = e.target && e.target.closest ? e.target.closest('[data-go]') : null;
    if (g && g.getAttribute('data-go')) location.href = g.getAttribute('data-go');
  });

  /* ── the stops tab ─────────────────────────────────────────────────── */
  var SEGS = { words: 'Free', window: 'Pennies — probe on doubt',
               wardrobe: 'The paid rungs — spend on certainty',
               treasury: 'Keep forever' };
  var list = document.getElementById('stoplist');
  function stopRow(st, feed) {
    var row = document.createElement(st.href ? 'a' : 'div');
    row.className = 'stop' + (st.none ? ' none' : '') + (feed ? ' feed' : '');
    row.setAttribute('data-item', 'stop-' + st.id);
    if (st.href) row.href = st.href;
    var gs = document.createElementNS(SVG, 'svg');
    gs.setAttribute('viewBox', '0 0 36 36'); gs.setAttribute('class', 'g');
    var gg = el('g', {});
    node(gg, st, { x: 18, y: 18 }, 17);
    gs.appendChild(gg);
    row.appendChild(gs);
    var tx = document.createElement('div');
    tx.innerHTML = '<div class="nm"></div><div class="what"></div>';
    var nm = tx.querySelector('.nm');
    nm.textContent = st.label;
    if (st.none) {
      var tag = document.createElement('span');
      tag.className = 'tag'; tag.textContent = st.none;
      nm.appendChild(tag);
    }
    tx.querySelector('.what').textContent = st.what;
    row.appendChild(tx);
    list.appendChild(row);
  }
  STOPS.forEach(function (st) {
    if (SEGS[st.id]) {
      var h = document.createElement('div');
      h.className = 'seg'; h.textContent = SEGS[st.id];
      list.appendChild(h);
    }
    stopRow(st, false);
    // the lap sits directly under the stop it cycles with
    if (st.id === 'window') stopRow(LAP, true);
  });

  /* ── the gaps tab ──────────────────────────────────────────────────────
     One row per thing you can DO to a prompt or its picture; the tags say
     which surface has it. From the repo's measured record (CLAUDE.md + the
     module docs; caption numbers measured Aug 2026 across all 171 chats).
     `id` is STABLE and content-derived — never renumber; add at the end. */
  var GAPS = [
    { id: 'verbatim', f: 'Send her words verbatim, nothing added', has: ['freeform'],
      note: 'promptSent stored on every run, so anyone can verify' },
    { id: 'probe4', f: 'Draw four ideas on one cheap sheet, cut into frames', has: ['vector room'], hole: 1,
      note: 'welded to the pastel style and the tracer — no other style can probe this way' },
    { id: 'ladder', f: 'The quality ladder on one prompt', has: ['playground'],
      note: 'the pyramid: low · low · medium' },
    { id: 'rack', f: 'One content prompt across the five house styles', has: ['playground'], hole: 1,
      note: 'one style a run — five runs by hand, nothing sends the same content through the whole rack' },
    { id: 'styleref', f: 'Attach one of her pages as a pure style reference', has: ['freeform', 'playground', 'movies'] },
    { id: 'character', f: 'Attach a character card so a person stays themselves', has: ['movies', 'playground', 'story room'] },
    { id: 'keepall', f: 'Keep every version, nothing overwritten', has: ['assets tab', 'playground'] },
    { id: 'reddiff', f: 'See which words changed between two versions', has: ['writing room'], hole: 1,
      note: 'built for the dating-book prose — nothing does it for prompts, the one text where a single word moves the picture' },
    { id: 'bankone', f: 'File the exact prompt with its picture', has: ['assets tab'],
      note: 'style and content halves, per image, per chat' },
    { id: 'findprompt', f: 'Find a prompt again months later', has: ['assets search'], hole: 1,
      note: 'within one chat — no shelf holds every content prompt across chats' },
    { id: 'caption', f: 'Know model and quality forever', has: ['assets caption'],
      note: 'when filed at make-time — 1,938 of 2,488 images have none, and it cannot be backfilled' },
    { id: 'rebuild', f: 'Rebuild a body of work in a new style', has: [], hole: 1,
      note: 'the insurance the treasure is FOR — today it is archaeology' },
    { id: 'twice', f: 'Draw the same picture twice', has: ['replicate styles'], hole: 1,
      note: 'a fixed seed is deterministic; gpt-image-2 never repeats — the prompt guarantees the idea, not the pixels' },
  ];
  var gl = document.getElementById('gaplist');
  GAPS.forEach(function (g) {
    var d = document.createElement('div');
    d.className = 'gap' + (g.hole ? ' hole' : '');
    d.setAttribute('data-item', 'gap-' + g.id);
    var f = document.createElement('div');
    f.className = 'f'; f.textContent = g.f;
    d.appendChild(f);
    if (g.note) {
      var n = document.createElement('div');
      n.className = 'what';
      n.style.font = '12px/1.35 Georgia, serif';
      n.style.color = 'var(--ink2)';
      n.style.marginTop = '3px';
      n.textContent = g.note;
      d.appendChild(n);
    }
    var w = document.createElement('div');
    w.className = 'who';
    if (!g.has.length) {
      var none = document.createElement('span');
      none.className = 'w no'; none.textContent = 'nothing has it';
      w.appendChild(none);
    } else g.has.forEach(function (h) {
      var s = document.createElement('span');
      s.className = 'w'; s.textContent = h;
      w.appendChild(s);
    });
    d.appendChild(w);
    gl.appendChild(d);
  });

  /* ── the wardrobe tab ──────────────────────────────────────────────────
     The rack of house styles the content half can wear. Thumbs are the
     committed style previews where one exists (public/samples). */
  var RACK = [
    { id: 'wtr', nm: 'WTR', th: '/samples/watercolordrawings.webp',
      what: 'the watercolor LoRA (trigger wtr) — loose wash, her watercolor drawings; the dating book’s art' },
    { id: 'chatgpt', nm: 'CHATGPT',
      what: 'sage sandy mirror — her ink-and-watercolour page as a pure style ref; the Evan film, the story room’s draw-it-here' },
    { id: 'pastel', nm: 'PASTEL', th: '/samples/house-pastel.webp',
      what: 'sophie snake + sophie animals as refs — witch school cards, stickers, the vector room' },
    { id: 'scarry', nm: 'SCARRY',
      what: 'the three richard scarry pages as refs — busy little worlds' },
    { id: 'hoonie', nm: 'HOONIE', th: '/samples/hoonie.webp',
      what: 'the linocut LoRA — relief print on white, the suffix applied server-side' },
    { id: 'dream', nm: 'DREAM MYSTERY',
      what: 'her diary-comic page — the movies’ dreamy pencil, the zine, the dream illustrator' },
  ];
  var rl = document.getElementById('racklist');
  RACK.forEach(function (s) {
    var row = document.createElement('a');
    row.className = 'stop';
    row.href = '/playground';
    row.setAttribute('data-item', 'rack-' + s.id);
    if (s.th) {
      var im = document.createElement('img');
