<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Similitude Dominoes v2</title>
<link rel="stylesheet" href="/compare.css">
<style>
/* One screen, never scrolls — the page owns its height and compare.css's page
   padding comes off. Palette tokens stay compare.css's. */
html, body { height: 100%; overflow: hidden; }
body { padding: 0; }
.wrap { max-width: 680px; height: 100vh; display: flex; flex-direction: column;
        padding: 14px 12px 8px; gap: 6px; }
@supports (height: 100dvh) { .wrap { height: 100dvh; } }
.wrap > h1 { font-size: 22px; margin: 0; padding-right: 56px; }

/* the strip — the top-right 64px belongs to the injected autoscroll pill */
.top { display: flex; align-items: center; gap: 10px; flex: none;
       font: 600 12px/1 -apple-system, 'Helvetica Neue', sans-serif;
       letter-spacing: .08em; text-transform: uppercase; color: var(--ink2);
       padding-right: 64px; }
.top b { color: var(--ink); font-weight: 700; }
.backs { display: flex; gap: 2px; margin-left: auto; }
.back { width: 7px; height: 15px; border: 1px solid var(--line); border-radius: 2px;
        background: var(--surface2); }

/* the table — triangles tessellate, so it grows in every direction, and it is
   the one thing that gives when the note grows */
.board { flex: 1; min-height: 0; overflow: auto; display: flex;
         border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
         -webkit-overflow-scrolling: touch; }
/* margin:auto inside a flex box centres the table AND still lets it be
   scrolled to when it outgrows the board — the one centring that does both */
.felt { position: relative; margin: auto; flex: none; }
/* A TAP MUST LAND ON THE TRIANGLE, NOT ITS BOX — and the box is the <span> as
   well as the <svg>. Triangles tessellate, so every tile's rectangle overlaps
   its neighbours', and an HTML box hit-tests its whole rectangle however
   little of it is painted. Only the drawn polygon takes a tap. */
.felt > span { position: absolute; pointer-events: none; }
.felt svg { pointer-events: none; }
.felt svg polygon[data-hit] { pointer-events: all; cursor: pointer; }

.msg { flex: none; font: 15px/1.3 Georgia, serif; color: var(--ink2); min-height: 20px; }
.msg b { color: var(--ink); font-weight: 400; font-style: italic; }

.acts { flex: none; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
button.b { font: 600 13px/1 -apple-system, 'Helvetica Neue', sans-serif;
           padding: 9px 12px; border: 1px solid var(--line); border-radius: 6px;
           background: var(--surface); color: var(--ink); cursor: pointer; }
button.b.go { border-color: var(--ink); }
button.b.quiet { color: var(--ink2); }
#bRound { margin-left: auto; }
/* she says what she sees — the box ships EMPTY, the placeholder only names it */
#why { flex: 1; min-width: 150px; font: 15px/1.3 Georgia, serif; padding: 8px 10px;
       border: 1px solid var(--ink); border-radius: 6px; background: var(--surface);
       color: var(--ink); }
#why:focus { outline: none; border-color: var(--chg); }

.hand { flex: none; display: flex; gap: 4px; overflow-x: auto; overflow-y: hidden;
        padding: 4px 0 6px; -webkit-overflow-scrolling: touch; }
.hand > span { flex: none; cursor: pointer; display: block; }
/* the card she is holding — the others step back, which reads at a glance
   where a gold outline on a triangle does not */
.hand.picking > span:not(.lit) { opacity: .45; }

.notehost { flex: none; position: relative; min-height: 30px; }
</style>

<div class="wrap" data-nostop>
  <h1>Similitude Dominoes</h1>

  <div class="top">
    <span>You <b id="sYou">0</b></span>
    <span>It <b id="sIt">0</b></span>
    <span>Pile <b id="sPile">0</b></span>
    <span class="backs" id="backs"></span>
  </div>

  <div class="board" id="board"><div class="felt" id="felt"></div></div>

  <div class="msg" id="msg"></div>

  <div class="acts" id="acts">
    <input id="why" type="text" hidden autocomplete="off">
    <button class="b go" id="bSay" type="button" hidden>Lay it</button>
    <button class="b go" id="bDraw" type="button">Draw</button>
    <button class="b" id="bPass" type="button" hidden>Pass</button>
    <button class="b quiet" id="bRound" type="button">New round</button>
    <button class="b quiet" id="bSuits" type="button">New cards</button>
  </div>

  <div class="hand" id="hand"></div>
  <div class="notehost" data-item="dominoes-v2"></div>
</div>

<script src="/compare.js"></script>
<script>
(function () {
  var DECK = __DECK__;                 // her 84 nature cards: {k cut, n name, t tags}
  var CUTS = 'https://storage.googleapis.com/deckfactory-43176.firebasestorage.app/triset/cuts/';

  /* ONE CARD IS ONE TILE, and there is only one of each — so a tile is not a
     pair of pips, it is a picture, and what joins two of them is what they have
     in common. A triangle has three sides, so a card can be joined on three.

     WHAT THE COMPUTER CAN SEE vs WHAT SHE CAN SEE. Every card carries a few
     tags, and the computer may only lay a card where it shares a tag with every
     neighbour it touches — so it plays honestly and passes when it has nothing,
     which is the house rule for this opponent already ("a stretch is a pass").
     SHE IS NOT BOUND BY THE TAGS: any space touching the table is hers to take,
     and where the tags see nothing she says what she sees and that stands. Her
     eye is the game; the tags are only what a page with no model call can read.

     THE GRID. Rows of triangles alternating point-up and point-down: cell (r,c)
     points up when r+c is even. Its three neighbours are always (r,c-1) left,
     (r,c+1) right, and the third across the flat side — (r+1,c) below an up
     tile, (r-1,c) above a down one. */
  var DEAL = 24;                       // cards in a round: 7 each, the rest the pile
  var $ = function (id) { return document.getElementById(id); };
  var S = null, score = { you: 0, it: 0 }, sel = -1, pend = null;

  var up = function (r, c) { return (((r + c) % 2) + 2) % 2 === 0; };
  var id = function (r, c) { return r + ',' + c; };
  function nb(r, c, d) {
    if (d === 'L') return [r, c - 1];
    if (d === 'R') return [r, c + 1];
    return up(r, c) ? [r + 1, c] : [r - 1, c];
  }
  // what two cards share, rarest first — the rarer the tag, the more it says
  var RARITY = {};
  DECK.forEach(function (c) { c.t.forEach(function (t) { RARITY[t] = (RARITY[t] || 0) + 1; }); });
  function shared(a, b) {
    return DECK[a].t.filter(function (t) { return DECK[b].t.indexOf(t) >= 0; })
      .sort(function (x, y) { return RARITY[x] - RARITY[y]; });
  }

  // ── drawing ──────────────────────────────────────────────────────────────
  // One SVG a tile: the card itself, filling the triangle. A card is cut
  // point-up, so a point-down space turns it — the tiles tessellate, and a
  // triangle tile is read from whichever side you are sitting on.
  function tri(r, c) { return up(r, c) ? '50,0 100,86.6 0,86.6' : '0,0 100,0 50,86.6'; }
  function tileSvg(r, c, card, W, cls) {
    var H = W * 0.866, u = up(r, c), cid = 'k' + Math.random().toString(36).slice(2, 8);
    return '<svg width="' + W + '" height="' + H + '" viewBox="0 0 100 86.6" class="' + (cls || '') + '">'
      + '<defs><clipPath id="' + cid + '"><polygon points="' + tri(r, c) + '"/></clipPath></defs>'
      + '<polygon points="' + tri(r, c) + '" fill="var(--surface)"/>'
      + '<g clip-path="url(#' + cid + ')"' + (u ? '' : ' transform="rotate(180 50 43.3)"') + '>'
      + '<image href="' + CUTS + DECK[card].k + '" x="0" y="0" width="100" height="86.6"'
      + ' preserveAspectRatio="none"/></g>'
      + '<polygon points="' + tri(r, c) + '" fill="none" stroke="var(--ink)" stroke-width="1.2"'
      + ' stroke-linejoin="round"/></svg>';
  }
  function slotSvg(r, c, W) {
    return '<svg class="slot" width="' + W + '" height="' + (W * 0.866) + '" viewBox="0 0 100 86.6">'
      + '<polygon data-hit points="' + tri(r, c) + '" fill="none" stroke="var(--chg)"'
      + ' stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round"/></svg>';
  }

  // ── the round ────────────────────────────────────────────────────────────
  function deal() {
    var pool = [], i;
    for (i = 0; i < DECK.length; i++) pool.push(i);
    for (i = pool.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = pool[i]; pool[i] = pool[j]; pool[j] = t;
    }
    var use = pool.slice(0, DEAL);
    S = { you: use.slice(0, 7), it: use.slice(7, 14), pile: use.slice(14),
          cells: {}, turn: 'you', passes: 0, over: false, last: '0,0' };
    sel = -1; pend = null;
    S.cells['0,0'] = { r: 0, c: 0, card: S.pile.pop(), why: '' };
    say('The ' + DECK[S.cells['0,0'].card].n + ' opens the table.');
    paint();
  }

  function frontier() {
    var seen = {}, out = [];
    Object.keys(S.cells).forEach(function (k) {
      var cell = S.cells[k];
      ['L', 'R', 'V'].forEach(function (d) {
        var p = nb(cell.r, cell.c, d), i = id(p[0], p[1]);
        if (S.cells[i] || seen[i]) return;
        seen[i] = 1; out.push({ r: p[0], c: p[1] });
      });
    });
    return out;
  }
  function around(r, c) {
    return ['L', 'R', 'V'].map(function (d) {
      var p = nb(r, c, d); return S.cells[id(p[0], p[1])];
    }).filter(Boolean);
  }
  // what the TAGS can see for this card in this space: a word per neighbour, or
  // null when one of them shares nothing
  function link(card, r, c) {
    var ns = around(r, c), words = [];
    for (var i = 0; i < ns.length; i++) {
      var s = shared(card, ns[i].card);
      if (!s.length) return null;
      if (words.indexOf(s[0]) < 0) words.push(s[0]);
    }
    return words.join(' · ');
  }
  function itMovesList() {
    var fr = frontier(), out = [];
    S.it.forEach(function (card, k) {
      fr.forEach(function (cell) {
        var w = link(card, cell.r, cell.c);
        if (w) out.push({ k: k, cell: cell, why: w, card: card });
      });
    });
    return out;
  }

  // ── it plays ─────────────────────────────────────────────────────────────
  // No model call and no server: it plays what the tags let it see, and it
  // passes rather than stretching. It prefers a link the deck rarely offers,
  // and a space that leaves it somewhere to go next.
  function itMoves() {
    if (S.over) return;
    var m = itMovesList();
    while (!m.length && S.pile.length) { S.it.push(S.pile.pop()); m = itMovesList(); paint(); }
    if (!m.length) {
      S.passes++; say('It passed.'); S.turn = 'you';
      if (S.passes >= 2) return blocked();
      return paint();
    }
    S.passes = 0;
    var best = null;
    m.forEach(function (mv) {
      var rare = 84 - (RARITY[mv.why.split(' · ')[0]] || 40);
      var s = rare + Math.random() * 12;
      if (!best || s > best.s) best = { s: s, mv: mv };
    });
    lay(S.it, best.mv.k, best.mv.cell, best.mv.why);
    say('It laid the ' + DECK[best.mv.card].n + ' on <b>' + best.mv.why + '</b>.');
    if (!S.it.length) return won('it');
    S.turn = 'you';
    paint();
  }

  function lay(hand, k, cell, why) {
    var card = hand.splice(k, 1)[0];
    S.cells[id(cell.r, cell.c)] = { r: cell.r, c: cell.c, card: card, why: why };
    S.last = id(cell.r, cell.c);
  }

  // ── the round ends ───────────────────────────────────────────────────────
  function won(who) {
    S.over = true;
    var left = who === 'you' ? S.it.length : S.you.length;
    score[who] += left;
    say(who === 'you' ? 'You went out — ' + left + ' to you.' : 'It went out — ' + left + ' to it.');
    paint();
  }
  function blocked() {
    S.over = true;
    if (S.you.length === S.it.length) say('Blocked, and dead even.');
    else {
      var w = S.you.length < S.it.length ? 'you' : 'it';
      var d = Math.abs(S.you.length - S.it.length);
      score[w] += d;
      say('Blocked — ' + (w === 'you' ? 'you hold' : 'it holds') + ' fewer, ' + d
          + ' to ' + (w === 'you' ? 'you' : 'it') + '.');
    }
    paint();
  }

  // ── painting ─────────────────────────────────────────────────────────────
  var BW = 104, HW = 116;               // tile width on the table, and in the hand
  function say(t) { $('msg').innerHTML = t; }

  function paint() {
    var mine = !S.over && S.turn === 'you';
    var fr = mine && sel >= 0 ? frontier() : [];

    var keys = Object.keys(S.cells);
    var all = keys.map(function (k) { var p = k.split(','); return { r: +p[0], c: +p[1] }; })
      .concat(fr);
    var rs = all.map(function (p) { return p.r; }), cs = all.map(function (p) { return p.c; });
    var minR = Math.min.apply(null, rs), maxR = Math.max.apply(null, rs);
    var minC = Math.min.apply(null, cs), maxC = Math.max.apply(null, cs);
    var H = BW * 0.866, felt = $('felt'), bd = $('board');
    var fw = (maxC - minC) * BW / 2 + BW, fh = (maxR - minR + 1) * H;
    felt.style.width = fw + 'px';
    felt.style.height = fh + 'px';
    // THE TABLE ZOOMS OUT AS IT GROWS, to a floor — the cards are what she is
    // reading, so it opens big and only shrinks as far as it must; past the
    // floor the board scrolls instead
    var z = Math.max(0.55, Math.min(1, (bd.clientWidth - 4) / fw, (bd.clientHeight - 4) / fh));
    felt.style.zoom = z;
    var at = function (r, c) {
      return 'left:' + ((c - minC) * BW / 2) + 'px;top:' + ((r - minR) * H) + 'px';
    };
    var html = keys.map(function (k) {
      var cell = S.cells[k];
      return '<span style="' + at(cell.r, cell.c) + '">'
        + tileSvg(cell.r, cell.c, cell.card, BW) + '</span>';
    }).join('') + fr.map(function (p) {
      return '<span data-slot="' + id(p.r, p.c) + '" style="' + at(p.r, p.c) + '">'
        + slotSvg(p.r, p.c, BW) + '</span>';
    }).join('');
    felt.innerHTML = html;

    // her hand — every card held point-up
    $('hand').className = 'hand' + (sel >= 0 ? ' picking' : '');
    $('hand').innerHTML = S.you.map(function (card, k) {
      return '<span data-k="' + k + '" class="' + (sel === k ? 'lit' : '') + '">'
        + tileSvg(0, 0, card, HW) + '</span>';
    }).join('');
    if (sel >= 0) {
      var g = $('hand').querySelector('[data-k="' + sel + '"] polygon:last-of-type');
      if (g) { g.setAttribute('stroke', 'var(--chg)'); g.setAttribute('stroke-width', '3.4'); }
    }

    $('sYou').textContent = score.you;
    $('sIt').textContent = score.it;
    $('sPile').textContent = S.pile.length;
    var backs = $('backs'); backs.innerHTML = '';
    for (var i = 0; i < S.it.length; i++) {
      var b = document.createElement('span'); b.className = 'back'; backs.appendChild(b);
    }
    var asking = !!pend;
    $('why').hidden = !asking; $('bSay').hidden = !asking;
    $('bDraw').hidden = asking || !(mine && S.pile.length);
    $('bPass').hidden = asking || !(mine && !S.pile.length);

    if (S.last) {
      var p = S.last.split(',');
      bd.scrollLeft = ((+p[1] - minC) * BW / 2 + BW / 2) * z - bd.clientWidth / 2;
      bd.scrollTop = ((+p[0] - minR) * H + H / 2) * z - bd.clientHeight / 2;
    }
  }

  // ── her turn ─────────────────────────────────────────────────────────────
  // EVERY space touching the table is hers. Where the tags already see the
  // link she lays it straight down; where they see nothing she says what she
  // sees, and that stands — nothing here judges her.
  $('hand').addEventListener('click', function (ev) {
    if (S.over || S.turn !== 'you' || pend) return;
    var el = ev.target.closest ? ev.target.closest('[data-k]') : null;
    if (!el) return;
    var k = +el.dataset.k;
    sel = sel === k ? -1 : k;
    say(sel < 0 ? '' : 'Tap a space.');
    paint();
  });
  $('felt').addEventListener('click', function (ev) {
    if (sel < 0 || pend) return;
    var el = ev.target.closest ? ev.target.closest('[data-slot]') : null;
    if (!el) return;
    var p = el.dataset.slot.split(','), r = +p[0], c = +p[1];
    var card = S.you[sel], w = link(card, r, c);
    if (w) return play(sel, { r: r, c: c }, w);
    pend = { k: sel, r: r, c: c };
    var ns = around(r, c).map(function (n) { return DECK[n.card].n; }).join(' and the ');
    say('The ' + DECK[card].n + ' and the ' + ns + ' — what do they share?');
    paint();
    $('why').value = ''; $('why').focus();
  });
  $('bSay').addEventListener('click', function () {
    if (!pend) return;
    var w = $('why').value.trim().slice(0, 90);
    if (!w) return $('why').focus();
    var k = pend.k, cell = { r: pend.r, c: pend.c };
    pend = null;
    play(k, cell, w, false);
  });
  $('why').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('bSay').click(); });

  function play(k, cell, why) {
    var card = S.you[k];
    lay(S.you, k, cell, why);
    sel = -1; S.passes = 0;
    say('You laid the ' + DECK[card].n + ' on <b>' + why + '</b>.');
    if (!S.you.length) return won('you');
    S.turn = 'it'; paint();
    setTimeout(itMoves, 900);
  }

  $('bDraw').addEventListener('click', function () {
    if (!S.pile.length || S.turn !== 'you' || S.over) return;
    S.you.push(S.pile.pop());
    sel = -1; say('You drew the ' + DECK[S.you[S.you.length - 1]].n + '.');
    paint();
  });
  $('bPass').addEventListener('click', function () {
    if (S.turn !== 'you' || S.over) return;
    S.passes++; sel = -1; say('You passed.');
    if (S.passes >= 2) return blocked();
    S.turn = 'it'; paint(); setTimeout(itMoves, 700);
  });
  $('bRound').addEventListener('click', deal);
  $('bSuits').addEventListener('click', function () { score.you = 0; score.it = 0; deal(); });

  deal();

  window.__compareNotes({ chat: 'triset-dominoes-game', sheet: 'dominoes-v2' });
  window.__compareHelp({ html:
      '<b>One card is one tile, and there is only one of each.</b> A triangle '
    + 'has three sides, so a card can be joined on three — and what joins two '
    + 'cards is what they have in common. Tap a card in your hand, then tap a '
    + 'space: if the link is one this page can already see it goes straight '
    + 'down, and if it is not, you say what you see and that stands. '
    + '<b>It plays only what it can see</b>, and passes rather than stretching. '
    + 'Twenty-four cards a round, seven each. Go out and you score the cards '
    + 'left in its hand.' });
})();
</script>
