<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Similitude Dominoes v4</title>
<link rel="stylesheet" href="/compare.css">
<style>
html, body { height: 100%; overflow: hidden; }
body { padding: 0; }
.wrap { max-width: 680px; height: 100vh; display: flex; flex-direction: column;
        padding: 14px 12px 8px; gap: 6px; }
@supports (height: 100dvh) { .wrap { height: 100dvh; } }
.wrap > h1 { font-size: 22px; margin: 0; padding-right: 56px; }

/* the strip — the top-right 64px belongs to the injected autoscroll pill */
.top { display: flex; align-items: center; gap: 10px; flex: none;
       font: 600 12px/1 -apple-system, 'Helvetica Neue', sans-serif;
       letter-spacing: .08em; text-transform: uppercase; color: var(--ink2);
       padding-right: 64px; }
.top b { color: var(--ink); font-weight: 700; }
.backs { display: flex; gap: 2px; margin-left: auto; }
.back { width: 7px; height: 15px; border: 1px solid var(--line); border-radius: 2px;
        background: var(--surface2); }

.board { flex: 1; min-height: 0; overflow: auto; display: flex;
         border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
         -webkit-overflow-scrolling: touch; }
/* margin:auto inside a flex box centres the table AND still lets it be
   scrolled to once it outgrows the board — the one centring that does both */
.felt { position: relative; margin: auto; flex: none; }
/* A TAP MUST LAND ON THE TRIANGLE, NOT ITS BOX. Triangles tessellate, so every
   tile's rectangle overlaps its neighbours', and an HTML box hit-tests its
   whole rectangle however little of it is painted. Only a polygon marked
   data-hit takes a tap. */
.felt > span { position: absolute; pointer-events: none; }
.felt svg { pointer-events: none; }
.felt svg polygon[data-hit] { pointer-events: all; cursor: pointer; }

.msg { flex: none; font: 15px/1.3 Georgia, serif; color: var(--ink2); min-height: 20px; }
.msg b { color: var(--ink); font-weight: 400; font-style: italic; }

.acts { flex: none; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
button.b { font: 600 13px/1 -apple-system, 'Helvetica Neue', sans-serif;
           padding: 9px 12px; border: 1px solid var(--line); border-radius: 6px;
           background: var(--surface); color: var(--ink); cursor: pointer; }
button.b.go { border-color: var(--ink); }
button.b.quiet { color: var(--ink2); }
#bRound { margin-left: auto; }

/* she says what she sees — one box per card she is joining. The boxes ship
   EMPTY; the card's name beside each one is the only label. */
.say { flex: none; display: none; flex-direction: column; gap: 6px; }
.say.on { display: flex; }
.say label { display: flex; align-items: center; gap: 8px;
             font: 13px/1.2 -apple-system, 'Helvetica Neue', sans-serif; color: var(--ink2); }
.say label span { flex: none; width: 92px; text-align: right;
                  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.say input { flex: 1; min-width: 0; font: 15px/1.3 Georgia, serif; padding: 7px 10px;
             border: 1px solid var(--ink); border-radius: 6px; background: var(--surface);
             color: var(--ink); }
.say input:focus { outline: none; border-color: var(--chg); }
.say .row { display: flex; gap: 8px; align-items: center; }

.hand { flex: none; display: flex; gap: 4px; overflow-x: auto; overflow-y: hidden;
        padding: 4px 0 6px; -webkit-overflow-scrolling: touch; }
.hand > span { flex: none; cursor: pointer; display: block; }
.hand.picking > span:not(.lit) { opacity: .45; }
.hand.swapping > span.mark { opacity: .35; }

.notehost { flex: none; position: relative; min-height: 30px; }
</style>

<div class="wrap" data-nostop>
  <h1>Similitude Dominoes</h1>

  <div class="top">
    <span>You <b id="sYou">0</b></span>
    <span>It <b id="sIt">0</b></span>
    <span>Pile <b id="sPile">0</b></span>
    <span class="backs" id="backs"></span>
  </div>

  <div class="board" id="board"><div class="felt" id="felt"></div></div>

  <div class="msg" id="msg"></div>

  <div class="say" id="say"></div>

  <div class="acts" id="acts">
    <button class="b go" id="bLay" type="button" hidden>Lay it</button>
    <button class="b" id="bSame" type="button" hidden>Same for all</button>
    <button class="b" id="bBack" type="button" hidden>Put it back</button>
    <button class="b" id="bPass" type="button">Pass</button>
    <button class="b go" id="bSwap" type="button" hidden>Swap</button>
    <button class="b" id="bNoSwap" type="button" hidden>Keep them</button>
    <button class="b quiet" id="bRound" type="button">New round</button>
  </div>

  <div class="hand" id="hand"></div>
  <div class="notehost" data-item="dominoes-v4"></div>
</div>

<script src="/compare.js"></script>
<script>
(function () {
  var DECK = __DECK__;                 // her nature cards: {k cut, id, n name, t visual tags}
  var CUTS = 'https://storage.googleapis.com/deckfactory-43176.firebasestorage.app/triset/cuts/';
  var CHAT = 'triset-dominoes-game', SHEET = 'dominoes-v4';

  /* ONE CARD IS ONE TILE, only one of each, edge to edge.

     A POINT-DOWN SPACE TURNS ITS CARD 60°, NEVER 180° (her call, after v2's
     upside-down cards and v3's empty middles — "there's an imaginary card
     between … just rotate 30 or 60 degrees not upside down"). A 60° turn of a
     point-up triangle IS the point-down triangle, so the picture tilts a
     little and lands exactly on the space: nothing to clip, no bare corners.

     THE GRID. Cell (r,c) points up when r+c is even. Its three neighbours are
     always (r,c-1) left, (r,c+1) right, and across the flat side — (r+1,c)
     below an up card, (r-1,c) above a down one. A card has three sides, so it
     touches up to three cards.

     HER SCORING. A point per card the laid card touches. Two may each share
     something different with it; three share the SAME thing or each a
     DIFFERENT one — the two kinds of Similitude set, never two-and-one.

     SHE SAYS WHAT SHE SEES EVERY TURN (her call): one box per card touched;
     tap a card on the table to read its links back. The tags are the
     computer's eyes only — it lays a card only where it can see a link to
     every card it would touch, and passes rather than stretching. */
  var HAND = 3, ROUND = 24;
  var $ = function (id) { return document.getElementById(id); };
  var S = null, score = { you: 0, it: 0 }, sel = -1, pend = null, swapping = false;
  var game = null, moveN = 0;

  var up = function (r, c) { return (((r + c) % 2) + 2) % 2 === 0; };
  var isUp = function (u) { var p = u.split(','); return up(+p[0], +p[1]); };
  var id = function (r, c) { return r + ',' + c; };
  var nbs = function (u) {
    var p = u.split(','), r = +p[0], c = +p[1];
    return [id(r, c - 1), id(r, c + 1), up(r, c) ? id(r + 1, c) : id(r - 1, c)];
  };
  var norm = function (s) { return String(s || '').trim().toLowerCase().replace(/\s+/g, ' '); };

  // WHAT COUNTS AS SEEING. Her own game (2026-09-02) linked on shape and
  // moment — "a trail", "about to fall", "surrounded", "staggered",
  // "collection over time" — while the computer took "animal", "glass",
  // "water", "leaves". So the broad category words are WEAK: they stay on the
  // cards but the computer may never name one. A link is a rare, visual tag.
  var WEAK = {}; __WEAK__.forEach(function (w) { WEAK[w] = 1; });
  var RARITY = {};
  DECK.forEach(function (c) { c.t.forEach(function (t) { RARITY[t] = (RARITY[t] || 0) + 1; }); });
  function shared(a, b) {
    return DECK[a].t.filter(function (t) { return !WEAK[t] && DECK[b].t.indexOf(t) >= 0; })
      .sort(function (x, y) { return RARITY[x] - RARITY[y]; });
  }
  var name = function (card) { return DECK[card].n; };

  // ── the table's geometry ─────────────────────────────────────────────────
  function touched(u) { return nbs(u).filter(function (k) { return S.cells[k]; }); }
  function frontier() {
    var seen = {}, out = [];
    Object.keys(S.cells).forEach(function (k) {
      nbs(k).forEach(function (u) {
        if (S.cells[u] || seen[u]) return;
        seen[u] = 1; out.push(u);
      });
    });
    return out;
  }
  // HER RULE: three cards touched share one thing said three times, or three
  // different things — never two and one
  function setRuleOk(whys) {
    var v = Object.keys(whys).map(function (o) { return norm(whys[o]); });
    if (v.length < 3) return true;
    var same = v.every(function (x) { return x === v[0]; });
    var diff = v[0] !== v[1] && v[1] !== v[2] && v[0] !== v[2];
    return same || diff;
  }
  function commit(u, card, whys) {
    S.cells[u] = { card: card };
    S.links[u] = Object.keys(whys).map(function (o) { return { o: o, why: whys[o] }; });
    S.last = u;
    return Object.keys(whys).length;
  }
  // every link a card on the table is part of, from either side
  function linksOf(u) {
    var out = (S.links[u] || []).map(function (l) { return { o: l.o, why: l.why }; });
    Object.keys(S.links).forEach(function (k) {
      if (k === u) return;
      S.links[k].forEach(function (l) { if (l.o === u) out.push({ o: k, why: l.why }); });
    });
    return out;
  }

  // ── the computer's eyes ──────────────────────────────────────────────────
  // what the tags can say for this card at u: {cellId: word} or null
  function tagLinks(card, u) {
    var os = touched(u), per = os.map(function (o) { return shared(card, S.cells[o].card); });
    if (per.some(function (x) { return !x.length; })) return null;
    var whys = {};
    if (os.length < 3) { os.forEach(function (o, i) { whys[o] = per[i][0]; }); return whys; }
    // three: one tag all three share, else three tags unlike each other
    var same = per[0].filter(function (x) { return per[1].indexOf(x) >= 0 && per[2].indexOf(x) >= 0; })[0];
    if (same) { os.forEach(function (o) { whys[o] = same; }); return whys; }
    for (var a = 0; a < per[0].length; a++) for (var b = 0; b < per[1].length; b++) for (var c = 0; c < per[2].length; c++) {
      var x = per[0][a], y = per[1][b], z = per[2][c];
      if (x !== y && y !== z && x !== z) { whys[os[0]] = x; whys[os[1]] = y; whys[os[2]] = z; return whys; }
    }
    return null;
  }
  function itMovesList() {
    var fr = frontier(), out = [];
    S.it.forEach(function (card, k) {
      fr.forEach(function (u) {
        var w = tagLinks(card, u);
        if (w) out.push({ k: k, u: u, whys: w, card: card, pts: Object.keys(w).length });
      });
    });
    return out;
  }

  // ── the round ────────────────────────────────────────────────────────────
  function deal() {
    var pool = [], i;
    for (i = 0; i < DECK.length; i++) pool.push(i);
    for (i = pool.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = pool[i]; pool[i] = pool[j]; pool[j] = t;
    }
    var use = pool.slice(0, ROUND);
    S = { you: use.slice(0, HAND), it: use.slice(HAND, HAND * 2), pile: use.slice(HAND * 2),
          cells: {}, links: {}, turn: 'you', passes: 0, over: false, last: '0,0' };
    sel = -1; pend = null; swapping = false;
    S.cells['0,0'] = { card: S.pile.pop() };
    game = Date.now().toString(36); moveN = 0;
    record('', { at: Date.now(), cards: use.map(function (c) { return DECK[c].id; }) });
    say('The ' + name(S.cells['0,0'].card) + ' opens the table.');
    paint();
  }
  function draw(hand) { while (hand.length < HAND && S.pile.length) hand.push(S.pile.pop()); }
  function endIfDone() {
    if (S.over) return true;
    if (!S.pile.length && !S.you.length && !S.it.length) { finish('All the cards are down.'); return true; }
    return false;
  }
  function finish(line) {
    S.over = true;
    var v = score.you === score.it ? 'A draw.' : (score.you > score.it ? 'You win the round.' : 'It wins the round.');
    say(line + ' ' + v);
    record('', { at: Date.now(), done: true, you: score.you, it: score.it });
    paint();
  }

  // ── it plays ─────────────────────────────────────────────────────────────
  function itMoves() {
    if (S.over) return;
    var m = itMovesList();
    if (!m.length) {
      // nothing it can honestly say — it swaps its hand and passes
      var swapped = S.it.splice(0, S.it.length);
      S.pile = swapped.concat(S.pile); draw(S.it);
      S.passes++;
      say('It passed' + (swapped.length ? ' and swapped its cards.' : '.'));
      record('it', { pass: true, swap: swapped.length });
      S.turn = 'you';
      if (S.passes >= 2 && !S.pile.length) return finish('Neither of you can go on.');
      if (endIfDone()) return;
      return paint();
    }
    S.passes = 0;
    var best = null;
    m.forEach(function (mv) {
      var rare = 0;
      Object.keys(mv.whys).forEach(function (o) { rare += 84 - (RARITY[mv.whys[o]] || 40); });
      var s = mv.pts * 100 + rare / mv.pts + Math.random() * 15;
      if (!best || s > best.s) best = { s: s, mv: mv };
    });
    var mv = best.mv;
    S.it.splice(mv.k, 1);
    var pts = commit(mv.u, mv.card, mv.whys);
    score.it += pts;
    var said = Object.keys(mv.whys).map(function (o) {
      return name(S.cells[o].card) + ' — <b>' + mv.whys[o] + '</b>';
    }).join(' · ');
    say('It laid the ' + name(mv.card) + ' on the ' + said + ' (' + pts + ').');
    record('it', { card: DECK[mv.card].id, at: mv.u, pts: pts,
      links: Object.keys(mv.whys).map(function (o) { return [DECK[S.cells[o].card].id, mv.whys[o]]; }) });
    draw(S.it);
    S.turn = 'you';
    if (endIfDone()) return;
    paint();
  }
  // a slight pause to "think" — nothing is computed in it; it is the beat a
  // turn takes at a table
  function itsTurn() {
    S.turn = 'it'; paint();
    setTimeout(function () { if (!S.over) say('It is thinking…'); }, 300);
    setTimeout(itMoves, 1400 + Math.random() * 1000);
  }

  // ── recording: every game, every move, on this page's verdict doc ────────
  function record(who, data) {
    var item = 'g' + game + (who ? '-' + (++moveN) + '-' + who : '');
    try {
      fetch('/api/chatfeed/verdict', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat: CHAT, sheet: SHEET, item: item, text: JSON.stringify(data) }) })
        .catch(function () {});
    } catch (e) { /* a game she cannot record is still a game */ }
  }

  // ── drawing ──────────────────────────────────────────────────────────────
  var BW = 104, HW = 116;
  var UP = '50,0 100,86.6 0,86.6', DN = '0,0 100,0 50,86.6';
  // rotate(60) about the up card's centroid lands its three corners exactly on
  // the point-down triangle 28.87 units lower — so translate back up by that
  var TURN = 'translate(0,-28.87) rotate(60 50 57.73)';
  function cardSvg(card, W, down, hit) {
    var H = W * 0.866, pts = down ? DN : UP;
    return '<svg width="' + W + '" height="' + H + '" viewBox="0 0 100 86.6">'
      + '<polygon points="' + pts + '" fill="var(--surface)"/>'
      + '<image href="' + CUTS + DECK[card].k + '" x="0" y="0" width="100" height="86.6"'
      + (down ? ' transform="' + TURN + '"' : '') + '/>'
      + '<polygon' + (hit ? ' data-hit' : '') + ' points="' + pts + '" fill="none"'
      + ' stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/></svg>';
  }
  function slotSvg(W, down) {
    return '<svg width="' + W + '" height="' + (W * 0.866) + '" viewBox="0 0 100 86.6">'
      + '<polygon data-hit points="' + (down ? DN : UP) + '" fill="none" stroke="var(--chg)"'
      + ' stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round"/></svg>';
  }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function say(t) { $('msg').innerHTML = t; }

  function paint() {
    var mine = !S.over && S.turn === 'you' && !swapping && !pend;
    var fr = mine && sel >= 0 ? frontier() : [];
    var keys = Object.keys(S.cells);
    var all = keys.concat(fr).map(function (k) { var p = k.split(','); return { r: +p[0], c: +p[1] }; });
    var rs = all.map(function (p) { return p.r; }), cs = all.map(function (p) { return p.c; });
    var minR = Math.min.apply(null, rs), maxR = Math.max.apply(null, rs);
    var minC = Math.min.apply(null, cs), maxC = Math.max.apply(null, cs);
    var H = BW * 0.866, felt = $('felt'), bd = $('board');
    var fw = (maxC - minC) * BW / 2 + BW, fh = (maxR - minR + 1) * H;
    felt.style.width = fw + 'px'; felt.style.height = fh + 'px';
    var z = Math.max(0.55, Math.min(1, (bd.clientWidth - 4) / fw, (bd.clientHeight - 4) / fh));
    felt.style.zoom = z;
    var at = function (k) {
      var p = k.split(','), r = +p[0], c = +p[1];
      return 'left:' + ((c - minC) * BW / 2) + 'px;top:' + ((r - minR) * H) + 'px';
    };
    felt.innerHTML = keys.map(function (k) {
      return '<span data-card="' + k + '" style="' + at(k) + '">' + cardSvg(S.cells[k].card, BW, !isUp(k), true) + '</span>';
    }).join('') + fr.map(function (u) {
      return '<span data-slot="' + u + '" style="' + at(u) + '">' + slotSvg(BW, !isUp(u)) + '</span>';
    }).join('');

    var hand = $('hand');
    hand.className = 'hand' + (sel >= 0 ? ' picking' : '') + (swapping ? ' swapping' : '');
    hand.innerHTML = S.you.map(function (card, k) {
      var cls = (sel === k ? 'lit' : '') + (swapping && S.mark[k] ? ' mark' : '');
      return '<span data-k="' + k + '" class="' + cls + '">' + cardSvg(card, HW, false, false) + '</span>';
    }).join('');

    $('sYou').textContent = score.you; $('sIt').textContent = score.it;
    $('sPile').textContent = S.pile.length;
    var backs = $('backs'); backs.innerHTML = '';
    for (var i = 0; i < S.it.length; i++) { var b = document.createElement('span'); b.className = 'back'; backs.appendChild(b); }

    var asking = !!pend;
    $('say').className = 'say' + (asking ? ' on' : '');
    $('bLay').hidden = !asking; $('bBack').hidden = !asking;
    $('bSame').hidden = !(asking && pend.others.length > 1);
    $('bPass').hidden = !(mine && !S.over) || asking;
    $('bSwap').hidden = !swapping; $('bNoSwap').hidden = !swapping;
    if (swapping) {
      var n = S.mark.filter(Boolean).length;
      $('bSwap').textContent = n ? 'Swap ' + n : 'Swap';
      $('bSwap').disabled = !n || !S.pile.length;
    }

    if (S.last) {
      var p = S.last.split(',');
      bd.scrollLeft = ((+p[1] - minC) * BW / 2 + BW / 2) * z - bd.clientWidth / 2;
      bd.scrollTop = ((+p[0] - minR) * H + H / 2) * z - bd.clientHeight / 2;
    }
  }

  // ── her turn ─────────────────────────────────────────────────────────────
  $('hand').addEventListener('click', function (ev) {
    var el = ev.target.closest ? ev.target.closest('[data-k]') : null;
    if (!el || S.over || S.turn !== 'you' || pend) return;
    var k = +el.dataset.k;
    if (swapping) { S.mark[k] = !S.mark[k]; return paint(); }
    sel = sel === k ? -1 : k;
    say(sel < 0 ? '' : 'Tap a space.');
    paint();
  });
  $('felt').addEventListener('click', function (ev) {
    var cardEl = ev.target.closest ? ev.target.closest('[data-card]') : null;
    if (cardEl && !pend) {
      // reading a card's links back
      var k0 = cardEl.dataset.card, list = linksOf(k0);
      say(list.length ? name(S.cells[k0].card) + ' — ' + list.map(function (x) {
        return name(S.cells[x.o].card) + ': <b>' + esc(x.why) + '</b>';
      }).join(' · ') : 'The ' + name(S.cells[k0].card) + ' opened the table.');
      return;
    }
    var el = ev.target.closest ? ev.target.closest('[data-slot]') : null;
    if (!el || sel < 0 || pend) return;
    var u = el.dataset.slot, card = S.you[sel];
    var others = touched(u);
    pend = { k: sel, u: u, others: others };
    var say_ = $('say');
    say_.innerHTML = others.map(function (o, i) {
      return '<label><span>' + esc(name(S.cells[o].card)) + '</span>'
        + '<input type="text" autocomplete="off" data-o="' + o + '"></label>';
    }).join('');
    say('What does the ' + name(card) + ' share with ' + (others.length > 1 ? 'each of them' : 'it') + '?');
    paint();
    var first = say_.querySelector('input'); if (first) first.focus();
  });
  $('bSame').addEventListener('click', function () {
    var ins = $('say').querySelectorAll('input'), v = '';
    for (var i = 0; i < ins.length; i++) if (ins[i].value.trim()) { v = ins[i].value.trim(); break; }
    if (!v) return ins[0].focus();
    for (var j = 0; j < ins.length; j++) ins[j].value = v;
  });
  $('bBack').addEventListener('click', function () { pend = null; sel = -1; say(''); paint(); });
  $('bLay').addEventListener('click', function () {
    if (!pend) return;
    var whys = {}, ins = $('say').querySelectorAll('input'), missing = null;
    for (var i = 0; i < ins.length; i++) {
      var v = ins[i].value.trim().slice(0, 90);
      if (!v) { missing = ins[i]; break; }
      whys[ins[i].dataset.o] = v;
    }
    if (missing) { missing.focus(); return say('Say something for each one.'); }
    if (!setRuleOk(whys)) {
      return say('Touching three, it is the <b>same thing</b> for all, or <b>different</b> for all.');
    }
    var k = pend.k, u = pend.u, card = S.you[k];
    pend = null; sel = -1; S.passes = 0;
    S.you.splice(k, 1);
    var pts = commit(u, card, whys);
    score.you += pts;
    say('You laid the ' + name(card) + ' (' + pts + ').');
    record('you', { card: DECK[card].id, at: u, pts: pts,
      links: Object.keys(whys).map(function (o) { return [DECK[S.cells[o].card].id, whys[o]]; }) });
    draw(S.you);
    if (endIfDone()) return;
    itsTurn();
  });
  $('say').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var ins = Array.prototype.slice.call($('say').querySelectorAll('input'));
    var i = ins.indexOf(e.target);
    if (i >= 0 && i < ins.length - 1) ins[i + 1].focus(); else $('bLay').click();
  });

  // PASS: mark any of your cards and swap them for new ones, or keep them all
  $('bPass').addEventListener('click', function () {
    if (S.over || S.turn !== 'you' || pend) return;
    swapping = true; sel = -1; S.mark = S.you.map(function () { return false; });
    say(S.pile.length ? 'Tap the cards to swap, or keep them.' : 'The pile is empty — pass keeps your cards.');
    paint();
  });
  $('bSwap').addEventListener('click', function () {
    var kept = [], out = [];
    S.you.forEach(function (c, k) { (S.mark[k] ? out : kept).push(c); });
    S.you = kept; S.pile = out.concat(S.pile); draw(S.you);
    swapping = false; S.passes++;
    say('You swapped ' + out.length + '.');
    record('you', { pass: true, swap: out.length });
    itsTurn();
  });
  $('bNoSwap').addEventListener('click', function () {
    swapping = false; S.passes++;
    say('You passed.');
    record('you', { pass: true, swap: 0 });
    if (S.passes >= 2 && !S.pile.length) return finish('Neither of you can go on.');
    itsTurn();
  });
  $('bRound').addEventListener('click', function () { score.you = 0; score.it = 0; deal(); });

  deal();

  window.__compareNotes({ chat: CHAT, sheet: SHEET });
  window.__compareHelp({ html:
      '<b>One card is one tile, only one of each, edge to edge</b> — a card in a '
    + 'point-down space is turned a little, never upside down. Tap a card in '
    + 'your hand, tap a space, then say what it shares with each card it '
    + 'touches. <b>A point per card touched.</b> Two may each share something '
    + 'different with it; three share the same thing or each a different one — '
    + 'never two and one. Three in hand, draw one after each lay. <b>Pass</b> '
    + 'lets you swap any of your cards. Tap a card on the table to read its '
    + 'links back. It plays only links it can see, and passes rather than '
    + 'stretching.' });
})();
</script>
