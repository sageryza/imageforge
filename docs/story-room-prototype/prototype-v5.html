<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Story Room — working prototype v2</title>
<style>
  :root { --paper:#faf6ee; --surface:#fffdf8; --ink:#2a2620; --ink2:#6b6255;
          --line:#e7dfd0; --chg:#a8845c; --gold:#a8845c; --rose:#c0614a; --green:#3f6633; }
  * { margin:0; padding:0; box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { background:var(--paper); color:var(--ink); font:17px/1.5 Georgia,'Times New Roman',serif;
         padding:16px 12px 80px; -webkit-text-size-adjust:100%; }
  .wrap { max-width:680px; margin:0 auto; }
  .eyebrow { font:700 11px/1 -apple-system,'Helvetica Neue',sans-serif; letter-spacing:.22em;
             text-transform:uppercase; color:var(--gold); margin-bottom:6px; padding-right:56px; }
  h1 { font-size:25px; line-height:1.2; font-weight:700; margin-bottom:4px; padding-right:56px; }
  .sub { color:var(--ink2); font-size:14px; margin-bottom:18px; padding-right:56px; }
  .cats { display:flex; gap:7px; overflow-x:auto; -webkit-overflow-scrolling:touch;
          padding:2px 56px 14px 0; scrollbar-width:none; }
  .cats::-webkit-scrollbar { display:none; }
  .cat { flex:0 0 auto; background:var(--surface); border:1px solid var(--line);
         border-radius:6px; padding:8px 14px; font:600 13px -apple-system,'Helvetica Neue',sans-serif;
         color:var(--ink2); cursor:pointer; white-space:nowrap; -webkit-tap-highlight-color:transparent; }
  .cat.on { border-color:var(--gold); color:var(--gold); }
  h2 { font:700 13px/1.2 -apple-system,'Helvetica Neue',sans-serif; letter-spacing:.14em;
       text-transform:uppercase; color:var(--gold); margin:24px 0 10px; }
  /* shelf tiles — 4 to a row, My-Creations squares */
  .tiles { display:grid; grid-template-columns:repeat(4,1fr); gap:12px 8px; }
  .tile { display:block; color:var(--ink); text-decoration:none; -webkit-tap-highlight-color:transparent; }
  .cov { display:block; position:relative; width:100%; aspect-ratio:2/3; }
  .cov img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
             border-radius:6px; border:1px solid var(--line); background:#efe9dd; }
  .cov .none { position:absolute; inset:0; border-radius:6px; border:1px dashed #d9cdb8;
               background:var(--surface); display:flex; align-items:center; justify-content:center;
               color:#b3a68e; font:600 10px -apple-system,sans-serif; text-align:center; padding:6px; }
  /* container = stacked deck: two offset sheets behind + count badge */
  .stack .cov::before, .stack .cov::after { content:''; position:absolute; inset:0;
       border-radius:6px; border:1px solid var(--line); background:var(--surface); z-index:-1; }
  .stack .cov::before { transform:translate(3px,-3px); }
  .stack .cov::after  { transform:translate(6px,-6px); opacity:.6; }
  .stack { position:relative; z-index:0; }
  .badge { position:absolute; top:4px; right:4px; background:var(--gold); color:#fffdf8;
           font:700 11px/1 -apple-system,sans-serif; border-radius:6px; padding:4px 6px; }
  .nm { font:700 12px/1.25 Georgia,serif; padding-top:5px; display:-webkit-box;
        -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .st { display:block; font:500 10.5px/1.3 -apple-system,'Helvetica Neue',sans-serif; color:var(--ink2); padding-top:2px; }
  .st.go { color:var(--green); } .st.hot { color:var(--rose); }
  /* story view */
  .backrow { position:sticky; top:0; background:var(--paper); padding:10px 56px 10px 0; z-index:5;
             font:600 14px -apple-system,'Helvetica Neue',sans-serif; }
  .backrow a { color:var(--gold); text-decoration:none; }
  .sv h1 { margin-top:4px; }
  .chips { margin:6px 0 12px; }
  .chip { display:inline-block; font:600 11px/1 -apple-system,'Helvetica Neue',sans-serif;
          letter-spacing:.04em; border-radius:6px; padding:4px 7px; margin:2px 4px 2px 0;
          border:1px solid #e0d6c4; color:var(--ink2); background:#f6f0e4; }
  .chip.good { background:#e8f0e2; border-color:#c9dbbd; color:var(--green); }
  .chip.warn { background:#f9e9e4; border-color:#eccfc5; color:#a04f35; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:6px;
          padding:12px 14px; margin-bottom:12px; }
  .card h3 { font:700 12px/1.2 -apple-system,sans-serif; letter-spacing:.14em;
             text-transform:uppercase; color:var(--gold); margin-bottom:8px; }
  .row { display:flex; align-items:baseline; gap:8px; padding:5px 0; font-size:16px; }
  .row a { color:#8a6238; text-underline-offset:2px; }
  .row .k { color:var(--gold); font:700 13px -apple-system,sans-serif; flex:none; }
  .row .scrap { font:600 10px -apple-system,sans-serif; color:#a04f35; background:#f9e9e4;
                border:1px solid #eccfc5; border-radius:6px; padding:2px 5px; flex:none; }
  .mini { color:var(--ink2); font-size:13px; }
  /* evan version rows */
  .ver { display:flex; gap:10px; align-items:center; padding:7px 0; border-top:1px solid var(--line); text-decoration:none; color:var(--ink); }
  .ver span { display:block; }
  .ver:first-of-type { border-top:none; }
  .ver img { width:64px; height:96px; object-fit:cover; border-radius:6px; border:1px solid var(--line); flex:none; }
  .ver .t { font-weight:700; font-size:15px; }
  .ver .d { font:500 12px -apple-system,sans-serif; color:var(--ink2); }
  .mrow { display:grid; grid-template-columns:1fr 1fr; gap:10px 8px; margin-top:4px; }
  .mt { display:block; text-decoration:none; color:var(--ink); }
  .mth { display:block; position:relative; width:100%; aspect-ratio:2/3; }
  .mth img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
             border-radius:6px; border:1px solid var(--line); background:#efe9dd; }
  .mth .nopic { position:absolute; inset:0; border-radius:6px; border:1px dashed #d9cdb8;
                background:var(--surface); }
  .mplay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .mplay svg { width:34px; height:34px; fill:#fffdf8; filter:drop-shadow(0 1px 3px rgba(0,0,0,.5)); }
  .mtl { display:block; font:600 12px/1.3 -apple-system,'Helvetica Neue',sans-serif;
         color:var(--ink); padding-top:5px; }
  .sname { font:700 11px -apple-system,sans-serif; letter-spacing:.14em; text-transform:uppercase;
           color:var(--gold); margin:12px 0 6px; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .grid a { display:block; position:relative; aspect-ratio:2/3; }
  .grid img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
              border-radius:5px; border:1px solid var(--line); background:#efe9dd; }
  .arow { display:block; padding:9px 0; border-top:1px solid var(--line); }
  .arow:first-of-type { border-top:none; }
  .arow .al { display:block; font-size:15px; padding-bottom:5px; }
  .arow audio { width:100%; height:38px; }
  .filters { display:flex; flex-wrap:wrap; gap:6px; margin:2px 0 10px; }
  .fc { flex:0 0 auto; background:var(--surface); border:1px solid var(--line); border-radius:6px;
        padding:6px 10px; font:600 12px -apple-system,sans-serif; color:var(--ink2); cursor:pointer; }
  .fc.on { border-color:var(--gold); color:var(--gold); }
  .grid a { position:relative; }
  .badge2 { position:absolute; top:3px; right:3px; background:rgba(20,18,14,.62); color:#fff;
            border-radius:6px; font-size:11px; padding:2px 5px; line-height:1; }
  .badge2.no { color:#ffd9d0; }
  .lb2 { position:absolute; left:0; width:100%; background:rgba(15,13,10,.95); z-index:99;
         display:flex; align-items:flex-start; justify-content:center; padding:12px; overflow-y:auto; }
  .lb2in { max-width:560px; width:100%; }
  .lb2 img { display:block; width:100%; max-height:62vh; object-fit:contain; border-radius:6px; }
  .lb2m { color:#efe7da; padding-top:10px; }
  .lb2d { font:700 16px Georgia,serif; }
  .lb2c { font:600 12px -apple-system,sans-serif; color:#b6ac9c; padding-top:3px; }
  .lb2v { display:flex; align-items:center; gap:8px; padding:10px 0 4px; }
  .hv { width:40px; height:34px; border-radius:6px; border:1px solid #6b6255; background:transparent;
        color:#efe7da; font-size:15px; cursor:pointer; }
  .hv.on { border-color:var(--gold); color:var(--gold); }
  .hv.no.on { border-color:#c0614a; color:#e08b7a; }
  .lb2s { font:600 11px -apple-system,sans-serif; color:#8fae7f; }
  .lb2 details { margin-top:6px; }
  .lb2 summary { color:#b6ac9c; font:600 12px -apple-system,sans-serif; cursor:pointer; }
  .lb2p { font-size:13px; color:#cfc6b6; padding:6px 0; white-space:pre-wrap; }
  .lb2p b { color:var(--gold); font:600 11px -apple-system,sans-serif; letter-spacing:.1em; text-transform:uppercase; }
  .lb { position:absolute; left:0; width:100%; background:rgba(15,13,10,.94); z-index:99;
        display:flex; align-items:center; justify-content:center; padding:14px; }
  .lb img { max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain;
            border-radius:6px; display:block; }
  .note { border:1px solid #d9c9ac; background:#fbf3df; border-radius:6px; padding:10px 12px;
          margin:14px 0; font-size:14px; color:#4a4238; }
</style>

    document.documentElement.style.overflow=''; document.body.style.overflow='';
    ov.remove(); window.scrollTo(0, y);
  };
  document.body.appendChild(ov);
  document.documentElement.style.overflow='hidden'; document.body.style.overflow='hidden';
});
document.addEventListener('pointerdown',function(){ if(window.__scrollStop) window.__scrollStop(); },true);
</script>
