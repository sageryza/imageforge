name: ImageForge
options:
  bundleIdPrefix: com.sageryza
  deploymentTarget:
    iOS: "16.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
targets:
  ImageForge:
    type: application
    platform: iOS
    sources:
      - ImageForge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sageryza.imageforge
        # App Group shared with DumpShare — what lets the share sheet hand its
        # uploads to a background URLSession and dismiss immediately.
        CODE_SIGN_ENTITLEMENTS: ImageForge/ImageForge.entitlements
        GENERATE_INFOPLIST_FILE: YES
        # Base plist merged on top of the generated keys — carries the
        # deckfactory:// URL scheme (CFBundleURLTypes) for deep links.
        INFOPLIST_FILE: ImageForge/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Record your dream out loud so it can be transcribed and illustrated."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Turn your spoken dream into text as you talk."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Save your creations to your photo library."
        # Read access is what the Dump tab needs: it lists your albums so you can
        # send whole ones at once. Album listing requires FULL access — the
        # "Select Photos…" limited mode hides albums entirely.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Pick whole albums to dump into Deck Factory."
        INFOPLIST_KEY_NSCameraUsageDescription: "Take a photo of someone in your dream to turn them into a character card."
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseFirestore
      - target: DumpShare
        embed: true
      - target: ForgeWidget
        embed: true

  # "Send to Deck Factory" — the share-sheet way into the Dump, so dumping
  # works from Photos, Files, Safari, anywhere. Uploads run through a
  # BACKGROUND URLSession (Aug 2026, Sophie's call — nothing waits in the
  # foreground, house rule): that needs the App Group below on both this
  # target and the host app. Apple-managed signing with
  # -allowProvisioningUpdates registers the group during the CI build; if a
  # TestFlight build ever fails on a provisioning/entitlement error, this is
  # the first place to look.
  DumpShare:
    type: app-extension
    platform: iOS
    sources:
      - DumpShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sageryza.imageforge.dumpshare
        PRODUCT_NAME: DumpShare
        CODE_SIGN_ENTITLEMENTS: DumpShare/DumpShare.entitlements
        # Same pattern as the app target: the generated keys are produced, and
        # this plist (the NSExtension dict) is merged on top of them.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: DumpShare/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "Send to Deck Factory"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"

  # The home-screen widget (Aug 2026, Sophie: "I'd like the widget") — the
  # Update tab's count + the newest chats, refreshed on iOS's own timeline
  # from ONE small endpoint (/api/chatfeed/widget), never the real feed.
  ForgeWidget:
    type: app-extension
    platform: iOS
    sources:
      - ForgeWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sageryza.imageforge.widget
        PRODUCT_NAME: ForgeWidget
        # NO ENTITLEMENTS FILE, deliberately (Aug 2026 — the first build failed
        # exactly here): Apple-managed signing registers a NEW App ID for this
        # extension but does NOT enable the App GROUP on it, so the profile it
        # generates has no app-groups entitlement and the archive dies with
        # "profile doesn't match the entitlements file's value for
        # com.apple.security.application-groups". DumpShare's group was
        # enabled long before, which is why that target has never hit this.
        # Consequence: the widget cannot read the app's shared settings, so it
        # calls the DEFAULT server unauthenticated — fine while STUDIO_TOKEN is
        # off (it is), and it fails loudly ("can't reach the feed") rather than
        # showing a wrong number if that ever changes. To restore the group:
        # enable App Groups on com.sageryza.imageforge.widget in the developer
        # portal ONCE, then add the entitlements file back here.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ForgeWidget/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "Deck Factory"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  # Secretly a Witch — the public witchy app as its own tiny native shell
  # (WKWebView on the deployed /witch page + native SF-Symbols tab bar).
  # No Firebase, no CI patching: display name / compliance / icon / launch
  # screen are all baked in here. Built by the "Secretly a Witch TestFlight"
  # workflow in memory-library-react (lane `witch` in fastlane/Fastfile).
  SecretlyAWitch:
    type: application
    platform: iOS
    sources:
      - SecretlyAWitch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sageryza.secretlyawitch
        GENERATE_INFOPLIST_FILE: YES
        # Sign in with Apple (guideline 4.8 — required alongside Google).
        # The capability must also be enabled on the App ID in the developer
        # portal or this entitlement fails to sign.
        CODE_SIGN_ENTITLEMENTS: SecretlyAWitch/SecretlyAWitch.entitlements
        # Base plist merged on top of the generated keys — carries the
        # UILaunchScreen dict (cream LaunchBackground color).
        INFOPLIST_FILE: SecretlyAWitch/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: "Secretly a Witch"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # Long-press "Add to Photos" on any image in the web view writes to the
        # photo library; without this usage string iOS kills the app on the spot
        # (TCC crash — happened live on a lesson illustration, Aug 2026).
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Save lesson art and other images to your photo library."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
