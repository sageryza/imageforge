  <g class="norm" transform="translate(-3.0537 -3.0537) scale(1.09714)">
  <!-- "Set pyramid": a run of images as a tiered pyramid. EQUILATERAL — base 48
       wide, apex 24*sqrt(3) = 41.57 above it, so all three angles are 60°. The
       horizontal cut sits at half the HEIGHT, which lands its ends exactly
       halfway along each side, so the filled cap is this same triangle at half
       scale. Two cells along the base, one filled tier on top. -->
