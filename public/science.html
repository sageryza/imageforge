<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Science School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ── SCIENCE SCHOOL ──────────────────────────────────────────────────────
     Sophie's decision (docs/science-school/lessons-1-4.md): it must look VERY
     SIMILAR to Witch School — same tap-through deck, same progress dashes,
     same quiz + After card. THE PALETTE IS THE ONLY DELIBERATE DIFFERENCE, so
     don't redesign anything else here.

     The palette is her hearted "pastel A": mint / powder blue / butter /
     blush on PLAIN WHITE, which is also exactly what the card art is drawn in
     (cell-lesson-spec.json).

     THE PINK IS THE ART'S OWN PINK — #f6c6da, the blush out of the palette
     the cards are drawn in (Aug 2026, Sophie: "make the pink the same shade
     as the pink in the lessons"). Sampled off the real drawings to be sure:
     the dominant pink pixels across cl-01/02/05/07 are #f7c8d5-#fdcfdf, i.e.
     that value as rendered. There is exactly ONE pink here now.

     It is used ONLY where pink is a BLOCK — the progress dashes, the button,
     the rule beside a note. Small type stays ink or grey, because #f6c6da on
     white is about 1.3:1 and a pastel kicker would be unreadable; the way to
     keep her one shade honest is to not set 10px text in it at all. And NO
     BLUE anywhere in the chrome (her earlier ask, same message) — the ART
     keeps its powder blue, which is her palette. NO GRADIENTS (house rule). */
  :root {
    --bg: #ffffff;
    --bg-2: #fdf6f9;
    --surface: #ffffff;
    --surface-2: #fdf4f7;
    --panel: #fbf1f5;
    --border: #ecdfe5;
    --border-soft: #f5ecf0;
    --gold: #f6c6da;        /* the accent — still NAMED `gold` so the ported
                               deck CSS stays declaration-for-declaration the
                               same as witch.html's and can be diffed against
                               it. Its VALUE is her blush, exactly. */
    --gold-dim: #d9a8bb;
    --mint: #b6e5cf;
    --blue: #afc9e8;
    --butter: #f6e7a8;
    --blush: #f6c6da;
    --text: #33272e;
    --text-dim: #6d5c65;
    --text-faint: #a8969e;
    --radius: 6px;
    --serif: 'Cormorant Garamond', Georgia, serif;
  }
  * { touch-action: manipulation; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 16px; -webkit-font-smoothing: antialiased;
  }
  body.lesson-open { overflow: hidden; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 22px 20px 18vh; }

  /* ── The path ── */
  .eyebrow { font-size: 10.5px; font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase; color: var(--text-faint); }
  h1 { font-family: var(--serif); font-size: 34px; font-weight: 500; margin: 6px 0 4px; }
  .sub { font-size: 14.5px; line-height: 1.5; color: var(--text-dim); margin: 0 0 22px; }
  .course-hd { font-family: var(--serif); font-size: 22px; font-weight: 500; margin: 26px 0 2px; }
  .course-sub { font-size: 13px; color: var(--text-dim); margin-bottom: 10px; }
  .les {
    display: flex; align-items: center; gap: 12px; width: 100%;
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface); color: var(--text);
    font-family: inherit; text-align: left; padding: 12px 13px; cursor: pointer;
  }
  .les + .les { margin-top: 9px; }
  .les:hover { border-color: var(--gold); }
  .les-cv { width: 52px; height: 52px; flex: none; border-radius: 4px; object-fit: contain; background: var(--panel); }
  .les .lt { font-family: var(--serif); font-size: 19px; line-height: 1.2; }
  .les .ld { font-size: 12.5px; color: var(--text-dim); margin-top: 2px; }
  .les-go { margin-left: auto; color: var(--text-faint); line-height: 0; }
  .les-go svg { width: 18px; height: 18px; }
  .les.soon { opacity: .55; cursor: default; }
  .les.soon:hover { border-color: var(--border); }

  /* ── Full-screen lesson deck — ported from witch.html, palette aside ── */
  #school-lesson {
    position: fixed; inset: 0; z-index: 90;
    background: #ffffff;                     /* fallback; each card sets its own */
    display: flex; flex-direction: column;
    padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  }
  .deck-top { display: flex; align-items: center; gap: 12px; padding: 4px 16px 10px; }
  .deck-prog { display: flex; gap: 4px; flex: 1; }
  .deck-seg { flex: 1; height: 3px; border-radius: 2px; background: var(--border); transition: background .2s ease; }
  .deck-seg.on { background: var(--gold); }
  .les-back { background: none; border: none; padding: 2px 0 10px; color: var(--text-dim); cursor: pointer; line-height: 0; }
  .les-back svg { width: 21px; height: 21px; }
  .deck-stage { flex: 1; display: flex; flex-direction: column; min-height: 0; cursor: pointer; -webkit-user-select: none; user-select: none; overflow: hidden; }
  @keyframes tcardIn { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
  #deck-stage .tcard { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: stretch; overflow: hidden; animation: tcardIn .22s ease; }
  .tcard-img { width: 100%; height: auto; flex: 999 9 42vh; min-height: 110px; max-height: min(42vh, 430px); object-fit: contain; display: block; }
  .deck-head { flex: none; padding: 10px 24px 4px; }
  .deck-text { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; padding: 8px 24px 0; overflow-y: auto; }
  .deck-text > :first-child { margin-top: auto; }
  .deck-text > :last-child { margin-bottom: auto; }
  .tcard-kicker { text-align: center; font-size: 10.5px; font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase; color: var(--text-faint); }
  .tcard-h { font-family: var(--serif); font-size: 24px; font-weight: 500; line-height: 1.15; text-align: center; color: var(--text); margin: 6px 0 0; }
  .tcard-body { font-size: 16px; line-height: 1.55; color: var(--text); text-align: center; max-width: 340px; margin: 0 auto; }
  .tcard-body b { font-weight: 600; }
  .tap-arrow { text-align: center; margin-top: 14px; opacity: 0; animation: tapArrowIn .8s ease 4s forwards, tapArrowNudge 1.4s ease 4.8s infinite; }
  .tap-arrow svg { width: 28px; height: 28px; color: var(--gold); }
  @keyframes tapArrowIn { to { opacity: 1; } }
  @keyframes tapArrowNudge { 0%,100% { transform: translateX(0); } 25% { transform: translateX(3px); } 75% { transform: translateX(-3px); } }

  /* The ⓘ FAQ — a card's obvious follow-ups, answered in place. */
  .faq-btn { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; margin-left: 7px; padding: 0; background: none; border: none; cursor: pointer; color: var(--text-faint); line-height: 0; vertical-align: middle; }
  .faq-btn svg { width: 17px; height: 17px; stroke: currentColor; fill: none; }
  .faq-btn:hover, .faq-btn.on { color: var(--text-dim); }
  .faq-wrap { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; padding: 16px; z-index: 6; }
  .faq-wrap.on { display: flex; }
  .faq-card { background: #ffffff; border: 1px solid var(--border); border-radius: 8px; padding: 15px 16px 14px; max-height: 100%; overflow-y: auto; text-align: left; box-shadow: 0 10px 30px rgba(38, 49, 58, .13); }
  .faq-card .faq-hd { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-faint); margin-bottom: 10px; }
  .faq-card .faq-q { font-size: 14px; font-weight: 600; margin-top: 13px; }
  .faq-card .faq-q:first-of-type { margin-top: 0; }
  .faq-card .faq-a { font-size: 14px; line-height: 1.5; margin-top: 3px; }
  .faq-card .faq-close { font-size: 11px; color: var(--text-faint); text-align: center; margin-top: 14px; }

  /* "Check your knowing" — a wrong tap flips the card and warmly tells you. */
  .know { width: min(340px, 88vw); margin: 0 auto; perspective: 900px; }
  .know-n { text-align: center; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-faint); margin-bottom: 10px; }
  .know-flip { position: relative; width: 100%; transform-style: preserve-3d; transition: transform .55s ease; min-height: 280px; }
  .know-flip.flipped { transform: rotateY(180deg); }
  .know-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border: 1px solid var(--border); border-radius: 10px; padding: 18px 16px; background: var(--surface); display: flex; flex-direction: column; justify-content: center; gap: 10px; }
  .know-face.back { transform: rotateY(180deg); text-align: center; }
  .know-q { font-size: 16px; line-height: 1.5; text-align: center; margin-bottom: 2px; }
  .know-opt { border: 1px solid var(--border); border-radius: 6px; background: none; color: var(--text); font-family: inherit; font-size: 14px; padding: 11px 12px; cursor: pointer; text-align: left; }
  .know-opt:hover { border-color: var(--gold); }
  .know-verdict { font-size: 15px; color: var(--text-dim); }
  .know-tell { font-size: 14.5px; line-height: 1.55; }
  .know-hint { font-size: 11px; color: var(--text-faint); }

  .deck-nav { flex: none; display: flex; align-items: center; gap: 12px; padding: 10px 20px 0; }
  .deck-prev { background: none; border: none; color: var(--text-dim); font-family: inherit; font-size: 14px; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; padding: 6px 0; }
  .deck-prev svg { width: 15px; height: 15px; }
  .btn { border: 1px solid var(--gold); border-radius: var(--radius); background: var(--gold); color: var(--text); font-family: inherit; font-size: 15px; padding: 9px 18px; cursor: pointer; width: auto; }
  .deck-next { margin-left: auto; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<div class="wrap" id="path">
  <div class="eyebrow">Science School</div>
  <h1>The living world</h1>
  <p class="sub">One idea a card. Every lesson names the experiment — who did it, when, and what they actually did.</p>

  <div class="course-hd">Biology</div>
  <div class="course-sub">Starts with the cell, because everything after it stands on that.</div>
  <div id="course-list"></div>
</div>

<!-- Lesson reader: tap-based deck (cards injected by JS) -->
<div id="school-lesson" style="display:none;">
  <div class="deck-top">
    <button class="les-back" id="lesson-back" aria-label="Back to lessons"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <div class="deck-prog" id="deck-prog"></div>
  </div>
  <div class="deck-stage" id="deck-stage"></div>
  <div class="deck-nav">
    <button class="deck-prev" id="deck-prev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg> Back</button>
    <button class="btn deck-next" id="deck-next">Continue</button>
  </div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); };

  /* The art is served as WEBP, never the ~1MB PNG originals (house rule).
     The cards are written by scripts/witch-school-cards.js into
     witch-school/assets/ and converted by `node scripts/webp-assets.js school`,
     so they share the school folder — hence the same base as witch.html.
     Reach art through SCI_IMG + SCI_EXT, never a hard-coded extension. */
  var SCI_IMG = 'https://storage.googleapis.com/deckfactory-43176.firebasestorage.app/witch-school/webp/';
  var SCI_EXT = '.webp';

  /* ── Lesson 1 — The Cell (text: docs/science-school/lessons-1-4.md) ──
     Card shape is Witch School's: { img, bg, kicker, h, body, faq? }, plus a
     `know` quiz card after the facts it tests, and an "After" card last.
     The After card is an OBSERVATION, not a feature — a science lesson has no
     app feature to point at, so there is no CTA. */
  var CELL_CARDS = [
    { img: 'cl-01', bg: '#ffffff', kicker: 'The Cell', h: 'Everything is made of these',
      body: 'Every living thing you have ever seen — the oak, the mould on the bread, the person next to you — is either one cell or a great many stuck together. There is no exception anyone has found. This is the first lesson because the next three are all about what happens inside one. We\'ll go one idea at a time.' },
    { img: 'cl-02', bg: '#ffffff', kicker: 'London, 1665', h: 'A slice of cork',
      body: '<b>Robert Hooke</b> put a shaving of cork under his own microscope and saw it was not solid at all: it was a honeycomb of tiny empty boxes. He needed a word, and the boxes reminded him of the small bare rooms monks slept in — <i>cells</i>. He published the drawing in <i>Micrographia</i> the same year. He was looking at the dead walls of plant cells, which is why they looked empty.',
      faq: [
        { q: 'Did Hooke know they had been alive?', a: 'No. Cork is dead tissue, so what he drew was the empty walls left behind. That living things are <i>made</i> of cells took another 170 years to state properly.' },
        { q: 'What was Micrographia?', a: 'His book of what he saw through the microscope — fleas, a fly\'s eye, the point of a needle — drawn at a size nobody had seen before. It was a bestseller; Samuel Pepys sat up until two in the morning with it.' },
        { q: 'Whose microscope was it?', a: 'His own compound design, two lenses in a tube with an oil lamp and a water flask to throw light on the sample. It magnified about 50x — good enough for cork walls, not for anything swimming.' }
      ] },
    { img: 'cl-03', bg: '#ffffff', kicker: 'Delft, 1670s', h: 'The first living ones',
      body: '<b>Antonie van Leeuwenhoek</b> ground his own lenses, better than anyone else\'s, and turned them on pond water, scrapings from his teeth, rainwater from a gutter. He found things swimming. He called them <b>animalcules</b> and wrote to the Royal Society about them for fifty years. Nobody had known that a drop of water was full of life.',
      faq: [
        { q: 'How did his lenses beat everyone\'s?', a: 'A single tiny bead of glass, ground and polished by hand, held in a brass plate you squinted through. Simpler than Hooke\'s two-lens tube and far sharper — up to about 270x. He never told anyone his method.' },
        { q: 'Was he a scientist?', a: 'He was a draper. He had no university training and no Latin, and wrote his letters in Dutch. The Royal Society had them translated for fifty years.' },
        { q: 'Did people believe him?', a: 'Not at first — the Society sent people to Delft to check. His lens-making was so far ahead that nobody matched his images for over a century.' }
      ] },
    { img: 'cl-04', bg: '#ffffff', kicker: 'The scale', h: 'How small, exactly',
      body: 'A typical cell in your body is about a hundredth of a millimetre across — you could line up roughly a hundred of them along the edge of a grain of sand. That is why nobody knew about them until lenses got good. Not every cell is small: a single nerve cell can run from the base of your spine to your toe, and an ostrich egg is one cell.' },
    { img: 'cl-05', bg: '#ffffff', kicker: 'The count', h: 'Thirty-seven trillion',
      body: 'The most careful estimate of how many cells a human body contains — done by adding up organ by organ rather than guessing — is about <b>37 trillion</b> (Bianconi and colleagues, 2013). Written out, that is 37 followed by twelve zeroes. They are being replaced constantly; the estimate is a snapshot of a population, not a fixed number.' },
    { img: 'cl-06', bg: '#ffffff', kicker: 'The correction', h: 'You are not outnumbered ten to one',
      body: 'You will still read that bacterial cells outnumber your own by ten to one. That figure came from a back-of-envelope calculation in 1972 and was repeated for forty years. When it was finally checked properly (<b>Sender, Fuchs and Milo, 2016</b>) the real ratio came out at roughly <b>one to one</b> — about 38 trillion bacteria to 30 trillion human cells. A number can survive a long time on being repeated.',
      faq: [
        { q: 'Where did the ten-to-one come from?', a: 'A 1972 paper estimating bacteria per gram of gut contents and multiplying up. It was offered as a rough order of magnitude, not a measurement, and the caveat fell off as it was quoted.' },
        { q: 'How was it checked?', a: 'By measuring what is actually in the colon — the only part of you holding bacteria in real numbers — and counting human cells by organ. Red blood cells turn out to be about 84% of you by count.' },
        { q: 'Does the ratio change?', a: 'Yes, by a lot, over the course of a day. A single visit to the toilet shifts it measurably, which is another reason a fixed ratio was always the wrong shape of answer.' }
      ] },
    { img: 'cl-07', bg: '#ffffff', kicker: 'The rule', h: 'Cells come from cells',
      body: 'Schleiden and Schwann proposed in 1838–39 that all plants and all animals are made of cells. <b>Rudolf Virchow</b> added the part that mattered most in 1855: <i>omnis cellula e cellula</i> — every cell comes from a cell that was already alive. No cell has ever been seen to assemble itself from scratch. Your cells are an unbroken line of division going back billions of years.' },
    { know: { qs: [
        { q: 'Hooke named the cell after…', a: ['the small rooms monks slept in', 'the shape of a honeycomb', 'the Latin for "seed"'], ok: 0,
          tell: 'He was looking at dead cork, a honeycomb of empty boxes, and reached for a word that fit the shape.' },
        { q: 'The bacteria-to-human-cell ratio is closest to…', a: ['ten to one', 'one to one', 'a hundred to one'], ok: 1,
          tell: 'The famous ten-to-one came from a rough 1972 estimate and stood unchecked for forty years. Measured properly in 2016: about 38 trillion to 30 trillion.' },
        { q: 'Virchow\'s addition to cell theory was that…', a: ['plants and animals are both made of cells', 'every cell comes from another cell', 'cells can be seen with a microscope'], ok: 1,
          tell: 'Not that cells exist — that none has ever been seen to start from nothing.' }
      ] }, bg: '#ffffff', kicker: 'Try it', h: 'Check your knowing' },
    { img: 'cl-09', bg: '#ffffff', kicker: 'The exception', h: 'The things that aren\'t cells',
      body: 'A virus is not a cell. It has genetic material and a coat and nothing else — no machinery of its own, no way to make a copy of itself without borrowing a cell\'s equipment. This is why "is a virus alive?" has no agreed answer: it fails the definition biology built around the cell.',
      faq: [
        { q: 'So is a virus alive or not?', a: 'There is no settled answer, and that is the honest state of it. It carries genes and evolves, which looks alive; it has no metabolism and cannot copy itself alone, which does not.' },
        { q: 'How much smaller than a cell?', a: 'Typically 20–300 nanometres against a 10,000-nanometre cell — so a few hundred to a few thousand would fit across one. Most are far too small for a light microscope; they were only seen once the electron microscope arrived in the 1930s.' },
        { q: 'Are there other in-between things?', a: 'Yes. Viroids are a loop of RNA with no coat at all, and prions are a misfolded protein with no genetic material — both spread, neither is a cell.' }
      ] },
    { img: 'cl-10', bg: '#ffffff', kicker: 'After', h: 'Tonight',
      body: 'Look at something living with your eyes as close as they will go — the edge of a leaf, the skin on your forearm, a slice of onion held to a window. You will not see cells. What you <i>can</i> see is the point: this whole layer of the world was invisible until 1665, and everything in the next three lessons happens down there.<br><br><b>Tonight:</b> find the smallest living thing you can actually see.' }
  ];


  /* ── Lesson 2 — What's Inside One ── */
  var INSIDE_CARDS = [
    { img: 'in-01', bg: '#ffffff', kicker: 'Inside a cell', h: 'Not a bag of soup',
      body: 'A cell is not one substance. Inside its outer membrane there are separate pieces of machinery, each walled off, each doing one job — the way a kitchen has an oven and a sink and a bin rather than one all-purpose surface. They are called <b>organelles</b>, little organs.' },
    { img: 'in-02', bg: '#ffffff', kicker: 'The office', h: 'The nucleus',
      body: 'The largest thing in most of your cells is the <b>nucleus</b>, a sphere with its own double membrane holding the DNA. Nothing comes out of it but copies — instructions are transcribed inside and the copy is sent out to be used. The original never leaves the room. Lesson 4 is about what happens to those copies.' },
    { img: 'in-03', bg: '#ffffff', kicker: 'The floor', h: 'Ribosomes',
      body: '<b>Ribosomes</b> are the machines that build proteins, and there are millions of them in a single cell — some drifting loose, some studding the folded membranes around the nucleus. They are the smallest thing in this lesson and the busiest.' },
    { img: 'in-04', bg: '#ffffff', kicker: 'The power', h: 'Mitochondria',
      body: '<b>Mitochondria</b> are bean-shaped and there may be a handful in one cell or thousands, depending on how hard it works — heart muscle is packed with them. They take sugar and oxygen and produce the chemical the rest of the cell spends, ATP. The next card is why they are strange.' },
    { img: 'in-05', bg: '#ffffff', kicker: 'The strange part', h: 'They have their own DNA',
      body: 'Mitochondria carry their <b>own DNA</b>, separate from the DNA in the nucleus — in humans a small circular loop of 16,569 letters. They have their own ribosomes. They divide on their own schedule rather than when the cell does. And you inherited yours from your mother only; your father\'s contributed nothing. None of that is how an organelle should behave.',
      faq: [
        { q: 'Why only from your mother?', a: 'The egg brings its own mitochondria into the new cell and the sperm\'s are destroyed shortly after fertilisation. So that small loop is a copy of your mother\'s, and hers of her mother\'s, back and back.' },
        { q: 'Can something go wrong with it?', a: 'Yes — mitochondrial diseases are inherited down the maternal line and often hit the tissues that need the most energy: muscle, nerve, heart, eye.' },
        { q: 'How many letters is that, next to yours?', a: '16,569 against about three billion in the nucleus. So it is a tiny fraction of your total DNA, and you cannot live without it.' }
      ] },
    { img: 'in-06', bg: '#ffffff', kicker: 'Boston, 1967', h: 'The paper nobody would take',
      body: '<b>Lynn Margulis</b> had an explanation: mitochondria were once free-living bacteria that got swallowed by a larger cell and were never digested — both sides did better, and they stayed. She wrote it up as <i>On the Origin of Mitosing Cells</i>. It was rejected by <b>fifteen journals</b>, some without being read, before the <i>Journal of Theoretical Biology</i> published it. She was thirty and publishing under a married name, Lynn Sagan.',
      faq: [
        { q: 'Why was it so unwelcome?', a: 'It said a major step in evolution happened by one organism swallowing another and keeping it, rather than by gradual change. That was outside how the field was thinking, and she had no way yet to prove it.' },
        { q: 'Was the idea hers originally?', a: 'The suggestion had been floated around 1905 by Konstantin Mereschkowski and largely forgotten. Margulis assembled the evidence and argued it properly, which is what made it stick.' },
        { q: 'What happened to her afterwards?', a: 'She kept working on symbiosis for forty years, was elected to the National Academy of Sciences, and received the National Medal of Science in 1999.' }
      ] },
    { img: 'in-07', bg: '#ffffff', kicker: 'The verdict', h: 'She was right',
      body: 'When DNA sequencing arrived it settled the argument. Read a mitochondrion\'s genes and its closest living relatives are not any part of you — they are a group of bacteria. The same is true of chloroplasts, the green parts of plants, which were once free-living photosynthetic bacteria. <b>Endosymbiosis</b> is now in every textbook.' },
    { know: { qs: [
        { q: 'Which of these is the giveaway that mitochondria were once separate organisms?', a: ['they are bean-shaped', 'they have their own DNA and divide on their own schedule', 'there are thousands of them'], ok: 1,
          tell: 'A normal organelle is built by the cell to order. These carry their own genes, their own ribosomes, and their own timing.' },
        { q: 'Margulis\'s paper was rejected by…', a: ['two journals', 'fifteen journals', 'nobody — it was taken at once'], ok: 1,
          tell: 'Some without reading it. The Journal of Theoretical Biology published it in 1967.' },
        { q: 'You inherit your mitochondria from…', a: ['both parents equally', 'your mother only', 'whichever parent you resemble'], ok: 1,
          tell: 'Which is why mitochondrial DNA is used to trace maternal lines back through thousands of years.' }
      ] }, bg: '#ffffff', kicker: 'Try it', h: 'Check your knowing' },
    { img: 'in-09', bg: '#ffffff', kicker: 'The consequence', h: 'Two kinds of cell',
      body: 'Cells that keep their DNA in a nucleus are called <b>eukaryotes</b> — you, oak trees, yeast, amoebae. Cells that don\'t are <b>prokaryotes</b> — bacteria and archaea, which are older and enormously more numerous. The swallowing Margulis described is roughly where the first group came from.' },
    { img: 'in-10', bg: '#ffffff', kicker: 'After', h: 'Tonight',
      body: 'Mitochondria are the reason you breathe. Every breath you take is oxygen going to trillions of former bacteria so they can finish burning your last meal, and the carbon dioxide coming back out is their exhaust. Notice one breath with that in mind.<br><br><b>Tonight:</b> one breath, followed all the way down.' }
  ];

  /* ── Lesson 3 — DNA ── */
  var DNA_CARDS = [
    { img: 'dn-01', bg: '#ffffff', kicker: 'DNA', h: 'The instructions',
      body: 'Every cell in your body carries the same set of instructions, written in a molecule called <b>DNA</b>, and the copy in a cell in your foot is identical to the copy in a cell behind your eye. What differs is which parts each cell is reading. This lesson is what the molecule is; the next is how a cell reads it.' },
    { img: 'dn-02', bg: '#ffffff', kicker: 'Tübingen, 1869', h: 'Found in bandages',
      body: '<b>Friedrich Miescher</b> was studying white blood cells and getting them from the pus-soaked bandages of a nearby hospital. He isolated something from the nuclei that was not protein and not fat, and called it <b>nuclein</b>. That was DNA, found eighty-four years before anyone worked out what it looked like or what it did.',
      faq: [
        { q: 'Why bandages?', a: 'He needed white blood cells in quantity, and surgical dressings from the clinic next door were the richest source available in 1869. He washed them off the cloth.' },
        { q: 'Did he know what he had?', a: 'No. He knew it was a new substance, rich in phosphorus, that came out of the nucleus specifically — which is why he named it after the nucleus.' },
        { q: 'What took eighty-four years?', a: 'Chemistry good enough to work out what it was made of, and X-ray crystallography good enough to see its shape. Both arrived in the 1940s and 50s.' }
      ] },
    { img: 'dn-03', bg: '#ffffff', kicker: 'The doubt', h: 'Nobody thought it was the answer',
      body: 'For decades DNA was assumed to be too boring to carry heredity — only four different units, where proteins had twenty. Most biologists expected genes to turn out to be proteins. <b>Avery, MacLeod and McCarty</b> showed in 1944 that it was DNA after all, and the field still took years to be convinced.' },
    { img: 'dn-04', bg: '#ffffff', kicker: 'London, 1952', h: 'Photograph 51',
      body: '<b>Rosalind Franklin</b>\'s laboratory produced an X-ray image of DNA fibres so clean that its cross-shaped pattern could only mean a helix — and the spacing in it gave the dimensions. The exposure took around a hundred hours. It is the single most important piece of evidence for the structure, and it is a photograph of something far too small to see.',
      faq: [
        { q: 'How does a cross mean a helix?', a: 'X-rays bouncing off a spiral scatter into an X shape; the angle of the arms gives the pitch of the spiral and the spacing of the spots gives the distance between the rungs. What the film records is the shadow the molecule casts, not the molecule.' },
        { q: 'Who actually took it?', a: 'Raymond Gosling, her PhD student, working on her equipment and under her direction on a method she had refined.' },
        { q: 'Did she know it had been shown to them?', a: 'There is no evidence she did. Wilkins showed it to Watson without asking her, and the 1953 paper credits her work only as "unpublished results".' }
      ] },
    { img: 'dn-05', bg: '#ffffff', kicker: 'Cambridge, 1953', h: 'The double helix',
      body: 'Watson and Crick published the structure in <i>Nature</i> in April 1953: two strands winding round each other, joined down the middle by pairs of chemical letters. Franklin\'s photograph had been shown to them without her knowledge. She died of ovarian cancer in 1958 at 37; the Nobel was awarded in 1962, and is not given posthumously.' },
    { img: 'dn-06', bg: '#ffffff', kicker: 'The letters', h: 'A pairs with T',
      body: 'There are four letters: <b>A, T, C, G</b>. A only ever pairs with T, and C only ever pairs with G. That is the whole reason the molecule can copy itself — unzip the two strands and each one carries enough information to rebuild its missing partner exactly. Watson and Crick\'s paper noted this in one famously understated sentence.' },
    { img: 'dn-07', bg: '#ffffff', kicker: 'The length', h: 'Two metres, coiled',
      body: 'The DNA in a single one of your cells is about <b>two metres</b> long if it were pulled straight, wound down into a nucleus a few thousandths of a millimetre across. It manages that by wrapping around protein spools, which is also how the cell controls what can be read: tightly wound is unreadable, loosened is open for business.' },
    { know: { qs: [
        { q: 'DNA was first isolated in…', a: ['1869', '1928', '1953'], ok: 0,
          tell: 'By Friedrich Miescher, out of the pus on hospital bandages — eighty-four years before its structure was known.' },
        { q: 'The evidence that settled the helix was…', a: ['a chemical test', 'an X-ray photograph', 'a microscope image'], ok: 1,
          tell: 'Photograph 51, from Rosalind Franklin\'s lab, took around a hundred hours of exposure.' },
        { q: 'A pairs only with T, and C only with G. The consequence is…', a: ['the molecule is very stable', 'each strand contains enough to rebuild the other', 'there are only four kinds of gene'], ok: 1,
          tell: 'Which is how a cell copies its instructions before it divides.' }
      ] }, bg: '#ffffff', kicker: 'Try it', h: 'Check your knowing' },
    { img: 'dn-09', bg: '#ffffff', kicker: 'The size of it', h: 'Three billion letters',
      body: 'Your genome is about <b>three billion</b> letter-pairs long. Printed at ordinary book size it would run to hundreds of thousands of pages. The Human Genome Project took thirteen years and finished a draft in 2003; the same job now takes about a day.' },
    { img: 'dn-10', bg: '#ffffff', kicker: 'The surprise', h: 'Most of it is not genes',
      body: 'Only about <b>1 to 2 per cent</b> of your genome is instructions for building proteins — roughly 20,000 genes, which is around the same number a nematode worm has. What the rest does is still being worked out: some of it controls when genes switch on, some is the wreckage of ancient viruses, and some may do nothing at all. Expecting "more complex animal, more genes" turned out to be wrong.' },
    { img: 'dn-11', bg: '#ffffff', kicker: 'After', h: 'This week',
      body: 'Two metres of it in every cell, three billion letters long, and the copy in your thumb is the same as the copy in your heart. Find one trait you share with a parent — an eye colour, a way your hands look, the shape of an ear — and know that you are looking at a passage of text that was copied, letter for letter, into you.<br><br><b>This week:</b> find the one you inherited.' }
  ];

  /* ── Lesson 4 — Reading the Code ── */
  var CODE_CARDS = [
    { img: 'cd-01', bg: '#ffffff', kicker: 'The code', h: 'From letters to a body',
      body: 'DNA is a list of instructions, but an instruction does nothing until something reads it. This lesson is the reading: how a sequence of four repeating letters becomes a physical object — an enzyme, a hair, the pigment in an iris.' },
    { img: 'cd-02', bg: '#ffffff', kicker: 'Two steps', h: 'Copy, then build',
      body: 'It happens in two moves. <b>Transcription</b>: inside the nucleus a stretch of DNA is copied into a portable single-stranded version called mRNA, and the copy leaves. <b>Translation</b>: out in the cell a ribosome runs along that copy and builds a protein to match. Crick named the overall flow the <i>central dogma</i> in 1957.' },
    { img: 'cd-03', bg: '#ffffff', kicker: 'The unit', h: 'Three letters at a time',
      body: 'The ribosome reads in <b>threes</b>. Each group of three letters — a <b>codon</b> — specifies one amino acid, and amino acids strung in order make a protein. Three letters from an alphabet of four gives 64 possible codons for 20 amino acids, so most amino acids have more than one codon that calls them.' },
    { img: 'cd-04', bg: '#ffffff', kicker: 'Bethesda, 1961', h: 'Three in the morning',
      body: 'Nobody knew which codon meant what until <b>Heinrich Matthaei</b>, working with <b>Marshall Nirenberg</b>, made an artificial RNA of nothing but U, added it to a cell extract, and at three in the morning on 27 May found one of his twenty tubes had built a protein of nothing but phenylalanine. <b>UUU means phenylalanine.</b> It was the first word anyone translated, and the rest of the code followed within five years.',
      faq: [
        { q: 'Why twenty tubes?', a: 'One per amino acid. Each tube had a different amino acid tagged so it could be detected, and whichever tube built something told them what UUU meant.' },
        { q: 'How was the rest cracked?', a: 'By making RNAs of known repeating patterns and, later, short defined triplets — about five years of grinding through combinations until all 64 were assigned.' },
        { q: 'Did they get the Nobel?', a: 'Nirenberg shared it in 1968 with Holley and Khorana. Matthaei, who ran the experiment that night, did not.' }
      ] },
    { img: 'cd-05', bg: '#ffffff', kicker: 'The punctuation', h: 'Start and stop',
      body: 'The code has punctuation. <b>AUG</b> means start — and also means the amino acid methionine, so every protein begins with one. Three codons mean stop and specify no amino acid at all; the ribosome reaches one and releases what it has built.' },
    { img: 'cd-06', bg: '#ffffff', kicker: 'The universality', h: 'The same code in everything',
      body: 'Here is the part that carries the weight: the codon table is very nearly <b>identical in every living thing</b> — bacteria, yeast, oak, whale, you. UUU means phenylalanine in all of them. The simplest explanation is that the code was fixed once, in a shared ancestor, and has barely moved since.' },
    { img: 'cd-07', bg: '#ffffff', kicker: 'The proof of it', h: 'Bacteria that make insulin',
      body: 'That shared code is not a theory you have to take on trust — it is manufacturing. In 1978 the human gene for insulin was put into <i>E. coli</i>, and the bacteria read it and built human insulin, because to them it was just an instruction in a language they already spoke. It reached patients in 1982. Most insulin in the world is made this way now.',
      faq: [
        { q: 'What did people use before 1982?', a: 'Insulin extracted from pig and cow pancreases collected at slaughterhouses. It worked, but it was a slightly different molecule and some people reacted to it.' },
        { q: 'How do you get a gene into a bacterium?', a: 'On a plasmid — a small ring of DNA bacteria pass around anyway. Cut the ring, drop the gene in, close it, and let the bacteria take it up.' },
        { q: 'Is anything else made this way?', a: 'Growth hormone, clotting factors, several vaccines, and most of the enzymes in washing powder.' }
      ] },
    { know: { qs: [
        { q: 'A codon is…', a: ['one letter of DNA', 'three letters of DNA or RNA', 'a whole gene'], ok: 1,
          tell: 'Read in threes, each group naming one amino acid. Four letters in groups of three gives 64 combinations.' },
        { q: 'The first codon to be cracked was…', a: ['AUG, in 1953', 'UUU, in 1961', 'nobody cracked one — it was deduced'], ok: 1,
          tell: 'Matthaei and Nirenberg\'s artificial poly-U RNA built a protein of pure phenylalanine — at three in the morning.' },
        { q: 'Bacteria can be made to produce human insulin because…', a: ['they are taught to', 'the genetic code is the same in both', 'insulin is a simple molecule'], ok: 1,
          tell: 'The gene is an instruction in a language E. coli already reads. Human insulin has been made this way since 1982.' }
      ] }, bg: '#ffffff', kicker: 'Try it', h: 'Check your knowing' },
    { img: 'cd-09', bg: '#ffffff', kicker: 'When it goes wrong', h: 'One letter',
      body: 'Change a single letter and the effect ranges from nothing at all to everything. Many changes land on a codon that still calls the same amino acid, and nothing happens. Sickle cell disease is one letter — a single A becoming a T, one amino acid swapped, and the shape of the haemoglobin molecule changes enough to deform the whole red blood cell.' },
    { img: 'cd-10', bg: '#ffffff', kicker: 'After', h: 'Tonight',
      body: 'Your body is running this right now, in every cell, millions of times a second: a copy leaves a nucleus, a ribosome reads it in threes, a protein comes out folded and working. Eat something with protein in it and you are taking apart someone else\'s version of the same process to build your own.<br><br><b>Tonight:</b> one meal, read as instructions being recycled.' }
  ];

  var LESSONS = { cell: CELL_CARDS, inside: INSIDE_CARDS, dna: DNA_CARDS, code: CODE_CARDS };
  var LESSON_TITLES = { cell: 'The Cell', inside: 'What\'s Inside One', dna: 'DNA', code: 'Reading the Code' };
  /* Notes on a lesson live in the CHAT'S COMPARE TAB, not on this page
     (Aug 2026, Sophie: "just put it in the compare tab where it belongs").
     The page posted there uses these same keys as its item ids — cell /
     inside / dna / code, sheet `lessons-4` — so read what she wrote with
     GET /api/chatfeed/verdict?chat=<slug>&sheet=lessons-4. Never renumber or
     reuse one: it is what her words hang on. */
  var COURSE = { title: 'Biology', lessons: [
    { key: 'cell', note: 'cell', title: 'The Cell', sub: 'Everything is made of these', cover: 'cl-01' },
    { key: 'inside', note: 'inside', title: 'What\'s Inside One', sub: 'The machinery, and the one that used to be a bacterium', cover: 'in-04' },
    { key: 'dna', note: 'dna', title: 'DNA', sub: 'Two metres of instructions, in every cell', cover: 'dn-05' },
    { key: 'code', note: 'code', title: 'Reading the Code', sub: 'How four letters become a body', cover: 'cd-03' }
  ] };

  /* ── The path ── */
  var CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>';
  function renderPath() {
    $('course-list').innerHTML = COURSE.lessons.map(function (l) {
      var cover = l.cover ? '<img class="les-cv" src="' + SCI_IMG + l.cover + SCI_EXT + '" alt="" loading="lazy">'
                          : '<span class="les-cv"></span>';
      return '<button class="les' + (l.key ? '' : ' soon') + '"' + (l.key ? ' data-lesson="' + l.key + '"' : ' disabled') + ' type="button">' +
        cover + '<div><div class="lt">' + esc(l.title) + '</div><div class="ld">' + esc(l.sub) + '</div></div>' +
        (l.key ? '<span class="les-go">' + CHEV + '</span>' : '') + '</button>';
    }).join('');
    Array.prototype.forEach.call($('course-list').querySelectorAll('[data-lesson]'), function (b) {
      b.addEventListener('click', function () { openLesson(b.dataset.lesson); });
    });
  }

  /* ── The deck ── */
  var deckCards = CELL_CARDS, deckIdx = 0, deckKey = 'cell';
  var preloaded = {};
  function preload(cards) {
    cards.forEach(function (c) {
      if (!c.img || preloaded[c.img]) return;
      preloaded[c.img] = 1; var im = new Image(); im.src = SCI_IMG + c.img + SCI_EXT;
    });
  }
  var FAQ_BTN = '<button class="faq-btn" id="faq-btn" type="button" aria-label="More about this"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg></button>';
  function faqPanel(faq) {
    return '<div class="faq-wrap" id="faq-wrap"><div class="faq-card">' +
      '<div class="faq-hd">More about this</div>' +
      faq.map(function (f) { return '<div class="faq-q">' + esc(f.q) + '</div><div class="faq-a">' + f.a + '</div>'; }).join('') +
      '<div class="faq-close">tap anywhere to close</div></div></div>';
  }
  var TAP_HINT = '<div class="tap-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></div>';

  // A wrong tap flips the card and warmly tells you the answer. No score, no
  // timer, nothing red — you always finish.
  function renderKnowStage(c) {
    var qs = c.know.qs, qi = 0;
    $('deck-stage').innerHTML = '<div class="tcard">' +
      '<div class="deck-head"><div class="tcard-kicker">' + esc(c.kicker) + '</div>' +
      '<div class="tcard-h">' + esc(c.h) + '</div></div>' +
      '<div class="know"><div class="know-n" id="know-n"></div><div class="know-flip" id="know-flip"></div></div></div>';
    var flip = $('know-flip'), nEl = $('know-n');
    function renderQ() {
      var q = qs[qi];
      nEl.textContent = (qi + 1) + ' of ' + qs.length;
      flip.className = 'know-flip';
      flip.innerHTML = '<div class="know-face front"><div class="know-q">' + esc(q.q) + '</div>' +
        q.a.map(function (t, i) { return '<button class="know-opt" data-ki="' + i + '" type="button">' + esc(t) + '</button>'; }).join('') +
        '</div><div class="know-face back" id="know-back"></div>';
      Array.prototype.forEach.call(flip.querySelectorAll('.know-opt'), function (btn) {
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          var right = +btn.dataset.ki === q.ok;
          $('know-back').innerHTML = '<div class="know-verdict">' + (right ? '✦ Just so.' : 'Actually —') + '</div>' +
            '<div class="know-tell">' + esc(q.tell) + '</div>' +
            '<div class="know-hint">tap the card to keep going</div>';
          flip.classList.add('flipped');
        });
      });
    }
    flip.addEventListener('click', function (e) {
      if (!flip.classList.contains('flipped')) return;
      e.stopPropagation(); qi++;
      if (qi >= qs.length) { deckNext(); return; }
      renderQ();
    });
    renderQ();
  }

  function renderDeckCard() {
    var c = deckCards[deckIdx];
    $('school-lesson').style.background = c.bg || '#ffffff';
    $('deck-prog').innerHTML = deckCards.map(function (_, i) {
      return '<span class="deck-seg' + (i <= deckIdx ? ' on' : '') + '"></span>'; }).join('');
    if (c.know) { renderKnowStage(c); }
    else {
      $('deck-stage').innerHTML = '<div class="tcard">' +
        '<div class="deck-head"><div class="tcard-kicker">' + esc(c.kicker) + '</div>' +
        '<div class="tcard-h">' + esc(c.h) + (c.faq ? FAQ_BTN : '') + '</div></div>' +
        '<img class="tcard-img" src="' + SCI_IMG + c.img + SCI_EXT + '" alt="">' +
        '<div class="deck-text"><div class="tcard-body">' + c.body + '</div>' +
        (deckIdx === 0 ? TAP_HINT : '') + '</div>' +
        (c.faq ? faqPanel(c.faq) : '') + '</div>';
    }
    // The ⓘ and its panel live inside the tap-zone stage, so both swallow the
    // tap — otherwise opening the FAQ would also turn the card.
    var faqBtn = $('faq-btn'), faqWrap = $('faq-wrap');
    if (faqBtn && faqWrap) {
      faqBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        var on = faqWrap.classList.toggle('on');
        faqBtn.classList.toggle('on', on);
      });
      faqWrap.addEventListener('click', function (e) {
        e.stopPropagation();
        faqWrap.classList.remove('on'); faqBtn.classList.remove('on');
      });
    }
    $('deck-next').textContent = deckIdx >= deckCards.length - 1 ? 'Done' : 'Continue';
  }

  function openLesson(key) {
    deckKey = LESSONS[key] ? key : 'cell';
    deckCards = LESSONS[deckKey]; preload(deckCards); deckIdx = 0;
    $('school-lesson').style.display = ''; document.body.classList.add('lesson-open');
    renderDeckCard();
  }
  function closeLesson() {
    $('school-lesson').style.display = 'none';
    document.body.classList.remove('lesson-open');
  }
  function deckNext() {
    if (deckIdx < deckCards.length - 1) { deckIdx++; renderDeckCard(); }
    else { closeLesson(); }
  }
  function deckPrev() { if (deckIdx > 0) { deckIdx--; renderDeckCard(); } }

  $('lesson-back').addEventListener('click', closeLesson);
  $('deck-next').addEventListener('click', deckNext);
  $('deck-prev').addEventListener('click', deckPrev);
  // Imprint-style tap zones: the left edge steps back, the rest advances.
  $('deck-stage').addEventListener('click', function (e) {
    var r = this.getBoundingClientRect();
    if (e.clientX - r.left < r.width * 0.24) deckPrev(); else deckNext();
  });

  renderPath();
  preload(CELL_CARDS.slice(0, 2));
  // Test hooks — the headless test drives the real page, never a copy.
  window.__sci = { openLesson: openLesson, closeLesson: closeLesson,
    next: deckNext, prev: deckPrev, at: function () { return deckIdx; },
    cards: function () { return deckCards; }, LESSONS: LESSONS, TITLES: LESSON_TITLES };
})();
</script>
</body>
