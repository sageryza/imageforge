<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screening Room</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f5efe2;
    color: #22201b;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 26px 14px 30px; }
  header { text-align: center; margin-bottom: 18px; }
  h1 {
    font-family: Georgia, serif; font-size: 24px; font-weight: 400;
    letter-spacing: 0.05em; text-transform: uppercase;
  }
  .sub { margin-top: 4px; font-size: 12px; font-style: italic; color: #8a8371; }
  .row {
    display: flex; align-items: center; gap: 12px; width: 100%;
    background: #fffbf3; border: 1px solid #e3dbc6; border-radius: 6px;
    padding: 9px 12px; margin-bottom: 7px; cursor: pointer;
    text-align: left; font: inherit; color: inherit;
  }
  .row:active { background: #f3ecd9; }
  .row svg { flex: none; width: 20px; height: 20px; stroke: #a8874f; }
  .row .t { flex: 1; font-size: 14px; line-height: 1.25; }
  .row .d { flex: none; font-size: 11px; color: #8a8371; }
  #box {
    position: fixed; inset: 0; background: rgba(15, 12, 8, 0.94);
    display: none; flex-direction: column; align-items: center;
    justify-content: center; padding: 16px; z-index: 10;
  }
  #box.on { display: flex; }
  #boxlabel {
    color: #f0e9d8; font-family: Georgia, serif; font-size: 15px;
    margin-bottom: 12px; text-align: center; max-width: 90%;
  }
  #boxvid { max-width: 100%; max-height: 78vh; border-radius: 6px; background: #000; }
  #boxclose {
    position: absolute; top: 14px; right: 14px; width: 40px; height: 40px;
    border-radius: 50%; border: 1px solid #6b6249; background: #26211a;
    color: #f0e9d8; font-size: 18px; line-height: 38px; text-align: center;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Screening Room</h1>
    <div class="sub">every film from the commercials chat, newest first</div>
  </header>
  <div id="list"></div>
</div>
<div id="box">
  <button id="boxclose" aria-label="Close">&#10005;</button>
  <div id="boxlabel"></div>
  <video id="boxvid" controls playsinline></video>
</div>
<script>
var PLAY = '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" ' +
  'stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg>';
var savedY = 0;
var box = document.getElementById('box');
var vid = document.getElementById('boxvid');
var label = document.getElementById('boxlabel');

function openBox(f) {
  savedY = window.scrollY;
  document.body.style.overflow = 'hidden';
  label.textContent = f.title;
  vid.src = f.url;
  box.classList.add('on');
  vid.play().catch(function () {});
}
function closeBox() {
  vid.pause();
  vid.removeAttribute('src');
  vid.load();
  box.classList.remove('on');
  document.body.style.overflow = '';
  window.scrollTo(0, savedY);
}
document.getElementById('boxclose').addEventListener('click', closeBox);
box.addEventListener('click', function (e) { if (e.target === box) closeBox(); });

fetch('https://storage.googleapis.com/deckfactory-43176.firebasestorage.app/commercials/index.json?t=' + Date.now())
  .then(function (r) { return r.json(); })
  .then(function (films) {
    films.sort(function (a, b) { return b.added - a.added; });
    var list = document.getElementById('list');
    films.forEach(function (f) {
      var row = document.createElement('button');
      row.className = 'row';
      row.innerHTML = PLAY + '<span class="t">' + f.title + '</span>' +
        '<span class="d">' + f.dur + '</span>';
      row.addEventListener('click', function () { openBox(f); });
      list.appendChild(row);
    });
  });
</script>
</body>
</html>
