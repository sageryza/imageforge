<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Freeform</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none !important}
  body{background:#f6f2ea;color:#2b2620;font:16px/1.45 -apple-system,BlinkMacSystemFont,Georgia,serif;
       padding:14px 12px 40px;-webkit-text-size-adjust:100%}
  /* THE PAGE'S OWN HEADER BAND — a real row for pagehead.js to put its back
     chevron into (Aug 2026). This page had no header element at all, so on the
     new build pagehead.js fell to its last resort and FLOATED the chevron in
     the corner, where it landed on top of the title. The house shape is the
     Playground's: caps, letter-spaced, one row, the pill's corner reserved.
     On the OLD build the native bar still says Freeform, and the server's
     ?embed=1 rule hides `.app-header` — never two titles. */
  .app-header{display:flex;align-items:center;min-height:34px;padding-right:64px;margin:0 0 8px}
  .app-header h1{font:400 11px/1 -apple-system,'Helvetica Neue',sans-serif;letter-spacing:.34em;
                 text-transform:uppercase;color:#6f675e;margin:0}
  .panel{background:#fff;border:1px solid #e0d8ca;border-radius:6px;padding:12px;margin-bottom:14px}
  .lab{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9a8f7d;margin-bottom:7px}
  textarea{width:100%;min-height:110px;border:1px solid #d8cfc0;border-radius:6px;padding:9px;
           font:16px/1.4 -apple-system,Georgia,serif;background:#fdfbf7;color:#2b2620;resize:vertical}
  textarea:focus,select:focus,input:focus{outline:none;border-color:#a89a80}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  select{border:1px solid #d8cfc0;border-radius:6px;padding:7px 8px;background:#fdfbf7;
         font:15px -apple-system,Georgia,serif;color:#2b2620}
  button{border:1px solid #d8cfc0;border-radius:6px;background:#fff;color:#2b2620;
         font:15px -apple-system,Georgia,serif;padding:8px 12px}
  .go{background:#2b2620;color:#f6f2ea;border-color:#2b2620;padding:10px 18px;font-size:16px}
  .go[disabled]{opacity:.45}
  .cost{color:#9a8f7d;font-size:12px}
  /* THE LIBRARY IS FOLDED AWAY BY DEFAULT (Aug 2026, Sophie: "there's like a
     whole wall of suggested references in the Freeform tool. Can you get rid
     of them or put them behind a recently used button?"). Every reference ever
     uploaded was painted as a wall of squares ABOVE the prompt box — 17 of
     them the day she asked, five rows — MEASURED on a 390x844 phone, the
     prompt box sat at y=742, below the fold, and the page was 1,017px tall;
     folded, they are y=316 and 590. The wall is behind `Recently used` now, and the
     library comes back MOST-RECENTLY-USED FIRST rather than newest-uploaded,
     so opening it puts the ones she actually reaches for in the first row.
     WHAT IS ATTACHED IS NEVER HIDDEN — the tick on a tile used to be the only
     thing saying which references a run would carry, so folding the grid away
     without the strip below would mean drawing blind. */
  .refs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}
  .ref{position:relative;aspect-ratio:1;border:1px solid #e0d8ca;border-radius:6px;overflow:hidden;background:#f1ece2}
  .ref img{width:100%;height:100%;object-fit:cover;display:block}
  .ref.on{border-color:#2b2620;border-width:2px}
  .ref .tick{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:10px;
             background:#2b2620;color:#fff;font-size:12px;line-height:20px;text-align:center;display:none}
  .ref.on .tick{display:block}
  .ref .x{position:absolute;bottom:3px;right:3px;width:20px;height:20px;border-radius:4px;
          background:rgba(255,255,255,.9);border:1px solid #d8cfc0;font-size:11px;line-height:18px;text-align:center;padding:0}
  .empty{color:#9a8f7d;font-size:13px;padding:6px 2px}
  /* The boiler toggle: the house rounded rectangle, filled when it is ON so a
     wrapper can never be riding along unnoticed. */
  #boiler.on{background:#2b2620;border-color:#2b2620;color:#f6f2ea}
  .boilertext{margin-top:8px;font-size:12px;line-height:1.45;color:#6f675e;
              border-left:2px solid #d8cfc0;padding-left:8px;white-space:pre-wrap}
  #reftog.on{border-color:#2b2620}
  /* The attached strip — small, one row, always shown while anything is on. */
  .picked{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
  .picked .pk{position:relative;width:44px;height:44px;border-radius:6px;overflow:hidden;
              border:2px solid #2b2620;background:#f1ece2;padding:0}
  .picked .pk img{width:100%;height:100%;object-fit:cover;display:block}
  .up{position:relative;overflow:hidden}
  .up input{position:absolute;inset:0;opacity:0;font-size:0}
  /* Feed */
  .run{background:#fff;border:1px solid #e0d8ca;border-radius:6px;padding:11px;margin-bottom:11px}
  .runhead{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
  .run .p{font-size:15px;white-space:pre-wrap;flex:1;min-width:0}
  /* A rounded SQUARE, the house 6px — never a circle (2026-08-24). */
  .copybtn{flex:none;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;
           padding:0;border:1px solid #d8cfc0;border-radius:6px;background:#fdfbf7;color:#6f675e}
  .copybtn svg{width:14px;height:14px}
  .tags{font-size:11px;color:#9a8f7d;margin-bottom:8px}
  .outs{display:flex;gap:7px;flex-wrap:wrap}
  .outs img{width:calc(50% - 4px);border-radius:4px;display:block;background:#f1ece2}
  .ph{width:calc(50% - 4px);aspect-ratio:2/3;border-radius:4px;background:#f1ece2;animation:br 1.6s ease-in-out infinite}
  @keyframes br{0%,100%{opacity:.5}50%{opacity:1}}
  .err{color:#a0402a;font-size:13px}
  .usedrefs{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
  .usedrefs img{width:34px;height:34px;object-fit:cover;border-radius:4px;border:1px solid #e0d8ca}
  #lb{position:fixed;inset:0;background:rgba(20,16,10,.93);display:none;align-items:center;
      justify-content:center;z-index:60;padding:10px}
  #lb img{max-width:100%;max-height:100%}
  .toast{position:fixed;left:12px;bottom:12px;background:#2b2620;color:#f6f2ea;font-size:13px;
         border-radius:6px;padding:7px 11px;opacity:0;transition:opacity .25s;z-index:70}
  .toast.show{opacity:1}
</style>
</head>
<body>
<header class="app-header"><h1>Freeform</h1></header>
<div class="panel">
  <div class="lab">Reference images</div>
  <div class="row">
    <button class="up">Add images<input type="file" accept="image/*" multiple id="file"></button>
    <button id="reftog" aria-expanded="false" hidden>Recently used</button>
    <span class="cost" id="refhint">attached images are sent with the prompt</span>
  </div>
  <div class="picked" id="refpicked"></div>
  <div class="refs" id="refs" hidden></div>
  <div class="empty" id="refempty" hidden>No references yet — add some, or run with none for a plain generation.</div>
</div>

<div class="panel">
  <div class="lab">Prompt</div>
  <textarea id="prompt"></textarea>
  <div class="row" style="margin-top:9px">
    <select id="quality">
      <option value="low">low</option>
      <option value="medium" selected>medium</option>
      <option value="high">high</option>
    </select>
    <select id="size">
      <option value="portrait" selected>portrait 2:3</option>
      <option value="square">square</option>
      <option value="landscape">landscape 3:2</option>
    </select>
    <select id="outputs">
      <option value="1" selected>1 image</option>
      <option value="2">2 images</option>
      <option value="3">3 images</option>
      <option value="4">4 images</option>
    </select>
    <button id="boiler" aria-pressed="false"
            title="Add the stock style line after your words">Boilerplate style</button>
    <button class="go" id="go">Draw</button>
    <span class="cost" id="cost"></span>
  </div>
  <!-- Lit, this prints the EXACT line that will ride after her words. A
       wrapper this module adds may never be invisible. -->
  <div class="boilertext" id="boilertext" hidden></div>
</div>

<div id="feed"></div>

<div id="lb"><img id="lbi" src="" alt=""></div>
<div class="toast" id="toast"></div>

<script>
var TOKEN = '__STUDIO_TOKEN__';
if (TOKEN.indexOf('__') === 0) TOKEN = '';
var API = '/api/freeform';
var COST = { low: 0.02, medium: 0.06, high: 0.25 };
var picked = {};      // ref id -> true
var polling = {};     // run id -> timer

function hdr(extra) {
  var h = extra || {};
  if (TOKEN) h['x-studio-token'] = TOKEN;
  return h;
}
function api(path, opts) {
  opts = opts || {};
  opts.headers = hdr(opts.body ? { 'Content-Type': 'application/json' } : {});
  return fetch(API + path, opts).then(function (r) { return r.json(); });
}
var toastEl = document.getElementById('toast'), toastT = null;
function toast(msg) {
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(function () { toastEl.classList.remove('show'); }, 2600);
}

// ── Autoscroll pill, the Chats-app gesture ──────────────────────────────────
// A tap on anything INTERACTIVE (button, form field, link) pauses the scroll
// so the page never creeps while she's working; a tap on plain content or
// empty paper toggles it — stop, tap again to start (__scrollTap, the shared
// pill's own content-tap gesture). Images are excluded here because the
// lightbox open/close below owns their scroll behavior.
// THE PILL'S OWN BUTTONS ARE NOT THE PAGE'S, AND THE QUESTION IS ASKED AT
// POINTERDOWN (found live Aug 2026 — the play button did nothing at all here,
// and neither did the arrows). Two things had to be true at once. `.vseg
// button` is a <button>, so the skip list below called it interactive: play
// started the scroll and this handler stopped it in the same click — every
// other page that wires a document tap excludes `.float` first (compare.js,
// cuttingroom, cutmarks, assets) and this one never did. And a `.float` test
// at CLICK time cannot see it anyway: the tap lands on the play triangle's
// <polygon>, and paintPill replaces the button's innerHTML the instant the
// scroll starts — so by the time the click bubbles here the tapped node is
// detached and closest() walks a subtree with no `.float` left in it. That is
// the same detached-node trap the Assets lightbox hit. Asked at pointerdown,
// while the node is still in the page, and remembered for the one gesture.
var pillTap = false;
document.addEventListener('pointerdown', function (e) {
  var t = e.target;
  try { pillTap = !!(t && t.closest && t.closest('.float')); } catch (_) { pillTap = false; }
}, true);
document.addEventListener('click', function (e) {
  var t = e.target;
  var fromPill = pillTap; pillTap = false;
  if (fromPill || (t && t.closest && t.closest('.float'))) return;
  if (t && t.closest && (t.closest('#lb') || t.closest('img[data-full]'))) return;
  var interactive = (window.__pillInteractive && window.__pillInteractive(t)) ||
                    (t && t.closest && t.closest('.ref'));   // library tiles select refs
  if (interactive) {
    if (window.__scrollStop) window.__scrollStop();
    return;
  }
  if (window.__scrollTap) window.__scrollTap(e);
});
// Typing focus (keyboard up) always pauses, even without a click landing —
// but focus landing on the PILL's own button is the pill being used, not the
// page (a button takes focus on tap, so this stopped the scroll the play
// button had just started, one listener after the click guard above).
document.addEventListener('focusin', function (e) {
  var t = e && e.target;
  // the focus target here is the pill's BUTTON, never the glyph inside it, so
  // it is still in the page and closest() alone answers this one
  if (t && t.closest && t.closest('.float')) return;
  if (window.__scrollStop) window.__scrollStop();
});

// ── Lightbox: pause scroll, lock the body, and RESTORE the exact position on
// close — pausing alone is not enough, since overflow:hidden doesn't stop
// window.scrollBy if anything restarts the scroll underneath.
var lb = document.getElementById('lb'), lbi = document.getElementById('lbi'), savedY = 0;
function openLb(src) {
  if (window.__scrollStop) window.__scrollStop();
  savedY = window.scrollY;
  lbi.src = src; lb.style.display = 'flex'; document.body.style.overflow = 'hidden';
}
lb.addEventListener('click', function () {
  if (window.__scrollStop) window.__scrollStop();
  lb.style.display = 'none'; lbi.src = ''; document.body.style.overflow = '';
  window.scrollTo(0, savedY);
});

function updateCost() {
  var q = document.getElementById('quality').value;
  var n = Number(document.getElementById('outputs').value) || 1;
  document.getElementById('cost').textContent = '~$' + (COST[q] * n).toFixed(2);
}
document.getElementById('quality').addEventListener('change', updateCost);
document.getElementById('outputs').addEventListener('change', updateCost);
updateCost();

// ── Reference library ───────────────────────────────────────────────────────
// The grid is FOLDED AWAY until she asks for it — see the CSS note above. The
// server hands the refs back most-recently-used first, so `Recently used` is
// what the button opens, not a second sorted list the page keeps its own copy
// of. `known` is only what the strip needs to draw a thumb for an attached ref
// while the grid is closed.
var known = {};       // ref id -> record
var libOpen = false;

function libToggle(open) {
  libOpen = open === undefined ? !libOpen : !!open;
  var tog = document.getElementById('reftog');
  document.getElementById('refs').hidden = !libOpen;
  document.getElementById('refempty').hidden = !libOpen || Object.keys(known).length > 0;
  tog.setAttribute('aria-expanded', libOpen ? 'true' : 'false');
  tog.classList.toggle('on', libOpen);
}

// What this run will carry, whether or not the grid is open. Tapping one takes
// it off — the same gesture as tapping its lit tile.
function drawPicked() {
  var wrap = document.getElementById('refpicked');
  wrap.innerHTML = '';
  Object.keys(picked).forEach(function (id) {
    var r = known[id]; if (!r) return;
    var b = document.createElement('button');
    b.className = 'pk';
    b.title = 'attached — tap to remove';
    b.innerHTML = '<img src="' + (r.thumb || r.url) + '" alt="">';
    b.addEventListener('click', function () {
      delete picked[id];
      drawPicked();
      var tile = document.getElementById('ref-' + id);
      if (tile) tile.classList.remove('on');
    });
    wrap.appendChild(b);
  });
}

function drawRefs(refs) {
  var wrap = document.getElementById('refs');
  wrap.innerHTML = '';
  known = {};
  refs.forEach(function (r) { known[r.id] = r; });
  var tog = document.getElementById('reftog');
  tog.hidden = !refs.length;
  tog.textContent = 'Recently used' + (refs.length ? ' (' + refs.length + ')' : '');
  refs.forEach(function (r) {
    var d = document.createElement('div');
    d.className = 'ref' + (picked[r.id] ? ' on' : '');
    d.id = 'ref-' + r.id;
    d.innerHTML = '<img src="' + (r.thumb || r.url) + '" alt=""><div class="tick">&#10003;</div>' +
                  '<button class="x" title="remove">&#10005;</button>';
    d.querySelector('img').addEventListener('click', function () {
      if (picked[r.id]) delete picked[r.id]; else picked[r.id] = true;
      d.classList.toggle('on', !!picked[r.id]);
      drawPicked();
    });
    d.querySelector('.x').addEventListener('click', function (e) {
      e.stopPropagation();
      if (!confirm('Remove this reference? Runs that used it keep their images.')) return;
      delete picked[r.id];
      api('/refs/' + r.id, { method: 'DELETE' }).then(loadRefs);
    });
    wrap.appendChild(d);
  });
  drawPicked();
  libToggle(libOpen);
}
function loadRefs() {
  return api('/refs').then(function (d) { drawRefs((d && d.refs) || []); }).catch(function () {});
}
document.getElementById('reftog').addEventListener('click', function () { libToggle(); });

document.getElementById('file').addEventListener('change', function (e) {
  var files = Array.prototype.slice.call(e.target.files || []);
  if (!files.length) return;
  e.target.value = '';
  toast('Uploading ' + files.length + (files.length === 1 ? ' image…' : ' images…'));
  var reads = files.map(function (f) {
    return new Promise(function (res) {
      var fr = new FileReader();
      fr.onload = function () { res({ image: fr.result, name: f.name }); };
      fr.onerror = function () { res(null); };
      fr.readAsDataURL(f);
    });
  });
  Promise.all(reads).then(function (items) {
    items = items.filter(Boolean);
    if (!items.length) return toast('Could not read those files');
    return api('/refs', { method: 'POST', body: JSON.stringify({ images: items }) })
      .then(function (d) {
        // A freshly uploaded reference is almost always one you want on the
        // next run, so it arrives already selected.
        ((d && d.refs) || []).forEach(function (r) { if (r.ok && r.id) picked[r.id] = true; });
        toast('Added');
        libOpen = true;
        return loadRefs();
      });
  }).catch(function () { toast('Upload failed'); });
});

// ── PUTTING A PROMPT BACK PUTS ITS REFERENCES BACK (2026-08-27, Sophie:
//    "playground and other image tools shud save the reference photo and
//    reload when copy to prompt box") ───────────────────────────────────────
//
// Freeform's references are a LIBRARY rather than a per-run upload, so the
// bytes were never in danger — but which ones a run carried was, and there was
// no way back to a prompt at all: this page had no put-back button of any
// kind. It has the Playground's now, and it restores both halves of the
// request, because in Freeform the references ARE half the prompt (nothing
// else is added to her words).
//
// The run doc has stored `refIds` since the module shipped, so nothing new is
// saved and every run already on file gets this. A reference she has since
// DELETED cannot come back — the ids that are still in the library are
// re-selected and the answer SAYS how many were not, rather than quietly
// starting the next run one reference short.
var ICON_COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" ' +
  'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
  '<rect x="9" y="9" width="12" height="12" rx="2"></rect>' +
  '<path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';

function copyRunIn(run) {
  if (!run) return;
  // The library is fetched on load, so a tap inside that first round trip
  // would find `known` empty and report every reference as deleted. Ask once,
  // then apply — an empty library resolves straight through.
  if (!Object.keys(known).length) { loadRefs().then(function () { applyRunIn(run); }); return; }
  applyRunIn(run);
}
function applyRunIn(run) {
  var box = document.getElementById('prompt');
  box.value = run.prompt || '';
  // Only change what the record knows: a run with references re-attaches
  // exactly those, and a run drawn with NONE clears whatever is attached —
  // leaving one on would put an ingredient into the next run that this one
  // never had.
  var want = Array.isArray(run.refIds) ? run.refIds : [];
  picked = {};
  var gone = 0;
  want.forEach(function (id) { if (known[id]) picked[id] = true; else gone++; });
  document.querySelectorAll('.ref').forEach(function (d) {
    d.classList.toggle('on', !!picked[d.id.slice(4)]);
  });
  drawPicked();
  // Same rule as the references: a run drawn WITH the boiler turns it on, one
  // drawn without it turns it off, so the next run has exactly the ingredients
  // the one she copied had.
  boilerOn = !!run.boiler;
  paintBoiler();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  toast(gone
    ? 'Prompt is back — ' + gone + (gone === 1 ? ' reference is' : ' references are') + ' no longer in the library'
    : (want.length ? 'Prompt and its references are back' : 'Prompt is back in the box'));
}

// ── Runs ────────────────────────────────────────────────────────────────────
function runCard(run) {
  var el = document.getElementById('run-' + run.id);
  if (!el) {
    el = document.createElement('div');
    el.className = 'run';
    el.id = 'run-' + run.id;
    document.getElementById('feed').insertBefore(el, document.getElementById('feed').firstChild);
  }
  var tags = [run.model || 'gpt-image-2', run.quality, run.size,
              run.boiler ? 'boilerplate style' : ''].filter(Boolean).join(' · ');
  var html = '<div class="runhead"><div class="p"></div>' +
    '<button class="copybtn" data-copy="' + run.id + '" ' +
    'aria-label="Put this prompt and its references back" ' +
    'title="Put this prompt and its references back">' + ICON_COPY + '</button></div>' +
    '<div class="tags">' + tags + '</div>';
  html += '<div class="outs">';
  (run.images || []).forEach(function (u) { html += '<img src="' + u + '" alt="" data-full="' + u + '">'; });
  if (run.status === 'drawing' || run.status === 'ready') {
    var missing = Math.max((run.outputs || 1) - (run.images || []).length, 0);
    for (var i = 0; i < missing; i++) html += '<div class="ph"></div>';
  }
  html += '</div>';
  if (run.status === 'failed') html += '<div class="err">' + (run.error || 'failed') + '</div>';
  if ((run.refs || []).length) {
    html += '<div class="usedrefs">';
    run.refs.forEach(function (u) { html += '<img src="' + u + '" alt="" data-full="' + u + '">'; });
    html += '</div>';
  }
  el.innerHTML = html;
  el.querySelector('.p').textContent = run.prompt || '';
  el.querySelector('.copybtn').addEventListener('click', function () { copyRunIn(run); });
  el.querySelectorAll('img[data-full]').forEach(function (im) {
    im.addEventListener('click', function () { openLb(im.dataset.full); });
  });
}

function poll(id) {
  if (polling[id]) return;
  polling[id] = setInterval(function () {
    api('/run/' + id).then(function (d) {
      if (!d || !d.id) return;
      runCard(d);
      if (d.status === 'done' || d.status === 'failed') {
        clearInterval(polling[id]); delete polling[id];
        savePending();
        if (d.status === 'failed') toast('That run failed');
      }
    }).catch(function () {});
  }, 2500);
}
// Pending runs are remembered so leaving the page never loses an image that
// has already been paid for — polling resumes when you come back.
function pending() { try { return JSON.parse(localStorage.getItem('freeform_pending') || '[]'); } catch (e) { return []; } }
function savePending() {
  var live = Object.keys(polling);
  try { localStorage.setItem('freeform_pending', JSON.stringify(live)); } catch (e) {}
}

// ── The boiler style toggle ────────────────────────────────────────────────
// OFF on every load and deliberately NOT sticky: this is the one surface whose
// whole promise is that nothing is added, so a wrapper remembered from last
// week silently riding today's run is exactly the surprise it exists to avoid.
// The TEXT is fetched, never copied into this page — the server owns what is
// actually sent (the Playground's `/styles` rule).
var boilerOn = false;
var boiler = { prefix: '', suffix: '' };
function paintBoiler() {
  var b = document.getElementById('boiler');
  var t = document.getElementById('boilertext');
  b.classList.toggle('on', boilerOn);
  b.setAttribute('aria-pressed', boilerOn ? 'true' : 'false');
  // Both halves, each labelled with WHERE it lands — this is the house recipe,
  // so it wraps her words rather than only following them.
  var parts = [];
  if (boiler.prefix) parts.push('Before your words: ' + boiler.prefix);
  if (boiler.suffix) parts.push('After your words: ' + boiler.suffix);
  t.textContent = parts.join('\n\n');
  t.hidden = !(boilerOn && parts.length);
}
api('/style').then(function (d) {
  boiler = (d && d.style) || boiler;
  var b = document.getElementById('boiler');
  // Name the style it is, so a lit toggle says WHICH house recipe is riding.
  if (boiler.from) b.textContent = boiler.from + ' style';
  paintBoiler();
}).catch(function () {});
document.getElementById('boiler').addEventListener('click', function () {
  boilerOn = !boilerOn;
  paintBoiler();
});

document.getElementById('go').addEventListener('click', function () {
  var prompt = document.getElementById('prompt').value;
  if (!prompt.trim()) return toast('Type something first');
  var body = {
    prompt: prompt,
    refs: Object.keys(picked),
    quality: document.getElementById('quality').value,
    size: document.getElementById('size').value,
    outputs: Number(document.getElementById('outputs').value) || 1,
    boiler: boilerOn,
  };
  var go = document.getElementById('go');
  go.disabled = true;
  api('/run', { method: 'POST', body: JSON.stringify(body) }).then(function (d) {
    go.disabled = false;
    if (!d || !d.id) return toast((d && d.error) || 'Could not start');
    // `refIds` rides the optimistic card so its put-back is honest before the
    // first poll swaps the real doc in — without it, copying a run back the
    // second after starting it would CLEAR the references it is drawing with.
    runCard({ id: d.id, prompt: body.prompt, quality: body.quality, size: body.size,
              outputs: body.outputs, refs: [], refIds: body.refs.slice(), images: [],
              boiler: body.boiler, status: 'drawing' });
    poll(d.id); savePending();
    toast('Drawing…');
  }).catch(function () { go.disabled = false; toast('Could not start'); });
});

function loadRuns() {
  return api('/runs?limit=40').then(function (d) {
    var runs = (d && d.runs) || [];
    runs.slice().reverse().forEach(runCard);   // newest ends up on top
    runs.forEach(function (r) { if (r.status === 'drawing' || r.status === 'ready') poll(r.id); });
  }).catch(function () {});
}

loadRefs();
loadRuns();
pending().forEach(poll);
</script>
