<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dreams</title>
<style>
  /* Mirrors the iOS Theme used by DreamsView. Warm paper, mauve + gold accents. */
  :root{
    --bg:#faf9f7; --surface:#ffffff; --surface2:#f5f0eb; --border:#e8e4df;
    --accent:#b48b6a; --text:#3a3530; --textDim:#9e9590; --danger:#d4807a;
    --ink:#1c1813; --gold:#e7c25a; --mauve:#c58ba6;
    --radius:6px; --radiusLg:12px;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  body.locked{overflow:hidden}
  .topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;
    padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--border)}
  .topbar .title{font-family:var(--serif);font-variant:small-caps;letter-spacing:1.5px;font-size:20px;color:var(--text)}
  .iconbtn{background:none;border:0;padding:6px;cursor:pointer;color:var(--accent);display:flex;align-items:center}
  .iconbtn svg{width:22px;height:22px}
  .wrap{max-width:560px;margin:0 auto;padding:18px 16px 90px}
  .section{margin-bottom:22px}

  .eyebrow{font-size:12px;font-weight:600;letter-spacing:1px;color:var(--textDim);text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
  .eyebrow.rec{color:var(--danger)}
  textarea{width:100%;min-height:96px;resize:vertical;padding:12px;border:1px solid var(--border);border-radius:var(--radius);
    background:var(--surface);color:var(--text);font-size:16px;font-family:inherit;line-height:1.5}
  textarea:focus{outline:none;border-color:var(--accent)}
  .btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:13px;border:0;border-radius:var(--radius);
    font-size:15px;font-weight:600;cursor:pointer;margin-top:10px}
  .btn svg{width:18px;height:18px}
  .btn.illustrate{background:var(--gold);color:var(--ink)}
  .btn.draw{background:var(--mauve);color:#fff}
  .btn:disabled{opacity:.6;cursor:default}
  .micbtn{color:var(--accent)}
  .micbtn.rec{color:var(--danger)}

  .subnote{font-size:13.5px;color:var(--textDim);margin:0 0 14px}
  .dreamgroup{margin-bottom:6px}
  .dreamtitle{font-family:var(--serif);font-size:17px;color:var(--text);margin:8px 0 8px}
  .beat{display:flex;align-items:center;gap:12px;padding:12px;background:var(--surface);
    border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px}
  .beat .num{font:600 14px ui-monospace,Menlo,monospace;color:var(--mauve);width:20px;text-align:center;flex:none}
  .beat .lbl{flex:1;font-size:15px;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .beat .arrows{display:flex;flex-direction:column;gap:6px;flex:none}
  .arrow{width:32px;height:24px;border:1px solid var(--border);border-radius:6px;background:var(--bg);
    color:var(--mauve);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
  .arrow svg{width:13px;height:13px}
  .arrow:disabled{color:rgba(158,149,144,.4);cursor:default}

  /* Approval step: a read-only glance at what was captured… */
  .dreamcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radiusLg);
    padding:14px;margin-bottom:10px}
  .dreamcard .t{font-family:var(--serif);font-size:16px;color:var(--text);margin-bottom:6px}
  .dreamcard .words{font-size:14px;line-height:1.5;color:var(--textDim);cursor:pointer}
  .dreamcard .words.clamped{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .dreamcard .words mark{background:none;color:var(--mauve);text-decoration:underline;padding:0}

  /* …then the cast sheet: a cream page of who's in your dreams. */
  .castsheet{background:#f3ecdd;border:1px solid #e2d6bd;border-radius:var(--radiusLg);
    padding:16px 14px;margin:14px 0}
  .castsheet .lbl{font-size:12px;font-weight:600;letter-spacing:1px;color:#9c8f72;
    text-transform:uppercase;margin:0 0 12px}
  /* minmax(0,1fr) forces strictly equal columns — without the 0 minimum, a
     textarea's or long name's min-content stretches its column wider. */
  .castgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
  @media(max-width:380px){.castgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  /* one character slot (portrait card) */
  .cslot{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;
    padding:6px;border-radius:8px;border:2px solid transparent;background:transparent}
  .cslot .frame{width:100%;aspect-ratio:1;background:#fff;border:1px solid #d8c9a8;border-radius:6px;
    overflow:hidden;display:flex;align-items:center;justify-content:center}
  .cslot .frame img{width:100%;height:100%;object-fit:cover;display:block}
  .cslot .nm{font-size:12px;color:#7d7157;text-align:center;line-height:1.2;
    max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cslot.on{border-color:var(--mauve);background:#fff7ea}
  .cslot.on .nm{color:var(--text);font-weight:600}
  .cslot .frame .ph{color:#c3b48f}
  /* a "describe them" slot — same card shape, a text box where the face goes */
  .cslot.describe{cursor:default}
  .cslot.describe .frame{flex-direction:column;padding:6px;gap:4px;position:relative}
  .cslot.describe textarea{width:100%;flex:1;border:0;resize:none;background:transparent;
    font-family:inherit;font-size:11.5px;line-height:1.3;color:var(--text);outline:none;padding-top:20px}
  .cslot.describe textarea::placeholder{color:#c3b48f}
  .cslot .upload{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;
    background:#fff;border:1px solid #d8c9a8;display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:#9c8f72;padding:0}
  .cslot .upload svg{width:13px;height:13px}
  .cslot .mini{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.7)}
  /* the inset divider between "picked" and "everyone else" */
  .castdiv{height:1px;background:#d8c9a8;margin:18px 22px 14px;border:0}
  /* search within the saved sheet ("add anyone else") */
  .castsearch{width:100%;border:1px solid #d8c9a8;border-radius:var(--radius);background:#fff;
    padding:9px 11px;font-size:14px;font-family:inherit;color:var(--text);margin-bottom:12px}
  .castsearch:focus{outline:none;border-color:var(--accent)}
  .castsearch::placeholder{color:#b8a985}
  /* Draw button sticks to the bottom of the screen so it's always in reach —
     no scrolling past the whole sheet to find it. */
  .btn.draw{position:sticky;bottom:8px;z-index:5;box-shadow:0 3px 12px rgba(60,53,48,.22)}

  .page{width:100%;background:#fff;border:1px solid var(--border);border-radius:var(--radiusLg);margin-bottom:12px;
    overflow:hidden;cursor:zoom-in;display:block;min-height:120px}
  .page img{width:100%;display:block}
  .progress{display:flex;align-items:center;gap:12px;padding:16px;background:var(--surface);
    border:1px solid var(--border);border-radius:var(--radiusLg);color:var(--textDim);font-size:15px}
  .spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--mauve);border-radius:50%;
    animation:spin .8s linear infinite;flex:none}
  @keyframes spin{to{transform:rotate(360deg)}}

  .sunflower{width:100%;max-width:420px;margin:10px auto 0;display:block}

  /* Archive grid */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid .page{margin:0}
  .empty{color:var(--textDim);font-size:15px;text-align:center;padding:60px 30px}

  /* Zine book */
  .book{display:flex;gap:6px;justify-content:center;align-items:flex-start;margin-top:8px}
  .book .leaf{flex:1;max-width:48%;background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;min-height:200px}
  .book .leaf img{width:100%;display:block}
  .booknav{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--textDim);font-size:14px}
  .booknav button{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:8px 14px;cursor:pointer;color:var(--text);font-size:14px}

  /* Popup */
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:24px}
  .popup{background:var(--surface);border:1px solid var(--border);border-radius:var(--radiusLg);max-width:360px;width:100%;
    padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  .popup .bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .popup .bar button{background:none;border:0;color:var(--accent);cursor:pointer;font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
  .popup .bar button svg{width:16px;height:16px}
  .pill{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:3px;margin-bottom:12px}
  .pill button{flex:1;border:0;background:none;padding:8px;border-radius:999px;font-size:14px;font-weight:600;color:var(--textDim);cursor:pointer}
  .pill button.on.pic{background:var(--mauve);color:var(--ink)}
  .pill button.on.words{background:var(--gold);color:var(--ink)}
  .popbody img{width:100%;background:#fff;border-radius:var(--radius);display:block}
  .popbody .words{max-height:440px;overflow:auto;font-size:15px;line-height:1.55;color:var(--text);padding:4px}
  .popbody .words mark{background:rgba(197,139,166,.32);color:inherit;border-radius:3px;padding:0 2px}
  .toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:rgba(58,53,48,.92);color:#fff;
    padding:12px 18px;border-radius:var(--radius);font-size:14px;font-weight:600;z-index:60}
  .hidden{display:none!important}
</style>
</head>
<body>
  <div class="topbar">
    <button class="iconbtn" id="navLeft" title="Past dreams">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 5h4"/><path d="M20 3v4"/><path d="M21.5 12.8A9 9 0 1 1 11.2 2.5 7 7 0 0 0 21.5 12.8z"/></svg>
    </button>
    <div class="title" id="topTitle">Dreams</div>
    <button class="iconbtn" id="navRight" title="Dream zine">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4H19a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H6.5A2.5 2.5 0 0 1 4 17.5z"/><path d="M8 3v18"/><path d="M11 8h5"/><path d="M11 12h5"/></svg>
    </button>
  </div>

  <div class="wrap" id="root"></div>
  <div id="overlay"></div>
  <div id="toast"></div>

<script>
  const STUDIO_TOKEN = '__STUDIO_TOKEN__';
  const _tok = STUDIO_TOKEN.indexOf('__') === 0 ? '' : STUDIO_TOKEN;

  // Public "try it" mode (/trydreams): mint a per-device guest id so this
  // visitor's dreams are namespaced to them — their own past-dreams archive,
  // never Sophie's or another friend's. Sophie's own page (/dreams) has no
  // owner, so her archive is unchanged.
  const PUBLIC = location.pathname.replace(/\/+$/,'').toLowerCase() === '/trydreams';
  const GUEST_RE = /^guest_[a-z0-9]{4,40}$/i;
  let OWNER = '';
  if (PUBLIC) {
    try {
      // A restore link (?id=guest_…) adopts an existing archive onto THIS device
      // — so a lost/replaced phone (or a code Sophie hands back) recovers all the
      // dreams, which live safely in Firebase regardless of the device.
      const claim = new URLSearchParams(location.search).get('id') || '';
      if (GUEST_RE.test(claim)) { OWNER = claim; localStorage.setItem('dreams_guest', OWNER); }
      if (!OWNER) OWNER = localStorage.getItem('dreams_guest') || '';
      if (!GUEST_RE.test(OWNER)) {
        OWNER = 'guest_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
        localStorage.setItem('dreams_guest', OWNER);
      }
    } catch {}
  }
  // The archive/zine list endpoint, scoped to this visitor when in guest mode.
  const dreamListPath = () => '/dream' + (OWNER ? ('?owner=' + encodeURIComponent(OWNER)) : '');
  async function api(path, opts = {}) {
    if (_tok) opts = { ...opts, headers: { ...(opts.headers || {}), 'x-studio-token': _tok } };
    const res = await fetch('/api/movies' + path, opts);
    const t = await res.text(); let b; try { b = JSON.parse(t); } catch { b = t; }
    return { ok: res.ok, status: res.status, body: b };
  }
  const jpost = (p, body) => api(p, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  const esc = s => String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const $ = id => document.getElementById(id);
  const root = $('root'), overlay = $('overlay');

  // ── Icons (Lucide) ──
  const IC = {
    mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v4"/></svg>',
    stop:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
    sparkles:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2 2M16 16l2 2M18 6l-2 2M8 16l-2 2"/></svg>',
    up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg>',
    down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
    x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
    save:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>',
  };

  // ── State (mirrors DreamsView) ──
  const S = {
    view:'main', text:'', busy:false, statusLabel:'',
    review:[], castTop:[], castOthers:[], expanded:{}, othersFilter:'',   // the approval step
    current:null, finished:[],
    recording:false, session:0,
    archive:[], archiveLoading:false,
    zinePages:[], zineSpread:0, zineLoading:false,
  };

  // Character API (separate base from /api/movies) — the saved sheet + the
  // detached "make a card from a photo" job. Sophie's page only (guests never
  // touch her sheet).
  async function capi(path, opts={}) {
    if (_tok) opts = { ...opts, headers: { ...(opts.headers||{}), 'x-studio-token': _tok } };
    const res = await fetch('/api/character' + path, opts);
    const t = await res.text(); let b; try{ b=JSON.parse(t); }catch{ b=t; }
    return { ok: res.ok, status: res.status, body: b };
  }
  const norm = s => String(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
  // Live browser dictation exists here? (No inside the iOS app webview.)
  const SR_OK = !!(window.SpeechRecognition || window.webkitSpeechRecognition);

  // ── Speech (mic) ──
  let recog = null;
  function toggleMic(){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){ showToast("This browser can't do voice — type instead."); return; }
    if(S.recording){ recog && recog.stop(); return; }
    recog = new SR(); recog.continuous = true; recog.interimResults = true;
    const seed = S.text ? S.text.trim() + ' ' : '';
    recog.onresult = e => {
      let t = '';
      for(let i=0;i<e.results.length;i++) t += e.results[i][0].transcript;
      S.text = seed + t; const ta = $('ta'); if(ta) ta.value = S.text;
    };
    recog.onend = () => { S.recording = false; renderMain(); };
    recog.onerror = () => { S.recording = false; renderMain(); };
    recog.start(); S.recording = true; renderMain();
  }

  // ── Active-render persistence (so a render survives closing the page) ──
  function getActive(){ try{ return (localStorage.getItem('dreams_active')||'').split(',').filter(Boolean); }catch{ return []; } }
  function setActive(ids){ try{ ids.length ? localStorage.setItem('dreams_active', ids.join(',')) : localStorage.removeItem('dreams_active'); }catch{} }

  // ── Stage 1 (free, fast): the read ONLY splits the recording into its
  //    dreams — order, drift cues, who's mentioned, saved-sheet candidates.
  //    Runs as a server background job (poll the batch), then the approval
  //    step renders. Nothing is drawn until Draw is tapped. ──
  async function illustrate(){
    const body = (S.text||'').trim();
    if(!body){ showToast('Write down your dream first.'); return; }
    if(S.busy) return;
    try{ localStorage.setItem('dreams_last', body); }catch{}   // remember it so it prefills next time
    if(S.recording){ recog && recog.stop(); }
    S.busy=true; S.statusLabel='Reading your dream…'; S.current=null; S.finished=[]; S.review=[]; S.castTop=[]; S.castOthers=[];
    S.session++; const session=S.session;
    render();
    const r = await jpost('/dream', { dream: body, background:true, owner: OWNER || undefined });
    if(session!==S.session) return;
    if(!r.ok || !r.body.batchId){ S.busy=false; S.statusLabel=''; render(); showToast((r.body&&r.body.error)||'Could not read that dream.'); return; }
    try{ localStorage.setItem('dreams_reading', r.body.batchId); }catch{}
    await drainReading(r.body.batchId, session);
  }

  // Poll the background reading; when done, show the approval step.
  async function drainReading(id, session){
    let fails=0;
    while(session===S.session){
      const r = await api('/dream-batch/'+id);
      if(r.ok){
        fails=0; const b=r.body;
        if(b.status==='error'){
          try{ localStorage.removeItem('dreams_reading'); }catch{}
          S.busy=false; S.statusLabel=''; render();
          showToast(b.error||'Could not read that dream.'); return;
        }
        if(b.status==='done'){
          try{ localStorage.removeItem('dreams_reading'); }catch{}
          S.busy=false; S.statusLabel='';
          await beginReview(b.dreams||[]); render(); return;
        }
        if(b.label) S.statusLabel = b.label.charAt(0).toUpperCase()+b.label.slice(1)+'…', render();
      } else { fails++; if(fails>=25){ S.busy=false; S.statusLabel=''; render(); return; } }
      await sleep(3200);
    }
  }

  // The split dreams arrive → build ONE global cast for the whole recording
  // (not per dream). Chronology is already fixed by the split, so there's no
  // order step. Top = the people it picked (matched from the saved sheet, or a
  // describe slot when unmatched); below a divider = the rest of the sheet to
  // add. Guests get describe-only (no sheet).
  async function beginReview(dreams){
    if(!dreams.length){ showToast('Could not read that dream — try again.'); return; }
    S.review = dreams;
    S.expanded = {};
    // Merge every mention across all dreams, keeping first-seen casing and the
    // union of candidate matches (deduped by id).
    const byKey = new Map();
    for(const d of dreams){
      const sugg = d.castSuggestions || (d.mentions||[]).map(m=>({name:(m&&m.name)||m, matches:[], desc:(m&&m.desc)||''}));
      for(const s of sugg){
        const k = norm(s.name); if(!k) continue;
        if(!byKey.has(k)) byKey.set(k, { mention:s.name, candidates:[], selected:null, desc:'', photoUrl:null, creating:false });
        const e = byKey.get(k);
        // Preload any description the dreamer gave this person (first non-empty).
        if(!e.desc && s.desc) e.desc = String(s.desc);
        for(const m of (s.matches||[])) if(!e.candidates.some(c=>c.id===m.id)) e.candidates.push(m);
      }
    }
    // Default selection: a lone match is pre-picked; an ambiguous name shows
    // both/all and waits for you to choose.
    for(const e of byKey.values()) if(e.candidates.length===1) e.selected = e.candidates[0].id;
    S.castTop = [...byKey.values()];
    // The rest of the saved sheet (Sophie only) — everyone not already up top.
    S.castOthers = [];
    if(!PUBLIC){
      const usedIds = new Set(S.castTop.flatMap(e=>e.candidates.map(c=>c.id)));
      const r = await capi('/');
      const chars = (r.ok && r.body.characters) || [];
      S.castOthers = chars.filter(c=>!usedIds.has(c.id))
        .map(c=>({ id:c.id, name:c.name, url:c.url, on:false }));
    }
  }

  // Build the ONE global cast from the sheet: picked matches (or uploaded
  // cards) contribute a reference image; described people ride as text; added
  // sheet characters come along by name. The same cast goes to every dream —
  // the server's paginator decides who actually appears on each page.
  function buildCast(){
    const cast = [];
    for(const e of S.castTop){
      // Always include the NAME so the page planner can tag this person to the
      // pages they appear on (their `who`) — with a reference image or a
      // description when we have one, otherwise bare (drawn fresh, then carried
      // forward from the page they first appear on).
      const entry = { name:e.mention };
      const cand = e.selected && e.candidates.find(c=>c.id===e.selected);
      if(cand && cand.url) entry.url = cand.url;
      else if(e.photoUrl) entry.url = e.photoUrl;
      else if(e.desc.trim()) entry.desc = e.desc.trim();
      cast.push(entry);
    }
    for(const c of S.castOthers) if(c.on && c.url) cast.push({ name:c.name, url:c.url });
    return cast;
  }

  // Approval confirmed → render each dream with the one global cast. Chronology
  // is already set by the split, so no reorder call. Renders are background
  // jobs recorded by id so closing the page never loses them.
  async function draw(){
    const dreams = S.review;
    if(!dreams.length || S.busy) return;
    const cast = buildCast();
    S.review=[]; S.castTop=[]; S.castOthers=[]; S.finished=[]; S.current=null;
    S.busy=true; S.session++; const session=S.session;
    S.statusLabel='Planning pages…'; render();
    const started=[];
    for(const d of dreams){
      if(session!==S.session) return;
      const rr = await jpost('/dream/'+d.id+'/render', { quality:'medium', characters:cast });
      if(rr.ok){ started.push(d.id); setActive(started); }
      else showToast((rr.body&&rr.body.error)||'Render failed to start.');
    }
    await drain(started, dreams.length, session);
  }

  // Poll each active dream to completion, showing pages as they land and
  // dropping each id from the saved set as it finishes.
  async function drain(ids, total, session){
    const remaining = ids.slice();
    let doneCount = total - ids.length;
    while(remaining.length && session===S.session){
      const id = remaining.shift();
      doneCount++;
      S.statusLabel = total>1 ? `Drawing dream ${doneCount} of ${total}…` : 'Drawing…';
      render();
      const done = await pollDream(id, session);
      if(session!==S.session) return;
      if(done) S.finished.push(done);
      S.current=null;
      setActive(remaining);
    }
    if(session===S.session){ S.busy=false; S.statusLabel=''; S.text=''; render(); }
  }

  // Coming back to the page (reopened / reloaded): if a render was still going,
  // pick it up — the server kept drawing the whole time.
  async function resumeActive(){
    const ids = getActive();
    if(!ids.length || S.busy) return;
    S.busy=true; S.finished=[]; S.current=null; S.session++;
    render();
    await drain(ids, ids.length, S.session);
  }

  // Poll one dream to completion; resilient to dropped connections.
  async function pollDream(id, session){
    let fails=0;
    while(session===S.session){
      const r = await api('/dream/'+id);
      if(r.ok){
        fails=0; const d=r.body; S.current=d;
        const job=d.job||{};
        if(job.status==='error'){ showToast(job.error||"The render didn't finish."); return null; }
        if(job.status!=='running'){ return (d.pages&&d.pages.length)||job.status==='done' ? d : null; }
        if(job.label) S.statusLabel = job.label.charAt(0).toUpperCase()+job.label.slice(1)+'…';
        render();
      } else { fails++; if(fails>=25) return null; }
      await sleep(3200);
    }
    return null;
  }
  const sleep = ms => new Promise(r=>setTimeout(r,ms));

  // ── Rendering ──
  function render(){
    $('topTitle').textContent = S.view==='archive' ? 'Past dreams' : S.view==='zine' ? 'Dream zine' : 'Dreams';
    if(S.view==='archive') return renderArchive();
    if(S.view==='zine') return renderZine();
    renderMain();
  }

  function renderMain(){
    pageRefs = [];
    let h = '';
    // input — the in-page mic uses browser speech recognition, which doesn't
    // run inside the iOS app webview; hide it there (the keyboard's own
    // dictation mic still works in the text box).
    const micBtn = SR_OK ? `<button class="iconbtn micbtn ${S.recording?'rec':''}" id="mic">${S.recording?IC.stop:IC.mic}</button>` : '';
    h += `<div class="section">
      <div class="eyebrow ${S.recording?'rec':''}"><span>${S.recording?'LISTENING…':'WHAT DID YOU DREAM?'}</span>
        ${micBtn}</div>
      <textarea id="ta" placeholder="Last night I dreamed…">${esc(S.text)}</textarea>
      <button class="btn illustrate" id="illustrate" ${S.busy?'disabled':''}>${IC.sparkles}${S.busy?'Illustrating…':'Illustrate'}</button>
    </div>`;

    if(S.review.length){
      h += reviewHtml();
    } else if(S.busy || S.current || S.finished.length){
      h += `<div class="section">`;
      S.finished.forEach(d => (d.pages||[]).forEach(p => h += pageHtml(p.url, d)));
      if(S.current && S.current.pages) S.current.pages.forEach(p => h += pageHtml(p.url, S.current));
      if(S.busy) h += `<div class="progress"><div class="spinner"></div><span>${esc(S.statusLabel||'Illustrating…')}</span></div>`;
      h += `</div>`;
    } else {
      h += `<img class="sunflower" src="/dream-sunflowers.png" alt="What did you dream last night?">`;
    }
    root.innerHTML = h;

    // wire
    const ta = $('ta'); if(ta) ta.oninput = e => S.text = e.target.value;
    const mic = $('mic'); if(mic) mic.onclick = toggleMic;
    const ill = $('illustrate'); if(ill) ill.onclick = illustrate;
    root.querySelectorAll('[data-page]').forEach(el=>el.onclick=()=>{const i=el.dataset.page;openPopup(pageRefs[i]);});
    wireReview();
  }

  // ── The approval step: a glance at the dream(s), then ONE cast sheet ──
  const IC_CAM = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L8 6H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
  const IC_PERSON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>';

  function reviewHtml(){
    const n = S.review.length;
    let h = `<div class="section">`;
    // A read-only glance at what was captured — no order step, that's automatic.
    S.review.forEach(d=>{
      let words = esc(d.dreamText || d.dream || '');
      (d.driftCues||[]).forEach(cue=>{ const c=esc(cue); if(c) words = words.split(c).join('<mark>'+c+'</mark>'); });
      h += `<div class="dreamcard">
        ${n>1?`<div class="t">${esc(d.title)}</div>`:''}
        <div class="words ${S.expanded[d.id]?'':'clamped'}" data-expand="${d.id}">${words}</div>
      </div>`;
    });
    // The cast sheet.
    h += `<div class="castsheet">
      <p class="lbl">Who's in your ${n>1?'dreams':'dream'}</p>
      <div class="castgrid">`;
    S.castTop.forEach((e,ei)=>{
      if(e.candidates.length){
        e.candidates.forEach(c=>{
          // Show the character's real name so look-alikes (two Jonathans) are
          // distinguishable; the mention is only used for the describe slot.
          h += `<div class="cslot ${e.selected===c.id?'on':''}" data-pick="${ei}|${esc(c.id)}">
            <div class="frame">${c.url?`<img src="${esc(c.url)}" loading="lazy">`:`<span class="ph">${IC_PERSON}</span>`}</div>
            <div class="nm">${esc(c.name)}</div></div>`;
        });
      } else if(e.photoUrl){
        h += `<div class="cslot on" data-pick="${ei}|photo">
          <div class="frame"><img src="${esc(e.photoUrl)}"></div>
          <div class="nm">${esc(e.mention)}</div></div>`;
      } else {
        h += `<div class="cslot describe">
          <div class="frame">
            ${!PUBLIC?`<button class="upload" data-upload="${ei}" title="Upload a photo">${IC_CAM}</button>`:''}
            ${e.creating?`<div class="mini"><div class="spinner"></div></div>`:''}
            <textarea data-desc="${ei}" placeholder="describe them…">${esc(e.desc)}</textarea>
          </div>
          <div class="nm">${esc(e.mention)}</div></div>`;
      }
    });
    h += `</div>`;
    if(S.castOthers.length){
      const q = norm(S.othersFilter);
      const shown = q ? S.castOthers.filter(c=>norm(c.name).includes(q)) : S.castOthers;
      h += `<hr class="castdiv"><p class="lbl">Add anyone else who was in it</p>
        <input class="castsearch" id="castSearch" placeholder="Search your characters…" value="${esc(S.othersFilter)}">
        <div class="castgrid">`;
      shown.forEach(c=>{
        h += `<div class="cslot ${c.on?'on':''}" data-add="${esc(c.id)}">
          <div class="frame">${c.url?`<img src="${esc(c.url)}" loading="lazy">`:`<span class="ph">${IC_PERSON}</span>`}</div>
          <div class="nm">${esc(c.name)}</div></div>`;
      });
      if(!shown.length) h += `<p class="nm" style="grid-column:1/-1;color:#9c8f72;text-align:center;padding:8px">no matches</p>`;
      h += `</div>`;
    }
    h += `</div>
      <button class="btn draw" id="drawBtn">${n>1?`Draw all ${n}`:'Draw it'}</button></div>`;
    return h;
  }

  function wireReview(){
    root.querySelectorAll('[data-expand]').forEach(el=>el.onclick=()=>{
      const id=el.dataset.expand; S.expanded[id]=!S.expanded[id]; render();
    });
    // pick / unpick a candidate (or the uploaded card) for one mention
    root.querySelectorAll('[data-pick]').forEach(el=>el.onclick=()=>{
      const [eiS,cid]=el.dataset.pick.split('|'); const e=S.castTop[Number(eiS)]; if(!e) return;
      if(cid==='photo'){ e.photoUrl=null; render(); return; }   // tap the made card = undo it
      e.selected = e.selected===cid ? null : cid;               // tap again = not them
      render();
    });
    root.querySelectorAll('[data-desc]').forEach(el=>el.oninput=ev=>{
      const e=S.castTop[Number(el.dataset.desc)]; if(e) e.desc=ev.target.value;
    });
    root.querySelectorAll('[data-add]').forEach(el=>el.onclick=()=>{
      const c=S.castOthers.find(x=>x.id===el.dataset.add); if(c){ c.on=!c.on; render(); }
    });
    // Live-filter the saved sheet without re-rendering (keeps input focus).
    const cs=$('castSearch');
    if(cs) cs.oninput=e=>{
      S.othersFilter=e.target.value; const q=norm(S.othersFilter);
      root.querySelectorAll('[data-add]').forEach(el=>{
        const c=S.castOthers.find(x=>x.id===el.dataset.add);
        el.style.display=(!q||(c&&norm(c.name).includes(q)))?'':'none';
      });
    };
    root.querySelectorAll('[data-upload]').forEach(el=>el.onclick=()=>uploadPhotoFor(Number(el.dataset.upload)));
    const db=$('drawBtn'); if(db) db.onclick=draw;
  }

  // Optional: upload a photo of a described person → make a real character card
  // (saved to the sheet, so they auto-match next time) and use it here.
  function uploadPhotoFor(ei){
    const e=S.castTop[ei]; if(!e || e.creating) return;
    const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
    inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(!f) return;
      const rd=new FileReader();
      rd.onload=async()=>{
        e.creating=true; render();
        try{
          const mk=await capi('/make',{method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({name:e.mention, photo:rd.result, quality:'medium'})});
          if(!mk.ok||!mk.body.jobId) throw new Error((mk.body&&mk.body.error)||'could not start');
          for(let i=0;i<60;i++){ await sleep(3000);
            const st=await capi('/make/'+mk.body.jobId);
            if(st.ok&&st.body.status==='done'&&st.body.character){ e.photoUrl=st.body.character.url; break; }
            if(st.ok&&st.body.status==='error') throw new Error(st.body.error||'generation failed');
          }
          if(!e.photoUrl) throw new Error('timed out');
        }catch(err){ showToast(err.message||'Photo card failed'); }
        e.creating=false; render();
      };
      rd.readAsDataURL(f);
    };
    inp.click();
  }

  // page refs table so a tile click can open the right image + dream text
  let pageRefs = [];
  function pageHtml(url, dream){
    if(!url) return '';
    const i = pageRefs.push({ url, title:dream.title||'Dream', text:dream.dreamText||dream.dream||'', driftCues:dream.driftCues||[] })-1;
    return `<div class="page" data-page="${i}"><img src="${url}" loading="lazy"></div>`;
  }

  // ── Archive ──
  async function renderArchive(){
    if(S.archiveLoading){ root.innerHTML = `<div class="progress"><div class="spinner"></div><span>Loading…</span></div>`; return; }
    if(!S.archive.length){ root.innerHTML = `<div class="empty">No dreams yet — illustrate one and it'll show up here.</div>`; return; }
    pageRefs = [];
    let h = `<div class="grid">`;
    S.archive.forEach(item => { h += pageHtml(item.url, item.dream); });
    h += `</div>`;
    root.innerHTML = h;
    root.querySelectorAll('[data-page]').forEach(el=>el.onclick=()=>openPopup(pageRefs[el.dataset.page]));
  }
  async function loadArchive(){
    S.archiveLoading = true; render();
    const list = await api(dreamListPath()); const dreams = (list.ok && list.body.dreams) || [];
    dreams.sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''));
    const out = [];
    for(const s of dreams){
      const r = await api('/dream/'+s.id);
      if(r.ok){ const d=r.body; (d.pages||[]).forEach(p => out.push({ url:p.url, dream:d })); }
    }
    S.archive = out; S.archiveLoading = false; render();
  }

  // ── Zine (two-page book) ──
  async function renderZine(){
    if(S.zineLoading){ root.innerHTML = `<div class="progress"><div class="spinner"></div><span>Gathering your dreams…</span></div>`; return; }
    if(!S.zinePages.length){ root.innerHTML = `<div class="empty">No dream pages to bind yet — illustrate a dream first.</div>`; return; }
    const n = S.zinePages.length;
    const left = S.zineSpread*2, right = left+1;
    let h = `<div class="book">
      <div class="leaf">${S.zinePages[left]?`<img src="${S.zinePages[left]}">`:''}</div>
      <div class="leaf">${S.zinePages[right]?`<img src="${S.zinePages[right]}">`:''}</div>
    </div>
    <div class="booknav">
      <button id="zprev" ${left===0?'disabled':''}>‹ Prev</button>
      <span>${left+1}–${Math.min(right+1,n)} of ${n}</span>
      <button id="znext" ${right>=n-1?'disabled':''}>Next ›</button>
    </div>`;
    root.innerHTML = h;
    const prev=$('zprev'), next=$('znext');
    if(prev) prev.onclick=()=>{ if(S.zineSpread>0){S.zineSpread--;render();} };
    if(next) next.onclick=()=>{ if((S.zineSpread+1)*2<n){S.zineSpread++;render();} };
  }
  async function loadZine(){
    S.zineLoading = true; render();
    const list = await api(dreamListPath()); const dreams = (list.ok && list.body.dreams) || [];
    dreams.sort((a,b)=> (a.createdAt||'').localeCompare(b.createdAt||''));  // oldest first: a book forward in time
    const pages=[];
    for(const s of dreams){ const r = await api('/dream/'+s.id); if(r.ok) (r.body.pages||[]).forEach(p=>pages.push(p.url)); }
    S.zinePages = pages; S.zineSpread = 0; S.zineLoading = false; render();
  }

  // ── Popup (Picture / Words) ──
  let popTab = 'pic';
  function openPopup(ref){
    popTab = 'pic';
    document.body.classList.add('locked');
    drawPopup(ref);
  }
  function closePopup(){ document.body.classList.remove('locked'); overlay.innerHTML=''; }
  function drawPopup(ref){
    let words = esc(ref.text || 'No text saved for this dream.');
    (ref.driftCues||[]).forEach(cue=>{ const c=esc(cue); if(c) words = words.split(c).join('<mark>'+c+'</mark>'); });
    overlay.innerHTML = `<div class="backdrop" id="bd">
      <div class="popup" id="pop">
        <div class="bar">
          <button id="save" style="${popTab==='pic'?'':'visibility:hidden'}">${IC.save} Save</button>
          <button id="close">${IC.x}</button>
        </div>
        <div class="pill">
          <button class="pic ${popTab==='pic'?'on':''}" id="tPic">Picture</button>
          <button class="words ${popTab==='words'?'on':''}" id="tWords">Words</button>
        </div>
        <div class="popbody">${popTab==='pic'?`<img src="${ref.url}">`:`<div class="words">${words}</div>`}</div>
      </div></div>`;
    $('bd').onclick = e => { if(e.target.id==='bd') closePopup(); };
    $('close').onclick = closePopup;
    $('tPic').onclick = ()=>{ popTab='pic'; drawPopup(ref); };
    $('tWords').onclick = ()=>{ popTab='words'; drawPopup(ref); };
    const sv=$('save'); if(sv) sv.onclick = ()=>saveImage(ref.url);
  }
  async function saveImage(url){
    try{
      const res = await fetch(url); const blob = await res.blob();
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = 'dream.webp'; document.body.appendChild(a); a.click(); a.remove();
      showToast('Saved');
    }catch{ showToast("Couldn't save that image"); }
  }

  function showToast(msg){
    $('toast').innerHTML = `<div class="toast">${esc(msg)}</div>`;
    setTimeout(()=>{ $('toast').innerHTML=''; }, 1800);
  }

  // ── Nav ──
  $('navLeft').onclick = ()=>{ if(S.view==='main'){ S.view='archive'; loadArchive(); } else { S.view='main'; render(); } };
  $('navRight').onclick = ()=>{ if(S.view==='main'){ S.view='zine'; loadZine(); } else { S.view='main'; render(); } };

  // (No page-open wake-up ping needed: the server self-pings every 10 min to
  // stay under Render's idle window — see the keep-awake timer in server.js.)
  // Prefill your last dream so you can just tap Illustrate to re-run it.
  try{ S.text = localStorage.getItem('dreams_last') || ''; }catch{}

  render();
  // If a reading or render was still going when the page was last closed,
  // pick it back up — the server never stopped.
  (async ()=>{
    let readingId='';
    try{ readingId = localStorage.getItem('dreams_reading')||''; }catch{}
    if(readingId && !S.busy){
      S.busy=true; S.statusLabel='Reading your dream…'; S.session++; render();
      await drainReading(readingId, S.session);
    }
    resumeActive();
  })();
</script>
</body>
</html>
