      av.textContent = extras.join(' ').trim();
      el.appendChild(al); el.appendChild(av);
    }
    var y = document.createElement('div'); y.className = 'plab'; y.textContent = 'Your words';
    var yv = document.createElement('div'); yv.className = 'yours';
    yv.textContent = document.getElementById('prompt').value.trim() || '(the box below)';
    el.appendChild(y); el.appendChild(yv);
    field('After your words', p.suffix, 'suffix');
    // The toggle is not an edit of hers, so it does not go in the box — the
    // box holds her text. This line under it says what the switch does to the
    // tail on the way out, so nothing is added to the prompt unannounced.
    if (noTextFor(styleKey) && p.baked.noText) {
      var sw = document.createElement('div'); sw.className = 'swapped';
      sw.textContent = p.suffix.indexOf(p.baked.noText.from) >= 0
        ? 'No text is on — “' + p.baked.noText.from + '” is sent as “' + p.baked.noText.to + '”'
        : 'No text is on — “' + p.baked.noText.to + '” is added at the end';
      el.appendChild(sw);
    }
    var row = document.createElement('div'); row.className = 'prow';
    var rst = document.createElement('button'); rst.type = 'button'; rst.textContent = 'Reset';
    rst.onclick = function () { saveOverride(styleKey, null); paintPromptPanel(); };
    row.appendChild(rst);
    var note = document.createElement('div'); note.className = 'pnote';
    note.textContent = p.edited ? 'Your wording' : 'House wording';
    row.appendChild(note);
    el.appendChild(row);
    function stash() {
      var parts = {};
      Array.prototype.forEach.call(el.querySelectorAll('textarea'), function (t) {
        parts[t.getAttribute('data-part')] = t.value;
      });
      var b = p.baked;
      // A LoRA draws ONE box (its trigger is shown, not edited), so `prefix`
      // is absent from `parts` — read the baked value for any half that has no
      // box, or the comparison below is always false and her tail can never
      // return to the house wording.
      var pre = parts.prefix != null ? parts.prefix : b.prefix;
      var suf = parts.suffix != null ? parts.suffix : b.suffix;
      // Back to the house text on both halves = not an edit at all, so the
      // override is dropped rather than stored as an identical twin.
      if (pre === b.prefix && suf === b.suffix) saveOverride(styleKey, null);
      else saveOverride(styleKey, parts);
      note.textContent = overrideFor(styleKey) ? 'Your wording' : 'House wording';
    }
  }
  document.getElementById('promptbtn').addEventListener('click', function () {
    promptOpen = !promptOpen; paintPromptPanel();
  });
  fetch('/api/promptlab/styles').then(function (r) { return r.json(); })
    .then(function (d) {
      BAKED = d.styles || {}; PHOTO_LINE = d.photoLine || '';
      RES = d.res || null; RES_DEFAULT = d.resDefault || '1k';
      if (RES && !RES[canvas]) canvas = 'portrait';
      if (RES && RES[canvas] && !RES[canvas].tiers[resTier]) resTier = RES_DEFAULT;
      paintPromptPanel(); syncControls(); paintRes();
    })
    .catch(function () {});

  // ── HER OWN PHOTO REFERENCE (Aug 2026, Sophie: "Freeform has the ability
  //    to upload a photo reference, but playground doesn't ... in the case of
  //    dreamy or watercolor, where they already have references, it will go as
  //    the second reference automatically") ────────────────────────────────
  //
  // ONE photo per run, attached from the file button — deliberately NOT a
  // library like Freeform's. The Playground's whole point is a fixed recipe
  // per style with one thing changed at a time; a shelf of references would
  // be a second thing moving.
  //
  // The picture rides LAST, after the style references and after the Sophie
  // card, and server.js appends `photoLine` to the prefix so the model knows
  // which of the attachments is the photo. That line is READ FROM THE SERVER
  // like the rest of the prompt and printed in the Prompt panel whenever a
  // photo is attached — nothing is added to her words unannounced.
  //
  // It is NOT persisted across loads: a photo she attached last week silently
  // riding today's run is exactly the kind of hidden ingredient the panel
  // exists to prevent. It DOES survive between runs in one sitting, so a
  // re-roll is one tap.
  var photoRef = null;              // { data: <dataURL>, name } — one per run
  var PHOTO_MAX_EDGE = 1600;        // gpt-image-2 works from ~1024; this is headroom
  var PHOTO_SEND_MAX = 9e6;         // ~9MB of base64, well under the server's 25mb body

  function paintPhoto() {
    var wrap = document.getElementById('photowrap');
    var btn = document.getElementById('photopick');
    wrap.classList.toggle('has', !!photoRef);
    if (photoRef) {
      btn.innerHTML = '<img alt="Photo reference">';
      btn.querySelector('img').src = photoRef.data;
      btn.title = 'Photo reference: ' + (photoRef.name || 'attached') + ' — tap to swap it';
    } else {
      btn.innerHTML = ICONS.imagePlus;
      btn.title = 'Attach a photo reference';
    }
    if (promptOpen) paintPromptPanel();
  }
  // A phone photo is 4-12MB and often HEIC, which the model will not take, so
  // anything big or oversized is redrawn through a canvas to a JPEG first. A
  // photo already small enough is sent BYTE-FOR-BYTE — the house rule is that
  // a derived copy is fine but nothing gets quietly transformed when it does
  // not have to be.
  function prepPhoto(dataUrl, cb) {
    var img = new Image();
    img.onload = function () {
      var big = Math.max(img.width, img.height) > PHOTO_MAX_EDGE;
      var heavy = dataUrl.length > PHOTO_SEND_MAX;
      var isJpegOrPng = /^data:image\/(jpeg|png)/i.test(dataUrl);
      if (!big && !heavy && isJpegOrPng) return cb(dataUrl);
      var scale = big ? PHOTO_MAX_EDGE / Math.max(img.width, img.height) : 1;
      var c = document.createElement('canvas');
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      cb(c.toDataURL('image/jpeg', 0.92));
    };
    img.onerror = function () { cb(null); };
    img.src = dataUrl;
  }
  document.getElementById('photopick').addEventListener('click', function () {
    document.getElementById('photofile').click();
  });
  document.getElementById('photoclear').addEventListener('click', function () {
    photoRef = null;
    document.getElementById('photofile').value = '';
    paintPhoto();
  });
  document.getElementById('photofile').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      prepPhoto(String(rd.result || ''), function (data) {
        var err = document.getElementById('err');
        if (!data) { err.textContent = 'That file could not be read as a picture.'; err.hidden = false; return; }
        photoRef = { data: data, name: f.name || '' };
        err.hidden = true;
        paintPhoto();
      });
    };
    rd.readAsDataURL(f);
  });
  paintPhoto();

  // ── THE CANVAS — portrait or square (Aug 2026, Sophie) ──────────────────
  // gpt-image-2 charges MORE for the SQUARE — 0.6c/5.3c/21.1c for 1024x1024
  // against 0.5c/4.1c/16.5c for 1024x1536, the inversion the price table warns
  // about — so both buttons print what they cost rather than leaving her to
  // assume the obvious. Square was her call as the opening default, made
  // knowing that.
  // IT IS REMEMBERED NOW (Aug 2026, Sophie: "make it not default to square,
  // but just whatever the last option was"). This REVERSES what was written
  // here — the note said a shape she picked once must not carry into every
  // later visit, and she has since said she wants exactly that, so the old
  // reasoning is history rather than a rule. `square` survives only as the
  // FIRST-EVER default, for a phone that has never picked one; an unknown
  // stored value falls back to it rather than riding through as an invented
  // shape. QUALITY IS DELIBERATELY NOT CHANGED WITH IT: she named the canvas,
  // and a remembered `high` is 16.5-21.1c a tap arriving unasked, where a
  // remembered shape costs nothing it did not cost last time.
  var CANVASES = ['portrait', 'square'];
  var canvas = CANVASES.indexOf(localStorage.getItem('promptlab_canvas')) >= 0
    ? localStorage.getItem('promptlab_canvas') : 'square';
  function paintCanvas() {
    document.getElementById('c-portrait').classList.toggle('on', canvas === 'portrait');
    document.getElementById('c-square').classList.toggle('on', canvas === 'square');
    document.getElementById('c-portrait').title = 'Portrait 1024x1536 — low 0.5\u00A2 \u00B7 medium 4.1\u00A2 \u00B7 high 16.5\u00A2';
    document.getElementById('c-square').title = 'Square 1024x1024 — low 0.6\u00A2 \u00B7 medium 5.3\u00A2 \u00B7 high 21.1\u00A2 (dearer than portrait)';
  }
  function pickCanvas(shape) {
    canvas = shape;
    // Written on the TAP, not on the run — the shape she is looking at is the
    // one she comes back to, whether or not she generated anything with it.
    try { localStorage.setItem('promptlab_canvas', shape); } catch (e) { /* private mode */ }
    paintCanvas();
    // Each shape has its OWN tier canvases (portrait 1568x2352 vs square
    // 1920x1920), so the ladder is repainted with the shape. The TIER itself
    // is deliberately not persisted alongside the shape — see paintRes.
    paintRes();
  }
  document.getElementById('c-portrait').addEventListener('click', function () { pickCanvas('portrait'); });
  document.getElementById('c-square').addEventListener('click', function () { pickCanvas('square'); });
  paintCanvas();

  // ── THE RESOLUTION — 1K, 2K or 4K (Aug 2026, Sophie: "adding the size as a
  // toggle in the playground for things I want to print versus things I'm
  // using for like videos") ────────────────────────────────────────────────
  // 1K stays the default and every earlier run is a 1K run: the tiers are an
  // addition, not a re-aim. Not persisted, for the same reason quality and the
  // canvas are not — 4K at high is 47c a picture and must never be something
  // she is spending without having just chosen it.
  // THE PRICES ARE THE SERVER'S, never a copy kept here: PL_GPT.res carries a
  // MEASURED `cents` per quality (OpenAI publishes only the three 1K sizes),
  // and the page that owns its own copy of a price is the page that goes stale
  // the day the model changes. Until /styles answers, the buttons carry the
  // tier name and no claim about cost.
  var resTier = '1k';
  var RES = null, RES_DEFAULT = '1k';
  function tierIds() { return ['1k', '2k', '4k']; }
  // Arrived with ?res= (a Panels cut's "Upscale in the Playground" carries the
  // tier the redraw should land at, 2026-08-25). One-shot like the rest of the
  // ported settings, and still never persisted — the not-persisted rule is
  // about a tier she is not looking at, and this one is in the link she tapped.
  (function () {
    var rt = new URLSearchParams(location.search).get('res');
    if (rt && tierIds().indexOf(rt) >= 0) resTier = rt;
  })();
  // The SAME three-way slider as quality (Aug 2026, her ask) — one CSS rule,
  // one behaviour: a tap lands on the stop under it, and the knob carries the
  // value rather than a position she has to decode. The knob says 1K/2K/4K
  // because that is what she asked to read off it; the exact canvas and what
  // it costs stay on the tooltip, where the canvas toggle already puts them.
  var rpick = document.getElementById('rpick');
  function paintRes() {
    var shape = RES && RES[canvas];
    var ids = tierIds();
    var t = shape && shape.tiers[resTier];
    rpick.setAttribute('data-n', String(Math.max(ids.indexOf(resTier), 0)));
    rpick.setAttribute('data-i', (t && t.label) || resTier.toUpperCase());
    if (!t) { rpick.title = ''; rpick.setAttribute('aria-label', 'Resolution'); return; }
    var c = t.cents || {};
    rpick.title = t.label + ' ' + t.size + ' \u2014 low ' + c.low + '\u00A2 \u00B7 medium '
      + c.medium + '\u00A2 \u00B7 high ' + c.high + '\u00A2';
    rpick.setAttribute('aria-label', 'Resolution ' + t.label + ' ' + t.size
      + ' — tap a side to pick one');
  }
  rpick.addEventListener('click', function (e) {
    // Same aim-at-the-stop rule as quality (/tritoggle.js), and the same reason
    // indexOf is floored: an unknown tier still has somewhere to go rather than
    // doing nothing at all.
    var ids = tierIds();
    resTier = ids[triNext(rpick, ids.length, e, ids.indexOf(resTier))];
    paintRes();
  });
  paintRes();

  // One control, the selected style on its face. Re-rendered rather than just
  // re-selected so a style added to STYLES needs nothing here.
  function renderStyles() {
    var sel = document.getElementById('stylepick');
    sel.innerHTML = Object.keys(STYLES).map(function (k) {
      return '<option value="' + k + '"' + (k === styleKey ? ' selected' : '') + '>' +
        STYLES[k].label + '</option>';
    }).join('');
    sel.value = styleKey;
  }
  document.getElementById('stylepick').addEventListener('change', function () {
    setStyle(this.value);
  });
  function setStyle(k) {
    styleKey = k;
    localStorage.setItem('promptlab_style', k);
    renderStyles(); updateShape(); syncControls(); paintRefTag(); paintPromptPanel();
  }
  // LoRA scale, ×3 and the seed are Replicate-only knobs — gpt-image-2 has no
  // equivalent, so they come off the panel for that style rather than sitting
  // there doing nothing.
  function syncControls() {
    var gpt = isGpt(styleKey);
    // The canvas toggle is gpt-image-2's — the LoRA's shape rides a different
    // parameter. The prompt button is NOT (see the note just below).
    var pb = document.getElementById('promptbtn');
    var ct = document.getElementById('canvastog');
    var rt = document.getElementById('rpick');
    // The Prompt panel is for EVERY style now — the LoRA wraps her words too,
    // and hiding it on the tile the page OPENS ON is what made her say there
    // was no way to see the style prompt at all.
    if (pb) {
      pb.hidden = !bakedFor(styleKey);
      pb.classList.toggle('edited', !!overrideFor(styleKey));
    }
    if (ct) ct.style.display = gpt ? 'flex' : 'none';
    // The tiers are gpt-image-2's too — the WTR LoRA has one output size and
    // rides `aspect_ratio`, so the toggle comes off there rather than offering
    // a choice that would change nothing. `hidden` rather than a display
    // style, exactly like the quality toggle beside it: .tri declares no
    // display of its own, so the attribute is free to win.
    // The no-text toggle exists only for a style whose tail allows text — the
    // server says which, so a style that already bans text shows no button
    // rather than a switch that would change nothing.
    var nt = document.getElementById('notextbtn');
    var b = bakedFor(styleKey);
    if (nt) {
      nt.hidden = !gpt || !b || !b.noText;
      var on = !nt.hidden && noTextFor(styleKey);
      nt.classList.toggle('on', on);
      nt.setAttribute('aria-pressed', on ? 'true' : 'false');
    }
    // NOTHING FORCE-CLOSES THE PANEL ANY MORE (2026-08-24). This line used to
    // read `if (!gpt && promptOpen) { promptOpen = false; … }` — correct while
    // the panel was gpt-only, and fatal once the LoRA got one: syncControls
    // runs on every save, so on WTR — the tile the page OPENS ON — the panel
    // slammed shut on the first character she typed into it. Her edit was
    // saved, so this read as "the style prompt doesn't save". paintPromptPanel
    // is already gated on `bakedFor`, so a style with no wrapper draws nothing
    // without anyone having to close the panel behind her.
    ['scalewrap', 'xthree', 'seedbtn', 'seedtag'].forEach(function (id) {
      document.getElementById(id).hidden = gpt;
    });
    document.getElementById('charpick').hidden = !gpt || !!STYLES[styleKey].noCharacter;
    // The photo rides gpt-image-2's EDITS call. The WTR LoRA has no
    // attachment slot at all — it takes a trigger word and nothing else — so
    // the button comes off rather than sitting there doing nothing.
    document.getElementById('photowrap').classList.toggle('on', gpt);
    document.getElementById('qpick').hidden = !gpt;
    if (rt) rt.hidden = !gpt;
    // Both ladders are quality ladders, so both come off the Replicate LoRA,
    // which has no quality parameter at all.
    document.getElementById('lowmed').hidden = !gpt;
    document.getElementById('medhigh').hidden = !gpt;
  }
  function styleLabelFor(model) {
    for (var k in STYLES) if (STYLES[k].model === model) return STYLES[k].label;
    if (RETIRED[model]) return RETIRED[model];
    return model ? model.split('/').pop() : '';
  }
  // The ChatGPT-engine styles share one model id, so a gpt run's label comes
  // from the doc's `gptStyle` (older docs have none → the original ChatGPT).
  function runStyleLabel(r) {
    if (r.engine === 'gptimage') {
      for (var k in STYLES) {
        if (STYLES[k].engine === 'gptimage' && STYLES[k].gptStyle === (r.gptStyle || 'evan')) return STYLES[k].label;
      }
    }
    return styleLabelFor(r.model);
  }

  // The "Sent as" preview is gone (Aug 2026, Sophie — just the text box).
  // The stub stays so its old call sites are harmless.
  function updateShape() {}

  // Pending entries carry what's being drawn so the card can say so.
  // Older saved entries may be plain id strings — normalize on read.
  function pendingList() {
    try {
      var arr = JSON.parse(localStorage.getItem(LSKEY) || '[]');
      return arr.map(function (e) { return typeof e === 'string' ? { id: e } : e; });
    } catch (e) { return []; }
  }
  function setPending(list) { localStorage.setItem(LSKEY, JSON.stringify(list)); }

  // ─── "I already have that one" ───────────────────────────────────────────
  // A Replicate run is DETERMINISTIC: same prompt, same scale, same seed gives
  // back the same picture, so re-running it spends money to draw a duplicate.
  // Those runs are skipped before anything is sent.
  //
  // ChatGPT is deliberately NOT deduped: an identical run there draws a
  // DIFFERENT picture every time, which is the whole point of tapping the
  // stars twice — so `recipeKey` answers null for it and nothing is blocked.
  //
  // The prompt is normalized the way the server does it (trim, then drop
  // trailing periods) or a typed "." would look like a different run.
  function recipeKey(model, prompt, scale, seed) {
    return sameRunKey(['replicate', model, String(prompt || '').trim().replace(/\.+$/, ''), scale, seed]);
  }
  function plannedKey(S, prompt, scale, seed) {
    return S.engine === 'gptimage' ? null : recipeKey(S.model, prompt, scale, seed);
  }
  function runKey(r) {
    return r.engine === 'gptimage' ? null : recipeKey(r.model, r.prompt, r.loraScale, r.seed);
  }
  // Only a run that actually produced a picture blocks a repeat — a failed or
  // cancelled one has to stay retryable. A run still drawing blocks too: it is
  // about to become that picture.
  function alreadyRun(key) {
    if (!key) return false;
    var hit = pendingList().some(function (p) { return p.key === key; });
    if (hit) return true;
    return feed.some(function (r) {
      return runImages(r).length > 0 && runKey(r) === key;
    });
  }

  // `q` overrides the quality dropdown for one run — the low·low·medium button
  // draws its own ladder without touching what the dropdown says.
  function startRun(scale, q) {
    var prompt = document.getElementById('prompt').value.trim();
    var S = STYLES[styleKey];
    var gpt = S.engine === 'gptimage';
    var seed = curSeed();
    var qual = q || quality;
    var key = plannedKey(S, prompt, scale, seed);
    var over = gpt ? overrideFor(styleKey) : null;
    var body = gpt
      ? { prompt: prompt, model: S.model, style: S.gptStyle, outputs: OUTPUTS, quality: qual,
          character: charOn && !S.noCharacter, canvas: canvas, res: resTier,
          // Her uploaded photo reference, when there is one. Absent otherwise,
          // so an ordinary run is byte-for-byte what it always was.
          photo: photoRef ? photoRef.data : undefined,
          // Only sent when she has actually edited it — an absent field means
          // "use the house text", so a normal run is byte-for-byte what it
          // always was.
          prefix: over ? over.prefix : undefined, suffix: over ? over.suffix : undefined,
          noText: noTextFor(styleKey),
          // Absent unless she came here from a beat, so an ordinary run is
          // byte-for-byte the request it has always been.
          padTarget: padBack || undefined }
      // Her edited tail wins for the LoRA too, exactly as it does for a gpt
      // style — sentParts falls back to the baked text when she has not
      // touched it, so an ordinary run is byte-for-byte what it always was.
      : { prompt: prompt, lora_scale: scale, model: S.model,
          suffix: (sentParts(styleKey) || {}).suffix != null
            ? sentParts(styleKey).suffix : S.suffix,
          seed: seed, padTarget: padBack || undefined };
    return fetch('/api/promptlab', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    }).then(function (r) { return r.json(); }).then(function (d) {
      if (!d.id) throw new Error(d.error || 'Could not start.');
      var list = pendingList();
      list.push(gpt
        // `ar` rides along so the waiting slots hold the shape the picture is
        // about to be — the wall must not re-flow when it lands.
        ? { id: d.id, prompt: prompt, style: S.label, engine: 'gptimage', count: OUTPUTS, quality: qual,
            ar: (RES && RES[canvas] && RES[canvas].aspectRatio) || '2:3' }
        // `key` rides along so a second tap can see this one is already on its
        // way, before it has any images to be recognised by.
        : { id: d.id, prompt: prompt, scale: scale, style: S.label, engine: 'replicate', count: OUTPUTS, seed: seed, key: key, ar: '2:3' });
      setPending(list);
      renderPendings(); startPolling();
    });
  }

  function checkPrompt() {
    var err = document.getElementById('err');
    err.hidden = true;
    if (!document.getElementById('prompt').value.trim()) {
      err.textContent = 'Type a prompt first.'; err.hidden = false; return false;
    }
    return true;
  }
  function showErr(e) {
    var err = document.getElementById('err');
    err.textContent = (e && e.message) || 'Network error — try again.'; err.hidden = false;
  }

  function go() {
    if (!checkPrompt()) return;
    var scale = parseFloat(document.getElementById('scale').value) || 1;
    var prompt = document.getElementById('prompt').value.trim();
    if (alreadyRun(plannedKey(STYLES[styleKey], prompt, scale, curSeed()))) {
      toast('You already have that one — tap the sprout for a new seed');
      return;
    }
    var btn = document.getElementById('go');
    btn.disabled = true;
    startRun(scale).catch(showErr).finally(function () { btn.disabled = false; });
  }

  // ×3: the strength ladder in one tap — same prompt and seed at 1 / 1.2 / 1.4.
  // Whichever rungs she already has are skipped, so running ×3 after a single
  // scale-1 run only draws the two that are missing.
  document.getElementById('xthree').addEventListener('click', function () {
    if (!checkPrompt()) return;
    var prompt = document.getElementById('prompt').value.trim();
    var S = STYLES[styleKey], seed = curSeed();
    var todo = [], have = [];
    [1, 1.2, 1.4].forEach(function (s) {
      (alreadyRun(plannedKey(S, prompt, s, seed)) ? have : todo).push(s);
    });
    if (!todo.length) { toast('You already have all three — tap the sprout for a new seed'); return; }
    if (have.length) toast('Drawing scale ' + todo.join(' and ') + ' — you already have ' + have.join(' and '));
    var btn = document.getElementById('xthree');
    btn.disabled = true;
    Promise.all(todo.map(function (s) { return startRun(s).catch(showErr); }))
      .finally(function () { btn.disabled = false; });
  });

  // Low · low · medium in one tap (ChatGPT only): two cheap looks at the
  // prompt and one better one. ChatGPT is never deduped, so the two lows are
  // two DIFFERENT pictures — they land side by side in one box, and the
  // medium is its own box because its tags differ. ~10¢ a tap.
  document.getElementById('lowmed').addEventListener('click', function () {
    if (!checkPrompt()) return;
    ladder(this, ['low', 'low', 'medium']);
  });

  // Medium and high in one tap (Aug 2026, Sophie: "when pressed, it kicks off
  // 1 medium and 1 high job") — the step ABOVE the pyramid, for a prompt she
  // has already settled and wants to see properly. Two runs, not three: each
  // tier is its own box, because a box's tags have to describe every picture
  // under it and these two differ by quality. ~21¢ a tap on portrait, ~26¢ on
  // square (medium + high at the canvas's own prices).
  document.getElementById('medhigh').addEventListener('click', function () {
    if (!checkPrompt()) return;
    ladder(this, ['medium', 'high']);
  });

  // Both ladders start their runs the same way: every tier at once, the button
  // dead until the last one has been ACCEPTED (not finished — the pictures
  // arrive by polling), and one failure showing rather than silently dropping
  // the tier. `startRun`'s own `q` overrides the toggle for that run only, so
  // neither ladder moves what the knob says.
  function ladder(btn, tiers) {
    btn.disabled = true;
    Promise.all(tiers.map(function (q) { return startRun(1, q).catch(showErr); }))
      .finally(function () { btn.disabled = false; });
  }

  // Tapping Generate twice on the same prompt is ONE job as far as she's
  // concerned, so identical runs share a box: same prompt, same style, same
  // settings, same status → one head, and the pictures sit side by side in the
  // order they were made. Anything that differs — a different quality, a
  // nudged seed, another LoRA scale — stays its own run, because the head's
  // tags could no longer describe every picture under it.
  function sameRunKey(parts) {
    return parts.map(function (v) { return v == null ? '' : String(v); }).join('|');
  }
  // Groups a newest-first list, keeping first-appearance order — so a group
  // sits where its NEWEST member would have, and a fresh Generate is still the
  // first thing on the page.
  function groupBy(list, keyOf) {
    var byKey = {}, out = [];
    list.forEach(function (item) {
      var k = keyOf(item);
      if (!byKey[k]) { byKey[k] = { key: k, items: [] }; out.push(byKey[k]); }
      byKey[k].items.push(item);
    });
    return out;
  }

  // A pending run renders as the run it is becoming: the same head and the same
  // grid, with one empty slot per picture. Newest is at the top of #pendings,
  // which sits above #runs, so a fresh Generate is always the first thing on the
  // page — never a finished older run sitting where the new one should be.
  function renderPendings() {
    var list = pendingList().slice().reverse();
    if (qGroups.length) list = list.filter(function (p) { return qmatch(pendHay(p), qGroups); });
    var groups = groupBy(list, function (p) {
      return sameRunKey([p.engine, p.style, (p.prompt || '').trim(), p.quality, p.scale, p.seed]);
    });
    var pendHtml = groups.map(function (g) {
      var p = g.items[0];
      var slots = g.items.reduce(function (n, x) { return n + (x.count || OUTPUTS); }, 0);
      var tags = [p.style || ''];
      if (p.quality) tags.push(p.quality);
      if (p.scale != null) tags.push('scale ' + p.scale);
      if (p.seed) tags.push('seed ' + p.seed);
      // No X on a ChatGPT run: OpenAI bills an image the moment it's requested,
      // so there is nothing a cancel could save. Replicate runs can really stop.
      // One X per box — it stops every run in the box, since the box is the job.
      var ids = g.items.map(function (x) { return x.id; }).join(',');
      var kill = p.engine === 'gptimage' ? ''
        : '<button class="killbtn" data-kill="' + ids + '" aria-label="Cancel this job">' + ICONS.x + '</button>';
      var cells = '';
      var par = arCss(p.ar);
      for (var i = 0; i < slots; i++) cells += '<div class="cell ph" style="--ar: ' + par + '"></div>';
      return '<div class="run"><div class="runhead">' +
        '<span class="p clamp">' + esc(p.prompt || '') + '</span>' +
        '<button class="copybtn" data-copy="' + p.id + '" aria-label="Put this prompt back in the box">' + ICONS.copy + '</button>' +
        tags.filter(Boolean).map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') +
        '<span class="tag waiting">drawing…</span>' + kill + '</div>' +
        '<div class="grid">' + cells + '</div></div>';
    }).join('');
    // Rebuilt only when it actually changed — the poll calls this on every
    // transition, and re-assigning identical HTML restarts every placeholder's
    // pulse and costs a repaint for nothing.
    var pendBox = document.getElementById('pendings');
    if (pendBox.__html !== pendHtml) {
      pendBox.innerHTML = pendHtml;
      pendBox.__html = pendHtml;
      applyClamps(pendBox);
    }
    // The same runs are squares at the front of the tile wall — keep it current.
    if (curView() === 'tiles') renderTiles();
  }

  // Cancel: X on a running LoRA job → "are you sure" → POST /cancel. Replicate
  // stops the prediction and only bills the compute already run.
  var askId = null;
  document.getElementById('pendings').addEventListener('click', function (e) {
    var cp = e.target.closest('[data-copy]');
    if (cp) {
      var pid = cp.getAttribute('data-copy');
      var pend = pendingList().filter(function (x) { return x.id === pid; })[0];
      if (pend) copyPromptIn(pend.prompt);
      return;
    }
    var btn = e.target.closest('[data-kill]');
    if (!btn) return;
    askId = btn.getAttribute('data-kill');
    document.getElementById('askfine').textContent =
      'It stops the run — you’re only charged for what has already run.';
    document.getElementById('ask').classList.add('on');
    document.body.style.overflow = 'hidden';
  });
  function closeAsk() {
    askId = null;
    document.getElementById('ask').classList.remove('on');
    document.body.style.overflow = '';
  }
  document.getElementById('askno').addEventListener('click', closeAsk);
  document.getElementById('askyes').addEventListener('click', function () {
    var ids = (askId || '').split(',').filter(Boolean);   // a grouped box holds several
    closeAsk();
    if (!ids.length) return;
    Promise.all(ids.map(function (id) {
      return fetch('/api/promptlab/' + id + '/cancel', { method: 'POST' }).then(function (r) { return r.json(); });
    })).then(function () { poll(); }).catch(showErr);
  });

  function startPolling() {
    if (timer) return;
    timer = setInterval(poll, 2000);
    poll();
  }

  // A run shows the moment the model finishes ('ready', Replicate's own
  // links); the permanent Storage copies swap in quietly when 'done'.
  function poll() {
    var list = pendingList();
    if (!list.length) { clearInterval(timer); timer = null; renderPendings(); return; }
    list.forEach(function (p) {
      fetch('/api/promptlab/' + p.id).then(function (r) { return r.json(); }).then(function (d) {
        // A run whose doc is GONE (deleted server-side) must not haunt the
        // top of the page forever — drop it from the pending list too.
        if (d.error || !d.status) {
          setPending(pendingList().filter(function (x) { return x.id !== p.id; }));
          renderPendings();
          return;
        }
        if (d.status === 'ready' || d.status === 'done' || d.status === 'failed' || d.status === 'cancelled') {
          setPending(pendingList().filter(function (x) { return x.id !== p.id; }));
          // 'ready' = the first images are in, the rest still landing: the swap
          // poller keeps refreshing until 'done'.
          if (d.status === 'ready') { swapping[p.id] = true; startSwapPolling(); }
          renderPendings(); loadRuns();
        }
      }).catch(function () {});
    });
  }

  function startSwapPolling() {
    if (swapTimer) return;
    swapTimer = setInterval(function () {
      var ids = Object.keys(swapping);
      if (!ids.length) { clearInterval(swapTimer); swapTimer = null; return; }
      ids.forEach(function (id) {
        fetch('/api/promptlab/' + id).then(function (r) { return r.json(); }).then(function (d) {
          if (d.status === 'done' || d.status === 'failed') { delete swapping[id]; loadRuns(); }
        }).catch(function () {});
      });
    }, 5000);
  }

  function runImages(r) {
    return (r.images && r.images.length) ? r.images : (r.tempImages || []);
  }

  // ── DERIVED DISPLAY COPIES + REPAINT WITHOUT REBUILDING (Aug 2026, Sophie:
  // "the playground flashes a lot and sometimes things don't load") ────────
  //
  // SLOW: a tile is ~90-190px but its src was the full-size ORIGINAL
  // (1024x1536, hundreds of KB each) — the first page pulled tens of MB of
  // pictures over cell for one screen. Tiles load the house thumb service
  // now (`/api/story/thumb`, the Assets tab's own pattern: sharp once, a
  // cached webp in Storage, a 302 ever after). The LIGHTBOX and Save still
  // get the untouched original — this is the derived display copy, never the
  // picture. A temp Replicate/OpenAI url or a data: url has no derived copy
  // and is sent as-is (the thumb service only re-serves Google storage
  // hosts, and those temp urls expire on their own anyway).
  var THUMB_W = 480;
  function thumbFor(u) { return window.FeedKit.thumbFor(u, THUMB_W); }

  // FLASHING: every repaint used to be `innerHTML = …` over the whole feed,
  // which destroys and recreates every <img> on screen — the browser blanks
  // and re-decodes the wall, so a ♥, a search keystroke, a poll transition or
  // a finishing run flashed everything she was looking at. Repaints
  // RECONCILE now: a node whose content did not change is LEFT ALONE (same
  // element, same decoded picture), a changed one is updated in place, and
  // order is fixed by MOVING nodes — moving an element never reloads its
  // image. The lightbox arrows read the DOM (lbSeq), so they walk exactly
  // what reconciliation put there, same as before.
  var syncChildren = window.FeedKit.syncChildren;
  // A picture's own shape, as a CSS ratio. The run stores it as '2:3' / '1:1';
  // anything else (an older run from before the canvas toggle, a hand-written
  // value) falls back to portrait, which is what every run before it drew.
  // Parsed rather than passed through — it lands in a style attribute.
  function arCss(a) {
    var m = /^(\d{1,2}):(\d{1,2})$/.exec(String(a || ''));
    return m ? m[1] + ' / ' + m[2] : '2 / 3';
  }
  // One cell = one picture (or a breathing placeholder while it draws).
  function makeCell(it) {
    var d = document.createElement('div');
    d.style.setProperty('--ar', it.ar || '2 / 3');
    if (it.ph) { d.className = 'cell ph'; return d; }
    d.className = 'cell';
    var img = document.createElement('img');
    img.setAttribute('loading', 'lazy');
    d.appendChild(img);
    return d;
  }
  function updateCell(el, it) {
    if (it.ph) return;
    var img = el.firstElementChild;
    if (img.getAttribute('src') !== it.src) img.setAttribute('src', it.src);
    if (img.getAttribute('data-run') !== it.runId) img.setAttribute('data-run', it.runId);
    if (img.getAttribute('data-i') !== it.i) img.setAttribute('data-i', it.i);
    var badge = el.querySelector('.badge');
    var have = badge ? (badge.classList.contains('like') ? 'like' : 'dislike') : '';
    if (have !== it.vote) {
      if (badge) badge.remove();
      if (it.vote) {
        var b = document.createElement('span');
        b.className = 'badge ' + it.vote;
        b.innerHTML = it.vote === 'like' ? ICONS.heart : ICONS.x;
        el.appendChild(b);
      }
    }
  }
  // One run box: the head rebuilds only when its words/tags changed (it holds
  // no pictures, so that is cheap); the grid reconciles cell by cell.
  function makeRun() {
    var d = document.createElement('div');
    d.className = 'run';
    return d;
  }
  function updateRun(el, it) {
    if (it.bodyHtml !== undefined) {                // a failed run — words only
      if (el.__body !== it.bodyHtml) {
        el.innerHTML = it.bodyHtml; el.__body = it.bodyHtml;
        el.__head = undefined;
        applyClamps(el);
      }
      return;
    }
    var head = el.querySelector('.runhead');
    if (!head || el.__body !== undefined) {
      el.__body = undefined; el.__head = undefined;
      el.innerHTML = '<div class="runhead"></div><div class="grid"></div>';
      head = el.firstElementChild;
    }
    if (el.__head !== it.headHtml) {
      head.innerHTML = it.headHtml;
      el.__head = it.headHtml;
      applyClamps(head);
    }
    syncChildren(el.querySelector('.grid'), it.cells, makeCell, updateCell);
  }

  // What a run is labelled with. LoRA runs carry scale + seed; a gpt-image-2
  // run carries its quality and shape instead (it has neither of the others).
  function runParts(r) {
    var parts = [runStyleLabel(r)];
    if (r.engine === 'gptimage') {
      if (r.quality) parts.push(r.quality);
      if (r.aspectRatio) parts.push(r.aspectRatio);
      // A run made with a photo attached says so on its card — otherwise two
      // runs of the same words look identical and only one had the photo.
      if (r.photoRef) parts.push('photo ref');
    } else {
      parts.push('scale ' + r.loraScale);
      if (r.seed != null) parts.push('seed ' + r.seed);
    }
    if (r.status === 'cancelled') parts.push('cancelled');
    return parts;
  }

  // Fold a page of runs into the feed. Fresh copies WIN (a vote or a status
  // moved), and the whole list is re-sorted by time — so a head refresh and an
  // Older page can arrive in any order without scrambling it.
  function mergeRuns(fresh) {
    var byId = {};
    feed.forEach(function (r) { byId[r.id] = r; });
    fresh.forEach(function (r) { byId[r.id] = r; });
    feed = Object.keys(byId).map(function (k) { return byId[k]; })
      .sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
    // Merged, never replaced: a search hit can be an older run this feed has
    // not paged in, and the lightbox reads its settings out of here.
    Object.keys(byId).forEach(function (k) { runsById[k] = byId[k]; });
  }

  // Refresh the newest page. Anything already paged in behind it is kept — a
  // finished run must never throw away the older runs she scrolled back to.
  function loadRuns() {
    fetch('/api/promptlab?limit=' + PAGE).then(function (r) { return r.json(); }).then(function (d) {
      var runs = (d.runs || []).filter(function (r) { return r.status !== 'running'; });
      // Only page one can answer "is there more" — once she has paged deeper,
      // the tail fetch owns that flag.
      if (feed.length <= PAGE) feedMore = !!d.more;
      mergeRuns(runs);
      renderFeed();
    }).catch(function () {});
  }

  // One more page, behind the oldest run the feed holds. The cursor is that
  // run's createdAt, NOT an offset — runs land at the top while she reads, and
  // an offset would shift under her and repeat or skip one.
  function loadMore() {
    if (paging || !feedMore) return;
    var oldest = null;
    for (var i = feed.length - 1; i >= 0; i--) { if (feed[i].createdAt) { oldest = feed[i].createdAt; break; } }
    if (!oldest) return;
    paging = true; renderMoreBtn();
    fetch('/api/promptlab?limit=' + PAGE + '&before=' + oldest)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        feedMore = !!d.more;
        paging = false;
        mergeRuns((d.runs || []).filter(function (r) { return r.status !== 'running'; }));
        renderFeed();
      })
      .catch(function () { paging = false; renderMoreBtn(); });
  }

  function renderFeed() {
      var runs = visibleRuns();
      // Identical runs share a box. A failed run never joins one — its error is
      // its own — so it keys on its id and stays alone.
      var groups = groupBy(runs, function (r) {
        if (r.status === 'failed') return 'failed|' + r.id;
        return sameRunKey([r.engine, r.model, r.gptStyle, (r.prompt || '').trim(), r.status,
          r.quality, r.aspectRatio, r.character ? 'c' : '', r.loraScale, r.seed]);
      });
      var only = likedOnly();
      var nox = hideX();
      var items = [];
      groups.forEach(function (g) {
        var head = g.items[0];
        var cp = '<button class="copybtn" data-copy="' + head.id + '" aria-label="Put this prompt back in the box">' + ICONS.copy + '</button>';
        if (head.status === 'failed') {
          if (only) return;   // a failed run has no picture to have hearted
          items.push({ key: g.key, bodyHtml:
            '<div class="runhead"><span class="p clamp failed">' + esc(head.prompt) + '</span>' + cp +
            '<span class="tag">failed</span></div><div class="note">' + esc(head.error || 'generation failed') + '</div>' });
          return;
        }
        // Oldest first, so a second tap's picture lands to the RIGHT of the
        // first. Every cell still points at its OWN run, so the lightbox shows
        // that picture's real settings and a ♥ goes on the right doc.
        var cells = [];
        g.items.slice().reverse().forEach(function (r) {
          var votes = r.votes || {};
          runImages(r).forEach(function (u, i) {
            var v = votes[i];
            if (only && v !== 'like') return;
            if (nox && v === 'dislike') return;
            cells.push({ key: r.id + '|' + i, src: thumbFor(u), vote: v || '', runId: r.id, i: String(i), ar: arCss(r.aspectRatio) });
          });
        });
        // Nothing left to show in this run — everything hearted away or
        // crossed out — so the box goes with it rather than sitting empty.
        if ((only || nox) && !cells.length) return;
        items.push({ key: g.key, cells: cells,
          headHtml: '<span class="p clamp">' + esc(head.prompt) + '</span>' + cp +
            runParts(head).map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') });
      });
      var box = document.getElementById('runs');
      if (!items.length) box.innerHTML = emptyNote();
      else syncChildren(box, items, makeRun, updateRun);
      if (curView() === 'tiles') renderTiles();
      // The wall she is stepping through just changed under the lightbox (a
      // ♥ with the filter lit removes the picture she is on), so the arrows
      // re-derive rather than pointing at a row that is no longer there.
      if (lbCur) syncLbNav();
      renderMoreBtn();
  }

  // "Older" sits under BOTH views (it is the way further back in either one).
  // Deliberately a TAP, never load-on-scroll: the autoscroll pill would run the
  // page to the bottom on its own and pull page after page of pictures over her
  // data without her asking for any of them.
  function renderMoreBtn() {
    var el = document.getElementById('more');
    // "Older" walks the BROWSE feed; a search is already answered over the
    // whole collection, so there is nothing behind it to page in.
    if (qGroups.length || !feed.length || !feedMore) { el.innerHTML = ''; return; }
    el.innerHTML = '<button class="morebtn"' + (paging ? ' disabled' : '') + '>' +
      (paging ? 'Loading…' : 'Older') + '</button>';
  }
  document.getElementById('more').addEventListener('click', function (e) {
    if (e.target.closest('.morebtn')) loadMore();
  });

  // The tiles view: every picture from every run, newest first, as one wall of
  // uniform thumbnails. No prompt on the page — that's what the lightbox is
  // for, so tapping a tile is how you find out what made it. Runs still being
  // drawn hold an empty square each at the FRONT, so the wall is the whole
  // feed — a picture on its way has its place in it before it lands.
  function renderTiles() {
    var items = [];
    var only = likedOnly();
    var nox = hideX();
    // A picture on its way has not been hearted, so the waiting squares are a
    // list-of-everything thing: with the heart lit the wall is hearts only.
    if (!only) pendingList().slice().reverse().forEach(function (p) {
      if (qGroups.length && !qmatch(pendHay(p), qGroups)) return;
      var slots = p.count || OUTPUTS;
      for (var i = 0; i < slots; i++) items.push({ key: 'ph|' + p.id + '|' + i, ph: true, ar: arCss(p.ar) });
    });
    // Straight off `feed` — it is already sorted newest-first. (Walking
    // Object.keys of the id map relied on insertion order holding, which is a
    // property of the map, not of the wall's intended order.)
    visibleRuns().forEach(function (r) {
      if (r.status === 'failed') return;
      var votes = r.votes || {};
      runImages(r).forEach(function (u, i) {
        var v = votes[i];
        if (only && v !== 'like') return;
        if (nox && v === 'dislike') return;
        items.push({ key: r.id + '|' + i, src: thumbFor(u), vote: v || '', runId: r.id, i: String(i), ar: arCss(r.aspectRatio) });
      });
    });
    var box = document.getElementById('tiles');
    if (!items.length) box.innerHTML = emptyNote();
    else syncChildren(box, items, makeCell, updateCell);
  }

  // One delegated handler for every tile.
  document.getElementById('runs').addEventListener('click', function (e) {
    var cp = e.target.closest('[data-copy]');
    if (cp) {
      var r = runsById[cp.getAttribute('data-copy')];
      if (r) copyPromptIn(r.prompt);
      return;
    }
    var img = e.target.closest('img[data-run]');
    if (!img) return;
    openLB(img.getAttribute('data-run'), Number(img.getAttribute('data-i')));
  });
  document.getElementById('tiles').addEventListener('click', function (e) {
    var img = e.target.closest('img[data-run]');
    if (!img) return;
    openLB(img.getAttribute('data-run'), Number(img.getAttribute('data-i')));
  });

  // The "…" opener for a prompt the two-line cap really cut. Added after layout
  // (scrollHeight vs clientHeight is the only honest test) and as a SIBLING of
  // the capped box, never inside it.
  // The opener goes INSIDE the words, as their FIRST child — see the `.p.clamp`
  // block in the CSS for why first and not last. Measured after layout
  // (scrollHeight against clientHeight is the only honest test) and only on a
  // prompt that really was cut.
  function applyClamps(root) {
    var ps = root.querySelectorAll('.p.clamp');
    for (var i = 0; i < ps.length; i++) {
      (function (el) {
        if (el.querySelector('.moretxt')) return;      // a repaint, already folded
        // A BOX WITH NO LAYOUT IS NOT A BOX THAT FITS (2026-08-25, Sophie:
        // "why is there only a see more button for some of the prompts?").
        // `#runs` is hidden in TILES view, so every card the feed rendered
        // while she was on the wall measured 0/0 — which reads as "nothing was
        // cut" — and the head html never changes again, so applyClamps never
        // ran on it a second time: the opener was missing on those cards
        // FOREVER, on prompts plainly clipped mid-word. Measured against the
        // real feed: 36 of 36 openers present in list view, 0 of 36 when the
        // same runs were first drawn in tiles. So an unlaid-out box is left
        // undecided, and `resyncClamps` asks again the moment the list is
        // shown (and once the fonts have settled, which moves the wrap too).
        if (!el.clientHeight) return;
        if (el.scrollHeight - el.clientHeight <= 1) return;
        var btn = document.createElement('button');
        btn.className = 'moretxt';
        btn.textContent = '… more';
        btn.addEventListener('click', function () {
          var open = el.classList.toggle('clamp') === false;
          el.classList.toggle('fold', !open);
          btn.textContent = open ? 'less' : '… more';
          // It rides at the END of the words when they are open and at the
          // FRONT when they are folded — the float only reaches the last line
          // from in front of the text, and unfloated at the front it would
          // read before the first word.
          if (open) el.appendChild(btn); else el.insertBefore(btn, el.firstChild);
        });
        el.insertBefore(btn, el.firstChild);
        el.classList.add('fold');
      })(ps[i]);
    }
  }

  // Ask again for every prompt still undecided — the boxes that had no layout
  // when their card was built. Cheap: an already-folded one is skipped by the
  // `.moretxt` check, and an opened one no longer carries `.clamp` at all.
  function resyncClamps() {
    applyClamps(document.getElementById('pendings'));
    applyClamps(document.getElementById('runs'));
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(resyncClamps);

  function esc(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function openLB(id, i) {
    var r = runsById[id];
    if (!r) return;
    // Opening an image freezes the page behind it (design rule): the shared
    // autoscroll pill stops, not just the background scroll lock — otherwise
    // it keeps running under the lightbox and the page has moved on by the
    // time the image is closed.
    if (window.__scrollStop) window.__scrollStop();
    lbHalf = 'content';     // CONTENT opens the overlay — the house rule
    showLB(id, i);
    document.getElementById('lb').classList.add('on');
    document.body.style.overflow = 'hidden';
  }

  // The order the arrows walk is READ OFF THE VIEW BEHIND THE LIGHTBOX — the
  // pictures actually on screen, in document order — so tiles, list and the
  // heart filter all step through exactly what she is looking at, with no
  // second copy of the ordering rules to drift.
  function lbSeq() {
    var box = curView() === 'tiles' ? document.getElementById('tiles') : document.getElementById('runs');
    return Array.prototype.map.call(box.querySelectorAll('img[data-run]'), function (im) {
      return { id: im.getAttribute('data-run'), i: Number(im.getAttribute('data-i')) };
    });
  }
  function lbAt() {
    if (!lbCur) return -1;
    var seq = lbSeq();
    for (var k = 0; k < seq.length; k++) if (seq[k].id === lbCur.id && seq[k].i === lbCur.i) return k;
    return -1;
  }
  function lbStep(d) {
    var seq = lbSeq(), at = lbAt();
    if (at < 0) return;
    var next = seq[at + d];
    if (next) showLB(next.id, next.i);
  }
  function syncLbNav() {
    var seq = lbSeq(), at = lbAt();
    document.getElementById('lbprev').hidden = at <= 0;
    document.getElementById('lbnext').hidden = at < 0 || at >= seq.length - 1;
  }
  // Nothing is drawn in the zone — see the .lbnav note in the CSS. The two
  // buttons stay real elements (aria-label, hidden at the ends of the feed);
  // they are simply invisible, so no mark sits on top of the picture.
  document.getElementById('lbprev').addEventListener('click', function () { lbStep(-1); });
  document.getElementById('lbnext').addEventListener('click', function () { lbStep(1); });

  // ── THE TWO HALVES OF THE PROMPT, AS THIS RUN REALLY SENT THEM ──────────
  // The run doc stores `fullPrompt` (the literal text sent) and `prompt` (her
  // typed words), so the style half is the exact remainder — head and tail
  // SPLIT out of the sent string, never rebuilt from the tile's current baked
  // prefix. That is what makes it right for a run drawn before or after she
  // edited the Prompt panel, with the no-text swap, the character line and the
  // photo line included exactly when they really rode along.
  // The seam is marked `[content]`, the convention prompt-record.js writes and
  // the Assets PROMPT overlay documents.
  // No wrapper (the plain ChatGPT tile, a verbatim run) → an EMPTY style half,
  // which is the honest answer and what hides the STYLE button.
  function runPromptHalves(r) {
    var content = String((r && r.prompt) || '');
    var full = String((r && r.fullPrompt) || '');
    if (!full || !content) return { content: content, style: '' };
    var at = full.indexOf(content);
    if (at < 0) {
      // The LoRA path strips her trailing periods before sending, so the sent
      // string holds her words one character short of what the doc typed.
      var trimmed = content.replace(/\.+$/, '');
      if (trimmed) { at = full.indexOf(trimmed); if (at >= 0) content = trimmed; }
    }
    // Her words are not in the sent text verbatim (nothing here does that
    // today): file no style half rather than a reconstruction.
    if (at < 0) return { content: content, style: '' };
    var head = full.slice(0, at).replace(/\s+$/, '');
    var tail = full.slice(at + content.length).replace(/^\s+/, '');
    return {
      content: content,
      style: (head || tail) ? [head, '[content]', tail].filter(Boolean).join('\n\n') : '',
    };
  }

  function paintPrompt() {
    var h = lbHalves || { content: '', style: '' };
    if (!h.style && lbHalf === 'style') lbHalf = 'content';
    document.getElementById('lbcapp').textContent = h[lbHalf] || '';
    document.getElementById('lbhalfs').hidden = !h.style;
    document.getElementById('lbhalfc').classList.toggle('on', lbHalf === 'content');
    document.getElementById('lbhalfs').classList.toggle('on', lbHalf === 'style');
    // Nothing on file at all → no PROMPT row, the silence the Assets overlay
    // keeps rather than saying "no prompt filed".
    document.getElementById('lbcaphd').hidden = !h.content && !h.style;
  }
  // The way out, said in words as well as by the gesture. The delegated
  // handler on #lb would close on this tap anyway — this is the explicit half,
  // so the chevron keeps working if that skip list ever grows.
  document.getElementById('lbback').addEventListener('click', function () { closeLB(); });
  document.getElementById('lbcaphd').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-half]');
    if (!b) return;
    lbHalf = b.getAttribute('data-half');
    paintPrompt();
  });

  // Paint one picture into the already-open (or opening) lightbox.
  function showLB(id, i) {
    var r = runsById[id];
    if (!r) return;
    lbCur = { id: id, i: i };
    var src = runImages(r)[i];
    lbSrc = src;
    var img = document.getElementById('lbimg');
    // ── THE PICTURE IS ON SCREEN AT ONCE (2026-08-26, Sophie: "it seems like
    // it takes quite a while to load the images in light box view") ─────────
    // The wall and the list load a 480px derived thumb, and the lightbox
    // loaded the untouched ORIGINAL — 1-3MB at the 2K and 4K tiers — so every
    // tap was a fresh download over cell before anything appeared, with the
    // PREVIOUS picture sitting there in the meantime. The thumb is already in
    // the browser's cache (it is the tile she just tapped), so it paints in
    // the same frame; the original is swapped in behind it the moment it
    // lands, from the SAME fetch that was already being made for Save. One
    // download, not two, and never a blank.
    var th = thumbFor(src);
    if (lbObj) { URL.revokeObjectURL(lbObj); lbObj = ''; }
    img.src = th;
    // Fetched now so the Save tap can hand the file straight to the share
    // sheet without an await in between (iOS revokes the gesture across one).
    lbBlob = null;
    fetch(src).then(function (res) { return res.blob(); })
      .then(function (b) {
        if (lbSrc !== src) return;                 // she stepped on while it flew
        lbBlob = { url: src, blob: b };
        if (th === src) return;                    // no derived copy — already the original
        lbObj = URL.createObjectURL(b);
        img.src = lbObj;
      })
      .catch(function () {
        // A failed fetch must never leave her looking at the 480px copy: fall
        // back to loading the original the ordinary way.
        if (lbSrc === src && th !== src) img.src = src;
      });
    // What drew it — model, quality/scale, seed — pinned on top, then the
    // prompt under it. In the tiles view this is the ONLY place the prompt
    // appears, so it says everything about the picture.
    // The half she picked rides along as she steps (comparing the style
    // across two pictures is exactly why she would switch it) — but a fresh
    // OPEN always starts on content; `openLB` sets it.
    lbHalves = runPromptHalves(r);
    paintPrompt();
    var meta = runParts(r);
    if (runImages(r).length > 1) meta.push('image ' + (i + 1));
    document.getElementById('lbcapm').textContent = meta.join(' · ');
    syncLbVotes();
    syncLbNav();
  }
  function closeLB() {
    lbCur = null;
    lbSrc = '';
    if (lbObj) { URL.revokeObjectURL(lbObj); lbObj = ''; }
    document.getElementById('lb').classList.remove('on');
    document.body.style.overflow = '';
  }
  document.getElementById('lb').addEventListener('click', function (e) {
    // Buttons handle themselves — and the side arrows are STEPPING, not
    // leaving: closing on them would shut the lightbox on every tap. The
    // Content/Style toggle is the same: switching halves is not leaving.
    // The BACK chevron and the empty band it sits in are deliberately NOT in
    // this list — they close, which is the whole point of the strip.
    if (e.target.closest('.lbbtn') || e.target.closest('.lbnav') || e.target.closest('.capseg')) return;
    closeLB();
  });

  function syncLbVotes() {
    if (!lbCur) return;
    var votes = (runsById[lbCur.id] || {}).votes || {};
    document.getElementById('lblike').classList.toggle('on', votes[lbCur.i] === 'like');
    document.getElementById('lbx').classList.toggle('on', votes[lbCur.i] === 'dislike');
  }

  function vote(kind) {
    if (!lbCur) return;
    var r = runsById[lbCur.id];
    var votes = r.votes = r.votes || {};
    var next = votes[lbCur.i] === kind ? null : kind;    // tap again to clear
    if (next === null) delete votes[lbCur.i]; else votes[lbCur.i] = next;
    syncLbVotes();
    fetch('/api/promptlab/' + lbCur.id + '/vote', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: lbCur.i, vote: next || '' }),
    }).then(function () { loadRuns(); }).catch(function () {});
  }
  document.getElementById('lblike').addEventListener('click', function () { vote('like'); });
  document.getElementById('lbx').addEventListener('click', function () { vote('dislike'); });

  // Save to Photos. Three paths, in order:
  //   1. The app's native bridge (writes straight to the photo library and
  //      answers on window.__saveResult) — the only reliable one in a WKWebView.
  //   2. The share sheet, which offers "Save Image". It MUST be called inside
  //      the tap: iOS drops the user activation across an await, so awaiting the
  //      image download first made navigator.share reject silently — which is
  //      exactly the "nothing happens" she hit. The blob is fetched when the
  //      lightbox opens instead, so the tap has it ready.
  //   3. A plain download, for a desktop browser.
  // Every path says what happened — a failure is never silence.
  function nativeSaver() {
    try { return window.webkit.messageHandlers.forgeSave; } catch (e) { return null; }
  }
  window.__saveResult = function (ok, msg) { toast(msg || (ok ? 'Saved to Photos' : 'Couldn’t save that')); };

  document.getElementById('lbsave').addEventListener('click', function () {
    if (!lbCur) return;
    // The ORIGINAL url, never `lbimg.src` — that is the 480px thumb while the
    // full picture is still on its way, and a blob: url once it lands, and the
    // app's bridge needs the real https one.
    var url = lbSrc;
    var native = nativeSaver();
    if (native) { native.postMessage(url); toast('Saving…'); return; }
    if (!(lbBlob && lbBlob.url === url)) { toast('Still loading that image — try again'); return; }
    // Named after the BYTES, not after what the Playground usually makes: a
    // .webp name on png bytes is what the share sheet saves it as, and Photos
    // rejects webp outright.
    var ext = ((lbBlob.blob.type || '').split('/')[1] || 'png').replace('jpeg', 'jpg');
    var file = null;
    try { file = new File([lbBlob.blob], 'playground.' + ext, { type: lbBlob.blob.type || 'image/png' }); } catch (e) {}
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file] })
        .catch(function (err) { if (err && err.name !== 'AbortError') toast('Couldn’t open the share sheet'); });
      return;
    }
    var a = document.createElement('a');
    a.href = URL.createObjectURL(lbBlob.blob);
    a.download = 'playground.' + ext;
    document.body.appendChild(a); a.click(); a.remove();
  });

  // ── SEND TO THE STORY ROOM — it WALKS THERE (2026-08-26, Sophie: "rather
  // than this weird pop-up, it should take me to the story room so I can pick
  // myself") ────────────────────────────────────────────────────────────────
  // It shipped as a sheet over the lightbox: the shelf as a list of small
  // rows, then that story's doors. She asked for the room itself, so this
  // button is a NAVIGATION now and decides nothing about a story. The run and
  // which of its pictures ride the link (?send=<run>&i=<n>) — never the url,
  // because the room re-reads the run and gets the whole provenance with it,
  // the same src the pad's own inbox pick sends.
  // The placement is the room's own from there: her real shelf, the real
  // covers, and a gap in the ORDER rather than "at the end".
  document.getElementById('lbstory').addEventListener('click', function () {
    if (!lbCur) return;
    location.href = '/storyroom?send=' + encodeURIComponent(lbCur.id) + '&i=' + lbCur.i;
  });

  var toast = window.FeedKit.toast;

  // The app's nav-bar chevron asks the page first: close the lightbox if it's
  // open, else let the app leave the tool.
  window.__navBack = function () {
    if (document.getElementById('ask').classList.contains('on')) { closeAsk(); return true; }
    if (document.getElementById('lb').classList.contains('on')) { closeLB(); return true; }
