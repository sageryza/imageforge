    var prompt = document.getElementById('prompt').value.trim();
    if (alreadyRun(plannedKey(STYLES[styleKey], prompt, scale, curSeed()))) {
      toast('You already have that one — tap the sprout for a new seed');
      return;
    }
    var btn = document.getElementById('go');
    btn.disabled = true;
    startRun(scale).catch(showErr).finally(function () { btn.disabled = false; });
  }

  // ×3: the strength ladder in one tap — same prompt and seed at 1 / 1.2 / 1.4.
  // Whichever rungs she already has are skipped, so running ×3 after a single
  // scale-1 run only draws the two that are missing.
  document.getElementById('xthree').addEventListener('click', function () {
    if (!checkPrompt()) return;
    var prompt = document.getElementById('prompt').value.trim();
    var S = STYLES[styleKey], seed = curSeed();
    var todo = [], have = [];
    [1, 1.2, 1.4].forEach(function (s) {
      (alreadyRun(plannedKey(S, prompt, s, seed)) ? have : todo).push(s);
    });
    if (!todo.length) { toast('You already have all three — tap the sprout for a new seed'); return; }
    if (have.length) toast('Drawing scale ' + todo.join(' and ') + ' — you already have ' + have.join(' and '));
    var btn = document.getElementById('xthree');
    btn.disabled = true;
    Promise.all(todo.map(function (s) { return startRun(s).catch(showErr); }))
      .finally(function () { btn.disabled = false; });
  });

  // Low · low · medium in one tap (ChatGPT only): two cheap looks at the
  // prompt and one better one. ChatGPT is never deduped, so the two lows are
  // two DIFFERENT pictures — they land side by side in one box, and the
  // medium is its own box because its tags differ. ~10¢ a tap.
  document.getElementById('lowmed').addEventListener('click', function () {
    if (!checkPrompt()) return;
    ladder(this, ['low', 'low', 'medium']);
  });

  // Medium and high in one tap (Aug 2026, Sophie: "when pressed, it kicks off
  // 1 medium and 1 high job") — the step ABOVE the pyramid, for a prompt she
  // has already settled and wants to see properly. Two runs, not three: each
  // tier is its own box, because a box's tags have to describe every picture
  // under it and these two differ by quality. ~21¢ a tap on portrait, ~26¢ on
  // square (medium + high at the canvas's own prices).
  document.getElementById('medhigh').addEventListener('click', function () {
    if (!checkPrompt()) return;
    ladder(this, ['medium', 'high']);
  });

  // Both ladders start their runs the same way: every tier at once, the button
  // dead until the last one has been ACCEPTED (not finished — the pictures
  // arrive by polling), and one failure showing rather than silently dropping
  // the tier. `startRun`'s own `q` overrides the toggle for that run only, so
  // neither ladder moves what the knob says.
  function ladder(btn, tiers) {
    btn.disabled = true;
    Promise.all(tiers.map(function (q) { return startRun(1, q).catch(showErr); }))
      .finally(function () { btn.disabled = false; });
  }

  // Tapping Generate twice on the same prompt is ONE job as far as she's
  // concerned, so identical runs share a box: same prompt, same style, same
  // settings, same status → one head, and the pictures sit side by side in the
  // order they were made. Anything that differs — a different quality, a
  // nudged seed, another LoRA scale — stays its own run, because the head's
  // tags could no longer describe every picture under it.
  function sameRunKey(parts) {
    return parts.map(function (v) { return v == null ? '' : String(v); }).join('|');
  }
  // Groups a newest-first list, keeping first-appearance order — so a group
  // sits where its NEWEST member would have, and a fresh Generate is still the
  // first thing on the page.
  function groupBy(list, keyOf) {
    var byKey = {}, out = [];
    list.forEach(function (item) {
      var k = keyOf(item);
      if (!byKey[k]) { byKey[k] = { key: k, items: [] }; out.push(byKey[k]); }
      byKey[k].items.push(item);
    });
    return out;
  }

  // A pending run renders as the run it is becoming: the same head and the same
  // grid, with one empty slot per picture. Newest is at the top of #pendings,
  // which sits above #runs, so a fresh Generate is always the first thing on the
  // page — never a finished older run sitting where the new one should be.
  function renderPendings() {
    // Only THIS tab's pending runs — a drawing sheet belongs to the panels
    // gallery and a drawing picture to the other, same as the finished ones.
    var list = pendingKept().slice().reverse();
    if (qGroups.length) list = list.filter(function (p) { return qmatch(pendHay(p), qGroups); });
    var groups = groupBy(list, function (p) {
      return sameRunKey([p.engine, p.style, (p.prompt || '').trim(), p.quality, p.scale, p.seed]);
    });
    var pendHtml = groups.map(function (g) {
      var p = g.items[0];
      var slots = g.items.reduce(function (n, x) { return n + (x.count || OUTPUTS); }, 0);
      var tags = [p.style || ''];
      if (p.quality) tags.push(p.quality);
      if (p.scale != null) tags.push('scale ' + p.scale);
      if (p.seed) tags.push('seed ' + p.seed);
      // No X on a ChatGPT run: OpenAI bills an image the moment it's requested,
      // so there is nothing a cancel could save. Replicate runs can really stop.
      // One X per box — it stops every run in the box, since the box is the job.
      var ids = g.items.map(function (x) { return x.id; }).join(',');
      var kill = p.engine === 'gptimage' ? ''
        : '<button class="killbtn" data-kill="' + ids + '" aria-label="Cancel this job">' + ICONS.x + '</button>';
      var cells = '';
      var par = arCss(p.ar);
      for (var i = 0; i < slots; i++) cells += '<div class="cell ph" style="--ar: ' + par + '"></div>';
      return '<div class="run"><div class="runhead">' +
        '<span class="p clamp">' + esc(p.prompt || '') + '</span>' +
        '<button class="copybtn" data-copy="' + p.id + '" aria-label="Put this prompt back in the box">' + ICONS.copy + '</button>' +
        tags.filter(Boolean).map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') +
        '<span class="tag waiting">drawing…</span>' + kill + '</div>' +
        '<div class="grid">' + cells + '</div></div>';
    }).join('');
    // Rebuilt only when it actually changed — the poll calls this on every
    // transition, and re-assigning identical HTML restarts every placeholder's
    // pulse and costs a repaint for nothing.
    var pendBox = document.getElementById('pendings');
    if (pendBox.__html !== pendHtml) {
      pendBox.innerHTML = pendHtml;
      pendBox.__html = pendHtml;
      applyClamps(pendBox);
    }
    // The same runs are squares at the front of the tile wall — keep it current.
    if (curView() === 'tiles') renderTiles();
  }

  // Cancel: X on a running LoRA job → "are you sure" → POST /cancel. Replicate
  // stops the prediction and only bills the compute already run.
  var askId = null;
  document.getElementById('pendings').addEventListener('click', function (e) {
    var cp = e.target.closest('[data-copy]');
    if (cp) {
      var pid = cp.getAttribute('data-copy');
      var pend = pendingList().filter(function (x) { return x.id === pid; })[0];
      if (pend) { copyPromptIn(pend.prompt); restorePhoto(runsById[pid]); }
      return;
    }
    var btn = e.target.closest('[data-kill]');
    if (!btn) return;
    askId = btn.getAttribute('data-kill');
    document.getElementById('askfine').textContent =
      'It stops the run — you’re only charged for what has already run.';
    document.getElementById('ask').classList.add('on');
    document.body.style.overflow = 'hidden';
  });
  function closeAsk() {
    askId = null;
    document.getElementById('ask').classList.remove('on');
    document.body.style.overflow = '';
  }
  document.getElementById('askno').addEventListener('click', closeAsk);
  document.getElementById('askyes').addEventListener('click', function () {
    var ids = (askId || '').split(',').filter(Boolean);   // a grouped box holds several
    closeAsk();
    if (!ids.length) return;
    Promise.all(ids.map(function (id) {
      return fetch('/api/promptlab/' + id + '/cancel', { method: 'POST' }).then(function (r) { return r.json(); });
    })).then(function () { poll(); }).catch(showErr);
  });

  function startPolling() {
    if (timer) return;
    timer = setInterval(poll, 2000);
    poll();
  }

  // A run shows the moment the model finishes ('ready', Replicate's own
  // links); the permanent Storage copies swap in quietly when 'done'.
  function poll() {
    var list = pendingList();
    if (!list.length) { clearInterval(timer); timer = null; renderPendings(); return; }
    list.forEach(function (p) {
      fetch('/api/promptlab/' + p.id).then(function (r) { return r.json(); }).then(function (d) {
        // A run whose doc is GONE (deleted server-side) must not haunt the
        // top of the page forever — drop it from the pending list too.
        if (d.error || !d.status) {
          setPending(pendingList().filter(function (x) { return x.id !== p.id; }));
          renderPendings();
          return;
        }
        // Stash the doc: a pending run's copy button needs to know whether it
        // was drawn with a photo, and the pending ENTRY cannot carry one — it
        // lives in localStorage, where a 1600px dataURL is most of the quota.
        // The doc exists from the moment the run starts, so the first poll is
        // enough; a tap before it lands leaves the photo alone, which is the
        // "no record" answer restorePhoto is built to give.
        if (d.id) runsById[d.id] = d;
        if (d.status === 'ready' || d.status === 'done' || d.status === 'failed' || d.status === 'cancelled') {
          setPending(pendingList().filter(function (x) { return x.id !== p.id; }));
          // 'ready' = the first images are in, the rest still landing: the swap
          // poller keeps refreshing until 'done'.
          if (d.status === 'ready') { swapping[p.id] = true; startSwapPolling(); }
          renderPendings(); loadRuns();
        }
      }).catch(function () {});
    });
  }

  function startSwapPolling() {
    if (swapTimer) return;
    swapTimer = setInterval(function () {
      var ids = Object.keys(swapping);
      if (!ids.length) { clearInterval(swapTimer); swapTimer = null; return; }
      ids.forEach(function (id) {
        fetch('/api/promptlab/' + id).then(function (r) { return r.json(); }).then(function (d) {
          if (d.status === 'done' || d.status === 'failed') { delete swapping[id]; loadRuns(); }
        }).catch(function () {});
      });
    }, 5000);
  }

  function runImages(r) {
    return (r.images && r.images.length) ? r.images : (r.tempImages || []);
  }

  // THE SHEETS VIEW'S CELL — a run's finished sheet, uncut. A story sheet and
  // a cut-failed run already ARE their sheet (images[0], which is a real
  // picture with real votes, so it opens at its ordinary index); a cut grid
  // run banks its sheet beside the panels (`sheetUrl`), which is not in
  // `images` and opens at the VIRTUAL index -1 — which carries its OWN ♥/✕
  // since 2026-08-27, on the run doc under that index. A run with no sheet at
  // all (a failed draw) has nothing to show here.
  function sheetCellOf(r) {
    if (r.storySheet || r.cutFailed) {
      var u = runImages(r)[0];
      return u ? { i: '0', src: u } : null;
    }
    if (r.sheetUrl) return { i: '-1', src: r.sheetUrl };
    return null;
  }
  // The sheet's own shape: the stored WxH canvas when there is one (a grid's
  // derived sheet), else the run's ratio (a story sheet is the plain canvas).
  function sheetArOf(r) {
    var m = /^(\d+)x(\d+)$/.exec(String(r.sheet || r.size || ''));
    return m ? m[1] + ' / ' + m[2] : arCss(r.aspectRatio);
  }

  // THE UNCUT SHEET, WHILE THE CUT RUNS (2026-08-27, Sophie: "the uncut sheet
  // shud show before it's cut as soon as it's done (in panels"). The paid
  // render is banked and the run parks on 'ready' seconds before the panels
  // are cut, sized and filed — so the picture she just paid for goes up at
  // once instead of the run sitting on "drawing…" through work that has
  // nothing left to draw. ONE cell, in the SHEET's own ratio (a wide sheet in
  // cells cut for 2:3 panels would be squashed — that shape, not the stage
  // itself, is what this used to be avoided for), at the virtual index -1 the
  // Sheets view already opens — which carries its own ♥/✕ since 2026-08-27,
  // so this cell is not view-only any more. The swap poller replaces it with
  // the panels on 'done'.
  function cuttingSheet(r) {
    if (!r || !r.sheetUrl || !r.panels || !r.panels.length) return null;
    if (r.status !== 'ready' || runImages(r).length) return null;
    return { key: r.id + '|s', src: thumbFor(r.sheetUrl), vote: (r.votes || {})['-1'] || '',
      runId: r.id, i: '-1', ar: sheetArOf(r) };
  }

  // ── DERIVED DISPLAY COPIES + REPAINT WITHOUT REBUILDING (Aug 2026, Sophie:
  // "the playground flashes a lot and sometimes things don't load") ────────
  //
  // SLOW: a tile is ~90-190px but its src was the full-size ORIGINAL
  // (1024x1536, hundreds of KB each) — the first page pulled tens of MB of
  // pictures over cell for one screen. Tiles load the house thumb service
  // now (`/api/story/thumb`, the Assets tab's own pattern: sharp once, a
  // cached webp in Storage, a 302 ever after). The LIGHTBOX and Save still
  // get the untouched original — this is the derived display copy, never the
  // picture. A temp Replicate/OpenAI url or a data: url has no derived copy
  // and is sent as-is (the thumb service only re-serves Google storage
  // hosts, and those temp urls expire on their own anyway).
  var THUMB_W = 480;
  function thumbFor(u) { return window.FeedKit.thumbFor(u, THUMB_W); }

  // FLASHING: every repaint used to be `innerHTML = …` over the whole feed,
  // which destroys and recreates every <img> on screen — the browser blanks
  // and re-decodes the wall, so a ♥, a search keystroke, a poll transition or
  // a finishing run flashed everything she was looking at. Repaints
  // RECONCILE now: a node whose content did not change is LEFT ALONE (same
  // element, same decoded picture), a changed one is updated in place, and
  // order is fixed by MOVING nodes — moving an element never reloads its
  // image. The lightbox arrows read the DOM (lbSeq), so they walk exactly
  // what reconciliation put there, same as before.
  var syncChildren = window.FeedKit.syncChildren;
  // A picture's own shape, as a CSS ratio. The run stores it as '2:3' / '1:1';
  // anything else (an older run from before the canvas toggle, a hand-written
  // value) falls back to portrait, which is what every run before it drew.
  // Parsed rather than passed through — it lands in a style attribute.
  function arCss(a) {
    var m = /^(\d{1,2}):(\d{1,2})$/.exec(String(a || ''));
    return m ? m[1] + ' / ' + m[2] : '2 / 3';
  }
  // One cell = one picture (or a breathing placeholder while it draws).
  function makeCell(it) {
    var d = document.createElement('div');
    d.style.setProperty('--ar', it.ar || '2 / 3');
    if (it.ph) { d.className = 'cell ph'; return d; }
    d.className = 'cell';
    var img = document.createElement('img');
    img.setAttribute('loading', 'lazy');
    d.appendChild(img);
    return d;
  }
  function updateCell(el, it) {
    if (it.ph) return;
    var img = el.firstElementChild;
    if (img.getAttribute('src') !== it.src) img.setAttribute('src', it.src);
    if (img.getAttribute('data-run') !== it.runId) img.setAttribute('data-run', it.runId);
    if (img.getAttribute('data-i') !== it.i) img.setAttribute('data-i', it.i);
    var badge = el.querySelector('.badge');
    var have = badge ? (badge.classList.contains('like') ? 'like' : 'dislike') : '';
    if (have !== it.vote) {
      if (badge) badge.remove();
      if (it.vote) {
        var b = document.createElement('span');
        b.className = 'badge ' + it.vote;
        b.innerHTML = it.vote === 'like' ? ICONS.heart : ICONS.x;
        el.appendChild(b);
      }
    }
  }
  // One run box: the head rebuilds only when its words/tags changed (it holds
  // no pictures, so that is cheap); the grid reconciles cell by cell.
  function makeRun() {
    var d = document.createElement('div');
    d.className = 'run';
    return d;
  }
  function updateRun(el, it) {
    if (it.bodyHtml !== undefined) {                // a failed run — words only
      if (el.__body !== it.bodyHtml) {
        el.innerHTML = it.bodyHtml; el.__body = it.bodyHtml;
        el.__head = undefined;
        applyClamps(el);
      }
      return;
    }
    var head = el.querySelector('.runhead');
    if (!head || el.__body !== undefined) {
      el.__body = undefined; el.__head = undefined;
      el.innerHTML = '<div class="runhead"></div><div class="grid"></div>';
      head = el.firstElementChild;
    }
    if (el.__head !== it.headHtml) {
      head.innerHTML = it.headHtml;
      el.__head = it.headHtml;
      applyClamps(head);
    }
    syncChildren(el.querySelector('.grid'), it.cells, makeCell, updateCell);
  }

  // What a run is labelled with. LoRA runs carry scale + seed; a gpt-image-2
  // run carries its quality and shape instead (it has neither of the others).
  function runParts(r) {
    var parts = [runStyleLabel(r)];
    if (r.engine === 'gptimage') {
      if (r.quality) parts.push(r.quality);
      // THE REQUIRED THIRD SLOT — 1K / 2K / 4K, or "1/4 (4K)" for a panel cut
      // out of a sheet (2026-08-27, Sophie, looking at this very caption:
      // "shud say quality and 1k,2k/4k · 1/4 — I thought we already fixed
      // this"). It HAD been fixed, on the other half: her Aug 2026 ask named
      // "the playground and assets and Meta assets", and that was built as
      // what the Playground FILES — every creation carries the slot, and Meta
      // Assets and My Creations print it. This caption is drawn client-side
      // out of the run doc instead, so it was never in scope and had never
      // carried a size at all, for a panels run or a plain one. The PANELS tab
      // then added two slots of its own beside the missing one, which is what
      // made it loud enough to see.
      //
      // Right after quality, so it reads in the house caption order
      // (model · quality · size) rather than as a fourth thing on the end.
      // The run doc has carried everything this needs since the tier toggle
      // shipped — `res`, `size` (the sheet's canvas) and `grid.count`.
      var slot = window.__sizeTier ? window.__sizeTier.runSize(r) : '';
      if (slot) parts.push(slot);
      if (r.aspectRatio) parts.push(r.aspectRatio);
      // A panels run says so — its pictures are cut out of one sheet, which
      // is the one fact that explains their size and their price.
      if (r.grid && r.grid.count) parts.push('panels ' + r.grid.across + 'x' + r.grid.down);
      // A story sheet says so — the model laid out the panels, and the one
      // picture is the whole page by design, not a failed cut.
      if (r.storySheet) parts.push('story sheet');
      // The cut failed and the one picture IS the uncut sheet — disclosed on
      // the card rather than leaving her to wonder why one wide picture came
      // back instead of nine.
      if (r.cutFailed) parts.push('uncut sheet');
      // The sheet is up and the cut is still running — the tag says why one
      // wide picture is standing in for the panels, and that it is not the
      // end state (a cut that never lands says 'uncut sheet' instead).
      if (cuttingSheet(r)) parts.push('sheet — cutting…');
      // A run made with a photo attached says so on its card — otherwise two
      // runs of the same words look identical and only one had the photo.
      if (r.photoRef) parts.push('photo ref');
    } else {
      parts.push('scale ' + r.loraScale);
      if (r.seed != null) parts.push('seed ' + r.seed);
    }
    if (r.status === 'cancelled') parts.push('cancelled');
    return parts;
  }

  // THE LIGHTBOX CAPTION IS THE HOUSE CAPTION AND NOTHING ELSE — MODEL ·
  // QUALITY · SIZE (2026-08-27, Sophie, pointing at the banked sheet's caption:
  // "extra notes - dreamy etc … just need model quality and pixels + 1/4").
  // It read "Dreamy · medium · 1/4 (1K) · 1:1 · panels 2x2 · uncut sheet · 2x2"
  // — six things, of which the caption's own three were the first three. The
  // card's tag row is where a run's other facts belong (the style, the ratio,
  // the grid, a photo ref); over a picture she is looking at, the ratio and
  // the grid are things she can SEE and the style is behind the Prompt door.
  //
  // The slot-1 model is the model ID, not the style label — which is exactly
  // what this picture's own FILED caption says in My Creations and Meta
  // Assets, so the same picture no longer reads two different ways in two
  // places.
  //
  // The size slot is sheet-aware: a cut panel is "1/4 (4K)" (the fraction and
  // the SHEET's tier), the banked uncut sheet is the sheet's own "4K".
  function lbCaption(r, i) {
    // A LoRA run has neither a quality nor a tier — its caption is what it
    // always was (the card's tags), because there is no house caption to trim
    // it down to and her ask was about the gpt-image-2 one.
    if (r.engine !== 'gptimage') return runParts(r);
    var st = window.__sizeTier;
    var parts = [r.model || 'gpt-image-2'];
    if (r.quality) parts.push(r.quality);
    var slot = st ? (i === -1 ? st.sheetSize(r) : st.runSize(r)) : '';
    if (slot) parts.push(slot);
    return parts;
  }

  // Fold a page of runs into the feed. Fresh copies WIN (a vote or a status
  // moved), and the whole list is re-sorted by time — so a head refresh and an
  // Older page can arrive in any order without scrambling it.
  function mergeRuns(fresh) {
    var byId = {};
    feed.forEach(function (r) { byId[r.id] = r; });
    fresh.forEach(function (r) { byId[r.id] = r; });
    feed = Object.keys(byId).map(function (k) { return byId[k]; })
      .sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
    // Merged, never replaced: a search hit can be an older run this feed has
    // not paged in, and the lightbox reads its settings out of here.
    Object.keys(byId).forEach(function (k) { runsById[k] = byId[k]; });
  }

  // Refresh the newest page. Anything already paged in behind it is kept — a
  // finished run must never throw away the older runs she scrolled back to.
  function loadRuns() {
    fetch('/api/promptlab?limit=' + PAGE).then(function (r) { return r.json(); }).then(function (d) {
      var runs = (d.runs || []).filter(function (r) { return r.status !== 'running'; });
      // Only page one can answer "is there more" — once she has paged deeper,
      // the tail fetch owns that flag.
      if (feed.length <= PAGE) feedMore = !!d.more;
      mergeRuns(runs);
      renderFeed();
    }).catch(function () {});
  }

  // The PANELS tab's whole gallery in one read — the server sweeps its scan
  // for panels runs (they are a sliver of the feed, so paging 40 mixed docs
  // to find them would make Older a button that mostly adds nothing). Asked
  // once per visit; a failed fetch un-marks itself so the next tab switch
  // tries again.
  var panelsSwept = false;
  function loadPanelsSweep() {
    if (panelsSwept) return;
    panelsSwept = true;
    fetch('/api/promptlab?kind=panels&limit=300').then(function (r) { return r.json(); }).then(function (d) {
      mergeRuns((d.runs || []).filter(function (r) { return r.status !== 'running'; }));
      renderFeed();
    }).catch(function () { panelsSwept = false; });
  }

  // One more page, behind the oldest SINGLE run the feed holds. The cursor is
  // that run's createdAt, NOT an offset — runs land at the top while she
  // reads, and an offset would shift under her and repeat or skip one. Oldest
  // SINGLE, not oldest anything: the panels sweep merges runs from the whole
  // history into `feed`, and a cursor taken off an ancient panels run would
  // skip every single-pic run between here and it. (Older only shows on the
  // Picture tab, so the walk is always the single runs'.)
  function loadMore() {
    if (paging || !feedMore) return;
    var oldest = null;
    for (var i = feed.length - 1; i >= 0; i--) {
      if (feed[i].createdAt && !runIsPanels(feed[i])) { oldest = feed[i].createdAt; break; }
    }
    if (!oldest) return;
    paging = true; renderMoreBtn();
    fetch('/api/promptlab?limit=' + PAGE + '&before=' + oldest + '&kind=single')
      .then(function (r) { return r.json(); })
      .then(function (d) {
        feedMore = !!d.more;
        paging = false;
        mergeRuns((d.runs || []).filter(function (r) { return r.status !== 'running'; }));
        renderFeed();
      })
      .catch(function () { paging = false; renderMoreBtn(); });
  }

  function renderFeed() {
      var runs = visibleRuns();
      // Identical runs share a box. A failed run never joins one — its error is
      // its own — so it keys on its id and stays alone.
      var groups = groupBy(runs, function (r) {
        if (r.status === 'failed') return 'failed|' + r.id;
        return sameRunKey([r.engine, r.model, r.gptStyle, (r.prompt || '').trim(), r.status,
          r.quality, r.aspectRatio, r.character ? 'c' : '', r.loraScale, r.seed,
          r.grid && r.grid.count ? 'g' + r.grid.count : '']);
      });
      var only = likedOnly();
      var nox = hideX();
      var items = [];
      groups.forEach(function (g) {
        var head = g.items[0];
        var cp = '<button class="copybtn" data-copy="' + head.id + '" aria-label="Put this prompt back in the box">' + ICONS.copy + '</button>';
        if (head.status === 'failed') {
          if (only) return;   // a failed run has no picture to have hearted
          items.push({ key: g.key, bodyHtml:
            '<div class="runhead"><span class="p clamp failed">' + esc(head.prompt) + '</span>' + cp +
            '<span class="tag">failed</span></div><div class="note">' + esc(head.error || 'generation failed') + '</div>' });
          return;
        }
        // Oldest first, so a second tap's picture lands to the RIGHT of the
        // first. Every cell still points at its OWN run, so the lightbox shows
        // that picture's real settings and a ♥ goes on the right doc.
        var cells = [];
        g.items.slice().reverse().forEach(function (r) {
          if (sheetsMode()) {
            var s = sheetCellOf(r);
            if (!s) return;
            var sv = (r.votes || {})[s.i] || '';
            if (only && sv !== 'like') return;
            if (nox && sv === 'dislike') return;
            cells.push({ key: r.id + '|s', src: thumbFor(s.src), vote: sv, runId: r.id, i: s.i, ar: sheetArOf(r) });
            return;
          }
          // Its panels are still being cut: the sheet stands in for them. It
          // is votable at -1 like the banked sheet, so it obeys the filters
          // rather than being dropped whenever the heart is lit.
          var cut = cuttingSheet(r);
          if (cut) {
            if (only && cut.vote !== 'like') return;
            if (nox && cut.vote === 'dislike') return;
            cells.push(cut); return;
          }
          var votes = r.votes || {};
          runImages(r).forEach(function (u, i) {
            var v = votes[i];
            if (only && v !== 'like') return;
            if (nox && v === 'dislike') return;
            cells.push({ key: r.id + '|' + i, src: thumbFor(u), vote: v || '', runId: r.id, i: String(i), ar: arCss(r.aspectRatio) });
          });
        });
        // Nothing left to show in this run — everything hearted away or
        // crossed out — so the box goes with it rather than sitting empty.
        if ((only || nox) && !cells.length) return;
        items.push({ key: g.key, cells: cells,
          headHtml: '<span class="p clamp">' + esc(head.prompt) + '</span>' + cp +
            runParts(head).map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') });
      });
      var box = document.getElementById('runs');
      if (!items.length) box.innerHTML = emptyNote();
      else syncChildren(box, items, makeRun, updateRun);
      if (curView() === 'tiles') renderTiles();
      // The wall she is stepping through just changed under the lightbox (a
      // ♥ with the filter lit removes the picture she is on), so the box is
      // repainted and the zones re-derive rather than pointing at a row that
      // is no longer there. The blob guard in showLB makes this free — the
      // already-loaded picture is never refetched.
      if (lbCur && lbIsOpen()) showLB(lbCur.id, lbCur.i);
      renderMoreBtn();
  }

  // "Older" sits under BOTH views (it is the way further back in either one).
  // Deliberately a TAP, never load-on-scroll: the autoscroll pill would run the
  // page to the bottom on its own and pull page after page of pictures over her
  // data without her asking for any of them.
  function renderMoreBtn() {
    var el = document.getElementById('more');
    // "Older" walks the BROWSE feed; a search is already answered over the
    // whole collection, so there is nothing behind it to page in. The PANELS
    // tab has no Older either — its sweep (loadPanelsSweep) answered the
    // tab's whole history in one read, like a search.
    if (qGroups.length || onPanels() || !feed.length || !feedMore) { el.innerHTML = ''; return; }
    el.innerHTML = '<button class="morebtn"' + (paging ? ' disabled' : '') + '>' +
      (paging ? 'Loading…' : 'Older') + '</button>';
  }
  document.getElementById('more').addEventListener('click', function (e) {
    if (e.target.closest('.morebtn')) loadMore();
  });

  // The tiles view: every picture from every run, newest first, as one wall of
  // uniform thumbnails. No prompt on the page — that's what the lightbox is
  // for, so tapping a tile is how you find out what made it. Runs still being
  // drawn hold an empty square each at the FRONT, so the wall is the whole
  // feed — a picture on its way has its place in it before it lands.
  function renderTiles() {
    var items = [];
    var only = likedOnly();
    var nox = hideX();
    // A picture on its way has not been hearted, so the waiting squares are a
    // list-of-everything thing: with the heart lit the wall is hearts only.
    // In sheets mode a drawing run is ONE square — the sheet on its way.
    if (!only) pendingKept().slice().reverse().forEach(function (p) {
      if (qGroups.length && !qmatch(pendHay(p), qGroups)) return;
      var slots = sheetsMode() ? 1 : (p.count || OUTPUTS);
      for (var i = 0; i < slots; i++) items.push({ key: 'ph|' + p.id + '|' + i, ph: true, ar: arCss(p.ar) });
    });
    // Straight off `feed` — it is already sorted newest-first. (Walking
    // Object.keys of the id map relied on insertion order holding, which is a
    // property of the map, not of the wall's intended order.)
    visibleRuns().forEach(function (r) {
      if (r.status === 'failed') return;
      if (sheetsMode()) {
        var s = sheetCellOf(r);
        if (!s) return;
        var sv = (r.votes || {})[s.i] || '';
        if (only && sv !== 'like') return;
        if (nox && sv === 'dislike') return;
        items.push({ key: r.id + '|s', src: thumbFor(s.src), vote: sv, runId: r.id, i: s.i, ar: sheetArOf(r) });
        return;
      }
      var cutting = cuttingSheet(r);
      if (cutting) {
        if (only && cutting.vote !== 'like') return;
        if (nox && cutting.vote === 'dislike') return;
        items.push(cutting); return;
      }
      var votes = r.votes || {};
      runImages(r).forEach(function (u, i) {
        var v = votes[i];
        if (only && v !== 'like') return;
        if (nox && v === 'dislike') return;
        items.push({ key: r.id + '|' + i, src: thumbFor(u), vote: v || '', runId: r.id, i: String(i), ar: arCss(r.aspectRatio) });
      });
    });
    var box = document.getElementById('tiles');
    if (!items.length) box.innerHTML = emptyNote();
    else syncChildren(box, items, makeCell, updateCell);
  }

  // One delegated handler for every tile.
  document.getElementById('runs').addEventListener('click', function (e) {
    var cp = e.target.closest('[data-copy]');
    if (cp) {
      copyRunIn(runsById[cp.getAttribute('data-copy')]);
      return;
    }
    var img = e.target.closest('img[data-run]');
    if (!img) return;
    openLB(img.getAttribute('data-run'), Number(img.getAttribute('data-i')));
  });
  document.getElementById('tiles').addEventListener('click', function (e) {
    var img = e.target.closest('img[data-run]');
    if (!img) return;
    openLB(img.getAttribute('data-run'), Number(img.getAttribute('data-i')));
  });

  // The "…" opener for a prompt the two-line cap really cut. Added after layout
  // (scrollHeight vs clientHeight is the only honest test) and as a SIBLING of
  // the capped box, never inside it.
  // The opener goes INSIDE the words, as their FIRST child — see the `.p.clamp`
  // block in the CSS for why first and not last. Measured after layout
  // (scrollHeight against clientHeight is the only honest test) and only on a
  // prompt that really was cut.
  function applyClamps(root) {
    var ps = root.querySelectorAll('.p.clamp');
    for (var i = 0; i < ps.length; i++) {
      (function (el) {
        if (el.querySelector('.moretxt')) return;      // a repaint, already folded
        // A BOX WITH NO LAYOUT IS NOT A BOX THAT FITS (2026-08-25, Sophie:
        // "why is there only a see more button for some of the prompts?").
        // `#runs` is hidden in TILES view, so every card the feed rendered
        // while she was on the wall measured 0/0 — which reads as "nothing was
        // cut" — and the head html never changes again, so applyClamps never
        // ran on it a second time: the opener was missing on those cards
        // FOREVER, on prompts plainly clipped mid-word. Measured against the
        // real feed: 36 of 36 openers present in list view, 0 of 36 when the
        // same runs were first drawn in tiles. So an unlaid-out box is left
        // undecided, and `resyncClamps` asks again the moment the list is
        // shown (and once the fonts have settled, which moves the wrap too).
        if (!el.clientHeight) return;
        if (el.scrollHeight - el.clientHeight <= 1) return;
        var btn = document.createElement('button');
        btn.className = 'moretxt';
        btn.textContent = '… more';
        btn.addEventListener('click', function () {
          var open = el.classList.toggle('clamp') === false;
          el.classList.toggle('fold', !open);
          btn.textContent = open ? 'less' : '… more';
          // It rides at the END of the words when they are open and at the
          // FRONT when they are folded — the float only reaches the last line
          // from in front of the text, and unfloated at the front it would
          // read before the first word.
          if (open) el.appendChild(btn); else el.insertBefore(btn, el.firstChild);
        });
        el.insertBefore(btn, el.firstChild);
        el.classList.add('fold');
      })(ps[i]);
    }
  }

  // Ask again for every prompt still undecided — the boxes that had no layout
  // when their card was built. Cheap: an already-folded one is skipped by the
  // `.moretxt` check, and an opened one no longer carries `.clamp` at all.
  function resyncClamps() {
    applyClamps(document.getElementById('pendings'));
    applyClamps(document.getElementById('runs'));
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(resyncClamps);

  function esc(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // ── THE LIGHTBOX ────────────────────────────────────────────────────────
  // THE ONE SHARED ASSETS LIGHTBOX (asset-lightbox.js) — never a second copy
  // (2026-08-26, Sophie: "it should be the exact same design — can it not be
  // the same exact code?"). This page kept the LAST hand copy in the house,
  // and it drifted every time a chat fixed one surface and not the other —
  // the exact failure Meta Assets had already lived through. Everything this
  // page needs rides the shared file's hooks, never a fork:
  //   stepping — `nav` draws the two invisible zones over the picture; the
  //     order is READ OFF THE VIEW BEHIND THE LIGHTBOX (lbSeq), so tiles,
  //     list and the filters all step exactly what she is looking at.
  //   fast open — the tile's own cached 480px thumb paints first and the
  //     original swaps in behind it, from the SAME fetch Save needs anyway.
  //   the prompt — the Assets overlay itself: PROMPT in the top row, the
  //     words covering the picture, Content first, Style the wrapper THIS
  //     run really sent (runPromptHalves off fullPrompt). The half she picked
  //     and the open door ride along as she steps (promptSide/promptOpen);
  //     a fresh open starts shut, on content.
  //   ♥/✕ — this run doc's own vote route, exactly as before; notes — the
  //     picture's thread in my-creations, where every Playground picture is
  //     filed (the Panels wiring, verbatim); actions — put the prompt back
  //     in the box, Save to Photos, Send to the Story Room.
  //   the layout — `votesBelow` + `capUnderImage` (2026-08-26, Sophie: "put
  //     the heart where they were before exactly … the quality model etc.
  //     should go right under the picture not below the note area"): ♥/✕
  //     lead the button row under the picture (♥ ✕ · copy · save · story,
  //     where this page has always kept them), the MODEL · QUALITY tag sits
  //     directly under the picture, and the picture keeps its old 76vh room.
  function openLB(id, i) {
    if (!runsById[id]) return;
    // Opening an image freezes the page behind it (design rule): the shared
    // autoscroll pill stops; the shared lightbox locks and restores the
    // background scroll itself.
    if (window.__scrollStop) window.__scrollStop();
    lbFresh = true;   // a fresh open: the door shut, content first
    showLB(id, i);
  }

  // The order the arrows walk is READ OFF THE VIEW BEHIND THE LIGHTBOX — the
  // pictures actually on screen, in document order — so tiles, list and the
  // heart filter all step through exactly what she is looking at, with no
  // second copy of the ordering rules to drift.
  function lbSeq() {
    var box = curView() === 'tiles' ? document.getElementById('tiles') : document.getElementById('runs');
    return Array.prototype.map.call(box.querySelectorAll('img[data-run]'), function (im) {
      return { id: im.getAttribute('data-run'), i: Number(im.getAttribute('data-i')) };
    });
  }
  function lbAt() {
    if (!lbCur) return -1;
    var seq = lbSeq();
    for (var k = 0; k < seq.length; k++) if (seq[k].id === lbCur.id && seq[k].i === lbCur.i) return k;
    return -1;
  }
  function lbStep(d) {
    var seq = lbSeq(), at = lbAt();
    if (at < 0) return;
    var next = seq[at + d];
    if (next) showLB(next.id, next.i);
  }

  function lbIsOpen() {
    var el = document.getElementById('clightbox');
    return !!el && el.style.display !== 'none';
  }
  function closeLB() {
    if (window.__assetLightboxClose) window.__assetLightboxClose();
    lbCur = null;
  }

  // ── THE TWO HALVES OF THE PROMPT, AS THIS RUN REALLY SENT THEM ──────────
  // The run doc stores `fullPrompt` (the literal text sent) and `prompt` (her
  // typed words), so the style half is the exact remainder — head and tail
  // SPLIT out of the sent string, never rebuilt from the tile's current baked
  // prefix. That is what makes it right for a run drawn before or after she
  // edited the Prompt panel, with the no-text swap, the character line and the
  // photo line included exactly when they really rode along.
  // The seam is marked `[content]`, the convention prompt-record.js writes and
  // the Assets PROMPT overlay documents.
  // No wrapper (the plain ChatGPT tile, a verbatim run) → an EMPTY style half,
  // which is the honest answer and what hides the STYLE button.
  function runPromptHalves(r, i) {
    var content = String((r && r.prompt) || '');
    // A panels run: picture i's content is THAT panel's own words — they sit
    // verbatim in the sent text (one labeled line per panel), so the style
    // half below splits correctly around them.
    if (r && r.panels && r.panels.length && i != null && r.panels[i] != null) {
      content = String(r.panels[i]);
    }
    var full = String((r && r.fullPrompt) || '');
    if (!full || !content) return { content: content, style: '' };
    var at = full.indexOf(content);
    if (at < 0) {
      // The LoRA path strips her trailing periods before sending, so the sent
      // string holds her words one character short of what the doc typed.
      var trimmed = content.replace(/\.+$/, '');
      if (trimmed) { at = full.indexOf(trimmed); if (at >= 0) content = trimmed; }
    }
    // Her words are not in the sent text verbatim (nothing here does that
    // today): file no style half rather than a reconstruction.
    if (at < 0) return { content: content, style: '' };
    var head = full.slice(0, at).replace(/\s+$/, '');
    var tail = full.slice(at + content.length).replace(/^\s+/, '');
    return {
      content: content,
      style: (head || tail) ? [head, '[content]', tail].filter(Boolean).join('\n\n') : '',
    };
  }

  // Save to Photos. Three paths, in order:
  //   1. The app's native bridge (writes straight to the photo library and
  //      answers on window.__saveResult) — the only reliable one in a WKWebView.
  //   2. The share sheet, which offers "Save Image". It MUST be called inside
  //      the tap: iOS drops the user activation across an await, so awaiting the
  //      image download first made navigator.share reject silently — which is
  //      exactly the "nothing happens" she hit. The blob is fetched when the
  //      lightbox opens instead, so the tap has it ready.
  //   3. A plain download, for a desktop browser.
  // Every path says what happened — a failure is never silence.
  function nativeSaver() {
    try { return window.webkit.messageHandlers.forgeSave; } catch (e) { return null; }
  }
  window.__saveResult = function (ok, msg) { toast(msg || (ok ? 'Saved to Photos' : 'Couldn’t save that')); };
  function saveFromLB() {
    if (!lbCur) return;
    // The ORIGINAL url, never what is painted — that is the 480px thumb while
    // the full picture is still on its way, and a blob: url once it lands, and
    // the app's bridge needs the real https one.
    var url = lbSrc;
    var native = nativeSaver();
    if (native) { native.postMessage(url); toast('Saving…'); return; }
    if (!(lbBlob && lbBlob.url === url)) { toast('Still loading that image — try again'); return; }
    // Named after the BYTES, not after what the Playground usually makes: a
    // .webp name on png bytes is what the share sheet saves it as, and Photos
    // rejects webp outright.
    var ext = ((lbBlob.blob.type || '').split('/')[1] || 'png').replace('jpeg', 'jpg');
    var file = null;
    try { file = new File([lbBlob.blob], 'playground.' + ext, { type: lbBlob.blob.type || 'image/png' }); } catch (e) {}
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file] })
        .catch(function (err) { if (err && err.name !== 'AbortError') toast('Couldn’t open the share sheet'); });
      return;
    }
    var a = document.createElement('a');
    a.href = URL.createObjectURL(lbBlob.blob);
    a.download = 'playground.' + ext;
    document.body.appendChild(a); a.click(); a.remove();
  }

  // Paint one picture into the shared lightbox (opening, stepping, or a feed
  // re-render refreshing what is already up).
  function showLB(id, i) {
    var r = runsById[id];
    if (!r || !window.__assetLightbox) return;
    // i === -1 is the VIRTUAL sheet index (the Sheets view): the banked uncut
    // sheet, which is not in `images`. View-only — votes are indexed into the
    // cut panels, so no ♥/✕ and no note thread ride it (asset-lightbox draws
    // both only when _cast is wired).
    var isSheet = i === -1;
    var src = isSheet ? (r.sheetUrl || '') : runImages(r)[i];
    if (!src) return;
    // The door's state rides a STEP and dies with a fresh open (her rule:
    // "the half she picked rides along as she steps; a fresh open always
    // starts on content").
    var carry = (!lbFresh && lbAsset) ? { side: lbAsset.promptSide, open: lbAsset.promptOpen } : null;
    lbFresh = false;
    if (lbSrc !== src) { if (lbObj) { URL.revokeObjectURL(lbObj); lbObj = ''; } lbBlob = null; }
    lbCur = { id: id, i: i };
    lbSrc = src;
    var h = runPromptHalves(r, i);
    // MODEL · QUALITY · SIZE, and then WHICH picture of the run this is —
    // which is navigation rather than a fact about the run, and the one thing
    // the three slots cannot say. The sheet needs no such line: its size slot
    // is the whole sheet's tier where a panel's is a fraction, so the two can
    // never be mistaken for each other. (The card's tag row still says
    // 'sheet — cutting…' while a cut is running.)
    var meta = lbCaption(r, i);
    if (!isSheet && r.panels && r.panels.length && !r.cutFailed) meta.push('panel ' + (i + 1) + ' of ' + runImages(r).length);
    else if (!isSheet && runImages(r).length > 1) meta.push('image ' + (i + 1));
    var seq = lbSeq(), at = -1;
    for (var k = 0; k < seq.length; k++) if (seq[k].id === id && seq[k].i === i) { at = k; break; }
    var asset = {
      prompt: meta.join(' · '),
      promptStyle: h.style,
      promptContent: h.content,
      // THE SHEET IS A PICTURE LIKE ANY OTHER (2026-08-27, Sophie: "missing
      // three buttons too" — the banked sheet's lightbox had lost the ♥, the
      // ✕ and the Story Room walk). It was view-only because votes are indexed
      // into `images` and the sheet is not in it; it rides the VIRTUAL index
      // -1 now, on the run doc and on the Assets record its own filing made
      // ("the sheet — N panels"). It is a picture she paid for, and on a story
      // sheet it is the only picture the run has.
      vote: (r.votes || {})[i] || null,
      thread: noteCache[src] || [],
      // The old Playground arrangement, as the shared file's hooks (2026-08-26,
      // Sophie): ♥/✕ lead the row under the picture, the tag right under it.
      votesBelow: true,
      capUnderImage: true,
      _cast: castLB,
      // The note lands on the picture's own thread in my-creations, where
      // every Playground picture is filed — the Panels wiring, verbatim, so a
      // chat sweeping its notes finds it where it expects.
      _noteSend: function (text, cb) {
        fetch('/api/gallery/assets/note', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat: NOTE_CHAT, url: src, text: text, from: 'sophie' }),
        }).then(function (res) { return res.json(); })
          .then(function (j) {
            if (j && j.thread) noteCache[src] = j.thread;
            cb(!(j && j.error));
          })
          .catch(function () { cb(false); });
      },
      nav: {
        prev: at > 0 ? function () { lbStep(-1); } : null,
        next: (at >= 0 && at < seq.length - 1) ? function () { lbStep(1); } : null,
      },
      actions: [
        // The same put-it-back-in-the-box button the list boxes have, but
        // reachable from TILES view: closes the lightbox and lands the
        // picture's prompt in the prompt box.
        { label: 'Put this prompt back in the box', icon: ICONS.copy,
          onClick: function () { closeLB(); copyPictureIn(r, i); } },
        { label: 'Save to Photos', icon: ICONS.download, onClick: saveFromLB },
        // SEND TO THE STORY ROOM — it WALKS THERE (2026-08-26, Sophie: "rather
        // than this weird pop-up, it should take me to the story room so I can
        // pick myself"). A NAVIGATION that decides nothing about a story: the
        // run and which of its pictures ride the link (?send=<run>&i=<n>) —
        // never the url, because the room re-reads the run and gets the whole
        // provenance with it, the same src the pad's own inbox pick sends.
        // The banked sheet walks too, at its virtual index -1 — the room
        // resolves that to `sheetUrl` (loadSend). A whole comic page is
        // exactly the kind of picture a beat wants.
        { label: 'Send to the Story Room', icon: ICONS.share,
          onClick: function () { location.href = '/storyroom?send=' + encodeURIComponent(id) + '&i=' + i; } },
      ],
    };
    if (carry) { asset.promptSide = carry.side; asset.promptOpen = carry.open; }
    lbAsset = asset;
    // ── THE PICTURE IS ON SCREEN AT ONCE (2026-08-26, Sophie: "it seems like
    // it takes quite a while to load the images in light box view") ─────────
    // The wall and the list load a 480px derived thumb, and the lightbox used
    // to load the untouched ORIGINAL — 1-3MB at the 2K and 4K tiers — so every
    // tap was a fresh download over cell before anything appeared. The thumb
    // is already in the browser's cache (it is the tile she just tapped), so
    // it paints in the same frame; the original swaps in behind it the moment
    // it lands, from the SAME fetch that was already being made for Save. One
    // download, not two, and never a blank.
    var th = thumbFor(src);
    var painted = (lbBlob && lbBlob.url === src) ? (lbObj || src) : th;
    window.__assetLightbox(painted, asset);
    if (!lbBlob || lbBlob.url !== src) {
      fetch(src).then(function (res) { return res.blob(); })
        .then(function (b) {
          if (lbSrc !== src) return;                 // she stepped on while it flew
          lbBlob = { url: src, blob: b };
          if (th === src) return;                    // no derived copy — already the original
          var el = document.querySelector('#clightbox .clwrap img');
          if (el && el.getAttribute('src') === th) { lbObj = URL.createObjectURL(b); el.src = lbObj; }
        })
        .catch(function () {
          // A failed fetch must never leave her looking at the 480px copy: fall
          // back to loading the original the ordinary way.
          if (lbSrc !== src || th === src) return;
          var el = document.querySelector('#clightbox .clwrap img');
          if (el && el.getAttribute('src') === th) el.src = src;
        });
    }
    // The thread is ONE doc read, asked for after the picture is already up —
    // the sibling /notes route answers with a whole chat's worth and would be
    // the wrong thing to fetch to open one picture. The virtual sheet asks
    // too: it is filed as its own asset ("the sheet — N panels"), so a note
    // left on it has somewhere real to land.
    fetch('/api/gallery/assets/note?chat=' + encodeURIComponent(NOTE_CHAT)
      + '&url=' + encodeURIComponent(src))
      .then(function (res) { return res.json(); })
      .then(function (j) {
        if (!j || j.error || !j.thread || !j.thread.length) return;
        noteCache[src] = j.thread;
        // Only repaint the picture she is still looking at — with whatever is
        // currently painted (the thumb, or the original once it swapped in),
        // so this repaint can never regress a loaded original to its thumb.
        if (!lbCur || lbCur.id !== id || lbCur.i !== i || !lbIsOpen()) return;
        var el = document.querySelector('#clightbox .clwrap img');
        window.__assetLightbox(el ? el.getAttribute('src') : painted,
          Object.assign(asset, { thread: j.thread }));
      })
      .catch(function () {});
  }

  // ♥/✕ — this run doc's own vote route, tap again to clear, exactly as the
  // old copy did; the shared lightbox repaints through _lbPaint.
  function castLB(kind) {
    if (!lbCur || !lbAsset) return;
    var r = runsById[lbCur.id];
    var votes = r.votes = r.votes || {};
    var next = votes[lbCur.i] === kind ? null : kind;    // tap again to clear
    if (next === null) delete votes[lbCur.i]; else votes[lbCur.i] = next;
    lbAsset.vote = next;
    if (lbAsset._lbPaint) lbAsset._lbPaint();
    fetch('/api/promptlab/' + lbCur.id + '/vote', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: lbCur.i, vote: next || '' }),
    }).then(function () { loadRuns(); }).catch(function () {});
  }

  var toast = window.FeedKit.toast;

  // The app's nav-bar chevron asks the page first: close the lightbox if it's
  // open, else let the app leave the tool.
  window.__navBack = function () {
    if (document.getElementById('ask').classList.contains('on')) { closeAsk(); return true; }
    if (lbIsOpen()) { closeLB(); return true; }
    return false;
  };

  /* ── THE PAGE HEALS ITS OWN STALENESS (2026-08-27, Sophie: "it's not
     there", about the back-to-top arrow — then "self heal").
     MEASURED that hour, and this is why the fix is here rather than in the
     pill: the bytes Render serves carry the arrow, and the live html renders
     it at her viewport with the iPhone 13's 47px safe-area inset. What she
     was looking at was an OLD PAGE. The iOS app keeps the three recent tools
     alive in a ZStack, so this page loads ONCE per app process and
     re-entering the tool shows the same one — no deploy can reach it, which
     is the Film Editor's round-three finding arriving at the tool she is in
     most.

     A HASH, NOT A CONST. The build id is derived server-side from the page
     file plus the pill (pageBuildId in server.js), so nobody has to remember
     to bump anything — the Film Editor's hand-kept `var BUILD` is one
     forgotten edit away from a self-heal that never fires.

     IT ONLY RELOADS WHEN NOTHING WOULD BE LOST, which is the half the Film
     Editor could take for granted and this page cannot: its whole state is
     server-side, and the Playground holds real unsaved things. Her typed
     prompt, an attached photo, a picked cast, the quality and size she has
     moved off default and a search she is in the middle of are all
     DELIBERATELY not persisted, so a silent reload would throw them away —
     a worse bug than the one being fixed. Everything else already survives
     (the view, the filters, the columns, the canvas, the panel words, her
     prompt overrides, and pending runs, which live in localStorage).
     When she IS holding something, it waits and asks again; the common
     stale case — the tool opened after a night in the background, nothing
     typed yet — heals on the spot.

     THE VISIBILITY CHECK IS THE ONE THAT MATTERS. Coming back to the tool is
     the moment a stale page is about to be used; the five-minute timer is
     the fallback for a page left open. Exposed as window.__plBuildCheck for
     the test. ── */
  // READ LAZILY, never at parse time: serveGated APPENDS the stamp after the
  // page (and after the pill), so at the moment this script runs
  // window.__forgeBuild does not exist yet. Caching it here would leave
  // PL_BUILD empty forever and the self-heal silently disabled — which every
  // "same build" assertion would still pass, vacuously.
  function plBuild() { return window.__forgeBuild || ''; }
  // The values a FRESH load would take, read here rather than written down —
  // a literal would drift the day a default moves.
  var plQ0 = quality, plR0 = resTier;
  var plTouchedAt = 0;
  ['pointerdown', 'keydown'].forEach(function (ev) {
    document.addEventListener(ev, function () { plTouchedAt = Date.now(); }, true);
  });
  function plHolding() {
    if (Date.now() - plTouchedAt < 10000) return true;      // under her thumb
    var el = document.activeElement;
    if (el && (el.tagName === 'TEXTAREA' || el.tagName === 'INPUT')) return true;
    if (document.getElementById('prompt').value.trim()) return true;
    if (photoRef) return true;
    if (pickedChars.length) return true;
    if (quality !== plQ0 || resTier !== plR0) return true;
    var q = document.getElementById('q');
    if (q && q.value.trim()) return true;
    if (lbIsOpen()) return true;
    if (document.getElementById('ask').classList.contains('on')) return true;
    if (charsOpen) return true;
    var pp = document.getElementById('promptpanel');
    if (pp && pp.classList.contains('on')) return true;
    return false;
  }
  function plBuildCheck() {
    var mine = plBuild();
    if (!mine) return Promise.resolve(false);      // older server, nothing to compare
    return fetch('/api/promptlab/build', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (r) {
        if (!r || !r.build || r.build === mine) return false;
        if (plHolding()) return false;
        location.reload();
        return true;
      }).catch(function () { return false; });
  }
  window.__plBuildCheck = plBuildCheck;
  setInterval(plBuildCheck, 5 * 60 * 1000);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') plBuildCheck();
  });

  if (window.__nativeNavBar) document.body.classList.add('native');
  renderStyles(); updateShape(); syncControls(); syncTab(); applyLiked(false); applyHideX(false); applyView(); loadRuns();
  if (pendingList().length) { renderPendings(); startPolling(); }
</script>
</body></html>
