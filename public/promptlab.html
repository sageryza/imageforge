  }
  document.getElementById('t-picture').addEventListener('click', function () { setTab('picture'); });
  document.getElementById('t-panels').addEventListener('click', function () { setTab('panels'); });
  window.addEventListener('resize', plTabLine);

  // ONE image a run, every style, no picker (Aug 2026, Sophie): tapping the
  // stars draws one picture. The old 1/2/3/4 toggle is gone and the LoRAs no
  // longer come back with four options either — the server sends the same
  // count. Change it in both places if that ever moves.
  var OUTPUTS = 1;

  // Quality — deliberately NOT persisted: it lives in a plain variable, so it
  // holds for as long as the page is open and every fresh load is back to
  // medium. (localStorage would carry an expensive 'high' over to next time
  // without her meaning it.)
  var QUALITIES = ['low', 'medium', 'high'];
  var quality = 'medium';
  // The three-way toggle (see .tri). Nothing here counts the notches: the
  // stops come from QUALITIES, so a fourth quality would be an entry in that
  // array plus one rule in the CSS — the same shape as the account switch.
  // `data-n` is the stop's INDEX and drives the knob's position; `data-i` is
  // what the knob says. Both are written in one place so the two can never
  // fall out of step, and the index is what lets the resolution toggle share
  // the identical CSS rule rather than keeping a second copy of it.
  var qpick = document.getElementById('qpick');
  function paintQuality() {
    qpick.setAttribute('data-n', String(Math.max(QUALITIES.indexOf(quality), 0)));
    qpick.setAttribute('data-i', quality.charAt(0).toUpperCase());

  qpick.addEventListener('click', function (e) {

    // goes to high from medium never low even if I click it on that side").
    // This used to be a plain cycle, which is why a tap on the L went to high.
    // triNext falls back to the cycle for a tap with no coordinate (the

    // to go: indexOf is -1, so that tap lands on the first notch rather than
    // doing nothing at all.
    quality = QUALITIES[triNext(qpick, QUALITIES.length, e, QUALITIES.indexOf(quality))];

  });
  paintQuality();

  // The Sophie character toggle — plain variable like quality, so every fresh
  // load starts OFF and a run only carries her when the picture is lit.
  var charOn = false;
  document.getElementById('charpick').addEventListener('click', function () {
    charOn = !charOn;
    this.classList.toggle('on', charOn);
    updateShape();
    // Her card adds a line to the prompt, so the open panel has to say so the
    // moment it goes on — the panel is the one place the whole sent prompt is
    // visible, and a line appearing there only after a reload is a line hidden.
    if (promptOpen) paintPromptPanel();
  });

  // ── HER OWN CAST — THE CHARACTER PICKER (2026-08-27) ──────────────
  // Sophie: "a little button in the playground right next to where it says
  // dreamy, make sure it's the same style, with a character icon that shows
  // the five most recent characters that were put and then also the rest of
  // the sheet and characters with a search".
  //
  // The library is the Character Creator's own — /api/promptlab/characters is
  // `forge-characters` in most-recently-DRAWN-WITH order, never a second pile
  // and never an ordering invented here. Picking is two taps: the button, then
  // the face.
  //
  // NOT PERSISTED, the same rule quality and the photo reference follow: a
  // cast picked last week silently riding today's run is exactly the hidden
  // ingredient the Prompt panel exists to prevent — and every reference is
  // paid input tokens (~1.2c each), so it would be a hidden ingredient that
  // costs money. It survives between runs in one sitting, so a re-roll is one
  // tap.
  var CHAR_RECENT = 5;             // her number — the top row
  var charList = null;             // the library, once fetched
  var charMax = (window.__padCharacters && window.__padCharacters.MAX_PICKED) || 6;
  var pickedChars = [];            // ids, in the order she picked them
  var charsOpen = false;
  var charsBtn = document.getElementById('charsbtn');
  var charPanel = document.getElementById('charpanel');

  // The characters riding this run, as records — what charLine() needs, and
  // what the Prompt panel prints. Her pick ORDER is the attach order, so a
  // named list in the prompt lines up with the pictures behind it.
  function pickedCharRecords() {
    if (!charList) return [];
    return pickedChars.map(function (id) {
      for (var i = 0; i < charList.length; i++) if (charList[i].id === id) return charList[i];
      return null;
    }).filter(Boolean);
  }
  // The line that will really ride, from the REAL shared rule — the page owns
  // no copy of the wording.
  function charsLine() {
    var f = window.__padCharacters && window.__padCharacters.charLine;
    return f ? f(pickedCharRecords()) : '';
  }
  function paintCharsBtn() {
    var n = pickedChars.length;
    charsBtn.classList.toggle('on', n > 0);
    document.getElementById('charsn').textContent = n ? String(n) : '';
    charsBtn.setAttribute('aria-label', n
      ? 'Character references — ' + n + ' picked' : 'Character references');
  }
  function charHay(c) {
    return (String(c.name || '') + ' ' + (c.aliases || []).join(' ')).toLowerCase();
  }
  function charCard(c) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'charcard' + (pickedChars.indexOf(c.id) >= 0 ? ' on' : '');
    b.setAttribute('data-id', c.id);
    b.setAttribute('aria-pressed', pickedChars.indexOf(c.id) >= 0 ? 'true' : 'false');
    var im = document.createElement('img');
    // A DERIVED DISPLAY COPY, never the original — the house webp rule. A
    // saved character card is a full gpt-image-2 render (measured: 1.2MB
    // apiece), and a picker of 143 faces at 52px would be tens of megabytes
    // of originals over cell. thumbFor is the feed's own one, and it leaves
    // anything not in Storage exactly as it is.
    // (FeedKit's own, not the page's `thumbFor` — that one is bound to the
    // FEED's width and a 52px card wants its own.)
    im.src = window.FeedKit.thumbFor(c.url, 240); im.alt = ''; im.loading = 'lazy';
    var nm = document.createElement('span');
    nm.className = 'nm';
    nm.textContent = c.name || 'unnamed';
    b.appendChild(im); b.appendChild(nm);
    b.addEventListener('click', function () { toggleChar(c.id); });
    return b;
  }
  function toggleChar(id) {
    var at = pickedChars.indexOf(id);
    if (at >= 0) pickedChars.splice(at, 1);
    // The cap is the shared one (pad-characters.js): every reference is paid
    // input tokens, so a draw carries a few characters, never the library.
    else if (pickedChars.length >= charMax) {
      toast('That is ' + charMax + ' characters — as many as one drawing takes');
      return;
    } else pickedChars.push(id);
    paintCharsBtn();
    paintCharPanel();
    // The picked cast adds a line to the prompt, so an open Prompt panel has
    // to say so the moment it changes — same rule as the Sophie card.
    if (promptOpen) paintPromptPanel();
  }
  // THE PILL OWNS THAT CORNER, AND THE SHEET OPENS INTO IT. Measured against
  // the pill's REAL rect rather than a hardcoded band — it is conditional
  // (no pill until there is something to scroll) and its top rides
  // env(safe-area-inset-top), so on her phone it sits ~33px lower than it
  // does in a plain headless browser, which is the difference between
  // clipping a card's corner and covering its middle.
  function fitCharPill() {
    var pill = document.querySelector('.float');
    var row = document.getElementById('charrecent');
    if (!pill || !row) { charPanel.style.setProperty('--charpill', '0px'); return; }
    var p = pill.getBoundingClientRect();
    var r = row.getBoundingClientRect();
    if (!p.width || !r.width) { charPanel.style.setProperty('--charpill', '0px'); return; }
    // The row's own right edge against the pill's left one, plus a hair of
    // air. `#spd` — the pill's speed label — hangs BELOW the capsule and is
    // the part that actually reached the cards, so the wider of the two wins.
    var spd = document.getElementById('spd');
    var left = spd ? Math.min(p.left, spd.getBoundingClientRect().left || p.left) : p.left;
    var over = Math.max(0, Math.round(r.right - left) + 4);
    charPanel.style.setProperty('--charpill', over + 'px');
  }
  window.addEventListener('resize', function () { if (charsOpen) fitCharPill(); });

  function paintCharPanel() {
    var recentBox = document.getElementById('charrecent');
    var allBox = document.getElementById('charall');
    var note = document.getElementById('charnote');
    recentBox.innerHTML = ''; allBox.innerHTML = '';
    if (!charList) { note.textContent = 'Loading your characters…'; return; }
    if (!charList.length) {
      note.textContent = 'No characters saved yet — the Character Creator is where they are made.';
      return;
    }
    var q = document.getElementById('charq').value.trim().toLowerCase();
    var recent = charList.slice(0, CHAR_RECENT);
    recent.forEach(function (c) { recentBox.appendChild(charCard(c)); });
    // NO SEARCH → the REST, so the top row is not printed twice. TYPING →
    // the whole library, because a search that skipped the five she uses most
    // would answer "no such character" about a character she can see.
    var rest = q
      ? charList.filter(function (c) { return charHay(c).indexOf(q) >= 0; })
      : charList.slice(CHAR_RECENT);
    document.getElementById('charalllab').textContent = q ? 'Matches' : 'All characters';
    rest.forEach(function (c) { allBox.appendChild(charCard(c)); });
    note.textContent = q && !rest.length
      ? 'Nothing matches “' + q + '”.'
      : (pickedChars.length
        ? 'Riding this drawing: ' + pickedCharRecords().map(function (c) { return c.name || 'unnamed'; }).join(', ')
          + ' — write their names in your prompt.'
        : 'Pick up to ' + charMax + '. The name under a face is what to write in your prompt.');
  }
  function loadChars() {
    if (charList) return Promise.resolve(charList);
    return fetch('/api/promptlab/characters').then(function (r) { return r.json(); }).then(function (d) {
      charList = (d.characters || []).filter(function (c) { return c && c.id && c.url; });
      if (d.max) charMax = d.max;
      paintCharPanel();
      // The pill only exists once there is something to scroll, and the sheet
      // filling with faces is often what makes that true — so measure again
      // after the cards land, not only when the sheet opened empty.
      setTimeout(fitCharPill, 60);
      return charList;
    }).catch(function () {
      document.getElementById('charnote').textContent = 'Could not load your characters.';
    });
  }
  charsBtn.addEventListener('click', function () {
    charsOpen = !charsOpen;
    charPanel.classList.toggle('on', charsOpen);
    if (charsOpen) { paintCharPanel(); fitCharPill(); loadChars(); }
  });
  // The house search helpers, both of them: iOS dictation can fill a box
  // without ever firing `input`, and Return has nothing to submit to.
  (function () {
    var box = document.getElementById('charq');
    var live = liveInput(box, paintCharPanel);
    enterSubmits(box, function () { paintCharPanel(); live.sync(); });
  })();
  paintCharsBtn();

  // ── ARRIVED FROM A STORY ROOM BEAT (2026-08-26, Sophie) ───────────
  // Her ask, in three parts: the beat's drawing prompt lands in the box (the
  // ?prompt= block below does that, the same door an image's "open in the
  // Playground" uses), the way back returns to THAT BEAT rather than the
  // shelf, and "whatever I just made, there should also be for that beat".
  //
  // The landing is the SERVER's job, not this page's — see landOnBeat in
  // server.js. A medium picture takes 30-90s, so a page that placed it on the
  // way out would lose everything she tapped back before. All this side does
  // is carry the target on every run it starts while the beat is in hand.
  //
  // NOT PERSISTED and not remembered: the context is the query string, so
  // opening the Playground any other way is byte-for-byte what it always was.
  var padBack = null;    // { pad, beat, style } while she is drawing for a beat
  (function () {
    var q = new URLSearchParams(location.search);
    if (!/[?&]from=scratchpad\b/.test(location.search)) return;
    var chip = document.getElementById('backchip');
    chip.classList.add('on');
    var pad = q.get('pad'), beat = q.get('beat');
    if (!pad || !beat) return;    // came from the room, not from one beat
    padBack = { pad: pad, beat: beat, style: q.get('padstyle') || 'watercolor' };
    // Back to the exact beat, popup open — /scratchpad reads both.
    chip.href = '/scratchpad?pad=' + encodeURIComponent(pad) + '&beat=' + encodeURIComponent(beat);
    var tag = document.getElementById('beattag');
    tag.textContent = 'Drawing for a beat in the Story Room — every picture you make here lands on it, newest as its art and the rest in its past pictures.';
    tag.classList.add('on');
  })();

  // Arrived with a generation's settings (an image's "open in the Playground"):
  // ?prompt=…&style=<a STYLES key>&quality=…&sameref=1|0&character=1&scale=…
  // An unknown style is simply ignored — the prompt still lands, on whatever
  // style is current. Everything lands prefilled so she can re-run it as-is or
  // nudge one thing.
  //
  // `sameref` is the honesty flag (Sophie, Aug 2026: "some sort of indicator
  // saying whether it's using the reference and prompt or not"). The sender
  // (/playground-port.js) sets it to 1 only when the picture's filed style
  // half NAMES this tile's own reference or quotes its own baked prompt. It is
  // NOT re-derived here — the Playground never sees the filed prompt, only the
  // content half — so the flag travels with the link.
  var portedFrom = null;   // the tile the picture was actually made on, or null
  (function () {
    var q = new URLSearchParams(location.search);
    if (!q.get('prompt') && !q.get('style')) return;
    // A PORTED PROMPT IS ONE PICTURE'S, SO IT LANDS ON THE PICTURE TAB
    // (2026-08-27, Sophie, about a panel image's Playground button: "should
    // copy text into the single picture … not the whole panel"). The tab is
    // sticky, and a panel image is exactly the picture she is on the PANELS
    // tab when she taps — so the prompt was landing in `.promptwrap`, which
    // that tab hides, and the run she fired next drew her saved panel boxes
    // instead. Silent, and the ported words were never used at all.
    // Stored, never setTab() — this block runs partway down the script, where
    // syncTab's painters are not all wired yet (rpick is a `var` several
    // hundred lines below, and calling it here threw before anything else in
    // this block could run). Boot's own syncTab() paints the tab at the end.
    try { localStorage.setItem(TABKEY, 'picture'); } catch (e) { /* private mode */ }
    var st = q.get('style');
    if (st && STYLES[st]) setStyle(st);
    if (q.get('prompt')) document.getElementById('prompt').value = q.get('prompt');
    var qq = q.get('quality');
    if (qq && QUALITIES.indexOf(qq) >= 0) { quality = qq; paintQuality(); }
    if (q.get('character') === '1' && isGpt(styleKey) && !STYLES[styleKey].noCharacter) { charOn = true; document.getElementById('charpick').classList.add('on'); }
    var sc = parseFloat(q.get('scale'));
    if (!isNaN(sc)) document.getElementById('scale').value = sc;
    if (q.get('sameref') !== null) portedFrom = (q.get('sameref') === '1' && st && STYLES[st]) ? st : '';
    paintRefTag();
    updateShape();
  })();

  // The indicator. Three things it can say, and it only ever speaks when she
  // arrived from a picture:
  //   • she is on the tile that made it   — same reference, same style prompt
  //   • she moved off that tile           — name what she left, so switching
  //                                         back is obvious
  //   • nothing identified the picture    — say so plainly rather than letting
  //                                         the fallback tile imply a match
  // A LoRA has no reference to attach, so it says "style prompt" alone.
  function paintRefTag() {
    var el = document.getElementById('reftag');
    if (portedFrom === null) { el.className = ''; el.textContent = ''; return; }
    var here = STYLES[styleKey] ? STYLES[styleKey].label : styleKey;
    var carries = isGpt(styleKey) ? 'reference and style prompt' : 'style prompt';
    if (portedFrom === '') {
      el.className = 'on';
      el.textContent = 'Nothing on this picture’s record says how it was made, so '
        + here + '’s ' + carries + ' is attached — not the one behind it.';
    } else if (portedFrom === styleKey) {
      el.className = 'on same';
      el.textContent = 'Carrying ' + here + '’s ' + carries + ' — the ones this picture was made with.';
    } else {
      el.className = 'on';
      el.textContent = 'On ' + here + '. This picture was made on '
        + (STYLES[portedFrom] ? STYLES[portedFrom].label : portedFrom) + '.';
    }
  }

  // ── THE PROMPT BUTTON — see what is wrapped around her words, and change it
  //    (Aug 2026, Sophie: "add a prompt button so you can see what's being
  //    added and what's and allow yourself to edit it as well").
  //
  // The baked text is READ FROM THE SERVER (`GET /api/promptlab/styles`), not
  // copied into this file. server.js owns what is actually sent, and a copy
  // here would drift the first time a style is reworded — which is exactly
  // what she caught the day this shipped ("I think we recently changed the
  // prompt anyway"). The panel therefore shows nothing until that read lands.
  //
  // NOT pre-written text in a box she writes in (the house rule): these two
  // fields hold the LIVE VALUE that will be sent, the way reopening her
  // waiting-for box shows the sentence she already wrote. Her own words go in
  // the main box, which still ships empty.
  //
  // Edits are per STYLE and kept in localStorage, so a look she has tuned
  // stays tuned across visits; RESET puts the house text back. An edited
  // style marks its button, so she can never be running her own wording
  // without the page saying so.
  var BAKED = null;                  // {gptStyleId: {label, prefix, suffix, refs}}
  var PHOTO_LINE = '';               // the line server.js adds when a photo is attached
  var PHOTO_LINE_CHARS = '';         // …and the same one re-anchored when characters ride behind it
  var promptOpen = false;
  var OVERKEY = 'promptlab_prompt_';  // + gptStyle id

  // Where a style's edit is stored. A gpt style is keyed by its SERVER id
  // (shared by every tile pointing at it); a LoRA has no gptStyle, so it is
  // keyed by its own key — that is what lets WTR carry an edit at all.
  function overKey(k) {
    var S = STYLES[k];
    return S ? (S.gptStyle || k) : '';
  }
  // WHAT IS WRAPPED AROUND HER WORDS, for EVERY style — not just the
  // gpt-image-2 ones (Sophie, 2026-08-24: "there's no way to see the style
  // prompt in the playground"). She was right, and the reason was structural:
  // everything here keyed off `S.gptStyle`, so the LoRA — which the page OPENS
  // ON — fell through to null and the whole panel was hidden. WTR does wrap her
  // words: the trigger word goes in front and a tail goes after, and both were
  // invisible.
  // The LoRA's shape is synthesised from its own STYLES row rather than served,
  // because there is no server-side recipe for it to serve — the trigger and
  // the tail ARE the style.
  function bakedFor(k) {
    var S = STYLES[k];
    if (!S) return null;
    if (S.gptStyle) return BAKED ? BAKED[S.gptStyle] : null;
    if (S.engine !== 'replicate') return null;
    return { label: S.label, prefix: '', suffix: S.suffix || '',
      trigger: S.trigger || '', lora: true, refs: [] };
  }
  function overrideFor(k) {
    var key = overKey(k);
    if (!key) return null;
    try { return JSON.parse(localStorage.getItem(OVERKEY + key) || 'null'); }
    catch (e) { return null; }
  }
  function saveOverride(k, v) {
    var key = overKey(k);
    if (!key) return;
    if (v) localStorage.setItem(OVERKEY + key, JSON.stringify(v));
    else localStorage.removeItem(OVERKEY + key);
    syncControls();
  }
  // What WILL be sent for this style — her edit if she has one, else the house
  // text. `null` while the server read is still in flight.
  function sentParts(k) {
    var b = bakedFor(k); if (!b) return null;
    var o = overrideFor(k);
    return {
      prefix: o && typeof o.prefix === 'string' ? o.prefix : b.prefix,
      suffix: o && typeof o.suffix === 'string' ? o.suffix : b.suffix,
      baked: b, edited: !!o,
    };
  }

  // ── NO TEXT — one toggle on the styles that allow text (Aug 2026, Sophie:
  // "add a no text line to the prompt that can be toggled on and off with a
  // little toggle"). Dreamy is the only one today: its tail says "Minimal text
  // only" on purpose, and this swaps that clause for a flat ban. The server
  // owns the wording and says per style whether the toggle exists at all, so
  // the page has no copy of the line to drift out of step.
  // Kept per style in localStorage — unlike quality and the canvas it costs
  // nothing, so carrying it into the next visit can never spend money unmeant.
  var NOTEXTKEY = 'promptlab_notext_';
  function noTextFor(k) {
    var b = bakedFor(k), S = STYLES[k];
    if (!b || !b.noText || !S || !S.gptStyle) return false;
    return localStorage.getItem(NOTEXTKEY + S.gptStyle) === '1';
  }
  function setNoText(k, on) {
    var S = STYLES[k]; if (!S || !S.gptStyle) return;
    if (on) localStorage.setItem(NOTEXTKEY + S.gptStyle, '1');
    else localStorage.removeItem(NOTEXTKEY + S.gptStyle);
    syncControls(); paintPromptPanel();
  }
  document.getElementById('notextbtn').addEventListener('click', function () {
    setNoText(styleKey, !noTextFor(styleKey));
  });

  function paintPromptPanel() {
    var el = document.getElementById('promptpanel');
    // Every style with a wrapper gets the panel — a LoRA has one too (its
    // trigger and its tail), and gating this on isGpt is what left the tile
    // the page opens on with no way to see its style prompt at all.
    if (!promptOpen || !bakedFor(styleKey)) { el.className = ''; el.innerHTML = ''; return; }
    var p = sentParts(styleKey);
    el.className = 'on';
    if (!p) { el.innerHTML = '<div class="plab">Prompt</div><div class="yours">Loading…</div>'; return; }
    el.innerHTML = '';
    function field(label, val, name) {
      var l = document.createElement('div'); l.className = 'plab'; l.textContent = label;
      var t = document.createElement('textarea'); t.value = val; t.setAttribute('data-part', name);
      t.addEventListener('input', stash);
      el.appendChild(l); el.appendChild(t);
    }
    // A LoRA's trigger word is what SELECTS the model, so it is shown as an
    // added line rather than as an editable half — editing it would quietly
    // stop the style working. Its tail below IS hers to change.
    if (p.baked.lora) {
      if (p.baked.trigger) {
        var tl = document.createElement('div'); tl.className = 'plab';
        tl.textContent = 'Before your words';
        var tv = document.createElement('div'); tv.className = 'added';
        tv.textContent = p.baked.trigger;
        el.appendChild(tl); el.appendChild(tv);
      }
    } else {
      field('Before your words', p.prefix, 'prefix');
    }
    // Whatever else actually rides this run, printed word for word. Read-only
    // on purpose: these are server-owned lines tied to an attachment, not a
    // half of the prompt she edits — taking the photo off is what removes the
    // photo line, and the Sophie button is what removes the character one.
    var extras = [];
    // The Panels tab sends neither the Sophie card nor a photo (both wordings
    // name an attachment a sheet does not carry) — and it DOES send the grid
    // sentence, printed here so nothing rides the prompt unannounced.
    if (charOn && !onPanels() && !STYLES[styleKey].noCharacter && p.baked.characterLine) extras.push(p.baked.characterLine);
    // The style's OWN photo line wins where it has one — the house sentence
    // says the drawing style "comes from the style reference above", which is
    // a lie on the plain ChatGPT tile where her photo is the only attachment.
    // Her own cast, and the photo line RE-ANCHORED when one rides behind it —
    // character cards attach at the very end, so "the LAST attached image" is
    // no longer the photo. Both halves are served, never written here.
    var cline = onPanels() ? '' : charsLine();
    if (photoRef && !onPanels()) {
      var pl = cline
        ? ((p.baked && p.baked.photoLineWithChars) || PHOTO_LINE_CHARS)
        : ((p.baked && p.baked.photoLine) || PHOTO_LINE);
      if (pl) extras.push(pl);
    }
    if (cline) extras.push(cline);
    if (onPanels() && PANELS_CFG) {
      // STORY mode sends the served story line; a grid sends its sentence.
      if (storyMode() && PANELS_CFG.story) extras.push(PANELS_CFG.story.line);
      else if (PANELS_CFG.grids[curGrid()]) extras.push(PANELS_CFG.grids[curGrid()].sentence);
    }
    if (extras.length) {
      var al = document.createElement('div'); al.className = 'plab';
      al.textContent = 'Also added before your words';
      var av = document.createElement('div'); av.className = 'added';
      av.textContent = extras.join(' ').trim();
      el.appendChild(al); el.appendChild(av);
    }
    var y = document.createElement('div'); y.className = 'plab'; y.textContent = 'Your words';
    var yv = document.createElement('div'); yv.className = 'yours';
    yv.textContent = storyMode()
      ? ((document.querySelector('#panelgrid textarea[data-story]') || {}).value || '').trim() || '(the story box below)'
      : onPanels()
        ? (panelVals().map(function (s) { return s.trim(); }).filter(Boolean).join(' / ') || '(the boxes below, one per panel)')
        : (document.getElementById('prompt').value.trim() || '(the box below)');
    el.appendChild(y); el.appendChild(yv);
    field('After your words', p.suffix, 'suffix');
    // The sheet swap, disclosed like the no-text one: on a panel sheet the
    // tail's anti-grid clause is sent SWAPPED (never two arguing sentences),
    // and if she has edited the clause away her tail goes untouched.
    if (onPanels() && p.baked.sheet && PANELS_CFG
        && (storyMode() ? PANELS_CFG.story : PANELS_CFG.grids[curGrid()])) {
      var shsw = document.createElement('div'); shsw.className = 'swapped';
      var shto = String(p.baked.sheet.to || '').replace('{layout}',
        storyMode() ? PANELS_CFG.story.layout : PANELS_CFG.grids[curGrid()].layout);
      shsw.textContent = p.suffix.indexOf(p.baked.sheet.from) >= 0
        ? 'On a panel sheet — “' + p.baked.sheet.from.trim() + '” is sent as “' + shto.trim() + '”'
        : 'Your tail is sent as written — the house anti-grid clause is not in it';
      el.appendChild(shsw);
    }
    // The toggle is not an edit of hers, so it does not go in the box — the
    // box holds her text. This line under it says what the switch does to the
    // tail on the way out, so nothing is added to the prompt unannounced.
    if (noTextFor(styleKey) && p.baked.noText) {
      var sw = document.createElement('div'); sw.className = 'swapped';
      sw.textContent = p.suffix.indexOf(p.baked.noText.from) >= 0
        ? 'No text is on — “' + p.baked.noText.from + '” is sent as “' + p.baked.noText.to + '”'
        : 'No text is on — “' + p.baked.noText.to + '” is added at the end';
      el.appendChild(sw);
    }
    var row = document.createElement('div'); row.className = 'prow';
    var rst = document.createElement('button'); rst.type = 'button'; rst.textContent = 'Reset';
    rst.onclick = function () { saveOverride(styleKey, null); paintPromptPanel(); };

  // ONE photo per run, attached from the file button — deliberately NOT a
  // library like Freeform's. The Playground's whole point is a fixed recipe
  // per style with one thing changed at a time; a shelf of references would
  // be a second thing moving.

  // card, and server.js appends `photoLine` to the prefix so the model knows
  // which of the attachments is the photo. That line is READ FROM THE SERVER
  // like the rest of the prompt and printed in the Prompt panel whenever a
  // photo is attached — nothing is added to her words unannounced.
  //

  // riding today's run is exactly the kind of hidden ingredient the panel
  // exists to prevent. It DOES survive between runs in one sitting, so a
  // re-roll is one tap.
  var photoRef = null;              // { data: <dataURL>, name } — one per run
  var PHOTO_MAX_EDGE = 1600;        // gpt-image-2 works from ~1024; this is headroom
  var PHOTO_SEND_MAX = 9e6;         // ~9MB of base64, well under the server's 25mb body

  function paintPhoto() {
    var wrap = document.getElementById('photowrap');
    var btn = document.getElementById('photopick');

  // photo already small enough is sent BYTE-FOR-BYTE — the house rule is that
  // a derived copy is fine but nothing gets quietly transformed when it does
  // not have to be.
  function prepPhoto(dataUrl, cb) {
    var img = new Image();
    img.onload = function () {
      var big = Math.max(img.width, img.height) > PHOTO_MAX_EDGE;
      var heavy = dataUrl.length > PHOTO_SEND_MAX;
      var isJpegOrPng = /^data:image\/(jpeg|png)/i.test(dataUrl);
      if (!big && !heavy && isJpegOrPng) return cb(dataUrl);

      var c = document.createElement('canvas');
