<!doctype html><html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Playground</title>
<link rel="stylesheet" href="/tritoggle.css">
<!-- The toggle's BEHAVIOUR is shared too since 2026-08-24 — a tap lands on the
     stop under the thumb rather than cycling. See /tritoggle.js. -->
<script src="/tritoggle.js"></script>
<!-- The feed's own shared pieces — the search grammar, liveInput/enterSubmits,
     the keyed reconcile, the derived display copy and the toast. ONE copy,
     so a second feed can never hand-copy them. -->
<script src="/feedkit.js"></script>
<!-- The character-reference rules — the SAME file the server draws with and
     the Story Room draws with, so the sentence the picked characters add to
     her words is written down exactly once. See /pad-characters.js. -->
<script src="/pad-characters.js"></script>
<!-- The caption's required third slot, shared the same way (2026-08-27) — the
     SAME derivation the server files a picture with, so the caption she reads
     on this page and the one on the filed record cannot disagree about which
     rung a picture was drawn on. See /size-tier.js. -->
<script src="/size-tier.js"></script>
<script src="/asset-lightbox.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  body { font-family: -apple-system, "Helvetica Neue", sans-serif; background: #faf7f2; color: #2b2622; padding: 14px 12px 60px; }
  /* The page's OWN header band (Aug 2026, Sophie: "there shud be a header —
     playground is missing it"). The house app-header shape — caps, letter-
     spaced, one row pagehead.js puts its back chevron into and centres. */
  .app-header { display: flex; align-items: center; min-height: 34px; padding-right: 64px; margin: 0 0 10px; }
  .app-header h1 { font-family: -apple-system, 'Helvetica Neue', sans-serif; font-size: 11px;
    letter-spacing: .34em; color: #6f675e; text-transform: uppercase; font-weight: 400; margin: 0; }
  /* On the OLD build Apple's nav bar still says Playground — never two titles.
     pagehead.js un-hides the band (flex !important) only once the new build's
     bridge is there and the bar is gone. */
  body.native .app-header { display: none; }
  .panel { background: #fff; border: 1px solid #e3dcd1; border-radius: 6px; padding: 12px; margin-bottom: 18px; }
  /* THE STYLE PICKER IS A DROP-DOWN, not a row of tiles (Aug 2026, Sophie:
     "make the tiles at the top like dreamy, etc. into a drop-down so I don't
     see all the tiles I just see the selected one and an arrow that shows
     it's a drop-down"). One control showing the style she is on, with a
     chevron so it reads as a menu; the other five are behind the tap.
     It is a NATIVE <select> on purpose — iOS opens its own picker, it is the
     same control the quality field beside it already uses, and it needs no
     open/close state of its own to go wrong. The chevron is a flat SVG data
     URI — never a gradient. 16px, or iOS zooms the page when it opens the
     picker.
     IT IS NOT FILLED DARK ANY MORE (Aug 2026, Sophie: "make the selected style
     dropdown not filled in w black (just white, even tho it's selected)"). It
     was painted like the old lit tile, on the reasoning that the selected style
     should read as chosen — but there is only ever ONE style picker on the row,
     so there is nothing for it to read as chosen AGAINST, and a solid black
     slab was the heaviest thing on a page of pale controls. The INK BORDER
     stays: it is what still separates the one control that decides the run
     from the pale `.stylebtn` neighbours. */
  .styles { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  #stylepick { appearance: none; -webkit-appearance: none; border: 1px solid #2b2622; border-radius: 6px;
    padding: 8px 32px 8px 12px; font: inherit; font-size: 16px; background-color: #fdfcf9; color: #2b2622;
    background-image: url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232b2622' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m6 9 6 6 6-6'/%3E%3C/svg%3E");
    background-repeat: no-repeat; background-position: right 9px center; background-size: 15px 15px; }
  .stylebtn { border: 1px solid #d8d0c4; border-radius: 6px; padding: 0 12px; font: inherit; font-size: 13.5px; background: #fdfcf9; color: #6f675e; }
  .stylebtn.on { background: #2b2622; color: #faf7f2; border-color: #2b2622; }
  /* Inputs stay at 16px — anything smaller makes iOS zoom the page on focus. */
  textarea { width: 100%; min-height: 64px; border: 1px solid #d8d0c4; border-radius: 6px; padding: 9px; font: inherit; font-size: 16px; background: #fdfcf9; resize: vertical; }
  /* THE BIGGER BOX (2026-08-25, Sophie: "can you put a button so I can see the
     prompt in a bigger box as an option"). A long dictated prompt shows ~3
     lines in the compact box; the corner button toggles the SAME textarea to
     just over half the screen — never a second field, so nothing has to be
     synced back. A rounded square at the house 6px (never a circle), sitting
     INSIDE the box's bottom-RIGHT corner on the box's own paper so it reads
     over any text beneath it; the textarea reserves that corner with
     padding-bottom so the last line of her words is never under the button.

     ON THE RIGHT, SLID CLEAR OF THE PILL'S COLUMN (2026-08-26, two rounds).
     Sophie asked for the right side back after the one-day move to
     bottom-left ("put it back exactly where it was"), then reported the
     exact corner untappable ("i was able to click it before … now i cant") —
     and it is, measured: at 390x844 with the iPhone 13's real 47px safe-area
     inset the injected autoscroll pill's ▼ (#vbot, x 325-373 / y 153-206)
     sits dead on the corner spot (x 333-359 / y 164-190), so a tap there
     reaches the pill. A z-index lift is NOT the fix — measured, it puts the
     button over #vbot's own centre and kills the pill's scroll-down instead.
     So `right: 56px`: still the right end of the box, clear of the pill's
     50px column plus margin at 390pt AND at 320pt, both controls tappable at
     every scroll position. Don't slide it back into the corner, and don't
     move it off the right side — both are hers.

     THE BIG BOX FITS THE WORDS (2026-08-27, Sophie: "why not expand based on
     text, not static"). It was a flat 52vh whatever was in it — an empty half
     under two lines, and still scrolling under a long dictation — so the size
     said nothing about what was in it. `.big` is the CAP now, never the
     height: the height is measured off the content on the tap, on every
     keystroke while it is open, and on a resize. The FLOOR is what keeps the
     button worth tapping on an empty box — this is a field she WRITES in, so
     "expand" has to mean room to write before the words exist; that is the
     difference from the `.moretxt` opener, which only ever reveals text that
     is already there and so may hide itself. Both bounds are CSS, so the
     browser clamps the inline height and no `vh` is re-derived in script. */
  /* THE BOX DOES NOT SIT ON THE BUTTONS (2026-08-26, Sophie: "there was no
     padding between the buttons and the bottom of the text prompt box").
     Measured: `.styles` gives the box 10px of air ABOVE it and `.promptwrap`
     carried no margin at all, so `.controls` started at the textarea's exact
     bottom edge — gap 0 — and the box's bottom line and the first row of
     buttons drew as one seam. The same 10px the picker already uses, so the
     card has one rhythm rather than a number picked per gap. */
  .promptwrap { position: relative; margin-bottom: 10px; }
  .promptwrap textarea { display: block; box-sizing: border-box; padding-bottom: 34px; }
  #prompt.big { min-height: 24vh; max-height: 52vh; }
  #bigprompt { position: absolute; right: 56px; bottom: 6px; width: 26px; height: 26px;
    display: flex; align-items: center; justify-content: center; padding: 0; margin: 0;
    border: 1px solid #d8d0c4; border-radius: 6px; background: #fdfcf9; color: #6f675e; cursor: pointer; }
  #bigprompt svg { width: 14px; height: 14px; }
  /* WRAPS (Aug 2026): the row gained a Prompt button and a canvas toggle, and
     on a 390pt phone flex squeezed the toggle to 50px — "Portrait" bled out of
     its box and the Square half was clipped off the row entirely, which is why
     Sophie couldn't find it ("I don't know how to change it from portrait to
     square"). Wrapping to a second line is the fix; `flex: none` on the two
     segmented groups is what stops flex shrinking them below their words in
     the first place. */
  /* ONE HEIGHT FOR THE WHOLE ROW (Aug 2026, Sophie: "the prompt button seems to
     be taller than the other buttons … can you tell me why all the buttons
     aren't the same height or sizing? Do they have different padding? If so,
     can you make them all have lower padding").
     They did: every control had grown its own padding AND its own font-size,
     so each one worked out a different height — Prompt 8px/13.5px was the
     tallest, No text 6px/12.5px the shortest, the canvas halves 9px/11px, the
     ladders 7px, and Generate a flat 38. Height is set ONCE here now and the
     padding is horizontal only, so nothing can drift again: a control that
     wants to be on this row takes --ctl-h and centres its contents.
     AND THE OUTLINES ARE INK (her ask, same message: "some of them have like
     gray or gold outlines. Can you make them black outlines instead") — the
     warm #d8d0c4 reads gold on her phone. It is --ctl-line here so the row has
     one answer; the rest of the page keeps its own softer borders, which are
     boxes around content rather than buttons. */
  .controls { --ctl-h: 34px; --ctl-line: #2b2622;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .controls label { font-size: 12.5px; color: #6f675e; }
  /* Every boxed control on the row, in one place. */
  /* `#stylepick` LIVES IN `.styles`, NOT IN THE ROW, so a `.controls
     #stylepick` selector never matched it and it stood 35px tall beside a row
     of 34s (Aug 2026, measured, after "they're all different sizes"). It is
     addressed by its own id here; the rest are genuinely in the row. */
  #stylepick,
  .controls .stylebtn, .controls .xthree,
  .controls .canvastog, .controls .tri, .controls #charpick,
  .controls #photopick, .controls .seedbtn, .controls button.go {
    height: 34px; box-sizing: border-box; }
  .controls .stylebtn, .controls .xthree {
    display: inline-flex; align-items: center; padding-top: 0; padding-bottom: 0; }
  #stylepick { padding-top: 0; padding-bottom: 0; }
  .controls .stylebtn, .controls .xthree, .controls .canvastog,
  .controls #charpick, .controls #photopick, .controls .seedbtn { border-color: var(--ctl-line); }
  .xthree { border: 1px solid #d8d0c4; border-radius: 6px; padding: 0 10px; font: inherit; font-size: 14px; font-weight: 600; background: #fdfcf9; color: #2b2622; }
  /* The quality LADDERS: one tap that draws the same prompt at more than one
     quality. Each wears a picture of HOW MANY and at what tier, never a word —
     the pyramid is two lows along its base and the better one filling the cap;
     the oval is medium under high, the top half filled. */
  /* NO BOX (Aug 2026, Sophie: "the oval button and the triangle button now have
     a box around them I want it back the other way no box"). They are pictures
     of what the tap draws, and a border round a drawing makes it read as a
     third bordered control between the toggles and Generate. The tap target
     keeps the row's full height — only the paint comes off. */
  .stepbtn { display: flex; align-items: center; justify-content: center;
    height: var(--ctl-h); width: 30px; padding: 0; border: 0; background: none;
    border-radius: 6px; color: #2b2622; font: inherit; }
  .stepbtn svg { width: 20px; height: 20px; display: block; }
  .stepbtn:disabled { opacity: .5; }
  /* THE LADDERS RIDE WITH GENERATE, AT THE RIGHT END (Aug 2026, Sophie: "move
     the pyramid and the oval to the right side so they're next to the generate
     button but still to the left of it"). They are all three "draw it now"
     buttons, so they are one group rather than three things that happen to
     land near each other — and it has to BE a group, because `.controls`
     wraps: `margin-left:auto` on each button separately would right-align
     whichever ones share a line and scatter the rest. The auto margin moved
     off `.go` and onto the group for the same reason. */
  .gogroup { display: flex; align-items: center; gap: 8px; flex: none; margin-left: auto; }
  /* A ROUNDED SQUARE at the house 6px, never a circle (2026-08-24: "i prefer
     rounded squares for buttons, or plain icons, rather than circles") — it
     was the one round thing in a row of 6px boxes. */
  .seedbtn { width: var(--ctl-h); border-radius: 6px; border: 1px solid #d8d0c4; background: #fdfcf9; color: #2b2622; display: flex; align-items: center; justify-content: center; }
  .seedbtn svg { width: 19px; height: 19px; }
  .seedtag { font-size: 11.5px; color: #6f675e; }
  /* The three-way toggle is /tritoggle.css now (Aug 2026, Sophie: "make a
     reusable three toggle shell so we can change the styling all at once. make
     color a per instance option"). This page keeps only its COLOUR and its
     size — ink on paper rather than the account switcher's rose, and her own
     wider track ("make the low medium high toggle a little bit wider so it's
     easier to change it"; 26px of knob is what "4K" needs).
     ONE rule for both toggles: the stops are NUMBERED (`data-n`), so quality
     (low/medium/high) and size (1K/2K/4K) share it and neither needs a
     selector of its own. Nothing here counts the notches. */
  /* PAPER WITH A BLACK LINE, like every other control on the row (Aug 2026,
     Sophie: "the buttons are styled so fucking weird. they should have black
     outlines and they're all different sizes"). They were solid ink slabs —
     the same 34px height as their neighbours, but the only things on the row
     with no line and no paper, which is what read as a different size. The
     KNOB is the dark one now, so what is lit is the stop she is on rather
     than the whole control. Colour only: the geometry is still the shell's. */
  .tri { --tri-fill: #fdfcf9; --tri-line: #2b2622; --tri-knob: #2b2622;
    --tri-ink: #faf7f2; --tri-w: 78px; --tri-k: 26px; }
  input[type=number] { width: 64px; border: 1px solid #d8d0c4; border-radius: 6px; padding: 7px; font: inherit; font-size: 16px; background: #fdfcf9; }
  /* Generate is the stars icon, not the word — one image, one tap. SQUARE
     since Aug 2026 (Sophie: "make the generate button a square"): 38x38, the
     same box the seed button already is, so the three buttons at the right end
     of the row read as one set of taps rather than one wide slab beside two
     small ones. The 6px radius stays — the house rule is rounded rectangles,
     and sharp corners here would be the only ones on the page. */
  button.go { width: var(--ctl-h); padding: 0; background: #2b2622; color: #faf7f2; border: 0; border-radius: 6px; font: inherit; display: flex; align-items: center; justify-content: center; }
  button.go svg { width: 21px; height: 21px; display: block; }
  button.go:disabled { opacity: .5; }
  .err { font-size: 12.5px; color: #a33; margin-top: 8px; }
  /* One box per run, so a prompt is unmistakably attached to its own pictures. */
  .run { margin-bottom: 14px; background: #fff; border: 1px solid #e3dcd1; border-radius: 6px; padding: 10px; }
  .runhead { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
  .runhead .p { display: block; font-size: 14px; font-weight: 600; flex: 1; min-width: 70%;
    --lh: 20px; --lines: 2; line-height: var(--lh); }
  /* THE OPENER SITS ON THE LAST LINE OF THE WORDS, NOT OFF TO THE SIDE (Aug
     2026, Sophie: "Button should be part of the text, not separated from it on
     the side"). She asked for this once before, on the dream cards ("I want
     the see more button to be on the same last line of the text rather than
     underneath it"), and this is that solution ported — see `.dbody` in
     dreamapp.html.
     `-webkit-line-clamp` cannot hold a control: anything inside the box after
     the cut is clipped away with the text, which is why the opener used to be
     a SIBLING and ended up parked at the far end of the header row. So the
     clamp is a plain max-height, and the button is a right float with
     `clear:both` sitting below a zero-width float one line SHORT of the cap —
     the only line it can land on is the last one, and the words wrap around
     it. Both floats come BEFORE the text in DOM order, so neither is "after
     the clamped text" and neither is clipped.
     `fold` is added by JS and ONLY where the words really were cut: the
     ::before float would otherwise stretch a one-line prompt (overflow:hidden
     makes this a BFC) to the full two-line height. */
  .runhead .p.clamp { max-height: calc(var(--lines) * var(--lh)); overflow: hidden; }
  .runhead .p.clamp.fold::before { content: ''; float: left; width: 0;
    height: calc((var(--lines) - 1) * var(--lh)); }
  .runhead .p > .moretxt { float: right; clear: both; margin-left: 8px; height: var(--lh);
    display: inline-flex; align-items: baseline; }
  .runhead .p:not(.clamp) > .moretxt { float: none; margin-left: 6px; }
  /* THE HOUSE OPENER FOR TRUNCATED TEXT — a underlined word, never a button
     (Aug 2026, Sophie: "the ... button for longer than two line prompt is
     huge … truncated text shud always just be a … with a line under it that
     links to open, or it can say more or see more. never a separate button.
     it shud be fixed everywhere"). The full pattern is in
     docs/design-rules.md.
     IT WAS ALREADY WRITTEN THAT WAY AND LOST A NAME FIGHT: this rule used to
     be `.morebtn`, borderless and correct — and `.morebtn` is ALSO the
     "Older" paging button further down this file, 1px border and 9x18 of
     padding, defined later, so the later rule won and the opener rendered as
     a big empty box. Two unrelated controls must never share a class name.
     `.moretxt` is the opener; `.morebtn` stays the paging button. */
  .moretxt { display: inline; border: 0; background: none; margin: 0; padding: 0;
    font: inherit; font-size: 12.5px; color: #6f675e; text-decoration: underline;
    -webkit-tap-highlight-color: transparent; }
  .tag { font-size: 11px; color: #6f675e; background: #f0ebe3; border-radius: 6px; padding: 2px 6px; white-space: nowrap; }
  /* `minmax(0, 1fr)` and `align-items: start`, both load-bearing now that a
     cell carries its own shape: a bare `1fr` is `minmax(auto, 1fr)`, and a
     square cell's automatic minimum width is TRANSFERRED from the row's
     height through its aspect-ratio — so one square on a row of portraits
     blew its own column out to 132px and squeezed the other three to 73
     (measured). `start` keeps a shorter cell its own height instead of
     stretching it to the tallest on the row. */
  /* HOW MANY PICTURES ACROSS is ONE number, `--cols` on the root, read by
     BOTH grids — a run's own row of pictures in list view and the tile wall.
     Three or four, tapped on the number segment of the view switch (Aug 2026,
     Sophie: "add a 3 to a row vs. 4 to a row toggle"). One variable rather
     than two rules, so the two surfaces can never disagree about what "3 to
     a row" means. */
  .grid { display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); align-items: start; gap: 5px; }
  /* Two ways to read the feed: LIST (a box per run, prompt above its pictures)
     and TILES (every picture as a thumbnail, four to a row, prompt in the
     lightbox). The switch is STICKY so it is reachable from anywhere in a long
     feed — the first version scrolled away and left no way back — and it sits
     on the LEFT because the autoscroll pill owns the top-right corner. Its
     z-index stays BELOW the pill's 9 (the house pattern — /writing and
     /editor do the same at 5): at 20 the bar's paper background painted over
     the pill's top button. Full-screen overlays (lightbox, ask, toast) stay
     ABOVE 9 — they are meant to cover the pill. */
  .feedbar { position: sticky; top: 0; z-index: 5; display: flex; padding: 8px 56px 8px 0; background: #faf7f2; }
  .viewtog { display: flex; border: 1px solid #d8d0c4; border-radius: 6px; overflow: hidden; background: #fdfcf9; }
  /* 11px side padding, not the old 15 — the row gained the columns segment
     (2026-08-25) and the search box's own placeholder is what pays for any
     slack here; measured at 390pt, 15px clipped "Search" to a third. */
  .viewtog button { border: 0; background: none; font: inherit; font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: #6f675e; padding: 7px 11px; }
  .viewtog button + button { border-left: 1px solid #d8d0c4; }
  .viewtog button.on { background: #2b2622; color: #faf7f2; font-weight: 600; }
  /* THE TWO MARK FILTERS, one segmented box beside the view switch — neither
     is a third view: each rides on top of whichever view she is already in,
     and both are sticky, so a reload keeps them.
       ♥ = hearts only.
       ✕ = hide the ones she crossed out (Aug 2026, Sophie: "can u also add a
           button next to the heart that hides anything i've 'exed'").
     They share one border for the reason the List/Tiles pair does — they are
     one kind of decision — and that is also what pays for the second button:
     the row reserves 56px for the injected autoscroll pill, and two separate
     38px boxes with their own margins left the search box at 80px, clipping
     its own placeholder to "Searc" (measured). One box of two 34px buttons
     gives it back.
     LIT, THEY MUST NOT MATCH: the heart keeps only what it names and the ✕
     drops it, so the ✕ takes the GREY of the dislike badge rather than the
     rose. Two identical-looking filters read as two of the same thing. */
  .filttog { margin-left: 8px; display: flex; flex: none; border: 1px solid #d8d0c4;
    border-radius: 6px; overflow: hidden; background: #fdfcf9; }
  .likefilt { display: flex; align-items: center; justify-content: center; width: 34px;
    border: 0; background: none; color: #6f675e; padding: 0; }
  .likefilt + .likefilt { border-left: 1px solid #d8d0c4; }
  .likefilt svg { width: 16px; height: 16px; }
  .likefilt.on { background: #c25a72; color: #fff; }
  .xfilt.on { background: #9a938a; color: #fff; }
  /* The sheets view lit in INK, not the rose and not the grey — it is a mode
     (what the cells ARE), not a like/dislike filter, and three chips in one
     box lighting two colours would read as three of one kind. */
  .sheetfilt.on { background: #2b2622; color: #fff; }
  /* The story box: one tall field, never a grid cell's shape. */
  #panelgrid textarea[data-story] { aspect-ratio: auto; min-height: 120px; }
  /* THE SEARCH BOX FILLS THE GAP THE ROW ALREADY HAD (Aug 2026, Sophie: "a
     little search bar that fits in the space between the heart toggle and
     tiles/grid") — `flex: 1` between the heart and the 56px the autoscroll
     pill owns, so nothing moved to make room for it and the row still fits on
     one line. `min-width: 0` on both the box and the input or the flex item
     refuses to shrink below the input's default size and pushes the row wide.
     16px is a FLOOR, not a taste: iOS auto-zooms a focused input under 16px,
     that zoom ignores `user-scalable=no` (which this page sets), and pinching
     back out is then blocked — one tap would leave the whole page stuck
     zoomed (found live on her phone on /assets, Aug 2026). */
  .feedsearch { flex: 1; min-width: 0; margin-left: 8px; position: relative; display: flex; }
  /* The right padding reserves room for the ✕, which only exists once there
     are words to wipe — so an EMPTY box keeps the 19px for its own
     placeholder (2026-08-25, when the columns segment joined the view switch
     and the row got tight). `.hasq` is toggled beside `qclear.hidden`. */
  .feedsearch input { width: 100%; min-width: 0; font: inherit; font-size: 16px; color: #2b2622;
    background: #fdfcf9; border: 1px solid #d8d0c4; border-radius: 6px; padding: 6px 9px; }
  .feedsearch input.hasq { padding-right: 28px; }
  .feedsearch input:focus { outline: none; border-color: #c25a72; }
  .feedsearch input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
  /* CLEAR, not dismiss: it empties the box and keeps her in it. Shown only
     while there are words to wipe. */
  .qclear { position: absolute; right: 0; top: 0; height: 100%; width: 28px; border: 0; background: none;
    color: #8a8177; font-size: 18px; line-height: 1; padding: 0; }
  /* THREE OR FOUR ACROSS — the THIRD SEGMENT of the view switch (2026-08-25,
     Sophie: "the 3/4 switch button is in a weird place. It should not be in
     the auto scroll roll row"). Its two earlier homes are both retired by her:
     beside the search box it cost the row 38px it did not have, and the
     pill's rail — her own suggestion at the time — floats over the prompt
     card on her phone, so the button read as detached from everything. How
     many across is a VIEW decision, so it rides in the List/Tiles box as one
     more segment: List · Tiles · 3. It never wears `.on` — it is not a third
     view, and a lit number beside the lit view would read as two answers.
     IT SAYS THE NUMBER — "3" or "4" (her earlier correction; at this size a
     bar-count picture is a grey smudge). Two states, so a tap is the only
     move there is — the house no-cycling rule is about a three-way toggle
     with stops to aim at; with two there is nowhere else a tap could mean. */
  .viewtog .colseg { font-weight: 600; font-size: 13px; letter-spacing: 0; padding: 7px 12px; min-width: 34px; box-sizing: border-box; }
  .emptynote { font-size: 13px; color: #8a8177; padding: 18px 0; text-align: center; }
  #tiles .emptynote { grid-column: 1 / -1; }
  /* Tiles: THREE to a row by default (Aug 2026, her ask — four was too small
     to judge a picture by once they stopped being cropped squares), and HERS
     to switch since the columns button landed beside the search box — the
     count is `--cols`, shared with the list view's own rows. Tapping a tile
     opens the lightbox, which is where the prompt, model and quality live.
     EVERY TILE WEARS ITS OWN PICTURE'S SHAPE (Aug 2026, Sophie: "i kind of
     want the playground to show portrait aspect ratios to match my 2:3
     pictures"). The wall used to force 1:1 and `object-fit: cover` did the
     rest — so a 2:3 picture, which is nearly everything she draws here, lost
     a third of itself to a crop on the one screen meant for scanning them.
     The ratio rides on the cell as `--ar`, written from the run's own
     `aspectRatio`, so a square run still tiles square and the two shapes sit
     on the same wall as what they are. */
  #tiles { display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); align-items: start; gap: 5px; }
  /* A picture still being drawn holds its place at the front of the wall, so
     the tiles view shows the whole feed and not just what has landed. It
     breathes, because a flat empty box in a wall of pictures reads as a
     broken image rather than as one on its way. */
  #tiles .cell.ph { animation: plwait 1.5s ease-in-out infinite; }
  @keyframes plwait { 0%, 100% { background: #f0ebe3; } 50% { background: #e4dbcd; } }
  .copybtn { flex: none; width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center;
    padding: 0; border: none; background: none; color: #8a8177; cursor: pointer; }
  .copybtn svg { width: 14px; height: 14px; }
  .cell { position: relative; }
  /* `--ar` is the run's real canvas; 2/3 is the fallback for a run with no
     ratio on file, which is what every run before the canvas toggle was. */
  .cell img { width: 100%; aspect-ratio: var(--ar, 2 / 3); object-fit: cover; border-radius: 6px; display: block; background: #eee7dc; }
  .badge { position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .badge.like { background: #c25a72; color: #fff; }
  .badge.dislike { background: #9a938a; color: #fff; }
  .badge svg { width: 12px; height: 12px; }
  /* A run being drawn looks like the run it will become — same head, same
     grid — with an empty slot per picture that fills in as they land. Pressing
     Generate therefore always adds something visible at the TOP, which is what
     keeps "newest first" true while a slow run is still going. */
  .runhead .waiting { margin-left: auto; }
  .cell.ph { background: #f0ebe3; border: 1px solid #e3dcd1; border-radius: 6px; aspect-ratio: var(--ar, 2 / 3); }
  /* "Older" — the way further back through the feed. Hugs its text, rounded
     rectangle (no pills), centered under whichever view is showing. */
  #more { display: flex; justify-content: center; padding: 4px 0 22px; }
  .morebtn { border: 1px solid #d8d0c4; border-radius: 6px; padding: 9px 18px; font: inherit; font-size: 14px; background: #fdfcf9; color: #6f675e; }
  .morebtn[disabled] { opacity: .55; }
  .killbtn { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 1px solid #d8d0c4; background: #fdfcf9; color: #6f675e; display: flex; align-items: center; justify-content: center; }
  .killbtn svg { width: 14px; height: 14px; }
  /* Cancel confirmation. Flat, no gradients; buttons are rounded rectangles. */
  #ask { display: none; position: fixed; inset: 0; background: rgba(20,18,16,.55); z-index: 60; align-items: center; justify-content: center; padding: 24px; }
  #ask.on { display: flex; }
  .askbox { background: #faf7f2; border: 1px solid #e3dcd1; border-radius: 6px; padding: 16px; max-width: 320px; width: 100%; }
  .askbox p { font-size: 14.5px; color: #2b2622; margin-bottom: 4px; font-weight: 600; }
  .askbox .fine { font-size: 12px; color: #6f675e; margin-bottom: 14px; }
  .askrow { display: flex; gap: 8px; }
  .askrow button { flex: 1; border-radius: 6px; padding: 10px; font: inherit; font-size: 14px; border: 1px solid #d8d0c4; background: #fdfcf9; color: #2b2622; }
  .askrow button.yes { background: #2b2622; color: #faf7f2; border-color: #2b2622; font-weight: 600; }
  .failed { color: #a33; }
  .note { font-size: 12px; color: #8a8177; }
  /* THE LIGHTBOX IS THE SHARED ONE — asset-lightbox.js (2026-08-26, Sophie:
     "it should be the exact same design — can it not be the same exact
     code?"). This page kept the LAST hand copy in the house and it drifted
     every time a chat fixed one surface and not the other, so every rule
     about how it looks lives in that ONE file now. Nothing here may style
     #clightbox. */
  /* Above the shared lightbox (z-index 30) — Save's answer lives in there. */
  #toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); background: #2b2622; color: #faf7f2; font-size: 13.5px; border-radius: 6px; padding: 9px 14px; z-index: 70; opacity: 0; pointer-events: none; transition: opacity .18s; max-width: 84vw; text-align: center; }
  #toast.on { opacity: 1; }
  /* The Sophie character toggle (ChatGPT style only): her picture as the
     button — dim = off, lit = the second reference rides along. */
  #charpick { flex: none; width: var(--ctl-h); padding: 0; border: 1.5px solid #d8d0c4; border-radius: 6px;
    overflow: hidden; background: #fdfcf9; opacity: .4; cursor: pointer; }
  #charpick img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #charpick.on { opacity: 1; border-color: #2b2622; }
  /* HER OWN PHOTO REFERENCE (Aug 2026, Sophie: "could you add a little file
     icon so I can upload a photo reference"). Empty = the file glyph; once a
     photo is picked the button wears the photo itself, exactly the way the
     Sophie card does, and the small x on its corner takes it back off. It is
     ONE photo per run, not a library — the Playground's recipe is fixed per
     style so a run stays comparable to the last one. */
  #photowrap { position: relative; flex: none; display: none; }
  #photowrap.on { display: block; }
  #photopick { display: block; width: var(--ctl-h); padding: 0; border: 1.5px solid #d8d0c4;
    border-radius: 6px; overflow: hidden; background: #fdfcf9; color: #6f675e; cursor: pointer; }
  #photopick svg { width: 17px; height: 17px; display: block; margin: 0 auto; }
  #photopick img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #photowrap.has #photopick { border-color: #2b2622; }
  #photoclear { display: none; position: absolute; top: -6px; right: -6px; width: 17px; height: 17px;
    padding: 0; border: 1px solid #d8d0c4; border-radius: 50%; background: #faf7f2; color: #2b2622;
    cursor: pointer; }
  #photoclear svg { width: 11px; height: 11px; display: block; margin: 0 auto; }
  #photowrap.has #photoclear { display: block; }
  /* What the photo adds to the prompt, shown whenever one is attached — the
     house rule that anything added to her words is disclosed word for word. */
  #promptpanel .added { font-size: 12px; color: #6f675e; line-height: 1.4;
    border-left: 2px solid #2b2622; padding: 2px 0 2px 8px; margin: 4px 0 0; }
  /* Arrived from the Scratch Pad (?from=scratchpad): a way back, top-left. */
  #backchip { display: none; position: fixed; top: 12px; left: 12px; z-index: 80; align-items: center;
    font-size: 13px; color: #2b2622; text-decoration: none; background: #faf7f2; border: 1px solid #d8d0c4;
    border-radius: 6px; padding: 7px 11px; }
  #backchip.on { display: flex; }
  /* Arrived from an image's "open in the Playground": whether this tile really
     carries the reference and style prompt that picture was made with. Flat,
     no gradient, 6px like every other box on the page. It is NOT a text field
     — a status line the page writes, so it says something rather than naming a
     box. Repainted on every style tap: the claim is about the tile SHE is on
     now, not the one she arrived on. */
  #reftag { display: none; margin: 0 0 8px; font-size: 12px; line-height: 1.35;
    border: 1px solid #d8d0c4; border-radius: 6px; padding: 7px 10px;
    background: #fdfcf9; color: #6f675e; }
  #reftag.on { display: block; }
  #reftag.same { border-color: #2b2622; color: #2b2622; }
  /* Arrived from a Story Room BEAT: what a run made here is going to do
     (?pad=&beat=). It is a status line the page writes, not a control — the
     landing is a side effect and a side effect she cannot see is a trap. */
  #beattag { display: none; margin: 0 0 8px; font-size: 12px; line-height: 1.35;
    border: 1px solid #2b2622; border-radius: 6px; padding: 7px 10px;
    background: #fdfcf9; color: #2b2622; }
  #beattag.on { display: block; }
  /* ── THE CHARACTER PICKER (2026-08-27, Sophie: "a little button in the
     playground right next to where it says dreamy, make sure it's the same
     style, with a character icon that shows the five most recent characters
     that were put and then also the rest of the sheet and characters with a
     search").
     THE BUTTON sits in `.styles` beside the style picker — not in `.controls`
     below it — because that is the row she named, and it wears the picker's
     own ink border at the same 34px so the two read as one pair. Lit and
     filled when a cast is riding, with the COUNT on it: a reference she has
     forgotten she picked is paid input tokens and a face she did not ask for,
     so the button never stays quiet about it. */
  #charsbtn { flex: none; display: inline-flex; align-items: center; gap: 5px;
    height: 34px; box-sizing: border-box; padding: 0 10px; border: 1px solid #2b2622;
    border-radius: 6px; background: #fdfcf9; color: #2b2622; font: inherit; font-size: 13px;
    cursor: pointer; }
  #charsbtn svg { width: 17px; height: 17px; display: block; }
  #charsbtn.on { background: #2b2622; color: #faf7f2; }
  #charsn:empty { display: none; }
  /* THE SHEET opens under the style row like the Prompt panel, and is the
     same flat 6px box — one shape for "a panel this row opened". */
  #charpanel { display: none; margin: 0 0 8px; border: 1px solid #d8d0c4; border-radius: 6px;
    background: #fdfcf9; padding: 10px; }
  #charpanel.on { display: block; }
  #charpanel .plab { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase;
    color: #9a9186; margin: 0 0 6px; }
  #charpanel .plab + .plab, #charpanel .chargrid + .plab { margin-top: 12px; }
  /* Her five most recent run ACROSS, one row, so the ones she reaches for are
     never behind a scroll. The rest wrap into a grid under the search.
     BOTH ROWS END BEFORE THE PILL'S COLUMN. The sheet opens near the top of
     the page, which is exactly where the injected autoscroll pill is fixed —
     measured, its `Fast` label sat on the FIFTH recent card, and with her
     phone's 47px safe-area inset the pill rides lower still and covers that
     card's middle. So `--charpill` is a MEASURED reservation (fitCharPill),
     never a hardcoded band: the pill is conditional and its top follows the
     inset. It goes on the two CARD rows rather than on the panel, so the
     panel keeps the width of everything else on screen and the two rows stay
     aligned with each other. */
  .charrow { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px;
    padding-right: var(--charpill, 0px); }
  .chargrid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px;
    padding-right: var(--charpill, 0px);
    max-height: 40vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  /* A card is the face and the NAME a prompt calls them by — the name is not
     decoration here, it is the word she has to type into her prompt for the
     reference to mean anything, so it is never cropped away. */
  .charcard { display: block; width: 100%; padding: 0; border: 1px solid #d8d0c4; border-radius: 6px;
    background: #fff; color: #2b2622; font: inherit; text-align: center; cursor: pointer;
    overflow: hidden; -webkit-tap-highlight-color: transparent; }
  .charcard img { display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover; background: #f0ece5; }
  .charcard .nm { display: block; font-size: 11px; line-height: 1.25; padding: 3px 3px 4px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .charcard.on { border-color: #2b2622; box-shadow: inset 0 0 0 2px #2b2622; }
  .charcard.on .nm { background: #2b2622; color: #faf7f2; }
  /* 16px or iOS zooms the page on focus — every box she types into. */
  #charq { width: 100%; box-sizing: border-box; font: inherit; font-size: 16px; color: #2b2622;
    background: #fff; border: 1px solid #d8d0c4; border-radius: 6px; padding: 7px 9px; margin: 0 0 8px; }
  #charpanel .cnote { font-size: 11.5px; color: #9a9186; margin: 8px 0 0; }
  /* The PROMPT panel — what is wrapped around her words, and editable (Aug
     2026, Sophie). Opens under the style row, above her box, because that is
     where the wrapping happens. Flat, 6px, no gradient like everything else. */
  #promptpanel { display: none; margin: 0 0 8px; border: 1px solid #d8d0c4; border-radius: 6px;
    background: #fdfcf9; padding: 10px; }
  #promptpanel.on { display: block; }
  #promptpanel .plab { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase;
    color: #9a9186; margin: 0 0 4px; }
  #promptpanel .plab + .plab { margin-top: 10px; }
  /* 16px minimum on anything she types into — under that iOS auto-zooms on
     focus and user-scalable=no then blocks pinching back out. */
  #promptpanel textarea { width: 100%; box-sizing: border-box; font: inherit; font-size: 16px;
    line-height: 1.4; color: #2b2622; background: #fff; border: 1px solid #d8d0c4;
    border-radius: 6px; padding: 8px; resize: vertical; min-height: 66px; }
  #promptpanel .yours { font-size: 12px; color: #6f675e; font-style: italic;
    border-left: 2px solid #d8d0c4; padding: 2px 0 2px 8px; margin: 4px 0 0; }
  #promptpanel .prow { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  #promptpanel .prow button { border: 1px solid #d8d0c4; border-radius: 6px; background: #fdfcf9;
    color: #6f675e; font: inherit; font-size: 12.5px; padding: 6px 10px; cursor: pointer; }
  #promptpanel .pnote { font-size: 11.5px; color: #9a9186; margin-left: auto; text-align: right; }
  /* The id, not a `.promptbtn` class: the shared lightbox injects a global
     `.promptbtn` for ITS Prompt door, and the class on this control-row
     button let that style land on it. */
  #promptbtn { flex: none; }
  #promptbtn.edited { border-color: #2b2622; color: #2b2622; }
  /* The no-text toggle — one button, dark when it is on (Aug 2026, Sophie).
     Only the styles whose tail allows text ever show it. */
  .notextbtn { flex: none; font-size: 12.5px; padding: 0 10px; cursor: pointer; }
  .notextbtn.on { background: #2b2622; color: #faf7f2; border-color: #2b2622; }
  #promptpanel .swapped { font-size: 11.5px; color: #6f675e; font-style: italic; margin: 4px 0 0; }
  /* The canvas toggle — portrait or square. Two segments, no pill. */
  .canvastog { display: flex; flex: none; border: 1px solid #d8d0c4; border-radius: 6px; overflow: hidden; }
  .canvastog button { flex: none; white-space: nowrap; border: none; background: #fdfcf9;
    color: #6f675e; font: inherit; font-size: 12.5px; padding: 0 11px; margin: 0; cursor: pointer; }
  .canvastog button + button { border-left: 1px solid var(--ctl-line); }
  .canvastog button.on { background: #2b2622; color: #faf7f2; }
  /* PICTURE · PANELS — the house hairline tab row (.acctabs pattern, this
     page's own copy like every page keeps). The right padding is the injected
     autoscroll pill's reserved column. The line is measured by tabLine(). */
  .plabtabs { position: relative; display: flex; border-bottom: 1px solid #d8d0c4;
    margin: 0 0 10px; padding-right: 64px; }
  .plabtabs button { flex: none; border: none; background: none; cursor: pointer;
    font-family: inherit; font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    color: #6f675e; padding: 7px 12px 9px; margin: 0; -webkit-tap-highlight-color: transparent; }
  .plabtabs button.on { color: #2b2622; }
  .plabtabs::after { content: ''; position: absolute; left: 0; bottom: -1px; height: 2px;
    width: var(--tw, 0); background: #2b2622; transform: translateX(var(--tx, 0)); }
  .plabtabs.tl::after { transition: transform .2s ease, width .2s ease; }
  /* THE BOXES ARE THE GRID — she writes into the layout she gets back. Each
     box wears the CELL's shape (2:3 or 1:1, following the canvas toggle) with
     a floor so a 3-across box still fits a dictated sentence. Boxes ship
     EMPTY; the placeholder only NAMES the cell ("top left"). 16px or iOS
     zooms the page on focus. */
  #panelgrid { display: grid; gap: 6px; margin: 0 0 4px; }
  #panelgrid textarea { width: 100%; box-sizing: border-box; border: 1px solid #d8d0c4;
    border-radius: 6px; background: #fdfcf9; color: inherit; font: inherit; font-size: 16px;
    padding: 8px; resize: none; min-height: 64px; aspect-ratio: var(--pcell, 2 / 3); }
</style></head><body>
<a id="backchip" href="/scratchpad">&lsaquo; Scratch Pad</a>
<header class="app-header"><h1>Playground</h1></header>

<div class="panel">
  <div class="plabtabs" id="plabtabs">
    <button type="button" id="t-picture" class="on">Picture</button>
    <button type="button" id="t-panels">Panels</button>
  </div>
  <div class="styles"><select id="stylepick" aria-label="Style"></select><button type="button" id="charsbtn" hidden aria-label="Character references" title="Character references"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 21a8 8 0 0 0-16 0"/><circle cx="10" cy="8" r="5"/><path d="M22 20c0-3.37-2-6.5-4-8a5 5 0 0 0-.45-8.3"/></svg><span id="charsn"></span></button></div>
  <div id="charpanel">
    <div class="plab">Most recent</div>
    <div class="charrow" id="charrecent"></div>
    <div class="plab" id="charalllab">All characters</div>
    <input id="charq" type="search" placeholder="Search characters" aria-label="Search characters"
           autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="search">
    <div class="chargrid" id="charall"></div>
    <div class="cnote" id="charnote"></div>
  </div>
  <div id="reftag"></div>
  <div id="beattag"></div>
  <div id="promptpanel"></div>
  <div class="promptwrap"><textarea id="prompt"></textarea><button type="button" id="bigprompt" aria-label="Bigger box" title="Bigger box"></button></div>
  <div id="panelgrid" hidden></div>
  <div class="controls">
    <div class="canvastog" id="gridpick" role="group" aria-label="How many panels" hidden></div>
    <label id="scalewrap">LoRA scale <input type="number" id="scale" value="1" step="0.1" min="0" max="2"></label>
    <button class="xthree" id="xthree" title="Run at scale 1, 1.2 and 1.4">&times;3</button>
    <button class="seedbtn" id="seedbtn" aria-label="Next seed"></button>
    <span class="seedtag" id="seedtag"></span>
    <button id="charpick" hidden aria-label="Draw Sophie from her reference" title="Sophie character reference"><img src="https://storage.googleapis.com/deckfactory-43176.firebasestorage.app/promptlab/1785884140714-d37oym.webp" alt="Sophie"></button>
    <span id="photowrap"><button id="photopick" type="button" aria-label="Attach a photo reference" title="Attach a photo reference"></button><button id="photoclear" type="button" aria-label="Take the photo reference off" title="Take the photo reference off"></button></span>
    <input type="file" id="photofile" accept="image/*" hidden>
    <button class="stylebtn" id="promptbtn" title="What is wrapped around your words">Prompt</button>
    <button class="stylebtn notextbtn" id="notextbtn" hidden aria-pressed="false" title="Ask for no text at all in the picture">No text</button>
    <div class="canvastog" id="canvastog" role="group" aria-label="Canvas shape">

    </div>

    <div class="gogroup">
      <button class="stepbtn" id="lowmed" hidden aria-label="Two low and one medium" title="Two low and one medium"></button>
      <button class="stepbtn" id="medhigh" hidden aria-label="One medium and one high" title="One medium and one high"></button>

  </div>
  <div class="err" id="err" hidden></div>
</div>

<div class="feedbar">
  <div class="viewtog">
    <button id="v-list">List</button><button id="v-tiles">Tiles</button><button class="colseg" id="v-cols"></button>
  </div>

    <button class="likefilt xfilt" id="v-hidex" aria-label="Hide the ones you have crossed out" title="Hide the &times;'d"></button>
    <button class="likefilt sheetfilt" id="v-sheets" hidden aria-label="Just the finished sheets, uncut" title="Just the finished sheets, uncut"></button>
  </div>

    <input id="q" type="search" placeholder="Search" aria-label="Search your runs"
           autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="search">

  </div>
</div>
<div id="pendings"></div>
<div id="runs"></div>
<div id="tiles"></div>
<div id="more"></div>

<div id="toast"></div>

<div id="ask">
  <div class="askbox">
    <p>Are you sure you want to cancel?</p>
    <div class="fine" id="askfine"></div>
    <div class="askrow">
      <button id="askno">Keep going</button>
      <button class="yes" id="askyes">Cancel it</button>
    </div>
  </div>
</div>

<script>
  // THE AIM RULE LIVES IN /tritoggle.js — the ONE copy, shared with every other
  // three-way toggle. This line is only a floor for the case where that file
  // does not load (a stale cache, a stub harness that serves nothing else): it
  // is the pre-2026-08-24 CYCLE, deliberately not a second implementation of
  // the aim, so a page can never quietly grow its own version of the rule.
  var triNext = window.triNext || function (el, count, ev, cur) {
    return ((cur | 0) + 1 + count) % count;
  };
  var LSKEY = 'promptlab_pending';
  var timer = null;
  var swapTimer = null;
  var swapping = {};      // id -> true while a 'ready' run waits for permanent urls
  var runsById = {};      // id -> run doc, for the lightbox / copy button
  // The feed pages BACKWARDS THROUGH TIME, and holds everything loaded so far.
  // It used to be the newest 40 and nothing else — so a run older than that was

  // THE BIGGER PROMPT BOX (2026-08-25, Sophie: "can you put a button so I can
  // see the prompt in a bigger box as an option"). One textarea, two sizes —
  // the corner button toggles `.big` on #prompt and swaps its own glyph.
  // Deliberately NOT sticky: the compact box is the page's shape, and the big
  // one is a moment of reading a long dictation. Any hand-dragged resize
  // (desktop) is cleared on the toggle so shrinking back actually shrinks.
  //
  // AND THE BIG BOX FITS THE WORDS (2026-08-27, Sophie: "why not expand based
  // on text, not static"). `fitBig` measures the content and sets the height to
  // it; `.big`'s min/max-height clamp the result, so both bounds live in the
  // CSS and nothing re-derives a `vh` here. It runs on the tap, on every
  // keystroke while the box is open (so it grows under a dictation as she
  // speaks) and on a resize — a rotation changes what `vh` means.
  //   `height:auto` FIRST is what makes the measurement honest: scrollHeight of
  // a box already sized to its old height reports that height, so measuring
  // without the reset can only ever grow the box, never shrink it back when she
  // deletes a paragraph. The border is added back because the box is
  // `border-box` and scrollHeight excludes borders — without it every fit is
  // two pixels short and the box scrolls its own last line.
  //   `window.__fitBigPrompt` is what `copyPromptIn` calls: putting a prompt
  // back in the box sets `.value` directly, which fires no `input` event, so
  // without it the run she just copied would sit in a box fitted to whatever
  // was there before.
  (function () {
    var btn = document.getElementById('bigprompt');
    var box = document.getElementById('prompt');
    function fitBig() {
      if (!box.classList.contains('big')) return;
      box.style.height = 'auto';
      box.style.height = (box.scrollHeight + (box.offsetHeight - box.clientHeight)) + 'px';
    }
    function paint() {
      var big = box.classList.contains('big');
      btn.innerHTML = big ? ICONS.minimize : ICONS.maximize;
      btn.setAttribute('aria-label', big ? 'Back to the small box' : 'Bigger box');
      btn.title = big ? 'Back to the small box' : 'Bigger box';
    }
    btn.addEventListener('click', function () {
      box.classList.toggle('big');
      box.style.height = '';
      fitBig();
      paint();
    });
    box.addEventListener('input', fitBig);
    window.addEventListener('resize', fitBig);
    window.__fitBigPrompt = fitBig;
    paint();
  })();

  // THREE OR FOUR ACROSS (Aug 2026, Sophie: "add a 3 to a row vs. 4 to a row
  // toggle to the right of search in playground. square button that cycles
  // between 3 and 4"). ONE number, `--cols` on the root, so the tile wall and
  // a run's own row of pictures in list view can never disagree about it —
  // and the button is therefore never dead in either view. Sticky, like the
  // view and the two filters; three is the default, which is where the wall
  // already stood.
  var COLS = [3, 4];
  function curCols() {
    var n = parseInt(localStorage.getItem('promptlab_cols'), 10);
    return COLS.indexOf(n) >= 0 ? n : 3;
  }
  function applyCols() {
    var n = curCols(), next = COLS[(COLS.indexOf(n) + 1) % COLS.length];
    document.documentElement.style.setProperty('--cols', String(n));
    var b = document.getElementById('v-cols');
    b.textContent = String(n);
    b.setAttribute('aria-label', n + ' pictures a row — tap for ' + next);
    b.title = n + ' a row';

  // Sophie: "the 3/4 switch button is in a weird place. It should not be in
  // the auto scroll roll row"). The pill's rail was its previous home and she

  // decision, so it sits in the List/Tiles box — which also deletes the whole
  // measure-the-rail machinery (placeCols and its observers) that placing a
  // fixed guest under the pill required.
  document.getElementById('v-cols').addEventListener('click', function () {
    var n = COLS[(COLS.indexOf(curCols()) + 1) % COLS.length];
    try { localStorage.setItem('promptlab_cols', String(n)); } catch (e) { /* private mode */ }
    applyCols();
  });

  // ─── SEARCH (Aug 2026, Sophie: "can u add a little search bar that fits in
  // the space between the heart toggle (next to tiles/grid)") ──────────────
  // The shape WORD a run is searchable by — the twin of server.js's own
  // PL_SHAPE_WORD, pinned equal by scripts/test-playground-panels.js.
  var PL_SHAPE_WORD = { '2:3': 'portrait', '1:1': 'square', '3:2': 'landscape' };
  // It filters the feed by RUN — her words are a run's, not a picture's — so
  // in list view whole boxes drop out and in tiles every picture from a
  // matching run stays on the wall. It stacks with the heart the same way the
  // view does: search narrows which runs, the heart which pictures.
  //
  // NOT sticky, unlike the view and the heart: a query she typed yesterday
  // silently hiding most of the feed on open is a worse surprise than
  // re-typing four letters.
  var query = '';        // exactly what she typed
  var qGroups = [];      // parsed — the house grammar
  var hits = null;       // the server's answer for `query`; null until it lands
  var qSeq = 0, qTimer = null;

  // The house grammar (search-grammar.js parses it server-side): bare words
  // AND within one run, `OR` for either, `-word` to exclude, "quoted" for a
  // phrase. Matching is the feed's rule — each term anchored at a word START,
  // so "aries" never finds "boundaries" and `gpt-image-2` keeps its hyphens —
  // the same regexes /assets builds, so the client filter and the server
  // search can never disagree about what matches.
  var qparse = window.FeedKit.qparse;
  var qmatch = window.FeedKit.qmatch;
  // Everything a run's card actually says: her words, the style it was drawn
  // in, and the tags beside them — so "dreamy", "medium", "square", "photo
  // ref" and "failed" all find what she is looking at.
  function runHay(r) {
    // The canvas is stored and shown as a ratio, but the button she picked it
    // with says Portrait or Square — so both words find it. (The server's own
    // haystack, promptlabHay in server.js, is the same list.)
    var shape = PL_SHAPE_WORD[r.aspectRatio] || '';
    return [r.prompt, runStyleLabel(r), r.gptStyle, r.model, r.quality, r.aspectRatio, shape,
      r.status === 'failed' ? 'failed' : '', r.status === 'cancelled' ? 'cancelled' : '',
      r.photoRef ? 'photo ref' : '']
      // A panels run: every panel's own words plus the grid by name, exactly
      // as the server's promptlabHay lists them — the two haystacks must
      // never disagree or the view changes under her a beat after she types.
      .concat(r.panels || [])
      .concat([r.grid && r.grid.count ? 'panels ' + r.grid.across + 'x' + r.grid.down : '',
        r.storySheet ? 'story sheet' : ''])
      .filter(Boolean).join('  ');
  }
  function pendHay(p) {
    return [p.prompt, p.style, p.quality].filter(Boolean).join('  ');
  }
  // ─── THE GALLERY IS SEPARATE PER TAB (2026-08-27, Sophie: "separate the
  // gallery for playground for single pics vs panels") ─────────────────────
  // The PICTURE · PANELS tab already separates the making; the feed under it
  // now follows: Picture shows single-pic runs, Panels shows panels runs —
  // pendings, list, tiles, search and the lightbox walk all scoped the same
  // way, because they all come through visibleRuns/pendingKept. runIsPanels
  // is the twin of server.js's plRunIsPanels (pinned by
  // scripts/test-playground-panels.js): a failed panels run still carries
  // `panels`, so it stays in the panels gallery where its retry belongs.
  function runIsPanels(r) {
    return !!(r.grid && r.grid.count) || !!(r.panels && r.panels.length) || !!r.storySheet;
  }
  // A pending entry stores its grid as a NUMBER (the run doc grows the object
  // when the sheet is cut) — truthy is the whole test.
  function pendIsPanels(p) { return !!p.grid; }
  function tabKeepsRun(r) { return runIsPanels(r) === onPanels(); }
  function pendingKept() {
    return pendingList().filter(function (p) { return pendIsPanels(p) === onPanels(); });
  }
  // What the feed shows: everything ON THIS TAB, the server's answer, or —
  // while that is still in flight — the same filter run over what is already
  // loaded. The tab filter runs over the server's hits too: a stale answer
  // from before a tab switch can land, and it must not leak the other
  // gallery's runs into this one.
  function visibleRuns() {
    var mine = (qGroups.length && hits ? hits : feed).filter(tabKeepsRun);
    if (!qGroups.length) return mine;
    if (hits) return mine;
    return mine.filter(function (r) { return qmatch(runHay(r), qGroups); });
  }
  function emptyNote() {
    if (qGroups.length) return '<div class="emptynote">Nothing matches that</div>';
    if (sheetsMode()) return '<div class="emptynote">No sheets yet</div>';
    if (likedOnly()) return '<div class="emptynote">Nothing hearted yet</div>';
    if (hideX()) return '<div class="emptynote">Everything here is crossed out</div>';
    return onPanels() ? '<div class="emptynote">No panels yet</div>' : '';
  }

  // A SEARCH READS THE WHOLE FEED, NOT THE PAGE SHE IS LOOKING AT — the
  // Assets tab's lesson (Aug 2026: she searched "yarn" and got nothing back,
  // because the box only ever filtered the tiles already loaded). This feed
  // pages 40 at a time, so a client-only filter would answer "nothing matches"
  // for almost every run she has ever made. The client filter still runs
  // instantly over what is on screen; a beat later the server answers over the
  // whole collection and the feed becomes those runs.
  function runSearch() {
    var seq = ++qSeq, want = query;
    if (!want) { hits = null; return; }
    // The search is scoped to THIS tab's gallery server-side too — the 300
    // cap must never hide a panels hit behind three hundred single ones.
    fetch('/api/promptlab?q=' + encodeURIComponent(want) + '&limit=300&kind=' + (onPanels() ? 'panels' : 'single'))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (seq !== qSeq) return;                       // she typed on; this answer is stale
        var runs = (d.runs || []).filter(function (r) { return r.status !== 'running'; });
        // The lightbox and the copy button read runsById, and a hit may be an
        // older run the feed itself has never paged in.
        runs.forEach(function (r) { runsById[r.id] = r; });
        hits = runs;
        renderFeed();
      })
      .catch(function () { /* the client-filtered view stands */ });
  }
  function readSearch() {
    var box = document.getElementById('q');
    query = (box.value || '').trim();
    qGroups = qparse(query);
    document.getElementById('qclear').hidden = !query;
    box.classList.toggle('hasq', !!box.value);          // the ✕'s padding, only while it shows
    hits = null;                                        // the loaded feed answers meanwhile
    clearTimeout(qTimer);
    if (query) qTimer = setTimeout(runSearch, 350);

  var qLive = liveInput(document.getElementById('q'), readSearch);
  // `qLive.sync()` inside it: the blur Return performs would otherwise be
  // liveInput's first sight of dictated text and would search a second time.
  enterSubmits(document.getElementById('q'), function () { readSearch(); qLive.sync(); });
  document.getElementById('qclear').addEventListener('click', function () {
    var box = document.getElementById('q');
    box.value = ''; qLive.sync(); readSearch(); box.focus();
  });

  // ── PUTTING A PROMPT BACK ALSO PUTS ITS PHOTO BACK (2026-08-27, Sophie:
  //    "playground and other image tools shud save the reference photo and
  //    reload when copy to prompt box") ─────────────────────────────────────
  //
  // The server has always SAVED her photo reference — `photoRef` on the run
  // doc is the Storage url it was uploaded to, and the whole doc rides the
  // feed — but nothing on the page ever read it back, so a run drawn with a
  // photo could not be re-run with the same photo: the bytes existed and were
  // unreachable. Copying the prompt back now restores the photo that drew it.
  //
  // THE RULE IS "ONLY CHANGE WHAT THE RECORD KNOWS", and each of the three
  // answers matters:
  //   a url on the record  -> attach it (a re-run is the same request again),
  //   a record with none   -> CLEAR whatever is attached (a panels run, a LoRA
  //                           run, or a picture she drew with nothing on it —
  //                           leaving a photo attached would put an ingredient
  //                           into the next run that this one never had),
  //   no record at all     -> leave it alone, because nothing here knows.
  //
  // The restored `data` is that url, not a dataURL. Both readers take it: the
  // thumbnail is an <img src>, and the run POSTs `photo` as-is — server.js
  // already accepts an https url there and fetches the bytes back, so nothing
  // is re-uploaded and the run's own record points at the same object.
  //
  // This does NOT persist across loads. That rule is untouched and is hers:
  // a photo attached last week silently riding today's run is the hidden
  // ingredient the Prompt panel exists to prevent. Her tap on a copy button
  // is the opposite of silent — the thumbnail appears in the row as she does
  // it, and the Prompt panel's photo line comes back with it.
  function restorePhoto(r) {
    if (!r) return;                                   // nothing known — leave it
    var url = r.photoRef ? String(r.photoRef) : '';
    if (!/^https?:\/\//.test(url)) {
      if (!photoRef) return;
      photoRef = null;
      document.getElementById('photofile').value = '';
      paintPhoto();
      return;
    }
    if (photoRef && photoRef.data === url) return;    // already the one
    photoRef = { data: url, name: (url.split('/').pop() || '').split('?')[0] };
    document.getElementById('photofile').value = '';
    paintPhoto();
  }

  // The copy button beside a run's words: puts that prompt back into the box.
  function copyPromptIn(text) {
    var box = document.getElementById('prompt');
    box.value = text || '';
    // Setting `.value` fires no `input` event, so the big box has to be told.
    if (window.__fitBigPrompt) window.__fitBigPrompt();

    window.scrollTo({ top: 0, behavior: 'smooth' });
    toast('Prompt is back in the box');

  // A PANELS run's copy button refills the panel BOXES — switching to the
  // Panels tab, its grid, and her words in their cells — because that is the
  // box those words came out of. Falls back to the one box only when the
  // page has nothing to rebuild the grid from.
  function copyPanelsIn(r) {
    if (!r || !r.panels || !r.grid || !PANELS_CFG || !PANELS_CFG.grids[r.grid.count]) {
      copyPromptIn(r && r.prompt);
      restorePhoto(r);
      return;
    }
    // A panels run never carries a photo (the button is off on that tab), so
    // its record answers "none" and the restore CLEARS one that is attached —
    // the same rule everywhere, and the honest one here.
    restorePhoto(r);
    savePanelTexts(r.grid.count, r.panels.slice());
    try { localStorage.setItem(GRIDKEY, String(r.grid.count)); } catch (e) { /* private mode */ }
    setTab('panels');
    window.scrollTo({ top: 0, behavior: 'smooth' });
    toast('Panels are back in the boxes');
  }
  // A STORY run's copy button refills the STORY box — its words came out of
  // it, the same reasoning as copyPanelsIn.
  function copyStoryIn(r) {
    try { localStorage.setItem(STORYTEXTKEY, String(r.prompt || '')); } catch (e) { /* private mode */ }
    try { localStorage.setItem(GRIDKEY, 'story'); } catch (e) { /* private mode */ }
    restorePhoto(r);          // a story run never carries one → clears, honestly
    setTab('panels');
    window.scrollTo({ top: 0, behavior: 'smooth' });
    toast('The story is back in the box');
  }
  function copyRunIn(r) {
    if (r && r.storySheet) copyStoryIn(r);

  // ONE PICTURE'S WORDS GO IN THE ONE BOX (2026-08-27, Sophie: "pressing the
  // playground button on images made by panels should copy text into the

  // panel, so its put-back is that panel's own words on the PICTURE tab — a

  // grid (copyPanelsIn), because that card IS the run and those boxes are
  // where its words came from; this is the per-PICTURE control, and the two

  function copyPictureIn(r, i) {
    var panel = (r && r.panels && r.panels.length && i != null) ? r.panels[i] : null;
    if (panel == null) { copyRunIn(r); return; }

  }
  document.getElementById('seedbtn').innerHTML = ICONS.sprout;

  // up one — it only SETS the seed, Generate still fires the run. Persisted so
  // a reload keeps the seed you were on; the little number keeps it visible.
  function curSeed() {
    var s = parseInt(localStorage.getItem('promptlab_seed') || '85', 10);
    return Number.isFinite(s) ? s : 85;

  function showSeed() { document.getElementById('seedtag').textContent = 'seed ' + curSeed(); }
  document.getElementById('seedbtn').addEventListener('click', function () {

  showSeed();
  // The styles on offer. The server owns the real presets (trigger word,
  // baked suffix, steps); `suffix` here is the page-level tail — WTR keeps the
  // "White background" convention.
  // WTR is the one Replicate LoRA left on the picker (the Hoonie linocut tile
  // came off Aug 2026 at Sophie's ask — the model itself is untouched and
  // still serves the Test Station and the house styles, so old Hoonie runs

  // hidden; a `noCharacter` gpt style also hides the Sophie toggle (her card is

  // The KEY `watercolor` is deliberately unchanged though its label is now WTR:
  // it's what's saved in localStorage and what ?style= deep links send.
  var STYLES = {
    watercolor: { model: 'sageryza/watercolordrawings', label: 'WTR', engine: 'replicate',
                  trigger: 'wtr', suffix: 'White background', baked: '' },
    // Sandy mirror = refs/sage-sandy-mirror.png. Its KEY stays `chatgpt` and
    // its gptStyle stays `evan` (Aug 2026 rename, Sophie): both are stored —

    chatgpt:    { model: 'gpt-image-2', label: 'Sandy mirror', engine: 'gptimage', gptStyle: 'evan' },
    // ChatGPT = her words and nothing else, no reference image at all (Aug

    plain:      { model: 'gpt-image-2', label: 'ChatGPT', engine: 'gptimage', gptStyle: 'plain',
                  noCharacter: true },
    // Dreamy = refs/dream-mystery.jpg, her diary-comic page (Aug 2026). Sits
    // next to ChatGPT because those two are the references the chats actually
    // reach for; the server owns its bookended anti-content prompt.
    dreamy:     { model: 'gpt-image-2', label: 'Dreamy', engine: 'gptimage', gptStyle: 'dreamy',
                  noCharacter: true },
    scarry:     { model: 'gpt-image-2', label: 'Scarry', engine: 'gptimage', gptStyle: 'scarry',
                  noCharacter: true },
    pastel:     { model: 'gpt-image-2', label: 'Pastel', engine: 'gptimage', gptStyle: 'pastel',
                  noCharacter: true },
    hoonies:    { model: 'gpt-image-2', label: 'Hoonies', engine: 'gptimage', gptStyle: 'hoonies',
                  noCharacter: true },
  };
  // Styles retired from the picker still have runs in the feed — keep their
  // labels readable instead of falling back to the bare model id.
  var RETIRED = { 'sageryza/hoonie': 'Hoonie linocut' };
  var styleKey = localStorage.getItem('promptlab_style');

  // ── PICTURE · PANELS (Aug 2026, Sophie: "we make a picture and cut it into
  // panels … describe each panel individually. It's a way of saving money on
  // the picture") ─────────────────────────────────────────────────────────
  // The Panels tab swaps the one prompt box for N boxes laid out AS the grid
  // — she writes into the layout she gets back. The geometry (grids, cell
  // names, derived sheet canvases) is SERVED by /api/promptlab/styles and the
  // page holds no copy of it; until it answers, the tab says so instead of
  // guessing. Her words persist per grid in localStorage (her OWN text
  // restored — the one prefill the no-prewritten-text rule allows), so
  // switching 9 → 4 → 9 loses nothing.
  var PANELS_CFG = null;
  var TABKEY = 'promptlab_tab', GRIDKEY = 'promptlab_grid';
  // A grid may PIN its cell shape — the 2 option is two LANDSCAPE panels, one
  // above the other (2026-08-27, Sophie: "2 option shud be landscape in
  // panels"). The ratio is SERVED (sheet-grid.js is the one geometry), and a
  // pinned grid ignores the canvas toggle outright, so the toggle comes off
  // rather than sitting there changing nothing — the same rule the LoRA's
  // hidden knobs follow.
  function gridPin(g) {
    var m = PANELS_CFG && PANELS_CFG.grids[g];
    return (m && m.aspectRatio) || '';
  }
  function cellAr(g) {
    return gridPin(g) || (canvas === 'square' ? '1:1' : '2:3');
  }
  function canvasApplies() { return !(onPanels() && !storyMode() && gridPin(curGrid())); }
  function curTab() { return localStorage.getItem(TABKEY) === 'panels' ? 'panels' : 'picture'; }
  function onPanels() { return curTab() === 'panels'; }
  // THE STORY OPTION (2026-08-27, Sophie: "a sheet where i give instructions
  // for a story, and have the image model decide the exact panels") — a
  // fourth stop on the grid picker. She writes the STORY in one box and the
  // MODEL lays out the page; there is no grid, so the sheet is delivered
  // uncut. `curGrid()` deliberately keeps answering a real grid (its callers
  // are grid math); everything story-shaped asks storyMode() first.
  function storyMode() { return onPanels() && localStorage.getItem(GRIDKEY) === 'story'; }
  function curGrid() {
    var g = parseInt(localStorage.getItem(GRIDKEY), 10);
    return (PANELS_CFG && PANELS_CFG.grids[g]) ? g : 4;
  }
  var STORYTEXTKEY = 'promptlab_story';
  function storyText() { return localStorage.getItem(STORYTEXTKEY) || ''; }
  function panelTexts(g) {
    try {
      var a = JSON.parse(localStorage.getItem('promptlab_panels_' + g) || '[]');
      return Array.isArray(a) ? a : [];
    } catch (e) { return []; }
  }
  function savePanelTexts(g, arr) {
    try { localStorage.setItem('promptlab_panels_' + g, JSON.stringify(arr)); } catch (e) { /* private mode */ }
  }
  function panelVals() {
    return Array.prototype.map.call(document.querySelectorAll('#panelgrid textarea'),
      function (t) { return t.value; });
  }
  // The measured underline — chats.html's tabLine, this page's copy (the rows
  // measure their own line; nothing declares a tab count).
  function plTabLine() {
    var row = document.getElementById('plabtabs');
    var on = row.querySelector('button.on');
    if (!on) return;
    var r = row.getBoundingClientRect(), t = on.getBoundingClientRect();
    if (!t.width) return;
    row.style.setProperty('--tw', t.width + 'px');
    row.style.setProperty('--tx', (t.left - r.left - row.clientLeft) + 'px');
    if (!row.__tl) { row.__tl = 1; requestAnimationFrame(function () { row.classList.add('tl'); }); }
  }
  function buildPanelGrid() {
    var box = document.getElementById('panelgrid');
    if (!onPanels()) { box.hidden = true; return; }
    box.hidden = false;
    if (!PANELS_CFG) { box.style.display = 'block'; box.innerHTML = '<div class="emptynote">Loading…</div>'; return; }
    // STORY: one tall box for the whole story — her words persist like the
    // panel texts, so switching 9 → Story → 9 loses nothing either way. The
    // placeholder NAMES the field and nothing more (the house rule).
    if (storyMode()) {
      box.style.display = 'block';
      box.innerHTML = '';
      var st = document.createElement('textarea');
      st.setAttribute('data-story', '1');
      st.placeholder = 'The story';
      st.value = storyText();
      st.addEventListener('input', function () {
        try { localStorage.setItem(STORYTEXTKEY, st.value); } catch (e) { /* private mode */ }
      });
      box.appendChild(st);
      return;
    }
    var g = curGrid(), meta = PANELS_CFG.grids[g];
    box.style.display = 'grid';
    box.style.gridTemplateColumns = 'repeat(' + meta.across + ', 1fr)';
    // The boxes wear the CELL's shape: the grid's own when it PINS one (the 2
    // option is landscape), else the canvas toggle's.
    box.style.setProperty('--pcell', arCss(cellAr(g)));
    var saved = panelTexts(g);
    box.innerHTML = '';
    for (var i = 0; i < meta.count; i++) {
      var t = document.createElement('textarea');
      t.setAttribute('data-panel', String(i));
      // The placeholder NAMES the cell and nothing more (the house rule).
      t.placeholder = meta.positions[i] || ('panel ' + (i + 1));
      t.value = saved[i] || '';
      t.addEventListener('input', stashPanels);
      box.appendChild(t);
    }
  }
  function stashPanels() {
    if (!PANELS_CFG) return;

  }
  function paintGridPick() {
    var el = document.getElementById('gridpick');
    el.hidden = !onPanels();
    if (!PANELS_CFG || !onPanels()) { el.innerHTML = ''; return; }
    var g = curGrid(), story = storyMode();
    el.innerHTML = Object.keys(PANELS_CFG.grids).map(function (k) {
      return '<button type="button" data-grid="' + k + '"'
        + (!story && Number(k) === g ? ' class="on"' : '') + '>' + k + '</button>';
    }).join('')
      // The fourth stop: the model decides the panels. A word, not a number,
      // because the number is exactly what she is not choosing.
      + '<button type="button" data-grid="story"' + (story ? ' class="on"' : '')
      + ' title="You write the story; the model decides the panels">Story</button>';
  }
  document.getElementById('gridpick').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-grid]');
    if (!b) return;
    try { localStorage.setItem(GRIDKEY, b.getAttribute('data-grid')); } catch (err) { /* private mode */ }
    // paintCanvas too: Story ↔ a grid moves what the toggle DECIDES (the
    // sheet itself vs each cell), so the titles must move with it.
    paintGridPick(); buildPanelGrid(); syncControls(); paintCanvas(); paintRes(); paintPromptPanel();
  });
  // GENERATE on the Panels tab: every box must hold words — the error names
  // how many are still empty rather than a generic refusal. One sheet, one
  // run; the pending card holds N breathing placeholders in the cell shape.
  function goPanels() {
    var err = document.getElementById('err');
    err.hidden = true;
    if (!PANELS_CFG) { err.textContent = 'Still loading — one second.'; err.hidden = false; return; }
    if (storyMode()) {
      var story = (document.querySelector('#panelgrid textarea[data-story]') || {}).value || '';
      story = story.trim();
      if (!story) { err.textContent = 'Type the story first.'; err.hidden = false; return; }
      var sbtn = document.getElementById('go');
      sbtn.disabled = true;
      startStoryRun(story).catch(showErr).finally(function () { sbtn.disabled = false; });
      return;
    }
    var g = curGrid();
    var texts = panelVals().map(function (s) { return s.trim(); });
    var empty = texts.filter(function (s) { return !s; }).length;
    if (empty) {
      err.textContent = empty === texts.length ? 'Type each panel first.'
        : (empty + (empty === 1 ? ' panel still needs words.' : ' panels still need words.'));
      err.hidden = false;
      return;
    }
    var btn = document.getElementById('go');
    btn.disabled = true;
    startPanelsRun(g, texts).catch(showErr).finally(function () { btn.disabled = false; });
  }
  function startPanelsRun(g, texts) {
    var S = STYLES[styleKey];
    var over = overrideFor(styleKey);
    var joined = texts.join(' / ');
    return fetch('/api/promptlab', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        prompt: joined, model: S.model, style: S.gptStyle, panels: texts, grid: g,
        quality: quality, canvas: canvas, res: resTier,
        prefix: over ? over.prefix : undefined, suffix: over ? over.suffix : undefined,
        noText: noTextFor(styleKey),
      }),
    }).then(function (r) { return r.json(); }).then(function (d) {
      if (!d.id) throw new Error(d.error || 'Could not start.');
      var list = pendingList();
      list.push({
        id: d.id, prompt: joined, style: S.label, engine: 'gptimage',
        // N placeholders in the CELL's shape — the wall must not re-flow
        // when the cut panels land.
        count: (PANELS_CFG.grids[g] || {}).count || g, quality: quality,
        ar: cellAr(g), grid: g,
      });
      setPending(list); renderPendings(); startPolling();
    });
  }
  // A story run is a single picture on the sheet's own canvas — the toggle's
  // shape at the tier — with `story: true` telling the server to wrap her
  // words in the served story line and swap the tail's anti-grid clause.
  function startStoryRun(story) {
    var S = STYLES[styleKey];
    var over = overrideFor(styleKey);
    return fetch('/api/promptlab', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        prompt: story, model: S.model, style: S.gptStyle, story: true,
        quality: quality, canvas: canvas, res: resTier,
        prefix: over ? over.prefix : undefined, suffix: over ? over.suffix : undefined,
        noText: noTextFor(styleKey),
      }),
    }).then(function (r) { return r.json(); }).then(function (d) {
      if (!d.id) throw new Error(d.error || 'Could not start.');
      var list = pendingList();
      list.push({
        id: d.id, prompt: story, style: S.label, engine: 'gptimage',
        count: 1, quality: quality,
        ar: canvas === 'square' ? '1:1' : '2:3', grid: 'story',
      });
      setPending(list); renderPendings(); startPolling();
    });
  }
  function setTab(t) {
    try { localStorage.setItem(TABKEY, t); } catch (e) { /* private mode */ }
    // The LoRA has one output size and no attachment slot — a sheet needs
    // gpt-image-2, so the Panels tab hops off WTR onto Sandy mirror.
    if (t === 'panels' && !isGpt(styleKey)) setStyle('chatgpt');

  function syncTab() {
    var panels = onPanels();

    document.getElementById('t-panels').classList.toggle('on', panels);
    plTabLine();
    renderStyles(); syncControls(); buildPanelGrid(); paintGridPick();
    paintPromptPanel(); paintCanvas(); paintRes();
    // The gallery under the tab follows it — each tab shows its own runs
    // (2026-08-27, Sophie: "separate the gallery for playground for single

    // time it opens, and a live search re-asks scoped to the new tab. The
    // Sheets chip lives on the panels tab only.
    paintFiltRow();
