<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>dreams</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,600&family=Courier+Prime&display=swap" rel="stylesheet">
<style>
  /* Baveuse (Typodermic freeware) self-hosted — the wordmark must not hang on
     a third-party font CDN. */
  @font-face { font-family:'Baveuse'; font-style:normal; font-weight:400;
               src:url('/fonts/baveuse.woff') format('woff'); }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden] { display:none !important; }
  /* ── the melt feed (direction 2a, Claude Designs canvas Aug 2026) ──
     Ported EXACTLY from docs/dream-feed-designs/Dream Feed Prototype.dc.html —
     values are the artboard's, not inventions. The ink/cream/brown palette:
       #ece7dc app cream · #f4f0e5 card cream · #14131a ink (and the dark card)
       #7a4a3a brown accent · #dcd6c8 the desk the phone sits on (desktop only)
     The same-color alpha fades on the header/footer and the hatched
     illustration placeholders are the artboard's own; they are not the color
     gradients the no-gradients rule bans. */
  :root {
    --cream:#ece7dc; --card:#f4f0e5; --ink:#14131a; --brown:#7a4a3a; --desk:#dcd6c8;
  }
  @keyframes wobble{0%,100%{transform:rotate(-.6deg) skewX(-.4deg)}50%{transform:rotate(.7deg) skewX(.5deg)}}
  @keyframes breathe{0%,100%{border-radius:14px 60px 18px 46px/40px 16px 52px 18px}50%{border-radius:52px 16px 44px 20px/18px 48px 16px 42px}}
  @keyframes blob{0%,100%{border-radius:60% 40% 55% 45%/45% 55% 40% 60%}50%{border-radius:45% 55% 40% 60%/60% 40% 55% 45%}}
  /* the blob's own radii are percentages, which on a full-width picture melt it
     into a lozenge and eat the corners of a comic page — open, the morph keeps
     going in PIXELS so the picture stays readable. */
  @keyframes blobopen{0%,100%{border-radius:42px 26px 38px 30px/30px 40px 26px 44px}50%{border-radius:26px 44px 28px 40px/44px 26px 42px 28px}}
  @keyframes rise{from{opacity:0;transform:translateY(30px) rotate(1.2deg)}to{opacity:1;transform:none}}
  @keyframes inkpulse{0%,100%{opacity:.45}50%{opacity:1}}
  @keyframes sheetup{from{transform:translateY(100%)}to{transform:none}}

  body { background:var(--desk); color:var(--ink); font:15px/1.6 'EB Garamond', Georgia, serif; }
  .phone { max-width:480px; margin:0 auto; background:var(--cream); min-height:100vh; min-height:100dvh; }

  header { position:sticky; top:0; z-index:5; padding:22px 24px 12px;
           display:flex; justify-content:space-between; align-items:baseline;
           background:linear-gradient(var(--cream) 70%, rgba(236,231,220,0)); }
  .mark { font:28px 'Baveuse', sans-serif; color:var(--ink); letter-spacing:.5px; }
  .hright { display:flex; gap:14px; align-items:baseline; }
  .fnow { font:11px 'Courier Prime', monospace; color:var(--brown); }
  /* the one control not on the artboard: the way into your private dreams —
     the vault screen replaces it in the sharing-flow phase */
  .hmine { background:none; border:none; cursor:pointer; font:11px 'Courier Prime', monospace;
           color:rgba(20,19,26,.45); padding:0; }

  main { padding:0 18px 110px; }
  #scr-feed { display:flex; flex-direction:column; gap:22px; padding-top:8px; }

  /* ── cards ── */
  .dcard { border:2px solid var(--ink); padding:16px; background:var(--card); color:var(--ink);
           animation:rise both, breathe var(--dur,9s) ease-in-out infinite, wobble 7s ease-in-out infinite;
           animation-timeline:view(), auto, auto; animation-range:entry 0% entry 45%, normal, normal; }
  .dcard.dark { background:var(--ink); color:var(--cream); }
  .drow { display:flex; gap:12px; align-items:stretch; }
  .drow.rev { flex-direction:row-reverse; }
  .blob { flex:1; aspect-ratio:1/1; align-self:flex-start; border:1.5px solid currentColor;
          animation:blob 12s ease-in-out infinite; display:flex; align-items:center; justify-content:center;
          overflow:hidden; position:relative; cursor:zoom-in;
          background:repeating-linear-gradient(45deg,#e3ddcf,#e3ddcf 6px,#e9e4d6 6px,#e9e4d6 12px); }
  .dark .blob { background:repeating-linear-gradient(45deg,#221f2b,#221f2b 6px,#2a2735 6px,#2a2735 12px); }
  .blob img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .blob .empt { font:10px 'Courier Prime', monospace; opacity:.5; }
  .blob .working { font:10.5px 'Courier Prime', monospace; color:var(--brown);
                   animation:inkpulse 1.6s ease-in-out infinite; }
  .dtxt { flex:1; display:flex; flex-direction:column; gap:7px; min-width:0; }
  .dhead { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .dttl { font:600 19px/1.25 'EB Garamond', serif; }
  .dby { font:10.5px 'Courier Prime', monospace; opacity:.45; white-space:nowrap; }
  .dbody { font:400 14.5px/1.5 'EB Garamond', serif; white-space:pre-wrap;
           --lh:21.75px; --lines:6; }
  /* ── the fold sits ON the last line, never under it (Sophie: "I want the
     see more button to be on the same last line of the text rather than
     underneath it") ── -webkit-line-clamp cannot hold a button, so the clamp
     is a plain max-height and the button is a right float with `clear:both`
     sitting below a zero-width float one line SHORT of the clamp: the only
     line it can land on is the last one, and the words wrap around it.
     `fold` is set by JS and only where the words really were cut — the
     ::before float would otherwise stretch this block (overflow:hidden makes
     it a BFC) to the full clamp height on a two-line dream. */
  .dbody.clamped { max-height:calc(var(--lines) * var(--lh)); overflow:hidden; }
  .dbody.clamped.fold::before { content:''; float:left; width:0;
                                height:calc((var(--lines) - 1) * var(--lh)); }
  .dbody .dmore { float:right; clear:both; margin-left:8px;
                  height:var(--lh); display:inline-flex; align-items:flex-end; }
  .dbody.clamped .dmore::before { content:'\2026'; margin-right:5px; }
  .dmore { background:none; border:none; cursor:pointer; align-self:flex-start; padding:0;
           font:11px 'Courier Prime', monospace; color:var(--brown); }
  .dmore span { border-bottom:1px dashed currentColor; }
  .dtxt > .dmore { float:none; }
  .dark .dmore { color:var(--cream); opacity:.65; }

  /* ── opened, the picture comes up to its normal size and the words run
     UNDER it (Sophie) — the side-by-side row is the collapsed shape only, and
     a full-width read squeezed into half the card was the thing to fix. */
  .dcard.open .drow, .dcard.open .drow.rev { flex-direction:column; }
  .dcard.open .blob { flex:none; width:100%; aspect-ratio:auto; align-self:stretch;
                      animation:blobopen 12s ease-in-out infinite; }
  .dcard.open .blob img { position:static; width:100%; height:auto; display:block; }
  .dmeta { display:flex; gap:14px; font:10.5px 'Courier Prime', monospace; opacity:.55;
           margin-top:auto; padding-top:6px; }
  .dmeta span { cursor:pointer; }
  .dthread { border-top:1px dashed rgba(20,19,26,.3); margin-top:12px; padding-top:10px;
             display:flex; flex-direction:column; gap:10px; }
  .dark .dthread { border-top-color:rgba(236,231,220,.3); }
  .crow { display:flex; gap:8px; align-items:baseline; }
  .crow .who { font:10px 'Courier Prime', monospace; opacity:.4; white-space:nowrap; }
  .crow .said { font:400 13px/1.45 'EB Garamond', serif; }
  .whisper { font:11px 'Courier Prime', monospace; color:inherit; background:none;
             border:1px dashed rgba(20,19,26,.35); border-radius:14px; padding:8px 12px;
             outline:none; width:100%; }
  .dark .whisper { border-color:rgba(236,231,220,.35); }
  .whisper::placeholder { color:inherit; opacity:.45; }

  /* dividers between days, the end-of-night note */
  .fdiv { display:flex; align-items:center; gap:12px; padding:6px 4px; }
  .fdiv span.l { flex:1; border-top:1px solid var(--brown); }
  .fdiv span.t { font:11px 'Courier Prime', monospace; color:var(--brown); }
  .fend { text-align:center; font:400 16px/1.5 'EB Garamond', serif;
          color:rgba(20,19,26,.6); padding:14px 24px 4px; }

  /* the confess button */
  .confess { position:fixed; left:0; right:0; bottom:0; z-index:6; padding:14px 0 calc(24px + env(safe-area-inset-bottom));
             display:flex; justify-content:center; pointer-events:none;
             background:linear-gradient(rgba(236,231,220,0), var(--cream) 65%); }
  .confess button { pointer-events:auto; font:15px 'Courier Prime', monospace; background:var(--brown);
                    color:var(--cream); border:none; padding:14px 28px; cursor:pointer;
                    border-radius:60% 40% 55% 45%/45% 55% 40% 60%; animation:wobble 5s ease-in-out infinite; }

  /* sealed (the share-to-see gate, currently off server-side) */
  .sealwrap { position:relative; overflow:hidden; }
  .sealed { filter:blur(7px); pointer-events:none; user-select:none; display:flex; flex-direction:column; gap:22px; }
  .sealmsg { position:absolute; inset:0; z-index:2; display:flex; align-items:center; justify-content:center; }
  .sealmsg .inner { background:var(--ink); color:var(--cream); border:2px solid var(--ink);
                    border-radius:14px 60px 18px 46px/40px 16px 52px 18px; padding:24px 22px; margin:0 22px; text-align:center; }
  .sealmsg .big { font:600 17px 'EB Garamond', serif; }
  .sealmsg .sml { font:11px 'Courier Prime', monospace; opacity:.6; margin-top:6px; }
  .sealmsg button { margin-top:14px; font:13px 'Courier Prime', monospace; background:var(--brown); color:var(--cream);
                    border:none; padding:11px 20px; border-radius:60% 40% 55% 45%/45% 55% 40% 60%; cursor:pointer; }

  .quiet { font:11.5px 'Courier Prime', monospace; color:rgba(20,19,26,.5); margin-top:10px; }
  .err { font:11.5px 'Courier Prime', monospace; color:var(--brown); margin-top:10px; }

  /* ── screens NOT yet redesigned (compose, dream detail, my dreams, sign-in).
     Kept functional and re-toned to the melt palette; each gets its exact
     artboard in its own phase — the upload screen is next. ── */
  .h2 { font:600 20px 'EB Garamond', serif; color:var(--ink); margin:22px 2px 12px; }
  textarea { width:100%; background:#f4f0e5; border:1.5px solid var(--ink); border-radius:10px 18px 12px 16px;
             color:var(--ink); font:400 15px/1.5 'EB Garamond', serif; padding:12px 14px; min-height:140px;
             resize:none; outline:none; }
  .btn { display:block; width:100%; background:none; color:var(--brown); border:1px solid var(--brown);
         border-radius:6px; padding:13px 16px; font:14px 'Courier Prime', monospace; margin-top:14px; cursor:pointer; }
  .btn.sub { color:var(--ink); border-color:rgba(20,19,26,.4); }
  .btn[disabled] { opacity:.45; }
  .post { background:var(--card); border:2px solid var(--ink); color:var(--ink); padding:16px; margin-top:14px; }
  .post .ttl { font:600 19px/1.25 'EB Garamond', serif; }
  .post .meta { font:10.5px 'Courier Prime', monospace; opacity:.55; margin-top:4px; }
  .post .words { margin-top:11px; white-space:pre-wrap; font:400 14.5px/1.5 'EB Garamond', serif; }
  .post .words .part + .part { margin-top:14px; padding-top:13px; border-top:1px dashed rgba(20,19,26,.25); }
  .naming { font:11px 'Courier Prime', monospace; color:var(--brown); animation:inkpulse 1.1s infinite alternate; }
  .drawing { display:flex; align-items:center; gap:10px; margin-top:12px;
             font:11.5px 'Courier Prime', monospace; color:rgba(20,19,26,.6); }
  .pulse { width:9px; height:9px; border-radius:50%; background:var(--brown); animation:inkpulse 1s infinite alternate; }
  .skel { background:repeating-linear-gradient(45deg,#e3ddcf,#e3ddcf 6px,#e9e4d6 6px,#e9e4d6 12px);
          animation:inkpulse 1.1s infinite alternate; height:110px; border:1px solid rgba(20,19,26,.35);
          border-radius:12px 18px 10px 16px; }
  .pgrid { display:grid; grid-template-columns:repeat(3, 1fr); gap:7px; margin-top:11px; }
  .pgrid img { width:100%; display:block; border-radius:12px 18px 10px 16px; border:1px solid rgba(20,19,26,.35);
               background:#e3ddcf; cursor:zoom-in; }
  .pgrid.cover { grid-template-columns:1fr; }
  .morep { width:100%; background:none; border:none; color:rgba(20,19,26,.55); cursor:pointer;
           font:11.5px 'Courier Prime', monospace; display:flex; align-items:center; justify-content:center;
           gap:6px; padding:9px 0 0; }
  .morep.stuck { position:sticky; bottom:calc(14px + env(safe-area-inset-bottom)); z-index:4;
                 color:var(--brown); background:var(--cream); border:1px dashed var(--brown);
                 border-radius:14px; padding:9px 0; margin-top:11px; }
  .share-item { display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px dashed rgba(20,19,26,.2); }
  .share-item:last-of-type { border-bottom:none; }
  .share-item .thumb { width:34px; height:34px; border-radius:10px; object-fit:cover; flex:none; }
  .share-item .lab { font:400 14.5px 'EB Garamond', serif; }
  .share-item .st { margin-left:auto; border:1px solid rgba(20,19,26,.4); background:none; color:rgba(20,19,26,.6);
                    border-radius:14px 20px 12px 18px; padding:6px 13px; font:12px 'Courier Prime', monospace;
                    min-width:80px; cursor:pointer; }
  .share-item .st.pub { border-color:var(--brown); color:var(--brown); }
  .badge { display:inline-block; font:11px 'Courier Prime', monospace; border-radius:14px; padding:3px 8px; }
  .badge.pub { border:1px solid var(--brown); color:var(--brown); }
  .badge.priv { border:1px solid rgba(20,19,26,.3); color:rgba(20,19,26,.55); }
  .backrow { display:flex; align-items:center; gap:8px; padding:14px 0 0; }
  .backrow button { background:none; border:none; color:rgba(20,19,26,.55); display:flex; align-items:center;
                    gap:5px; font:12px 'Courier Prime', monospace; padding:4px 6px 4px 0; cursor:pointer; }
  .jitem { width:100%; text-align:left; background:var(--card); color:var(--ink);
           border:2px solid var(--ink); font:inherit; padding:15px 16px; margin-top:14px; cursor:pointer; }
  .jitem .row { display:flex; align-items:center; gap:9px; }
  .jitem .ttl { font:600 17px 'EB Garamond', serif; }
  .jitem .when { font:10.5px 'Courier Prime', monospace; opacity:.5; margin-left:auto; }
  .jitem .snip { font:400 13px/1.45 'EB Garamond', serif; opacity:.65; margin-top:4px;
                 display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .minefoot { display:flex; gap:18px; justify-content:center; padding:26px 0 10px; }
  .minefoot button { background:none; border:none; cursor:pointer; font:11px 'Courier Prime', monospace;
                     color:rgba(20,19,26,.5); border-bottom:1px dashed rgba(20,19,26,.4); padding:0; }

  /* sign-in */
  .gate { padding:70px 26px 40px; max-width:420px; margin:0 auto; }
  .gate .mark { font-size:42px; display:block; }
  .gate .sub { font:italic 400 15px 'EB Garamond', serif; color:rgba(20,19,26,.6); margin:8px 0 32px; }
  .gate input { width:100%; background:#f4f0e5; border:1px solid rgba(20,19,26,.35); border-radius:10px 18px 12px 16px;
                color:var(--ink); font:400 15px 'EB Garamond', serif; padding:13px; margin-top:10px; outline:none; }
  .gate input:focus { border-color:var(--brown); }
  .gate .rule { display:flex; align-items:center; gap:12px; color:rgba(20,19,26,.5);
                font:11px 'Courier Prime', monospace; margin:22px 0 8px; }
  .gate .rule::before, .gate .rule::after { content:''; flex:1; border-top:1px dashed rgba(20,19,26,.3); }
  .gate .swap { background:none; border:none; cursor:pointer; color:rgba(20,19,26,.55);
                font:12px 'Courier Prime', monospace; margin-top:16px; border-bottom:1px dashed rgba(20,19,26,.4); }

  /* how it works — a plain note, per the old rule */
  .howwrap { position:fixed; inset:0; z-index:45; background:rgba(20,19,26,.5);
             display:flex; align-items:center; justify-content:center; padding:20px; }
  .how { background:var(--cream); color:var(--ink); border:2px solid var(--ink); border-radius:14px; width:100%;
         max-width:400px; max-height:100%; overflow:auto; padding:22px 20px 18px;
         font:400 14px/1.55 'EB Garamond', serif; }
  .how h3 { font:600 16px 'EB Garamond', serif; margin-bottom:12px; }
  .how ol { list-style:none; counter-reset:s; }
  .how li { counter-increment:s; position:relative; padding-left:24px; margin-top:12px; }
  .how li::before { content:counter(s) '.'; position:absolute; left:0; top:0; font:11px 'Courier Prime', monospace; }
  .how .close { display:block; margin:18px auto 0; background:none; border:1px dashed var(--brown);
                color:var(--brown); border-radius:14px; padding:9px 18px;
                font:12px 'Courier Prime', monospace; cursor:pointer; }

  /* lightbox — house overlay contract: lock behind, restore scroll on close */
  .lb { position:fixed; inset:0; z-index:40; background:rgba(20,19,26,.96);
        display:flex; flex-direction:column; align-items:center; justify-content:center;
        gap:14px; padding:14px; }
  .lb img { max-width:100%; max-height:100%; display:block; }
  #lbfeat { background:none; border:1px dashed var(--cream); color:var(--cream); border-radius:14px;
            padding:9px 18px; font:12px 'Courier Prime', monospace; flex:none; cursor:pointer; }
  #lbfeat[disabled] { opacity:.5; }

  .toast { position:fixed; left:50%; bottom:108px; transform:translateX(-50%); z-index:30;
           background:var(--ink); color:var(--cream); border-radius:14px; padding:9px 18px;
           font:12px 'Courier Prime', monospace; opacity:0; transition:opacity .25s;
           pointer-events:none; white-space:nowrap; }
</style>
</head>
<body>
<div class="phone">

<div id="gate" class="gate" hidden>
  <div class="mark">dreams</div>
  <div class="sub">what did you dream last night?</div>
  <button class="btn" id="appleBtn">continue with apple</button>
  <button class="btn" id="googleBtn">continue with google</button>
  <div class="rule">or with email</div>
  <input id="email" type="email" placeholder="email" autocomplete="email">
  <input id="pw" type="password" placeholder="password" autocomplete="current-password">
  <button class="btn sub" id="emailBtn">sign in</button>
  <button class="swap" id="swapBtn">new here? create an account</button>
  <div class="err" id="gateErr" hidden></div>
</div>

<div id="app" hidden>
  <header>
    <span class="mark">dreams</span>
    <span class="hright">
      <button class="hmine" id="navMine">my dreams</button>
      <span class="fnow">tonight</span>
    </span>
  </header>
  <main>
    <section id="scr-feed"></section>
    <section id="scr-mine" hidden></section>
    <section id="scr-compose" hidden></section>
    <section id="scr-dream" hidden></section>
  </main>
  <div class="confess" id="confess"><button id="confessBtn">it&rsquo;s coming back to me&hellip;</button></div>
</div>

</div>
<div class="lb" id="lb" hidden><img id="lbimg" alt=""><button id="lbfeat" hidden></button></div>
<div class="toast" id="toast"></div>

<script>
document.addEventListener('pointerdown', function(){ if(window.__scrollStop) window.__scrollStop(); }, true);

var API = '/api/dreamapp';
var STAR = '<svg viewBox="0 0 100 100" fill="currentColor" stroke="none"><path d="M 55.8 31.9C52.8 32.3 53.9 36.4 53.2 38.5C52.5 44.4 52.0 51.0 47.3 55.3C42.9 59.9 36.4 60.6 30.4 61.3C28.2 61.9 24.2 60.8 23.9 64.0C24.4 67.0 28.4 65.9 30.6 66.6C36.5 67.4 43.0 68.0 47.3 72.6C52.0 76.9 52.5 83.5 53.3 89.4C54.0 91.5 52.7 95.5 55.8 95.9C59.0 95.6 57.9 91.6 58.5 89.4C59.4 83.5 60.0 76.9 64.6 72.6C68.8 68.0 75.4 67.3 81.2 66.5C83.4 65.8 87.4 67.0 87.9 64.0C87.7 60.8 83.6 61.9 81.5 61.2C75.5 60.5 68.9 59.9 64.6 55.2C59.9 51.0 59.3 44.5 58.5 38.5C57.9 36.4 59.0 32.2 55.8 31.9Z"/><path d="M 25.8 21.9C24.5 22.2 25.1 23.9 24.7 24.8C24.4 27.4 24.3 30.3 22.3 32.2C20.4 34.3 17.4 34.4 14.8 34.7C13.9 35.0 12.2 34.5 11.9 35.8C12.0 37.2 13.9 36.8 14.8 37.0C17.4 37.4 20.4 37.4 22.3 39.5C24.3 41.4 24.4 44.3 24.7 46.9C25.0 47.9 24.5 49.6 25.8 49.9C27.2 49.8 26.8 48.0 27.0 47.1C27.4 44.4 27.4 41.4 29.6 39.5C31.5 37.4 34.5 37.4 37.1 37.0C38.0 36.8 39.8 37.2 39.9 35.8C39.6 34.5 37.9 35.0 36.9 34.7C34.3 34.4 31.4 34.3 29.5 32.3C27.4 30.4 27.4 27.4 27.0 24.8C26.8 23.9 27.2 22.0 25.8 21.9Z"/><path d="M 47.9 4.9C47.1 5.1 47.3 6.2 47.2 6.9C47.1 8.5 46.7 10.3 45.5 11.5C44.3 12.7 42.5 13.1 40.8 13.2C40.2 13.3 39.0 13.1 38.9 14.0C39.2 14.8 40.2 14.4 40.8 14.6C42.5 14.7 44.2 15.0 45.4 16.3C46.8 17.5 47.1 19.3 47.2 21.0C47.3 21.6 47.1 22.8 47.9 22.8C48.7 22.7 48.4 21.6 48.6 21.0C48.6 19.3 49.1 17.5 50.4 16.2C51.6 15.0 53.3 14.6 55.0 14.6C55.6 14.4 56.6 14.8 56.8 14.0C56.8 13.1 55.6 13.3 55.0 13.2C53.3 13.1 51.5 12.8 50.3 11.5C49.1 10.3 48.6 8.5 48.6 6.9C48.4 6.2 48.8 5.1 47.9 4.9Z"/></svg>';
// Lucide heart + message-circle. The hand-fitted STAR above stays reserved for
// "draw it" — the one control here that spends a model call.
var HEART = '<svg class="i" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>';
var BUBBLE = '<svg class="i" viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>';
var DOWN = '<svg class="i" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>';
var UP = '<svg class="i" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></svg>';
var BACK = '<svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>';

var fbAuth = null, user = null, signUpMode = false;
var openDreamId = null, cameFrom = 'mine';

function esc(s){ var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function toast(msg){ var t = document.getElementById('toast'); t.textContent = msg;
  t.style.opacity = 1; setTimeout(function(){ t.style.opacity = 0; }, 2100); }
// "2026-08-07" -> "Friday, August 7". Built from the parts as a LOCAL date so
// the label can't slip a day (parsing the string directly reads as UTC midnight).
function dayLabel(iso){
  var p = String(iso || '').split('-');
  if (p.length !== 3) return '';
  return new Date(+p[0], +p[1] - 1, +p[2])
    .toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })
    .toLowerCase();
}
// the artboard's divider: "last night · friday, august 15"
function divLabel(k, today){
  var t = String(today || '').split('-').map(Number);
  var y = new Date(t[0], t[1] - 1, t[2]); y.setDate(y.getDate() - 1);
  var yk = y.getFullYear() + '-' + String(y.getMonth() + 1).padStart(2, '0') + '-' + String(y.getDate()).padStart(2, '0');
  return (k === yk ? 'last night \u00b7 ' : '') + dayLabel(k);
}
function ago(iso){
  var m = Math.max(1, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
  if (m < 60) return m + 'm';
  var h = Math.round(m / 60);
  if (h < 24) return h + 'h';
  return Math.round(h / 24) + 'd';
}
async function api(path, opts){
  opts = opts || {};
  var tok = await fbAuth.currentUser.getIdToken();
  opts.headers = Object.assign({ authorization: 'Bearer ' + tok }, opts.headers || {});
  if (opts.body) { opts.headers['content-type'] = 'application/json'; opts.body = JSON.stringify(opts.body); opts.method = opts.method || 'POST'; }
  var r = await fetch(API + path, opts);
  var j = await r.json();
  if (!r.ok) throw new Error(j.error || 'something went wrong');
  return j;
}

/* ── how it works ──
   Written for someone who just followed a link, so it says the two things the
   screen cannot: a dream is PRIVATE until shared, and sharing is per-piece. */
var howY = 0;
function howCard(){
  return '<div class="how">' +
    '<h3>How this works</h3><ol>' +
    '<li>Write a dream down. It saves to <b>my dreams</b>, private — nobody else can see it.</li>' +
    '<li>Tap <b>draw it</b> and it gets illustrated as comic pages. That takes a few minutes; you can leave and come back.</li>' +
    '<li>Then you choose what to share, piece by piece: your words, and each drawing on its own. Anything you leave private stays private.</li>' +
    '<li>What you share joins the day in the feed. Dreams sit under their date with no names on them.</li>' +
    '</ol>' +
    '<button class="close" data-howclose>got it</button>' +
    '</div>';
}
// The overlay keeps the lightbox's contract: stop the autoscroll, lock the page
// behind it, and put her back exactly where she was on close.
function openHow(){
  if (document.getElementById('howwrap')) return;
  howY = window.scrollY;
  if (window.__scrollStop) window.__scrollStop();
  var w = document.createElement('div');
  w.className = 'howwrap'; w.id = 'howwrap';
  w.innerHTML = howCard();
  document.body.appendChild(w);
  document.body.style.overflow = 'hidden';
  w.addEventListener('click', function(e){
    if (e.target === w || (e.target.closest && e.target.closest('[data-howclose]'))) closeHow();
  });
}
function closeHow(){
  var w = document.getElementById('howwrap');
  if (!w) return;
  w.remove();
  if (document.getElementById('lb').hidden) {
    document.body.style.overflow = '';
    window.scrollTo(0, howY);
  }
}

/* ── lightbox: a tapped panel opens big ──
   The house rule has two halves and BOTH matter: lock the page behind it, and
   remember where she was, because locking alone doesn't stop the page moving —
   she has to land back exactly where she opened it. */
var lbY = 0, lbList = [], lbIdx = 0, lbNight = null;
function lbShow(){
  var p = lbList[lbIdx];
  document.getElementById('lbimg').src = p.url;
  var btn = document.getElementById('lbfeat');
  var mine = lbNight && lbNight.mine, many = lbList.length > 1;
  var isCover = lbNight && lbNight.cover && lbNight.cover.dreamId === p.dreamId && lbNight.cover.i === p.i;
  btn.hidden = !(mine && many && !isCover);
  btn.textContent = 'feature this one';
  btn.disabled = false;
}
function openLightbox(list, idx, night){
  lbY = window.scrollY;
  if (window.__scrollStop) window.__scrollStop();
  lbList = list; lbIdx = idx || 0; lbNight = night || null;
  document.getElementById('lb').hidden = false;
  document.body.style.overflow = 'hidden';
  lbShow();
  document.getElementById('lbfeat').onclick = function(){
    var btn = this, p = lbList[lbIdx];
    btn.disabled = true;
    api('/nights/' + lbNight.id + '/cover', { body: { dreamId: p.dreamId, i: Number(p.i) } })
      .then(function(){ closeLightbox(); renderFeed(); toast('featured'); })
      .catch(function(e){ btn.disabled = false; toast(e.message); });
  };
}
function closeLightbox(){
  var lb = document.getElementById('lb');
  if (lb.hidden) return;
  lb.hidden = true;
  document.getElementById('lbimg').removeAttribute('src');
  document.getElementById('lbfeat').hidden = true;
  document.body.style.overflow = '';
  window.scrollTo(0, lbY);
}
// Delegated. A feed blob opens the night's panels (tap the picture to see the
// next); a plain grid image (the detail screen) opens itself.
document.addEventListener('click', function(e){
  if (e.target.id === 'lbfeat') return;
  if (e.target.id === 'lbimg') {
    if (lbList.length > 1) { lbIdx = (lbIdx + 1) % lbList.length; lbShow(); }
    return;
  }
  var blob = e.target.closest ? e.target.closest('.blob') : null;
  if (blob) {
    var card = blob.closest('.dcard'), n = feedNight[card.dataset.id];
    if (n && n.panels && n.panels.length) {
      var ci = 0, cov = n.cover || n.panels[0];
      n.panels.forEach(function(p, k){ if (p.dreamId === cov.dreamId && p.i === cov.i) ci = k; });
      openLightbox(n.panels, ci, n);
    }
    return;
  }
  var img = e.target.closest ? e.target.closest('.pgrid img') : null;
  if (img) { openLightbox([{ url: img.src }], 0, null); return; }
  if (e.target.closest && e.target.closest('.lb')) closeLightbox();
});
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') { closeLightbox(); closeHow(); } });

/* ── panels: three to a row; more than three folds behind "see more" ── */
/* ── the night's pictures: ONE cover, the rest behind the fold ──
   Sophie: "it only shows pictures for one and you can see the rest. People can
   decide to feature a photo if they don't like the one that's chronologically
   first, but that's the default." So the entry costs the same scroll whatever
   the night held, and the cover is a CHOICE the dreamer can make rather than an
   accident of which dream got written down first. */
// Every page, three across — the private view of your own dream.
function plainGrid(panels){
  if (!panels.length) return '';
  return '<div class="pgrid">' +
    panels.map(function(p){ return '<img src="' + p.url + '" alt="" loading="lazy">'; }).join('') +
    '</div>';
}

/* ── ONE fold, used by the words and by the extra panels ──
   `apply(open)` does the showing; `anchor` is the block being opened, so a
   close can put its top back on screen instead of leaving her stranded
   halfway down whatever she just collapsed. */
function wireFold(btn, anchor, apply, moreLabel){
  var open = false;
  function paint(){
    btn.innerHTML = open ? UP + '<span>see less</span>' : DOWN + '<span>' + moreLabel + '</span>';
    btn.classList.toggle('stuck', open);
  }
  btn.addEventListener('click', function(){
    open = !open;
    apply(open);
    paint();
    // Measure AFTER the collapse, never before. Closing a very long dream can
    // shorten the page past the scroll position the browser is holding, so it
    // CLAMPS — and a delta computed from the old layout then lands the dream
    // off the bottom of the screen. Reading the new rect and scrolling to it
    // is right whether or not the clamp bites.
    if (!open) {
      var r = anchor.getBoundingClientRect();
      if (r.top < 0 || r.top > window.innerHeight - 40) window.scrollTo(0, window.scrollY + r.top - 8);
    }
  });
  paint();
}
function wirePanels(root){
  root.querySelectorAll('[data-more]').forEach(function(btn){
    var rest = btn.parentElement.querySelector('[data-rest]');
    var anchor = btn.closest('.dream') || btn.parentElement;
    wireFold(btn, anchor, function(open){ rest.hidden = !open; }, btn.dataset.label);
  });
}

/* ── THE MELT FEED — one night is one card, exactly the 2a artboard ──
   Alternating dark cards (her alternateDark tweak, ON), the illustration in a
   breathing blob that swaps sides card by card, headline + body in EB
   Garamond, metadata a courier whisper. Dreams stay unattributed: the byline
   slot carries only the audience glyph. */
var feedNight = {};   // id -> night, for the blob lightbox

function meltCard(n, dark, rev, dur){
  var parts = (n.dreams || []).filter(function(d){ return !!d.words; });
  var words = parts.map(function(d){ return d.words; }).join('\n\n');
  var hasImg = !!(n.panels && n.panels.length);
  var cover = n.cover || (hasImg ? n.panels[0] : null);
  var blob = hasImg
    ? '<div class="blob"><img src="' + cover.url + '" alt="" loading="lazy"></div>'
    : '';
  var meta = n.mine ? '' :
    '<div class="dmeta">' +
      '<span class="likebtn' + (n.felt ? ' on' : '') + '">' + (n.felt ? '\u2665' : '\u2661') + ' ' + n.feltCount + '</span>' +
      '<span class="cmtbtn">\u270e ' + (n.commentCount || 0) + '</span>' +
    '</div>';
  return '<article class="dcard' + (dark ? ' dark' : '') + '" data-id="' + n.id + '"' +
    (n.mine ? ' data-mine="1"' : '') + ' style="--dur:' + dur + 's">' +
    '<div class="drow' + (rev ? ' rev' : '') + '">' + blob +
      '<div class="dtxt">' +
        '<div class="dhead"><span class="dttl">' + esc(n.title) + '</span><span class="dby">\u2733</span></div>' +
        (words ? '<div class="dbody clamped">' +
                   '<button class="dmore" hidden><span>see more</span></button>' + esc(words) +
                 '</div>' : '') +
        meta +
      '</div>' +
    '</div>' +
    '<div class="dthread" hidden></div>' +
  '</article>';
}

/* ── the words are cut to the PICTURE's height (Sophie: "truncate the text
   that goes next to the picture enough so that the picture and the words are
   about equal length vertically") ──
   The blob is a square of half the row, so its height is settled by layout
   alone — it does not wait on the image — and the lines that fit are whatever
   is left over once the title and the metadata row have taken their share.
   offsetHeight, never getBoundingClientRect: the card carries a wobble
   rotation and a rect would read the rotated box, a couple of px too tall.
   It also re-decides whether there is anything to fold, so it is safe to run
   again once the serif has loaded and the title may have re-wrapped. */
function fitCard(card){
  var body = card.querySelector('.dbody'), more = card.querySelector('.dmore');
  if (!body || !more || card.classList.contains('open')) return;
  var txt = card.querySelector('.dtxt'), blob = card.querySelector('.blob');
  if (blob) {
    var lh = parseFloat(getComputedStyle(body).lineHeight) || 21.75;
    var gap = parseFloat(getComputedStyle(txt).rowGap) || 0;
    var other = gap * (txt.children.length - 1);
    for (var i = 0; i < txt.children.length; i++) {
      if (txt.children[i] !== body) other += txt.children[i].offsetHeight;
    }
    var lines = Math.floor((blob.offsetHeight - other) / lh);
    body.style.setProperty('--lines', Math.max(3, Math.min(12, lines)));
  }
  var cut = body.scrollHeight - body.clientHeight > 4;
  body.classList.toggle('fold', cut);
  more.hidden = !cut;
}

function wireDreams(root){
  root.querySelectorAll('.dcard').forEach(function(card){
    var id = card.dataset.id;
    // the fold shows only where the clamp really cut the words
    var body = card.querySelector('.dbody'), more = card.querySelector('.dmore');
    if (body && more) {
      fitCard(card);
      more.addEventListener('click', function(){
        var txt = card.querySelector('.dtxt');
        var open = !card.classList.contains('open');
        card.classList.toggle('open', open);
        body.classList.toggle('clamped', !open);
        // The button lives INSIDE the words while they are cut (that is what
        // puts it on the last line) and moves out below them when they are
        // open, where a float would strand it at the top of the block.
        if (open) txt.insertBefore(more, body.nextSibling);
        else body.insertBefore(more, body.firstChild);
        more.querySelector('span').textContent = open ? 'see less' : 'see more';
        if (!open) {
          var r = card.getBoundingClientRect();
          if (r.top < 0) window.scrollTo(0, window.scrollY + r.top - 8);
        }
      });
    }
    var like = card.querySelector('.likebtn');
    if (like) like.addEventListener('click', function(){
      // POST — the old page sent a bodyless GET here, which the server never
      // routed, so the heart silently did nothing.
      api('/dreams/' + id + '/felt', { method: 'POST' }).then(function(r){
        like.textContent = (r.felt ? '\u2665' : '\u2661') + ' ' + r.feltCount;
      }).catch(function(e){ toast(e.message); });
    });
    var cmt = card.querySelector('.cmtbtn'), thread = card.querySelector('.dthread');
    if (cmt) cmt.addEventListener('click', function(){
      thread.hidden = !thread.hidden;
      if (!thread.hidden && !thread.dataset.loaded) loadComments(id, thread, cmt);
    });
  });
}

async function loadComments(id, thread, cmt){
  thread.dataset.loaded = '1';
  thread.innerHTML = '<div class="crow"><span class="said" style="opacity:.5">reading\u2026</span></div>';
  try {
    var r = await api('/dreams/' + id + '/comments');
    drawComments(r.comments, thread);
    thread.insertAdjacentHTML('beforeend',
      '<input class="whisper" placeholder="whisper back\u2026" maxlength="800" enterkeyhint="send">');
    var input = thread.querySelector('.whisper');
    input.addEventListener('keydown', async function(e){
      if (e.key !== 'Enter') return;
      var text = input.value.trim();
      if (!text) return;
      input.disabled = true;
      try {
        var res = await api('/dreams/' + id + '/comments', { body: { text: text } });
        input.value = '';
        var empty = thread.querySelector('[data-empty]');
        if (empty) empty.remove();
        input.insertAdjacentHTML('beforebegin', commentRow(res.comment));
        cmt.textContent = '\u270e ' + res.commentCount;
      } catch (err) { toast(err.message); }
      input.disabled = false;
      input.focus();
    });
  } catch (e) {
    thread.dataset.loaded = '';
    thread.innerHTML = '<div class="err">' + esc(e.message) + '</div>';
  }
}
function commentRow(c){
  return '<div class="crow"><span class="who">' + esc(c.name) + '</span>' +
    '<span class="said">' + esc(c.text) + '</span></div>';
}
function drawComments(comments, thread){
  thread.innerHTML = comments.length
    ? comments.map(commentRow).join('')
    : '<div class="crow" data-empty><span class="said" style="opacity:.5">no one has whispered yet.</span></div>';
}

/* ── views ── */
var scr = { feed: null, mine: null, compose: null, dream: null };
function go(which){
  for (var k in scr) scr[k].hidden = (k !== which);
  document.getElementById('confess').hidden = (which !== 'feed');
  var mineBtn = document.getElementById('navMine');
  mineBtn.textContent = (which === 'feed') ? 'my dreams' : 'feed';
  window.scrollTo(0, 0);
}

/* ── feed ── */
async function renderFeed(){
  var el = scr.feed;
  try {
    var f = await api('/feed');
    if (f.sealed) {
      var ghosts = '';
      for (var i = 0; i < 3; i++) {
        ghosts += '<article class="dcard' + (i % 2 ? ' dark' : '') + '"><div class="drow"><div class="dtxt">' +
          '<div class="dhead"><span class="dttl">Somewhere a Door Kept Opening</span><span class="dby">\u2733</span></div>' +
          '<div class="dbody">The stairwell went down further than the building did and everyone acted like that was normal\u2026</div>' +
          '</div></div></article>';
      }
      el.innerHTML =
        '<div class="sealwrap"><div class="sealed">' + ghosts + '</div>' +
        '<div class="sealmsg"><div class="inner">' +
        '<div class="big">' + f.count + ' dream' + (f.count === 1 ? '' : 's') + ' from last night</div>' +
        '<div class="sml">share one of yours to read them \u2014 the feed opens for the rest of the day</div>' +
        '<button id="gateGo">it\u2019s coming back to me\u2026</button>' +
        '</div></div></div>';
      document.getElementById('gateGo').addEventListener('click', function(){ openCompose(); });
      return;
    }
    var nights = f.nights || [];
    feedNight = {};
    nights.forEach(function(n){ feedNight[n.id] = n; });
    // Group under the day they were shared, newest first. Tonight's dreams
    // lead with no divider; the end-of-night note closes them; every older
    // day gets the dashed divider band.
    var byDay = {}, days = [];
    nights.forEach(function(n){
      var k = n.publicOn || String(n.createdAt || '').slice(0, 10);
      if (!byDay[k]) { byDay[k] = []; days.push(k); }
      byDay[k].push(n);
    });
    days.sort().reverse();
    var html = '', card = 0, img = 0;
    var drawCard = function(n){
      var hasImg = !!(n.panels && n.panels.length);
      var s = meltCard(n, card % 2 === 1, hasImg && img % 2 === 1, 8 + (card % 4));
      card++;
      if (hasImg) img++;
      return s;
    };
    if (days[0] === f.today) {
      html += byDay[f.today].map(drawCard).join('');
      html += '<div class="fend">that\u2019s all the dreams for the night \u2014 come back tomorrow</div>';
      days.shift();
    } else {
      html += '<div class="fend">no dreams in the pile yet tonight \u2014 yours could be the first</div>';
    }
    days.forEach(function(k){
      html += '<div class="fdiv"><span class="l"></span><span class="t">' + divLabel(k, f.today) + '</span><span class="l"></span></div>';
      html += byDay[k].map(drawCard).join('');
    });
    el.innerHTML = html;
    wireDreams(el);
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function(){ el.querySelectorAll('.dcard').forEach(fitCard); });
    }
  } catch (e) {
    el.innerHTML = '<div class="err" style="padding-top:30px">' + esc(e.message) + '</div>';
  }
}

/* ── compose ── */
function openCompose(){
  scr.compose.innerHTML =
    '<div class="h2" style="margin-top:18px">what did you dream last night?</div>' +
    '<textarea id="cap" placeholder="i dreamt\u2026"></textarea>' +
    '<button class="btn" id="saveBtn">save dream</button>' +
    '<div class="quiet">Saves privately to my dreams. The next screen is where you draw it, ' +
    'and where you choose what to share.</div>';
  go('compose');
  document.getElementById('saveBtn').addEventListener('click', async function(){
    var t = document.getElementById('cap').value.trim();
    if (!t) { document.getElementById('cap').focus(); return; }
    this.disabled = true;
    try {
      var d = await api('/dreams', { body: { text: t } });
      toast('saved to my dreams');
      openDream(d.id, 'mine');
    } catch (e) { toast(e.message); this.disabled = false; }
  });
}

/* ── one dream (detail: name, draw, share) ── */
var dreamPoll = null;
function openDream(id, from){
  openDreamId = id; cameFrom = from || 'mine';
  go('dream');
  renderDream();
}
async function renderDream(){
  clearTimeout(dreamPoll);
  var el = scr.dream;
  // The screen is the NIGHT, not one dream — you post once a day, and a long
  // recording split into several dreams is machinery on the way to the pictures.
  var night, d;
  try { night = await api('/nights/' + openDreamId); }
  catch (e) { el.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; return; }
  d = (night.dreams || []).find(function(x){ return x.id === openDreamId; }) || night.dreams[0];

  var allPanels = (night.dreams || []).reduce(function(a, x){ return a.concat(x.panels || []); }, []);
  var drawing = (night.dreams || []).some(function(x){ return x.drawJob && x.drawJob.status === 'drawing'; });
  var failed = d.drawJob && d.drawJob.status === 'failed';
  var shared = night.shared;
  var drawBlock;
  if (drawing) {
    drawBlock = '<div class="drawing"><span class="pulse"></span>drawing your dream…</div>' +
      '<div class="pgrid"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>' +
      '<div class="quiet">You can leave — the drawing will be here when it’s done.</div>';
  } else if (allPanels.length) {
    // Your OWN night, before you have shared it: every page at once. The
    // one-cover rule is about the FEED — here you are choosing what to share,
    // so hiding pages behind a fold would hide the thing you came to decide.
    drawBlock = plainGrid(allPanels);
  } else {
    drawBlock = '<button class="btn sub" id="drawBtn"><span class="star" style="color:var(--fuchsia)">' + STAR + '</span> draw it</button>' +
      (failed ? '<div class="err">' + esc(d.drawJob.error) + '</div>' : '');
  }
  // SHARING IS THE NIGHT'S, not the dream's (Sophie: "you can only really post
  // once per day"). Her words are one choice; each picture across the whole
  // night is its own, named by the dream that drew it.
  var shareRows = '';
  if (!drawing) {
    var pics = [];
    (night.dreams || []).forEach(function(dd){
      (dd.panels || []).forEach(function(p){ pics.push({ dreamId: dd.id, i: p.i, url: p.url, public: p.public }); });
    });
    shareRows = shareItem('words', 'your words', null, night.wordsPublic, shared) +
      pics.map(function(p, n){
        return shareItem('p:' + p.dreamId + ':' + p.i, 'picture ' + (n + 1), p.url, p.public, shared);
      }).join('');
  }
  el.innerHTML =
    '<div class="backrow"><button id="backBtn">' + BACK + 'back</button></div>' +
    '<div class="post">' +
    (night.title ? '<div class="ttl">' + esc(night.title) + '</div>' : '<div class="naming">finding its name…</div>') +
    '<div class="meta">' + ago(night.createdAt) + ' ago · ' +
    (shared ? '<span class="badge pub">in today’s feed</span>' : '<span class="badge priv">private</span>') + '</div>' +
    // The whole night's words, in order. Where a long recording was split for
    // the drawing, the pieces read on as one — that split is machinery.
    '<div class="words">' + (night.dreams || []).map(function(x){
      return '<div class="part">' + esc(x.text) + '</div>';
    }).join('') + '</div>' +
    drawBlock + '</div>' +
    (shareRows
      ? '<div class="h2">Share</div>' + shareRows +
        (shared ? '<div class="quiet">In today’s feed until midnight.</div>'
                : '<button class="btn" id="shareBtn">share to today’s feed</button>')
      : '');
  wirePanels(el);
  document.getElementById('backBtn').addEventListener('click', function(){
    clearTimeout(dreamPoll);
    if (cameFrom === 'feed') { renderFeed(); go('feed'); } else { renderMine(); go('mine'); }
  });
  var drawBtn = document.getElementById('drawBtn');
  if (drawBtn) drawBtn.addEventListener('click', async function(){
    this.disabled = true;
    try { await api('/dreams/' + openDreamId + '/draw', { body: {} }); renderDream(); }
    catch (e) { toast(e.message); this.disabled = false; }
  });
  el.querySelectorAll('[data-t]').forEach(function(b){
    b.addEventListener('click', function(){
      if (shared) return;
      b.classList.toggle('pub');
      b.textContent = b.classList.contains('pub') ? 'public' : 'private';
    });
  });
  var shareBtn = document.getElementById('shareBtn');
  if (shareBtn) shareBtn.addEventListener('click', async function(){
    var words = el.querySelector('[data-t="words"]').classList.contains('pub');
    var panels = [];
    el.querySelectorAll('[data-t]').forEach(function(b){
      if (b.dataset.t === 'words' || !b.classList.contains('pub')) return;
      var bits = b.dataset.t.split(':');   // p:<dreamId>:<i>
      panels.push({ dreamId: bits[1], i: parseInt(bits[2], 10) });
    });
    this.disabled = true;
    try {
      await api('/nights/' + openDreamId + '/share', { body: { words: words, panels: panels } });
      toast('you’re in today’s feed');
      await renderFeed();
      go('feed');
    } catch (e) { toast(e.message); this.disabled = false; }
  });
  // keep polling while the name or a drawing is still landing
  if (!night.title || drawing) dreamPoll = setTimeout(renderDream, drawing ? 4000 : 1500);
}
function shareItem(key, label, thumb, on, locked){
  return '<div class="share-item">' + (thumb ? '<img class="thumb" src="' + thumb + '" alt="">' : '') +
    '<span class="lab">' + label + '</span>' +
    '<button class="st' + (on ? ' pub' : '') + '" data-t="' + key + '"' + (locked ? ' disabled' : '') + '>' +
    (on ? 'public' : 'private') + '</button></div>';
}

/* ── my dreams ── */
async function renderMine(){
  var el = scr.mine;
  try {
    var r = await api('/dreams');
    if (!r.dreams.length) {
      el.innerHTML = '<div class="quiet" style="padding-top:30px">no dreams yet \u2014 they arrive when you wake up with one.</div>' + mineFoot();
      wireMineFoot(el);
      return;
    }
    // ONE ROW PER NIGHT — you post once a day, so two dreams written the same
    // night are one thing here too, and the row opens the whole night.
    var byNight = {}, order = [];
    r.dreams.forEach(function(d){
      var k = d.night || String(d.createdAt || '').slice(0, 10);
      if (!byNight[k]) { byNight[k] = []; order.push(k); }
      byNight[k].push(d);
    });
    order.forEach(function(k){ byNight[k].sort(function(a, b){ return a.createdAt < b.createdAt ? -1 : 1; }); });
    el.innerHTML = order.map(function(k){
      var group = byNight[k], first = group[0];
      var drawing = group.some(function(d){ return d.drawJob && d.drawJob.status === 'drawing'; });
      return '<button class="jitem" data-id="' + first.id + '"><div class="row">' +
        '<span class="ttl">' + esc(first.title || 'finding its name…') + '</span>' +
        (first.publicOn ? '<span class="badge pub">shared</span>' : '<span class="badge priv">private</span>') +
        (drawing ? '<span class="naming">drawing…</span>' : '') +
        '<span class="when">' + ago(first.createdAt) + '</span></div>' +
        '<div class="snip">' + esc(group.map(function(d){ return d.text; }).join(' ')) + '</div></button>';
    }).join('');
    el.innerHTML += mineFoot();
    el.querySelectorAll('.jitem').forEach(function(b){
      b.addEventListener('click', function(){ openDream(b.dataset.id, 'mine'); });
    });
    wireMineFoot(el);
  } catch (e) {
    el.innerHTML = '<div class="err" style="padding-top:30px">' + esc(e.message) + '</div>' + mineFoot();
    wireMineFoot(el);
  }
}
function mineFoot(){
  return '<div class="minefoot"><button data-how>how this works</button><button data-out>sign out</button></div>';
}
function wireMineFoot(el){
  var how = el.querySelector('[data-how]'), out = el.querySelector('[data-out]');
  if (how) how.addEventListener('click', openHow);
  if (out) out.addEventListener('click', function(){ fbAuth.signOut(); });
}

/* ── auth ── */
function loadScript(src){ return new Promise(function(ok, bad){
  var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = bad; document.head.appendChild(s); }); }

async function boot(){
  scr.feed = document.getElementById('scr-feed');
  scr.mine = document.getElementById('scr-mine');
  scr.compose = document.getElementById('scr-compose');
  scr.dream = document.getElementById('scr-dream');

  var cfg = await (await fetch('/api/witch/firebase-config')).json();
  var base = 'https://www.gstatic.com/firebasejs/10.12.0/';
  await loadScript(base + 'firebase-app-compat.js');
  await loadScript(base + 'firebase-auth-compat.js');
  firebase.initializeApp({ apiKey: cfg.apiKey, authDomain: cfg.authDomain, projectId: cfg.projectId,
    storageBucket: cfg.storageBucket, messagingSenderId: cfg.messagingSenderId, appId: cfg.appId });
  fbAuth = firebase.auth();
  // Coming back from a redirect sign-in: surface a real failure instead of
  // silently landing on the sign-in screen again.
  fbAuth.getRedirectResult().catch(function(e){
    if (e && e.code === 'auth/account-exists-with-different-credential') {
      showErr('That Apple ID uses the same email as your Google account — tap "Continue with Google" instead.');
    } else if (e && e.code) {
      showErr(String(e.message || e).replace(/^Firebase: /, '').replace(/ \(auth.*\)\.?$/, ''));
    }
  });

  fbAuth.onAuthStateChanged(function(u){
    user = u;
    document.getElementById('gate').hidden = !!u;
    document.getElementById('app').hidden = !u;
    if (u) { renderFeed(); renderMine(); go('feed'); }
  });

  // A popup cannot open inside an embedded web view (and phone browsers block
  // them freely), so every provider sign-in falls back to a full-page redirect
  // rather than dead-ending on auth/popup-blocked.
  var POPUP_FAILS = ['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment',
                     'auth/popup-closed-by-user', 'auth/cancelled-popup-request', 'auth/web-storage-unsupported'];
  async function providerSignIn(provider){
    try {
      await fbAuth.signInWithPopup(provider);
    } catch (e) {
      if (POPUP_FAILS.indexOf(e.code) !== -1) { await fbAuth.signInWithRedirect(provider); return; }
      throw e;
    }
  }
  document.getElementById('googleBtn').addEventListener('click', async function(){
    hideErr();
    try { await providerSignIn(new firebase.auth.GoogleAuthProvider()); }
    catch (e) { showErr(String(e.message || e).replace(/^Firebase: /, '').replace(/ \(auth.*\)\.?$/, '')); }
  });
  // Apple is already enabled on this Firebase project (set up for XI), and
  // this domain is authorized — so the provider needs no extra config here.
  document.getElementById('appleBtn').addEventListener('click', async function(){
    hideErr();
    try {
      var p = new firebase.auth.OAuthProvider('apple.com');
      p.addScope('email'); p.addScope('name');
      await providerSignIn(p);
    } catch (e) {
      // Same email on an existing Google account: both providers verify their
      // emails, so signing in with Google resolves it in one tap (XI's fallback).
      if (e.code === 'auth/account-exists-with-different-credential' || e.code === 'auth/email-already-in-use') {
        showErr('That Apple ID uses the same email as your Google account — tap "Continue with Google" instead.');
      } else { showErr(String(e.message || e).replace(/^Firebase: /, '').replace(/ \(auth.*\)\.?$/, '')); }
    }
  });
  document.getElementById('emailBtn').addEventListener('click', async function(){
    hideErr();
    var email = document.getElementById('email').value.trim();
    var pw = document.getElementById('pw').value;
    if (!email || !pw) return showErr('email and password, both');
    try {
      if (signUpMode) await fbAuth.createUserWithEmailAndPassword(email, pw);
      else await fbAuth.signInWithEmailAndPassword(email, pw);
    } catch (e) { showErr(e.message.replace(/^Firebase: /, '').replace(/ \(auth.*\)\.?$/, '')); }
  });
  document.getElementById('swapBtn').addEventListener('click', function(){
    signUpMode = !signUpMode;
    document.getElementById('emailBtn').textContent = signUpMode ? 'Create account' : 'Sign in';
    this.textContent = signUpMode ? 'Have an account? Sign in' : 'New here? Create an account';
  });
  // one header word swaps between the feed and your private dreams; the
  // vault screen replaces this in the sharing-flow phase
  document.getElementById('navMine').addEventListener('click', function(){
    if (scr.feed.hidden) { renderFeed(); go('feed'); }
    else { renderMine(); go('mine'); }
  });
  document.getElementById('confessBtn').addEventListener('click', openCompose);
}
function showErr(m){ var e = document.getElementById('gateErr'); e.textContent = m; e.hidden = false; }
function hideErr(){ document.getElementById('gateErr').hidden = true; }

boot();
</script>
</body>
