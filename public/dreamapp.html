<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>dreams</title>
<!-- What a friend sees when Sophie texts them the link. The picture is on the
     onrender host on purpose: it resolves whichever address she sent. -->
<meta name="description" content="Write down what you dreamt, have it drawn as a picture, and share as much or as little of it as you like.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="you were in my dreams">
<meta property="og:title" content="you were in my dreams">
<meta property="og:description" content="Write down what you dreamt, have it drawn as a picture, and share as much or as little of it as you like. Dreams sit in the feed under their date, with no names on them.">
<meta property="og:url" content="https://youwereinmydreams.com/">
<meta property="og:image" content="https://imageforge-q125.onrender.com/dream-sunflowers.png">
<meta name="twitter:card" content="summary_large_image">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,600&family=Courier+Prime&display=swap" rel="stylesheet">
<style>
  /* Baveuse (Typodermic freeware) self-hosted — the wordmark must not hang on
     a third-party font CDN. */
  @font-face { font-family:'Baveuse'; font-style:normal; font-weight:400;
               src:url('/fonts/baveuse.woff') format('woff'); }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden] { display:none !important; }
  /* ── the melt feed (direction 2a, Claude Designs canvas Aug 2026) ──
     Ported EXACTLY from docs/dream-feed-designs/Dream Feed Prototype.dc.html —
     values are the artboard's, not inventions. The ink/cream/brown palette:
       #ece7dc app cream · #f4f0e5 card cream · #14131a ink (and the dark card)
       #7a4a3a brown accent · #dcd6c8 the desk the phone sits on (desktop only)
     The same-color alpha fades on the header/footer and the hatched
     illustration placeholders are the artboard's own; they are not the color
     gradients the no-gradients rule bans. */
  :root {
    --cream:#ece7dc; --card:#f4f0e5; --ink:#14131a; --brown:#7a4a3a; --desk:#dcd6c8;
    --mauve:#c493a4; /* the hearts — pale mauve pink (Sophie, Aug 2026) */
  }
  @keyframes wobble{0%,100%{transform:rotate(-.6deg) skewX(-.4deg)}50%{transform:rotate(.7deg) skewX(.5deg)}}
  @keyframes breathe{0%,100%{border-radius:14px 60px 18px 46px/40px 16px 52px 18px}50%{border-radius:52px 16px 44px 20px/18px 48px 16px 42px}}
  @keyframes blob{0%,100%{border-radius:60% 40% 55% 45%/45% 55% 40% 60%}50%{border-radius:45% 55% 40% 60%/60% 40% 55% 45%}}
  /* the blob's own radii are percentages, which on a full-width picture melt it
     into a lozenge and eat the corners of a comic page — open, the morph keeps
     going in PIXELS so the picture stays readable. */
  @keyframes blobopen{0%,100%{border-radius:42px 26px 38px 30px/30px 40px 26px 44px}50%{border-radius:26px 44px 28px 40px/44px 26px 42px 28px}}
  @keyframes rise{from{opacity:0;transform:translateY(30px) rotate(1.2deg)}to{opacity:1;transform:none}}
  @keyframes inkpulse{0%,100%{opacity:.45}50%{opacity:1}}
  @keyframes sheetup{from{transform:translateY(100%)}to{transform:none}}

  body { background:var(--desk); color:var(--ink); font:15px/1.6 'EB Garamond', Georgia, serif; }
  .phone { max-width:480px; margin:0 auto; background:var(--cream); min-height:100vh; min-height:100dvh; }

  header { position:sticky; top:0; z-index:5; padding:22px 24px 12px;
           display:flex; justify-content:space-between; align-items:baseline;
           background:linear-gradient(var(--cream) 70%, rgba(236,231,220,0)); }
  .mark { font:28px 'Baveuse', sans-serif; color:var(--ink); letter-spacing:.5px; }
  /* the wordmark is the way home — tapping "dreams" returns to the feed (Sophie) */
  button.mark { background:none; border:none; padding:0; cursor:pointer; }
  .hright { display:flex; gap:14px; align-items:baseline; }
  .fnow { font:11px 'Courier Prime', monospace; color:var(--brown); }
  /* the one control not on the artboard: the way into your private dreams —
     the vault screen replaces it in the sharing-flow phase */
  .hmine { background:none; border:none; cursor:pointer; font:11px 'Courier Prime', monospace;
           color:rgba(20,19,26,.45); padding:0; }

  main { padding:0 18px 110px; }
  #scr-feed { display:flex; flex-direction:column; gap:22px; padding-top:8px; }

  /* ── cards ── */
  .dcard { border:2px solid var(--ink); padding:16px; background:var(--card); color:var(--ink);
           animation:rise both, breathe var(--dur,9s) ease-in-out infinite, wobble 7s ease-in-out infinite;
           animation-timeline:view(), auto, auto; animation-range:entry 0% entry 45%, normal, normal; }
  .dcard.dark { background:var(--ink); color:var(--cream); }
  /* the profile stacks the same cards without the feed's flex gap — give
     them the feed's 22px themselves (they sat touching, Sophie 2026-08-19) */
  #scr-dreamer .dcard { margin-top:22px; }
  .drow { display:flex; gap:12px; align-items:stretch; }
  .drow.rev { flex-direction:row-reverse; }
  .blob { flex:1; aspect-ratio:1/1; align-self:flex-start; border:1.5px solid currentColor;
          animation:blob 12s ease-in-out infinite; display:flex; align-items:center; justify-content:center;
          overflow:hidden; position:relative; cursor:zoom-in;
          background:repeating-linear-gradient(45deg,#e3ddcf,#e3ddcf 6px,#e9e4d6 6px,#e9e4d6 12px); }
  .dark .blob { background:repeating-linear-gradient(45deg,#221f2b,#221f2b 6px,#2a2735 6px,#2a2735 12px); }
  .blob img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .blob .empt { font:10px 'Courier Prime', monospace; opacity:.5; }
  .blob .working { font:10.5px 'Courier Prime', monospace; color:var(--brown);
                   animation:inkpulse 1.6s ease-in-out infinite; }
  .dtxt { flex:1; display:flex; flex-direction:column; gap:7px; min-width:0; }
  .dhead { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .dttl { font:600 19px/1.25 'EB Garamond', serif; }
  /* worn ONLY by a ☾ friends card — the ✳ that sat on every dream is gone
     (Sophie); this one says who can see it, which is information */
  .dby { font:10.5px 'Courier Prime', monospace; opacity:.45; white-space:nowrap; }
  /* visible only on a card where YOU were tagged — the app's namesake line */
  .youin { font:italic 600 13px/1.4 'EB Garamond', serif; color:var(--brown); }
  .dark .youin { color:#d9b3c0; }
  .dbody { font:400 14.5px/1.5 'EB Garamond', serif; white-space:pre-wrap;
           --lh:21.75px; --lines:6; }
  /* ── the fold sits ON the last line, never under it (Sophie: "I want the
     see more button to be on the same last line of the text rather than
     underneath it") ── -webkit-line-clamp cannot hold a button, so the clamp
     is a plain max-height and the button is a right float with `clear:both`
     sitting below a zero-width float one line SHORT of the clamp: the only
     line it can land on is the last one, and the words wrap around it.
     `fold` is set by JS and only where the words really were cut — the
     ::before float would otherwise stretch this block (overflow:hidden makes
     it a BFC) to the full clamp height on a two-line dream. */
  .dbody.clamped { max-height:calc(var(--lines) * var(--lh)); overflow:hidden; }
  .dbody.clamped.fold::before { content:''; float:left; width:0;
                                height:calc((var(--lines) - 1) * var(--lh)); }
  /* the padding trues the button's baseline up with the serif's — without it
     the label sat a few px below the line it shares (Sophie: "off the line of
     the rest of the text"). No ellipsis: she asked for it gone. */
  .dbody .dmore { float:right; clear:both; margin-left:8px; padding-bottom:3px;
                  height:var(--lh); display:inline-flex; align-items:flex-end; }
  .dmore { background:none; border:none; cursor:pointer; align-self:flex-start; padding:0;
           font:11px 'Courier Prime', monospace; color:var(--brown); }
  .dmore span { border-bottom:1px dashed currentColor; }
  .dtxt > .dmore { float:none; }
  .dark .dmore { color:var(--cream); opacity:.65; }

  /* ── opened, the picture comes up to its normal size and the words run
     UNDER it (Sophie) — the side-by-side row is the collapsed shape only, and
     a full-width read squeezed into half the card was the thing to fix. */
  .dcard.open .drow, .dcard.open .drow.rev { flex-direction:column; }
  .dcard.open .blob { flex:none; width:100%; aspect-ratio:auto; align-self:stretch;
                      animation:blobopen 12s ease-in-out infinite; }
  .dcard.open .blob img { position:static; width:100%; height:auto; display:block; }
  /* hearts big enough to see, in the pale mauve pink; the comment icon is a
     BUBBLE, not a pencil (Sophie, Aug 2026) */
  .dmeta { display:flex; gap:18px; align-items:center; margin-top:auto; padding-top:6px; }
  .dmeta span { cursor:pointer; display:inline-flex; align-items:center; gap:6px;
                font:12px 'Courier Prime', monospace; color:rgba(20,19,26,.6); }
  .dmeta .i { width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:1.8;
              stroke-linecap:round; stroke-linejoin:round; flex:none; }
  .dmeta .likebtn { color:var(--mauve); }
  .dmeta .likebtn.on .i { fill:var(--mauve); }
  .dark .dmeta span { color:rgba(236,231,220,.65); }
  .dark .dmeta .likebtn { color:#d9b3c0; }
  .dark .dmeta .likebtn.on .i { fill:#d9b3c0; }
  .dthread { border-top:1px solid rgba(20,19,26,.15); margin-top:12px; padding-top:10px;
             display:flex; flex-direction:column; gap:10px; }
  .dark .dthread { border-top-color:rgba(236,231,220,.2); }
  .crow { display:flex; gap:8px; align-items:baseline; }
  .crow .who { font:10px 'Courier Prime', monospace; opacity:.4; white-space:nowrap; }
  .crow .said { font:400 13px/1.45 'EB Garamond', serif; }
  .whisper { font:11px 'Courier Prime', monospace; color:inherit; background:none;
             border:1px solid rgba(20,19,26,.3); border-radius:8px; padding:8px 12px;
             outline:none; width:100%; }
  .dark .whisper { border-color:rgba(236,231,220,.3); }
  .whisper::placeholder { color:inherit; opacity:.45; }

  /* dividers between days, the end-of-night note */
  .fdiv { display:flex; align-items:center; gap:12px; padding:6px 4px; }
  .fdiv span.l { flex:1; border-top:1px solid var(--brown); }
  .fdiv span.t { font:11px 'Courier Prime', monospace; color:var(--brown); }
  .fend { text-align:center; font:400 16px/1.5 'EB Garamond', serif;
          color:rgba(20,19,26,.6); padding:14px 24px 4px; }

  /* the confess button — the plain ask ON the button, the poetic line under it
     (Sophie: "under that weird, long, narrow button, it should say, It's
     coming back to me") */
  .confess { position:fixed; left:0; right:0; bottom:0; z-index:6; padding:14px 0 calc(20px + env(safe-area-inset-bottom));
             display:flex; justify-content:center; pointer-events:none;
             background:linear-gradient(rgba(236,231,220,0), var(--cream) 65%); }
  .confess .cstack { display:flex; flex-direction:column; align-items:center; gap:7px; }
  .confess button { pointer-events:auto; font:15px 'Courier Prime', monospace; background:var(--brown);
                    color:var(--cream); border:none; padding:14px 28px; cursor:pointer;
                    border-radius:60% 40% 55% 45%/45% 55% 40% 60%; animation:wobble 5s ease-in-out infinite; }
  .csub { font:400 12px 'Courier Prime', monospace; color:rgba(20,19,26,.55); }

  /* The way out of an opened dream, floating so it is in reach from anywhere
     in a long one. A small icon-only circle since 2026-08-19 (Sophie: "less
     obtrusive … it doesn't say 'close the dream', it's just like an icon") —
     the wordy blob sat over the very dream it was closing. Same seat as the
     confess button, which stands down while it is up. */
  #closewrap button { pointer-events:auto; width:46px; height:46px; padding:0;
                      display:flex; align-items:center; justify-content:center;
                      background:var(--brown); color:var(--cream); border:none; border-radius:50%;
                      cursor:pointer; animation:wobble 5s ease-in-out infinite; }
  #closewrap button svg { width:19px; height:19px; }

  /* sealed (the share-to-see gate, currently off server-side) */
  .sealwrap { position:relative; overflow:hidden; }
  .sealed { filter:blur(7px); pointer-events:none; user-select:none; display:flex; flex-direction:column; gap:22px; }
  .sealmsg { position:absolute; inset:0; z-index:2; display:flex; align-items:center; justify-content:center; }
  .sealmsg .inner { background:var(--ink); color:var(--cream); border:2px solid var(--ink);
                    border-radius:14px 60px 18px 46px/40px 16px 52px 18px; padding:24px 22px; margin:0 22px; text-align:center; }
  .sealmsg .big { font:600 17px 'EB Garamond', serif; }
  .sealmsg .sml { font:11px 'Courier Prime', monospace; opacity:.6; margin-top:6px; }
  .sealmsg button { margin-top:14px; font:13px 'Courier Prime', monospace; background:var(--brown); color:var(--cream);
                    border:none; padding:11px 20px; border-radius:60% 40% 55% 45%/45% 55% 40% 60%; cursor:pointer; }

  .quiet { font:11.5px 'Courier Prime', monospace; color:rgba(20,19,26,.5); margin-top:10px; }
  .err { font:11.5px 'Courier Prime', monospace; color:var(--brown); margin-top:10px; }

  /* ── screens NOT yet redesigned (compose, dream detail, my dreams, sign-in).
     Kept functional and re-toned to the melt palette; each gets its exact
     artboard in its own phase — the upload screen is next. ── */
  textarea { width:100%; background:#f4f0e5; border:1.5px solid var(--ink); border-radius:10px 18px 12px 16px;
             color:var(--ink); font:400 15px/1.5 'EB Garamond', serif; padding:12px 14px; min-height:140px;
             resize:none; outline:none; }
  .btn { display:block; width:100%; background:none; color:var(--brown); border:1px solid var(--brown);
         border-radius:6px; padding:13px 16px; font:14px 'Courier Prime', monospace; margin-top:14px; cursor:pointer; }
  .btn.sub { color:var(--ink); border-color:rgba(20,19,26,.4); }
  .btn[disabled] { opacity:.45; }
  .post { background:var(--card); border:2px solid var(--ink); color:var(--ink); padding:16px; margin-top:14px; }
  .post .ttl { font:600 19px/1.25 'EB Garamond', serif; }
  .post .meta { font:10.5px 'Courier Prime', monospace; opacity:.55; margin-top:4px; }
  .post .words { margin-top:11px; white-space:pre-wrap; font:400 14.5px/1.5 'EB Garamond', serif; }
  .naming { font:11px 'Courier Prime', monospace; color:var(--brown); animation:inkpulse 1.1s infinite alternate; }
  .drawing { display:flex; align-items:center; gap:10px; margin-top:12px;
             font:11.5px 'Courier Prime', monospace; color:rgba(20,19,26,.6); }
  .pulse { width:9px; height:9px; border-radius:50%; background:var(--brown); animation:inkpulse 1s infinite alternate; }
  .skel { background:repeating-linear-gradient(45deg,#e3ddcf,#e3ddcf 6px,#e9e4d6 6px,#e9e4d6 12px);
          animation:inkpulse 1.1s infinite alternate; height:110px; border:1px solid rgba(20,19,26,.35);
          border-radius:12px 18px 10px 16px; }
  .pgrid { display:grid; grid-template-columns:repeat(3, 1fr); gap:7px; margin-top:11px; }
  .pgrid img { width:100%; display:block; border-radius:12px 18px 10px 16px; border:1px solid rgba(20,19,26,.35);
               background:#e3ddcf; cursor:zoom-in; }
  .pgrid.cover { grid-template-columns:1fr; }
  /* rows with a small right-hand toggle — the teams' routing flag, a friend's
     remove; the same furniture the share screen used to own */
  .share-item { display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px dashed rgba(20,19,26,.2); }
  .share-item:last-of-type { border-bottom:none; }
  .share-item .lab { font:400 14.5px 'EB Garamond', serif; }
  .share-item .st { margin-left:auto; border:1px solid rgba(20,19,26,.4); background:none; color:rgba(20,19,26,.6);
                    border-radius:14px 20px 12px 18px; padding:6px 13px; font:12px 'Courier Prime', monospace;
                    min-width:80px; cursor:pointer; }
  .share-item .st.pub { border-color:var(--brown); color:var(--brown); }
  .h2 { font:600 20px 'EB Garamond', serif; color:var(--ink); margin:22px 2px 12px; }
  .badge { display:inline-block; font:11px 'Courier Prime', monospace; border-radius:14px; padding:3px 8px; }
  .badge.pub { border:1px solid var(--brown); color:var(--brown); }
  .badge.priv { border:1px solid rgba(20,19,26,.3); color:rgba(20,19,26,.55); }
  svg.i { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8;
          stroke-linecap:round; stroke-linejoin:round; flex:none; }
  .backrow { display:flex; align-items:center; gap:8px; padding:14px 0 0; }
  .backrow button { background:none; border:none; color:rgba(20,19,26,.55); display:flex; align-items:center;
                    gap:5px; font:12px 'Courier Prime', monospace; padding:4px 6px 4px 0; cursor:pointer; }
  .jitem { width:100%; text-align:left; background:var(--card); color:var(--ink);
           border:2px solid var(--ink); font:inherit; padding:15px 16px; margin-top:14px; cursor:pointer; }
  .jitem .row { display:flex; align-items:center; gap:9px; }
  .jitem .ttl { font:600 17px 'EB Garamond', serif; }
  .jitem .when { font:10.5px 'Courier Prime', monospace; opacity:.5; margin-left:auto; }
  .jitem .snip { font:400 13px/1.45 'EB Garamond', serif; opacity:.65; margin-top:4px;
                 display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .minefoot { display:flex; gap:18px; justify-content:center; padding:26px 0 10px; }
  .minefoot button { background:none; border:none; cursor:pointer; font:11px 'Courier Prime', monospace;
                     color:rgba(20,19,26,.5); border-bottom:1px dashed rgba(20,19,26,.4); padding:0; }

  /* ── the compose sheet (the artboard's stage 1 + stage 2) ── */
  .sheet { position:fixed; inset:0; margin:0 auto; max-width:480px; z-index:8; background:var(--cream);
           animation:sheetup .35s cubic-bezier(.2,.9,.3,1) both; display:flex; flex-direction:column;
           gap:12px; padding:20px 22px calc(24px + env(safe-area-inset-bottom)); overflow-y:auto; }
  .shead { display:flex; justify-content:space-between; align-items:baseline; }
  /* as big as the homepage's wordmark (Sophie), and the same way home */
  .smark { font:28px 'Baveuse', sans-serif; color:var(--ink); background:none; border:none;
           padding:0; cursor:pointer; }
  #sheetX { background:none; border:none; font:16px 'Courier Prime', monospace; color:var(--brown); cursor:pointer; }
  .st { display:flex; flex-direction:column; gap:12px; flex:1; }
  .srow { display:flex; justify-content:space-between; align-items:flex-end; gap:8px; }
  /* not italic, not bold (Sophie) — it is an instruction, not a whisper */
  .srow .sq { font:400 14px 'EB Garamond', serif; color:var(--ink); }
  .sbtns { display:flex; gap:8px; }
  .sbtns button { width:42px; height:42px; border:none; background:var(--brown); color:var(--cream);
                  display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; }
  #micBtn { border-radius:16px 22px 14px 20px; }
  #micBtn.rec { background:var(--ink); }
  #fileBtn { border-radius:20px 14px 22px 16px; }
  /* small, glyphless, tucked to the right — recurring then lucid (Sophie) */
  .chips { display:flex; gap:7px; align-items:center; justify-content:flex-end; }
  .chips button { font:10.5px 'Courier Prime', monospace; padding:5px 10px; cursor:pointer;
                  border:1px solid rgba(20,19,26,.35); background:transparent; color:rgba(20,19,26,.6); }
  #lucidBtn { border-radius:14px 20px 16px 22px; }
  #recurBtn { border-radius:16px 22px 14px 20px; }
  .chips button.on { background:var(--brown); color:var(--cream); border-color:var(--brown); }
  .shardrow { display:flex; gap:8px; justify-content:center; align-items:center; }
  .shardrow span { font:11px 'Courier Prime', monospace; color:rgba(20,19,26,.45); }
  .shardrow button { font:11.5px 'Courier Prime', monospace; background:#f4f0e5;
                     border:1px dashed rgba(20,19,26,.4); color:rgba(20,19,26,.65);
                     padding:7px 12px; border-radius:16px 22px 14px 20px; cursor:pointer; }
  .blobbtn { align-self:center; font:15px 'Courier Prime', monospace; background:var(--brown); color:var(--cream);
             border:none; padding:13px 30px; border-radius:60% 40% 55% 45%/45% 55% 40% 60%; cursor:pointer; }
  .blobbtn[disabled] { opacity:.5; }
  .three { display:flex; gap:10px; }
  .three textarea { flex:1; min-width:0; height:82px; min-height:82px; font:400 13px/1.4 'EB Garamond', serif;
                    border:1px solid rgba(20,19,26,.4); border-radius:14px 20px 12px 18px; padding:10px;
                    text-align:center; }
  .sfoot { margin-top:auto; display:flex; flex-direction:column; gap:12px;
           border-top:1px dashed rgba(20,19,26,.3); padding-top:14px; }
  .moodrow { display:flex; align-items:center; gap:8px; justify-content:space-between; flex-wrap:wrap; }
  .moodrow > span { font:11px 'Courier Prime', monospace; color:rgba(20,19,26,.5); }
  .moods { display:flex; gap:6px; flex-wrap:wrap; }
  .moods button { font:11.5px 'Courier Prime', monospace; padding:7px 11px; border-radius:14px 20px 12px 18px;
                  border:1px solid rgba(20,19,26,.35); cursor:pointer; background:transparent;
                  color:rgba(20,19,26,.6); }
  .moods button.on { background:var(--brown); color:var(--cream); border-color:var(--brown); }
  /* the fifth feeling is HERS to write (Sophie: one more option they can fill
     in themselves) — a chip that happens to be an input */
  .moodfree { font:11.5px 'Courier Prime', monospace; padding:7px 11px; border-radius:14px 20px 12px 18px;
              border:1px solid rgba(20,19,26,.35); background:transparent; color:rgba(20,19,26,.75);
              width:104px; outline:none; }
  .moodfree:focus { border-color:var(--brown); }
  .moodfree::placeholder { color:rgba(20,19,26,.4); }
  .streakline { text-align:center; font:11px/1.7 'Courier Prime', monospace; color:rgba(20,19,26,.45); }
  /* stage 2 */
  .illus { aspect-ratio:1/1; width:74%; align-self:center; box-sizing:border-box;
           background:repeating-linear-gradient(45deg,#e3ddcf,#e3ddcf 6px,#e9e4d6 6px,#e9e4d6 12px);

// "2026-08-07" -> "Friday, August 7". Built from the parts as a LOCAL date so
// the label can't slip a day (parsing the string directly reads as UTC midnight).
function dayLabel(iso){
  var p = String(iso || '').split('-');
  if (p.length !== 3) return '';
  return new Date(+p[0], +p[1] - 1, +p[2])
    .toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })
    .toLowerCase();
}
// the artboard's divider: "last night · friday, august 15"
function divLabel(k, today){
  var t = String(today || '').split('-').map(Number);

  var yk = y.getFullYear() + '-' + String(y.getMonth() + 1).padStart(2, '0') + '-' + String(y.getDate()).padStart(2, '0');
  return (k === yk ? 'last night \u00b7 ' : '') + dayLabel(k);

function ago(iso){
  var m = Math.max(1, Math.round((Date.now() - new Date(iso).getTime()) / 60000));

  var h = Math.round(m / 60);
  if (h < 24) return h + 'h';
  return Math.round(h / 24) + 'd';
}
async function api(path, opts){
  opts = opts || {};

  opts.headers = Object.assign({ authorization: 'Bearer ' + tok }, opts.headers || {});

    err.limit = j.limit;   // 'day' marks the three-a-day doors — those get a pop-up

  return j;
}

/* ── lightbox: a tapped panel opens big ──

var lbY = 0, lbList = [], lbIdx = 0;

function openLightbox(list, idx){
  lbY = window.scrollY;

  document.body.style.overflow = 'hidden';

}
function closeLightbox(){
  var lb = document.getElementById('lb');
  if (lb.hidden) return;

  if (e.target.id === 'lbimg') {
    if (lbList.length > 1) { lbIdx = (lbIdx + 1) % lbList.length; lbShow(); }
    return;

  var blob = e.target.closest ? e.target.closest('.blob') : null;
  if (blob) {
    var card = blob.closest('.dcard'), n = feedEntry[card.dataset.id];
    if (n && n.panels && n.panels.length) openLightbox(n.panels, 0);
    return;
  }
  var img = e.target.closest ? e.target.closest('.pgrid img') : null;
  if (img) { openLightbox([{ url: img.src }], 0); return; }
  if (e.target.closest && e.target.closest('.lb')) closeLightbox();
});
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') { closeLightbox(); closeHow(); } });

// Every panel, three across — the private view of your own dream. One picture
// per dream since Aug 2026; an old comic dream still shows all its pages.
function plainGrid(panels){
  if (!panels.length) return '';
  return '<div class="pgrid">' +
    panels.map(function(p){ return '<img src="' + p.url + '" alt="" loading="lazy">'; }).join('') +
    '</div>';
}

/* ── THE MELT FEED — one DREAM is one card (Sophie, 2026-08-19: "they should
   save as separate dreams" — the night-grouping was what "appended" her
   dreams to each other, and it is gone). Alternating dark cards (her
   alternateDark tweak, ON), the illustration in a breathing blob that swaps
   sides card by card, headline + body in EB Garamond. Dreams stay
   unattributed — and the byline slot is GONE (Sophie: "these little stars
   next to all the dreams … I would get rid of it"). */
var feedEntry = {};   // id -> feed entry, for the blob lightbox

function meltCard(n, dark, rev, dur){
  var blob = n.cover
    ? '<div class="blob"><img src="' + n.cover.url + '" alt="" loading="lazy"></div>'
    : '';
  var meta = n.mine ? '' :
    '<div class="dmeta">' +
      '<span class="likebtn' + (n.felt ? ' on' : '') + '">' + HEART + (n.feltCount || 0) + '</span>' +
      '<span class="cmtbtn">' + BUBBLE + (n.commentCount || 0) + '</span>' +
      '<span class="whobtn" title="their dreams">' + WHO + '</span>' +
    '</div>';
  // A ☾ friends card says so in the corner and always wears the dark card
  // (the sharing-flow artboard's rule) — the only marker any card carries.
  var frd = n.audience === 'friends';
  return '<article class="dcard' + (dark || frd ? ' dark' : '') + '" data-id="' + n.id + '"' +
    (n.mine ? ' data-mine="1"' : '') + ' style="--dur:' + dur + 's">' +
    '<div class="drow' + (rev ? ' rev' : '') + '">' + blob +
      '<div class="dtxt">' +
        '<div class="dhead"><span class="dttl">' + esc(n.title) + '</span>' +
          (frd ? '<span class="dby">☾ friends</span>' : '') + '</div>' +
        (n.taggedYou ? '<div class="youin">you were in this dream</div>' : '') +
        (n.words ? '<div class="dbody clamped">' +
                   '<button class="dmore" hidden><span>see more</span></button>' + esc(n.words) +
                 '</div>' : '') +
        meta +
      '</div>' +
    '</div>' +
    '<div class="dthread" hidden></div>' +
  '</article>';
}

/* ── the words are cut to the PICTURE's height (Sophie: "truncate the text
   that goes next to the picture enough so that the picture and the words are
   about equal length vertically") ──
   The blob is a square of half the row, so its height is settled by layout
   alone — it does not wait on the image — and the lines that fit are whatever
   is left over once the title and the metadata row have taken their share.
   offsetHeight, never getBoundingClientRect: the card carries a wobble
   rotation and a rect would read the rotated box, a couple of px too tall.
   It also re-decides whether there is anything to fold, so it is safe to run
   again once the serif has loaded and the title may have re-wrapped. */
function fitCard(card){
  var body = card.querySelector('.dbody'), more = card.querySelector('.dmore');
  if (!body || !more || card.classList.contains('open')) return;
  var txt = card.querySelector('.dtxt'), blob = card.querySelector('.blob');
  if (blob) {
    var lh = parseFloat(getComputedStyle(body).lineHeight) || 21.75;
    var gap = parseFloat(getComputedStyle(txt).rowGap) || 0;
    var other = gap * (txt.children.length - 1);
    for (var i = 0; i < txt.children.length; i++) {
      if (txt.children[i] !== body) other += txt.children[i].offsetHeight;
    }
    var lines = Math.floor((blob.offsetHeight - other) / lh);
    body.style.setProperty('--lines', Math.max(3, Math.min(12, lines)));
  }
  var cut = body.scrollHeight - body.clientHeight > 4;
  body.classList.toggle('fold', cut);
  more.hidden = !cut;
}

/* ── opening a dream (Sophie, Aug 2026) ──
   "rather than saving their place in the scroll, it should jump it so the
   image is towards the top of the screen and the text is underneath it, but
   there should also be an option to close that dream at any point so a
   floating button."
   So opening is a JUMP, not a hold: the card's top goes just under the sticky
   header, where the full-size picture then sits with the words below it. Only
   one dream is open at a time — the floating close belongs to one dream, and
   two open dreams would leave her scrolling past a picture she already read to
   find the one she just tapped. Closing puts that card's top back on screen,
   which is the one place she is certainly looking. */
var openCard = null;
function headroom(){
  var h = document.querySelector('header');
  return (h ? h.offsetHeight : 0) + 8;
}
function cardTop(card){
  return card.getBoundingClientRect().top + window.scrollY;
}
function setOpen(card, open){
  if (open && openCard && openCard !== card) setOpen(openCard, false);
  var body = card.querySelector('.dbody'), more = card.querySelector('.dmore');
  var txt = card.querySelector('.dtxt');
  if (!body || !more) return;
  card.classList.toggle('open', open);
  body.classList.toggle('clamped', !open);
  // The button lives INSIDE the words while they are cut (that is what puts it
  // on the last line) and moves out below them when they are open, where a
  // float would strand it at the top of the block.
  if (open) txt.insertBefore(more, body.nextSibling);
  else body.insertBefore(more, body.firstChild);
  more.querySelector('span').textContent = open ? 'see less' : 'see more';
  openCard = open ? card : (openCard === card ? null : openCard);
  var wrap = document.getElementById('closewrap');
  if (wrap) wrap.hidden = !openCard;
  var confess = document.getElementById('confess');
  if (confess) confess.hidden = !!openCard || scr.feed.hidden;
  window.scrollTo(0, Math.max(0, cardTop(card) - headroom()));
}

// Re-fit every card, keeping whatever she is reading exactly where it is.
function refit(root){
  var cards = [].slice.call(root.querySelectorAll('.dcard'));
  if (!cards.length) return;
  // The anchor is the first card the viewport still touches; offsetTop is
  // measured against the same offsetParent before and after, so the delta is
  // honest even though the cards are mid-wobble.
  var anchor = null, off = 0;
  for (var i = 0; i < cards.length; i++) {
    var top = cards[i].offsetTop - window.scrollY;
    if (top + cards[i].offsetHeight > 0) { anchor = cards[i]; off = top; break; }
  }
  cards.forEach(fitCard);
  if (anchor && window.scrollY > 0) window.scrollTo(0, Math.max(0, anchor.offsetTop - off));
}

function wireDreams(root){
  root.querySelectorAll('.dcard').forEach(function(card){
    var id = card.dataset.id;
    // the fold shows only where the clamp really cut the words
    var body = card.querySelector('.dbody'), more = card.querySelector('.dmore');
    if (body && more) {
      fitCard(card);
      more.addEventListener('click', function(){
        setOpen(card, !card.classList.contains('open'));
      });
    }
    var like = card.querySelector('.likebtn');
    if (like) like.addEventListener('click', function(){
      // POST — the old page sent a bodyless GET here, which the server never
      // routed, so the heart silently did nothing.
      api('/dreams/' + id + '/felt', { method: 'POST' }).then(function(r){
        like.innerHTML = HEART + (r.feltCount || 0);
        like.classList.toggle('on', !!r.felt);
      }).catch(function(e){ toast(e.message); });
    });
    var cmt = card.querySelector('.cmtbtn'), thread = card.querySelector('.dthread');
    if (cmt) cmt.addEventListener('click', function(){
      thread.hidden = !thread.hidden;
      if (!thread.hidden && !thread.dataset.loaded) loadComments(id, thread, cmt);
    });
    // Nameless, not anonymous (Sophie): the sheet shows no name, but a dream
    // opens into its dreamer's profile — all their dreams you can see.
    var who = card.querySelector('.whobtn');
    if (who) who.addEventListener('click', function(){ openDreamer(id); });
  });
}

async function loadComments(id, thread, cmt){
  thread.dataset.loaded = '1';
  thread.innerHTML = '<div class="crow"><span class="said" style="opacity:.5">reading\u2026</span></div>';
  try {
    var r = await api('/dreams/' + id + '/comments');
    drawComments(r.comments, thread);
    thread.insertAdjacentHTML('beforeend',
      '<input class="whisper" placeholder="leave a comment\u2026" maxlength="800" enterkeyhint="send">');
    var input = thread.querySelector('.whisper');
    input.addEventListener('keydown', async function(e){
      if (e.key !== 'Enter') return;
      var text = input.value.trim();
      if (!text) return;
      input.disabled = true;
      try {
        var res = await api('/dreams/' + id + '/comments', { body: { text: text } });
        input.value = '';
        var empty = thread.querySelector('[data-empty]');
        if (empty) empty.remove();
        input.insertAdjacentHTML('beforebegin', commentRow(res.comment));
        cmt.innerHTML = BUBBLE + res.commentCount;
      } catch (err) { toast(err.message); }
      input.disabled = false;
      input.focus();
    });
  } catch (e) {
    thread.dataset.loaded = '';
    thread.innerHTML = '<div class="err">' + esc(e.message) + '</div>';
  }
}
function commentRow(c){
  return '<div class="crow"><span class="who">' + esc(c.name) + '</span>' +
    '<span class="said">' + esc(c.text) + '</span></div>';
}
function drawComments(comments, thread){
  thread.innerHTML = comments.length
    ? comments.map(commentRow).join('')
    : '<div class="crow" data-empty><span class="said" style="opacity:.5">no comments yet.</span></div>';
}

/* ── views ── */
var scr = { feed: null, mine: null, dream: null, teams: null, friends: null, dreamer: null };
function go(which){
  for (var k in scr) scr[k].hidden = (k !== which);
  if (which !== 'dream' && typeof stopListen === 'function') stopListen();
  // Leaving the feed takes an opened card with it. The floating close serves
  // TWO doors (Sophie: "they should all have a closed button that's
  // floating"): an opened feed card, and the archive's dream screen — where
  // it is the way back that doesn't make her scroll to either end.
  openCard = null;
  document.getElementById('closewrap').hidden = (which !== 'dream');
  document.getElementById('confess').hidden = (which !== 'feed');
  var mineBtn = document.getElementById('navMine');
  // Two views and one word to swap between them (Sophie, Aug 2026): the feed,
  // and your own dreams — which she calls the ARCHIVE.
  mineBtn.textContent = (which === 'feed') ? 'archive' : 'feed';
  window.scrollTo(0, 0);
}

/* ── feed ── */
async function renderFeed(){
  var el = scr.feed;
  try {
    var f = await api('/feed');
    if (f.sealed) {
      var ghosts = '';
      for (var i = 0; i < 3; i++) {
        ghosts += '<article class="dcard' + (i % 2 ? ' dark' : '') + '"><div class="drow"><div class="dtxt">' +
          '<div class="dhead"><span class="dttl">Somewhere a Door Kept Opening</span></div>' +
          '<div class="dbody">The stairwell went down further than the building did and everyone acted like that was normal\u2026</div>' +
          '</div></div></article>';
      }
      el.innerHTML =
        '<div class="sealwrap"><div class="sealed">' + ghosts + '</div>' +
        '<div class="sealmsg"><div class="inner">' +
        '<div class="big">' + f.count + ' dream' + (f.count === 1 ? '' : 's') + ' from last night</div>' +
        '<div class="sml">share one of yours to read them \u2014 the feed opens for the rest of the day</div>' +
        '<button id="gateGo">it\u2019s coming back to me\u2026</button>' +
        '</div></div></div>';
      document.getElementById('gateGo').addEventListener('click', function(){ openCompose(); });
      return;
    }
    var entries = f.dreams || [];
    feedEntry = {};
    entries.forEach(function(n){ feedEntry[n.id] = n; });
    // Group under the day they were shared, newest first. Tonight's dreams
    // lead with no divider and end with nothing (Sophie had the sign-off line
    // taken out); every older day gets the divider band. The line that shows
    // when nothing has been shared YET is a different one, and stays.
    var byDay = {}, days = [];
    entries.forEach(function(n){
      var k = n.publicOn || String(n.createdAt || '').slice(0, 10);
      if (!byDay[k]) { byDay[k] = []; days.push(k); }
      byDay[k].push(n);
    });
    days.sort().reverse();
    // The alternation reads the card actually painted before this one — a ☾
    // friends card is ALWAYS dark, and a blind counter put two darks in a row
    // beside one (Sophie's screenshot, 2026-08-19).
    var html = '', dark = true, card = 0, img = 0;
    var drawCard = function(n){
      var hasImg = !!n.cover;
      var dk = n.audience === 'friends' ? true : !dark;
      dark = dk;
      var s = meltCard(n, dk, hasImg && img % 2 === 1, 8 + (card % 4));
      card++;
      if (hasImg) img++;
      return s;
    };
    if (days[0] === f.today) {
      html += byDay[f.today].map(drawCard).join('');
      days.shift();
    } else {
      html += '<div class="fend">no dreams in the pile yet tonight \u2014 yours could be the first</div>';
    }
    days.forEach(function(k){
      html += '<div class="fdiv"><span class="l"></span><span class="t">' + divLabel(k, f.today) + '</span><span class="l"></span></div>';
      html += byDay[k].map(drawCard).join('');
    });
    openCard = null;
    document.getElementById('closewrap').hidden = true;
    el.innerHTML = html;
    wireDreams(el);
    // The serif arrives from a font CDN, and a title that re-wraps changes how
    // many lines fit beside its picture — so the fit is taken again once it
    // lands. It has to hold her place while it does: a card ABOVE the viewport
    // changing height moves the page under her thumb, which is the same bug
    // the lightbox rules exist to prevent, arriving seconds after she stopped
    // touching anything.
    if (document.fonts && document.fonts.ready) {
      var painted = Date.now();
      document.fonts.ready.then(function(){
        // Only while the feed is still settling, or while she is still at the
        // top of it. A font that lands late (a slow CDN, a cold cache) would
        // otherwise re-lay the page out mid-read — and if the shift makes the
        // page SHORTER the browser clamps her scroll, so even holding an
        // anchor cannot put her back. A fit taken on the fallback serif is a
        // line out at worst; a page that moves under her thumb is the bug.
        if (Date.now() - painted < 2000 || window.scrollY === 0) refit(el);
      });
    }
  } catch (e) {
    // She hit a bare "Load failed" once with no way onward but a full reload —
    // a transient fetch failure gets a door to try again.
    el.innerHTML = '<div class="err" style="padding-top:30px">' + esc(e.message) + '</div>' +
      '<button class="btn" style="width:auto; padding:11px 22px" id="feedRetry">try again</button>';
    var rb = document.getElementById('feedRetry');
    if (rb) rb.addEventListener('click', function(){ renderFeed(); });
  }
}

/* ── the compose sheet (stage 1 → stage 2, per the artboard) ──
   Speak it / upload a recording go through POST /transcribe and land in the
   same box as typing. "illustrate it" saves the dream FIRST (with mood, lucid,
   recurring and the three things — captured now, no later moment knows them),
   then starts the drawing as a background job (one square medium picture,
   5.3¢). Three drawings a night: past that the server refuses, the pop-up says
   come back tomorrow, and the dream is safe in the archive as a draft. Stage 2
   polls the job; the seen-by dial picks everyone / friends / just me. Sharing
   while the ink is still working needs no client machinery any more — the
   server marks a landing picture public by itself when the dream is already
   out. */
var sheetState = null;
var composeInfo = null;   // /me: streak, fetched once per open

function openCompose(){
  sheetState = { stage: 1, dreamId: null, share: 'everyone', mood: null,
                 lucid: false, recur: false, expanded: false, poll: null, rec: null,
                 tags: [],
                 audios: [] };   // her spoken takes, saved by /transcribe
  var sh = document.getElementById('sheet');
  document.getElementById('st1').hidden = false;
  document.getElementById('st2').hidden = true;
  document.getElementById('draft').value = '';
  document.querySelectorAll('.three .el').forEach(function(t){ t.value = ''; });
  document.querySelectorAll('.moods button, #lucidBtn, #recurBtn').forEach(function(b){ b.classList.remove('on'); });
  document.getElementById('moodFree').value = '';
  document.getElementById('micBtn').classList.remove('rec');
  document.getElementById('illusBtn').disabled = false;
  document.getElementById('friendNote').hidden = true;
  document.querySelectorAll('#sheet .dial button').forEach(function(b){
    b.classList.toggle('on', b.dataset.s === 'everyone');
  });
  document.getElementById('streakLine').textContent = '';
  sh.hidden = false;
  document.body.style.overflow = 'hidden';
  api('/me').then(function(r){
    composeInfo = r;
    // Just the streak — the write-fast line and "last night: …" are gone (Sophie).
    if (r.streak > 0) {
      document.getElementById('streakLine').textContent = '☾ night ' + r.streak + ' of your streak';
    }
  }).catch(function(){});
}
function closeCompose(){
  clearTimeout(sheetState && sheetState.poll);
  if (sheetState && sheetState.rec) { try { sheetState.rec.stop(); } catch (e) {} }
  document.getElementById('sheet').hidden = true;
  document.body.style.overflow = '';
}

var SHARDS = ['i was somewhere i knew, but it was wrong ',
              'it started in the middle of something ',
              'there was water where there should not have been ',
              'someone was there who could not have been '];

/* voice → words: MediaRecorder while the mic button reads dark, then the
   bytes go to /transcribe and the transcript lands in the box */
async function toggleRec(){
  var btn = document.getElementById('micBtn');
  if (sheetState.rec) { sheetState.rec.stop(); return; }
  try {
    var stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) { toast('the microphone said no'); return; }
  var mime = window.MediaRecorder && MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : 'audio/webm';
  var rec = new MediaRecorder(stream, { mimeType: mime });
  var chunks = [];
  rec.ondataavailable = function(e){ if (e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = function(){
    stream.getTracks().forEach(function(t){ t.stop(); });
    sheetState.rec = null;
    btn.classList.remove('rec');
    transcribeBlob(new Blob(chunks, { type: mime }));
  };
  sheetState.rec = rec;
  btn.classList.add('rec');
  rec.start();
}
async function transcribeBlob(blob){
  if (!blob || !blob.size) return;
  toast('listening back…');
  try {
    var tok = await fbAuth.currentUser.getIdToken();
    var r = await fetch(API + '/transcribe', {
      method: 'POST', body: blob,
      headers: { authorization: 'Bearer ' + tok, 'content-type': blob.type || 'audio/mp4' },
    });
    var jn = await r.json();
    if (!r.ok) throw new Error(jn.error || 'something went wrong');
    // the recording itself rides along, so the dream can be LISTENED to later
    if (jn.audio) sheetState.audios.push({ url: jn.audio, duration: jn.duration || 0 });
    var box = document.getElementById('draft');
    box.value = (box.value.trim() ? box.value.trim() + ' ' : '') + jn.text;
  } catch (e) { toast(e.message); }
}

function elemsNow(){
  return [].map.call(document.querySelectorAll('.three .el'), function(t){ return t.value.trim(); })
    .filter(Boolean);
}

async function illustrate(){
  var text = document.getElementById('draft').value.trim();
  if (!text) { document.getElementById('draft').focus(); return; }
  var btn = document.getElementById('illusBtn');
  btn.disabled = true;
  // Read the free mood box at submit time — iOS dictation can fill a field
  // without ever firing an input event.
  var free = document.getElementById('moodFree').value.trim();
  if (free) sheetState.mood = free;
  var d;
  try {
    d = await api('/dreams', { body: { text: text, mood: sheetState.mood,
      lucid: sheetState.lucid, recurring: sheetState.recur, elems: elemsNow(),
      audio: sheetState.audios } });
    sheetState.dreamId = d.id;
  } catch (e) { toast(e.message); btn.disabled = false; return; }
  try {
    await api('/dreams/' + d.id + '/draw', { body: {} });
  } catch (e) {
    // The dream is SAVED either way (Sophie: "it should save your dream to
    // your own private archive even if it's just a draft") — only the ink is
    // rationed, and the third-of-the-night refusal gets her pop-up.
    closeCompose();
    renderMine(); go('mine');
    popupMsg(e.limit === 'day'
      ? 'sorry — three dreams get their ink each night. this one is saved in your archive; come back tomorrow.'
      : e.message + ' — your dream is saved in your archive; you can draw it from there.');
    return;
  }
  enterStage2(text);
}

function enterStage2(text){
  sheetState.stage = 2;
  document.getElementById('st1').hidden = true;
  document.getElementById('st2').hidden = false;
  document.getElementById('shareBtn2').disabled = false;
  document.getElementById('illusBox').innerHTML =
    '<span class="working">reading your dream… illustrating it in your ink</span>';
  var els = elemsNow();
  document.getElementById('slots').innerHTML = [0, 1, 2].map(function(i){
    return '<div class="slot"><div class="sq2"><span>✎</span></div>' +
      '<div class="slab">' + esc(els[i] || '…') + '</div></div>';
  }).join('');
  paintPreview(text);
  paintTagRow();
  pollDrawing();
}

/* ── who was in it? — tagging, the app's namesake (Sophie, 2026-08-19:
   "the ability to tag someone in your dream … should be on the dream
   sharing page"). Chips of your FRIENDS' names on both sharing surfaces;
   the whole selection posts at once, and only the tagged friend ever sees
   anything — "you were in this dream" on their card. */
var friendsCache = null;
function friendsOnce(){
  if (friendsCache) return Promise.resolve(friendsCache);
  return api('/friends').then(function(r){ friendsCache = r.friends || []; return friendsCache; });
}
function tagChip(f, on){
  return '<button data-pair="' + esc(f.pair || f.id) + '"' + (on ? ' class="on"' : '') + '>' +
    esc(f.name) + '</button>';
}
function paintTagRow(){
  friendsOnce().then(function(fs){
    var row = document.getElementById('tagRow');
    if (!fs.length || !sheetState || sheetState.stage !== 2) { row.hidden = true; return; }
    var box = document.getElementById('tagChips');
    box.innerHTML = fs.map(function(f){ return tagChip(f, sheetState.tags.indexOf(f.id) !== -1); }).join('');
    row.hidden = false;
    box.querySelectorAll('button').forEach(function(b){
      b.addEventListener('click', function(){
        var i = sheetState.tags.indexOf(b.dataset.pair);
        if (i === -1) sheetState.tags.push(b.dataset.pair); else sheetState.tags.splice(i, 1);
        b.classList.toggle('on', i === -1);
      });
    });
  }).catch(function(){});
}

function paintPreview(text){
  var el = document.getElementById('preview');
  var t = text.trim();
  if (sheetState.expanded || t.length <= 150) {
    el.innerHTML = esc(t) + (t.length > 150 ? ' <button>see less</button>' : '');
  } else {
    el.innerHTML = esc(t.slice(0, 150).trim()) + '… <button>see more</button>';
  }
  var b = el.querySelector('button');
  if (b) b.addEventListener('click', function(){ sheetState.expanded = !sheetState.expanded; paintPreview(text); });
}
function pollDrawing(){
  clearTimeout(sheetState.poll);
  api('/dreams/' + sheetState.dreamId).then(function(d){
    var box = document.getElementById('illusBox');
    if (d.panels && d.panels.length) {
      box.innerHTML = '<img src="' + d.panels[0].url + '" alt="your dream, illustrated">';
      document.querySelectorAll('#slots .sq2 span').forEach(function(p){ p.remove(); });
      return;
    }
    if (d.drawJob && d.drawJob.status === 'failed') {
      box.innerHTML = '<span class="werr">' + esc(d.drawJob.error || 'the drawing failed') + '</span>';
      return;
    }
    sheetState.poll = setTimeout(pollDrawing, 4000);
  }).catch(function(){ sheetState.poll = setTimeout(pollDrawing, 6000); });
}

/* Sharing while the ink is still working needs nothing from the client: the
   server marks a landing picture public by itself when the dream is already
   out (the draw job re-reads the doc as it finishes). */
async function shareDream(){
  var btn = document.getElementById('shareBtn2');
  btn.disabled = true;
  try {
    if (sheetState.tags.length) {
      await api('/dreams/' + sheetState.dreamId + '/tags', { body: { pairs: sheetState.tags } });
    }
    if (sheetState.share === 'private') {
      closeCompose(); renderMine(); toast('kept in your archive — only you');
      return;
    }
    await api('/dreams/' + sheetState.dreamId + '/audience', { body: { audience: sheetState.share } });
    closeCompose();
    await renderFeed(); go('feed');
    toast(sheetState.share === 'friends' ? 'shared with your friends \u263e' : 'you\u2019re in tonight\u2019s feed');
  } catch (e) {
    btn.disabled = false;
    if (e.limit === 'day') popupMsg(e.message + ' — it stays safe in your archive.');
    else toast(e.message);
  }
}

/* ── one dream (detail: name, draw, who sees it) ──
   Per DREAM since 2026-08-19 (the night screen "appended" her dreams). The
   sharing sits at the TOP as the three-stop dial (Sophie: "have the sharing
   at the top and make it the toggle thing"), and the floating close button
   is the way back — a long rambling dream must never strand her scrolling
   for an exit. The "in today's feed until midnight" line is gone: with the
   gate off a shared dream simply stays in the feed. */
var dreamPoll = null;
function openDream(id, from){
  openDreamId = id; cameFrom = from || 'mine';
  go('dream');
  renderDream();
}
function closeDreamScreen(){
  clearTimeout(dreamPoll);
  stopListen();
  if (cameFrom === 'feed') { renderFeed(); go('feed'); } else { renderMine(); go('mine'); }
}
function audLabel(aud){
  return aud === 'private' ? 'just yours again'
    : aud === 'friends' ? 'shared with your friends \u263e' : 'you\u2019re in the feed';
}
/* ── listening back: the takes play in order, one button toggles ── */
var listenPlayer = null;
function stopListen(){
  if (listenPlayer) { listenPlayer.pause(); listenPlayer = null; }
  var b = document.getElementById('listenBtn');
  if (b) b.innerHTML = PLAY + '<span>listen to this dream</span>';
}
function startListen(takes){
  var i = 0;
  var next = function(){
    if (!listenPlayer && i > 0) return;   // stopped mid-way
    if (i >= takes.length) { stopListen(); return; }
    listenPlayer = new Audio(takes[i].url);
    listenPlayer.onended = function(){ i++; next(); };
    listenPlayer.play().catch(function(){ toast('couldn’t play the recording'); stopListen(); });
  };
  next();
  var b = document.getElementById('listenBtn');
  if (b) b.innerHTML = PAUSE + '<span>pause</span>';
}

async function renderDream(){
  clearTimeout(dreamPoll);
  stopListen();
  var el = scr.dream;
  var d;
  try { d = await api('/dreams/' + openDreamId); }
  catch (e) { el.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; return; }
  var drawing = d.drawJob && d.drawJob.status === 'drawing';
  var failed = d.drawJob && d.drawJob.status === 'failed';
  // HER ORDER (2026-08-19): the picture in its goofy frame on top, then the
  // sharing dial, then the listen button, then the words.
  var top;
  if (drawing) {
    top = '<div class="illus"><span class="working">drawing your dream…</span></div>' +
      '<div class="quiet">You can leave — the drawing will be here when it’s done.</div>';
  } else if ((d.panels || []).length) {
    top = '<div class="illus" id="dreamPic"><img src="' + d.panels[0].url + '" alt=""></div>';
  } else {
    top = '<button class="btn sub" id="drawBtn"><span class="star">' + STAR + '</span> draw it</button>' +
      (failed ? '<div class="err">' + esc(d.drawJob.error) + '</div>' : '');
  }
  var aud = d.audience || (d.publicOn ? 'everyone' : 'private');
  var takes = d.audio || [];
  el.innerHTML =
    '<div class="backrow"><button id="backBtn">' + BACK + 'back</button></div>' +
    '<div class="dtop">' + top + '</div>' +
    '<div class="seenby sharebar"><span>seen by</span>' +
      '<div class="dial" id="audDial">' +
        '<button data-s="everyone"' + (aud === 'everyone' ? ' class="on"' : '') + '>everyone</button>' +
        '<button data-s="friends"' + (aud === 'friends' ? ' class="on"' : '') + '>friends</button>' +
        '<button data-s="private"' + (aud === 'private' ? ' class="on"' : '') + '>just me</button>' +
      '</div></div>' +
    (aud === 'friends'
      ? '<div class="quiet" style="text-align:center">your accepted friends, plus any dream team you switched on</div>'
      : '') +
    (takes.length
      ? '<button class="listenbtn" id="listenBtn">' + PLAY + '<span>listen to this dream</span></button>'
      : '') +
    '<div class="moodrow" id="dreamTags" hidden>' +
      '<span>who was in it?</span><div class="moods"></div></div>' +
    '<div class="post">' +
    (d.title ? '<div class="ttl">' + esc(d.title) + '</div>' : '<div class="naming">finding its name…</div>') +
    '<div class="meta">' + ago(d.createdAt) + ' ago</div>' +
    '<div class="words">' + esc(d.text) + '</div></div>' +
    // an old comic dream keeps its remaining pages under the words
    ((d.panels || []).length > 1 ? plainGrid(d.panels.slice(1)) : '');
  document.getElementById('backBtn').addEventListener('click', closeDreamScreen);
  var pic = document.getElementById('dreamPic');
  if (pic) pic.addEventListener('click', function(){ openLightbox(d.panels, 0); });
  var lbtn = document.getElementById('listenBtn');
  if (lbtn) lbtn.addEventListener('click', function(){
    if (listenPlayer) stopListen(); else startListen(takes);
  });
  var drawBtn = document.getElementById('drawBtn');
  if (drawBtn) drawBtn.addEventListener('click', async function(){
    this.disabled = true;
    try { await api('/dreams/' + openDreamId + '/draw', { body: {} }); renderDream(); }
    catch (e) {
      this.disabled = false;
      if (e.limit === 'day') popupMsg('sorry — three dreams get their ink each night. come back tomorrow.');
      else toast(e.message);
    }
  });
  // who was in it — chips saved on the tap, like the dial above them
  friendsOnce().then(function(fs){
    var row = document.getElementById('dreamTags');
    if (!row || !fs.length) return;
    var picked = (d.tags || []).map(function(t){ return t.pair; });
    var box = row.querySelector('.moods');
    box.innerHTML = fs.map(function(f){ return tagChip(f, picked.indexOf(f.id) !== -1); }).join('');
    row.hidden = false;
    box.querySelectorAll('button').forEach(function(b){
      b.addEventListener('click', async function(){
        var i = picked.indexOf(b.dataset.pair);
        if (i === -1) picked.push(b.dataset.pair); else picked.splice(i, 1);
        b.classList.toggle('on', i === -1);
        try { await api('/dreams/' + openDreamId + '/tags', { body: { pairs: picked } }); }
        catch (e) { toast(e.message); }
      });
    });
  }).catch(function(){});
  el.querySelectorAll('#audDial button').forEach(function(b){
    b.addEventListener('click', async function(){
      if (b.classList.contains('on')) return;
      try {
        await api('/dreams/' + openDreamId + '/audience', { body: { audience: b.dataset.s } });
        toast(audLabel(b.dataset.s));
        renderDream();
      } catch (e) {
        if (e.limit === 'day') popupMsg(e.message + ' — it stays safe in your archive.');
        else toast(e.message);
      }
    });
  });
  // keep polling while the name or the drawing is still landing
  if (!d.title || drawing) dreamPoll = setTimeout(renderDream, drawing ? 4000 : 1500);
}

/* ── my dreams ── */

/* ── dream teams — where friends-posts route (see THE DIAL in dreamapp.js) ──

function legacyCopy(text){
  var t = document.createElement('textarea');
  t.value = text; document.body.appendChild(t); t.select();
  try { document.execCommand('copy'); } catch (e) {}
  t.remove();
}

/* ── friends — mutual, ask-and-accept (THE DIAL in dreamapp.js) ──
   "Like following on Instagram except you can't follow someone, you have to
   let them accept you — a two-way Facebook model" (Sophie). The ask happens
   on a dreamer's PROFILE (below), reached from their dream in the feed — no
   links, no directory; nothing happens until the owner says yes; the yes is
   the holding-hands moment, on BOTH phones — the accepter right on the tap,
   the asker the next time the app checks (boot, or opening this screen). */
async function renderFriends(){
  var el = scr.friends;
  el.innerHTML = '<div class="backrow"><button id="frBack">' + BACK + 'back</button></div>' +
    '<div class="quiet">loading…</div>';
  var wireBack = function(){
    document.getElementById('frBack').addEventListener('click', function(){ renderMine(); go('mine'); });
  };
  try {
    var r = await api('/friends');

    r.asks.forEach(function(a){

        '<div class="minefoot" style="padding:12px 0 0"><button data-yes="' + a.id + '">say yes</button>' +
        '<button data-no="' + a.id + '">not now</button></div></div>';

        '<button class="st" data-un="' + f.id + '">remove</button></div>';
    });

      // no names — you asked nameless profiles, and they stay that way

      html += '<div class="quiet">waiting on ' + r.waiting.length +
        (r.waiting.length === 1 ? ' answer' : ' answers') + '</div>';
    }
    html += '<div class="quiet">you make friends from their dreams — tap the little person on ' +
      'a dream in the feed and ask there. nothing happens until the other side says yes. ' +
      '☾ friends dreams reach everyone on this screen, plus any dream team you switched on.</div>';
    el.innerHTML = html;
    wireBack();
    el.querySelectorAll('[data-yes]').forEach(function(b){
      b.addEventListener('click', async function(){
        b.disabled = true;
        try {
          var a = await api('/friends/accept', { body: { id: b.dataset.yes } });
          celebrateHands(a.name);
          renderFriends();
        } catch (e) { toast(e.message); b.disabled = false; }
      });
    });
    el.querySelectorAll('[data-no]').forEach(function(b){
      b.addEventListener('click', async function(){

        catch (e) { toast(e.message); }
      });
    });
    el.querySelectorAll('[data-un]').forEach(function(b){
      b.addEventListener('click', async function(){
        // two taps on purpose — unfriending is the one destructive thing here
        if (!b.dataset.armed) { b.dataset.armed = '1'; b.textContent = 'sure?'; return; }
        try { await api('/friends/remove', { body: { id: b.dataset.un } }); renderFriends(); }
        catch (e) { toast(e.message); }
      });
    });
  } catch (e) {
    el.innerHTML = '<div class="backrow"><button id="frBack">' + BACK + 'back</button></div>' +
      '<div class="err">' + esc(e.message) + '</div>';

/* The holding-hands moment (Sophie: "some kind of graphic showing holding
   hands because you just became friends"). Same overlay contract as the
   how card: page locked behind it, any tap closes, scroll put back. Her
   line for it says "all of your dreams" — this says just "your dreams",
   because the vault stays private whatever friendship says. */
function celebrateHands(name){
  if (document.getElementById('handswrap')) return;
  var y = window.scrollY;
  if (window.__scrollStop) window.__scrollStop();
  var w = document.createElement('div');
  w.className = 'howwrap'; w.id = 'handswrap';
  w.innerHTML = '<div class="hands">' + HANDS +
    '<div class="hbig">you’re holding hands</div>' +
    '<div class="hsml">you and ' + esc(name) + ' are friends now — they can see your dreams, and you can see theirs</div></div>';
  document.body.appendChild(w);
  document.body.style.overflow = 'hidden';
  w.addEventListener('click', function(){
    w.remove();
    if (document.getElementById('lb').hidden) { document.body.style.overflow = ''; window.scrollTo(0, y); }
  });
}

/* The asker's side of the moment: remember which asks are out; the first
   time one of them comes back accepted, hold hands. */
function handsKey(){ return 'dreamapp-hands-waiting'; }
function syncHands(r){
  var was = [];
  try { was = JSON.parse(localStorage.getItem(handsKey()) || '[]'); } catch (e) {}
  var accepted = (r.friends || []).filter(function(f){ return was.indexOf(f.id) !== -1; });
  localStorage.setItem(handsKey(), JSON.stringify((r.waiting || []).map(function(w){ return w.id; })));
  if (accepted.length) celebrateHands(accepted[0].name);
}
function checkHands(){
  api('/friends').then(syncHands).catch(function(){});
}

/* ── a dreamer's profile — nameless, not anonymous (Sophie) ──
   "The name doesn't show on the sheet, but if you click on the dream
   there's a way to see all the dreams from that person — basically there is
   a profile, but their name isn't attached." Reached from any card's
   "their dreams"; carries the one friend button ("ask if they want to be
   friends", her words); the name appears only once you're holding hands. */
var dreamerId = null;
function openDreamer(id){ dreamerId = id; renderDreamer(); go('dreamer'); }
async function renderDreamer(){
  var el = scr.dreamer;
  var backHtml = '<div class="backrow"><button id="drBack">' + BACK + 'back</button></div>';
  var wireBack = function(){
    document.getElementById('drBack').addEventListener('click', function(){ renderFeed(); go('feed'); });
  };
  el.innerHTML = backHtml + '<div class="quiet">loading…</div>';
  wireBack();
  try {
    var r = await api('/dreamer/' + dreamerId);
    var friendRow = '';
    if (r.state === 'none') {
      friendRow = '<div class="minefoot" style="justify-content:flex-start;padding:2px 0 6px">' +
        '<button data-ask>ask if they want to be friends</button></div>';
    } else if (r.state === 'asked') {
      friendRow = '<div class="quiet" style="margin-top:0">you asked — it’s their yes now</div>';
    } else if (r.state === 'asks-you') {
      friendRow = '<div class="minefoot" style="justify-content:flex-start;padding:2px 0 6px">' +
        '<button data-dyes="' + esc(r.pairId) + '">they asked you — say yes</button></div>';
    } else if (r.state === 'friends') {
      friendRow = '<div class="quiet" style="margin-top:0">☾ you’re holding hands</div>';
    }
    var html = backHtml +
      '<div class="h2">' + (r.name ? esc(r.name) + '’s dreams' : 'their dreams') + '</div>' +
      friendRow;
    var dark = true, card = 0, img = 0;
    (r.dreams || []).forEach(function(n){
      feedEntry[n.id] = n;
      var hasImg = !!n.cover;
      var dk = n.audience === 'friends' ? true : !dark;
      dark = dk;
      html += meltCard(n, dk, hasImg && img % 2 === 1, 8 + (card % 4));
      card++;
      if (hasImg) img++;
    });
    if (!(r.dreams || []).length) html += '<div class="quiet">nothing shared yet.</div>';
    el.innerHTML = html;
    wireBack();
    wireDreams(el);
    // every card here is the same dreamer — the way in would only loop
    el.querySelectorAll('.whobtn').forEach(function(b){ b.hidden = true; });
    var ask = el.querySelector('[data-ask]');
    if (ask) ask.addEventListener('click', async function(){
      ask.disabled = true;
      try {
        var a = await api('/friends/ask', { body: { dream: dreamerId } });
        if (a.state === 'friends') { celebrateHands(a.name || 'a dreamer'); renderDreamer(); return; }
        if (a.state === 'asked' && a.id) {
          var was = [];
          try { was = JSON.parse(localStorage.getItem(handsKey()) || '[]'); } catch (e) {}
          if (was.indexOf(a.id) === -1) { was.push(a.id); localStorage.setItem(handsKey(), JSON.stringify(was)); }
        }
        renderDreamer();
      } catch (e) { toast(e.message); ask.disabled = false; }
    });
    var dyes = el.querySelector('[data-dyes]');
    if (dyes) dyes.addEventListener('click', async function(){
      dyes.disabled = true;
      try {
        var a = await api('/friends/accept', { body: { id: dyes.dataset.dyes } });
        celebrateHands(a.name);
        renderDreamer();
      } catch (e) { toast(e.message); dyes.disabled = false; }
    });
  } catch (e) {
    el.innerHTML = backHtml + '<div class="err">' + esc(e.message) + '</div>';
    wireBack();
  }
}

/* Arrived through an invite link (/t/<code>): join once signed in, then fold
   the address back to the app's own home so a reload doesn't re-join. */
var joinedFromPath = false;
function joinFromPath(){
  var m = location.pathname.match(/^\/t\/([A-Za-z0-9_-]{6,})$/);
  if (!m || joinedFromPath) return;
  joinedFromPath = true;
  var home = /youwereinmydreams/.test(location.hostname) ? '/' : '/dreamfeed';
  api('/teams/join', { body: { code: m[1] } }).then(function(t){
    history.replaceState({}, '', home);
    toast('you’re in “' + t.name + '” ☾');
  }).catch(function(e){
    history.replaceState({}, '', home);
    toast(e.message);
  });
}

/* ── auth ── */
function loadScript(src){ return new Promise(function(ok, bad){
  var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = bad; document.head.appendChild(s); }); }

async function boot(){
  scr.feed = document.getElementById('scr-feed');
  scr.mine = document.getElementById('scr-mine');
  scr.dream = document.getElementById('scr-dream');
  scr.teams = document.getElementById('scr-teams');
  scr.friends = document.getElementById('scr-friends');
  scr.dreamer = document.getElementById('scr-dreamer');

  var cfg = await (await fetch('/api/witch/firebase-config')).json();
  var base = 'https://www.gstatic.com/firebasejs/10.12.0/';
  await loadScript(base + 'firebase-app-compat.js');
  await loadScript(base + 'firebase-auth-compat.js');
  firebase.initializeApp({ apiKey: cfg.apiKey, authDomain: cfg.authDomain, projectId: cfg.projectId,
    storageBucket: cfg.storageBucket, messagingSenderId: cfg.messagingSenderId, appId: cfg.appId });
  fbAuth = firebase.auth();
  // Coming back from a redirect sign-in: surface a real failure instead of
  // silently landing on the sign-in screen again.
  fbAuth.getRedirectResult().catch(function(e){
    if (e && e.code === 'auth/account-exists-with-different-credential') {
      showErr('That Apple ID uses the same email as your Google account — tap "Continue with Google" instead.');
    } else if (e && e.code) {
      showErr(String(e.message || e).replace(/^Firebase: /, '').replace(/ \(auth.*\)\.?$/, ''));
    }
  });

  fbAuth.onAuthStateChanged(function(u){
    user = u;
    document.getElementById('gate').hidden = !!u;
    document.getElementById('app').hidden = !u;
    if (u) {
      renderFeed(); renderMine(); go('feed');
      joinFromPath();        // came in through a dream-team invite link
      checkHands();          // an ask of yours said yes while you were away?
    }
  });

  // A popup cannot open inside an embedded web view (and phone browsers block
  // them freely), so every provider sign-in falls back to a full-page redirect
  // rather than dead-ending on auth/popup-blocked.
  var POPUP_FAILS = ['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment',
                     'auth/popup-closed-by-user', 'auth/cancelled-popup-request', 'auth/web-storage-unsupported'];
  async function providerSignIn(provider){
    try {
      await fbAuth.signInWithPopup(provider);
    } catch (e) {
      if (POPUP_FAILS.indexOf(e.code) !== -1) { await fbAuth.signInWithRedirect(provider); return; }
      throw e;
    }
  }
  document.getElementById('googleBtn').addEventListener('click', async function(){
    hideErr();
    try { await providerSignIn(new firebase.auth.GoogleAuthProvider()); }
    catch (e) { showErr(String(e.message || e).replace(/^Firebase: /, '').replace(/ \(auth.*\)\.?$/, '')); }
  });
  // Apple is already enabled on this Firebase project (set up for XI), and
  // this domain is authorized — so the provider needs no extra config here.
  document.getElementById('appleBtn').addEventListener('click', async function(){
    hideErr();
    try {
      var p = new firebase.auth.OAuthProvider('apple.com');
      p.addScope('email'); p.addScope('name');
      await providerSignIn(p);
    } catch (e) {
      // Same email on an existing Google account: both providers verify their
      // emails, so signing in with Google resolves it in one tap (XI's fallback).
      if (e.code === 'auth/account-exists-with-different-credential' || e.code === 'auth/email-already-in-use') {
        showErr('That Apple ID uses the same email as your Google account — tap "Continue with Google" instead.');
      } else { showErr(String(e.message || e).replace(/^Firebase: /, '').replace(/ \(auth.*\)\.?$/, '')); }
    }
  });
  document.getElementById('emailBtn').addEventListener('click', async function(){
    hideErr();
    var email = document.getElementById('email').value.trim();
    var pw = document.getElementById('pw').value;
    if (!email || !pw) return showErr('email and password, both');
    try {
      if (signUpMode) await fbAuth.createUserWithEmailAndPassword(email, pw);
      else await fbAuth.signInWithEmailAndPassword(email, pw);
    } catch (e) { showErr(e.message.replace(/^Firebase: /, '').replace(/ \(auth.*\)\.?$/, '')); }
  });
  document.getElementById('swapBtn').addEventListener('click', function(){
    signUpMode = !signUpMode;
    document.getElementById('emailBtn').textContent = signUpMode ? 'Create account' : 'Sign in';
    this.textContent = signUpMode ? 'Have an account? Sign in' : 'New here? Create an account';
  });
  // one header word swaps between the feed and your private dreams
  document.getElementById('navMine').addEventListener('click', function(){
    if (scr.feed.hidden) { renderFeed(); go('feed'); }
    else { renderMine(); go('mine'); }
  });
  // the wordmark is the way home, on the app AND on the compose sheet (Sophie:
  // "the header at the top … should take me back to the feed")
  document.getElementById('markBtn').addEventListener('click', function(){
    renderFeed(); go('feed');
  });
  document.getElementById('smarkBtn').addEventListener('click', function(){
    closeCompose(); renderFeed(); go('feed');
  });
  document.getElementById('confessBtn').addEventListener('click', openCompose);
  // An iOS tab restored from a snapshot can hold a render from days ago —
  // that is exactly how her archive showed one dream on a six-dream account.
  // Coming back to the app re-reads whichever list screen is up (the feed
  // only from its top, so the page never moves under her thumb mid-read).
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState !== 'visible' || !user) return;
    if (!scr.mine.hidden) renderMine();
    else if (!scr.feed.hidden && !openCard && window.scrollY < 40) renderFeed();
  });
  // one floating close, two doors: an opened feed card, or the dream screen
  document.getElementById('closeDream').addEventListener('click', function(){
    if (openCard) setOpen(openCard, false);
    else if (!scr.dream.hidden) closeDreamScreen();
  });
  document.getElementById('sheetX').addEventListener('click', closeCompose);
  document.getElementById('micBtn').addEventListener('click', toggleRec);
  document.getElementById('fileBtn').addEventListener('click', function(){
    document.getElementById('fileInput').click();
  });
  document.getElementById('fileInput').addEventListener('change', function(){
    var f = this.files && this.files[0];
    this.value = '';
    if (f) transcribeBlob(f);
  });
  document.getElementById('shardBtn').addEventListener('click', function(){
    document.getElementById('draft').value = SHARDS[Math.floor(Math.random() * SHARDS.length)];
    document.getElementById('draft').focus();
  });
  document.getElementById('lucidBtn').addEventListener('click', function(){
    sheetState.lucid = this.classList.toggle('on');
  });
  document.getElementById('recurBtn').addEventListener('click', function(){
    sheetState.recur = this.classList.toggle('on');
  });
  document.querySelectorAll('.moods button').forEach(function(b){
    b.addEventListener('click', function(){
      var was = b.classList.contains('on');
      document.querySelectorAll('.moods button').forEach(function(x){ x.classList.remove('on'); });
      document.getElementById('moodFree').value = '';
      sheetState.mood = was ? null : b.dataset.mood;
      if (!was) b.classList.add('on');
    });
  });
  // the fifth feeling, in her own word — typing it stands the presets down
  document.getElementById('moodFree').addEventListener('input', function(){
    var v = this.value.trim();
    if (v) document.querySelectorAll('.moods button').forEach(function(x){ x.classList.remove('on'); });
    sheetState.mood = v || null;
  });
  document.querySelectorAll('#sheet .dial button').forEach(function(b){
    b.addEventListener('click', function(){
      document.querySelectorAll('#sheet .dial button').forEach(function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      sheetState.share = b.dataset.s;
      document.getElementById('friendNote').hidden = (b.dataset.s !== 'friends');
    });
  });
  document.getElementById('illusBtn').addEventListener('click', illustrate);
  document.getElementById('shareBtn2').addEventListener('click', shareDream);
}
function showErr(m){ var e = document.getElementById('gateErr'); e.textContent = m; e.hidden = false; }
function hideErr(){ document.getElementById('gateErr').hidden = true; }

boot();
</script>
</body>
</html>
