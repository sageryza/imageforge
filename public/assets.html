<!doctype html>
<!-- META ASSETS (Aug 2026, Sophie: "pull every asset from every chat into one
     place … automatic, they won't have to file them themselves … in order of
     when it was filed. It will look the same as the normal assets … if an
     image gets hearted or ✕'d here, the heart also applies to the original
     image in the chat and vice versa").

     One read: GET /api/gallery/assets/all — every chat's Assets tab,
     interleaved newest-first. NOTHING files into this page; it is a view over
     forge-chat-assets, so a filing into any chat's tab is here automatically.

     THE SYNC IS FREE BY DESIGN: every row carries its origin chat, and the
     ♥/✕/note here POSTs against that chat's own vote doc (the same
     deterministic chat+url id the chat's tab uses) — so a heart here IS the
     heart there, in both directions, with no mirroring machinery to drift.

     The look and the widgets are the chat Assets tab's own (chats.html):
     the tile grid, the New/♥/Hide ✕ filter, the search box on the house
     grammar, the lightbox with ♥/✕ over the image, the PROMPT overlay
     (Content first), the note thread underneath. One addition earns its
     place: the origin chat's name rides under each label, because on a mixed
     page "whose is this" is part of what a tile says.

     Pill contract (this page is served with the injected pill): the pill's
     own element palette already matches this paper theme; the page script is
     an IIFE; taps pause the autoscroll through window.__scrollTap(e) (shared
     skip list); the lightbox freezes the page and restores scrollY.
     Rules for pages: .claude/skills/new-page. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Meta Assets</title>
<style>
:root{ --paper:#f6f2e9; --ink:#26221c; --ink2:#8a8377; --line:#d9d2c2; --rose:#a5586a; --chg:#b3443f; --barbg:#fffdf7; }
@media (prefers-color-scheme: dark){:root{--paper:#191713; --ink:#e8e2d6; --ink2:#97907f; --line:#37322a; --rose:#c98a99; --chg:#e08b84; --barbg:#211e19;}}
:root[data-theme="dark"]{--paper:#191713; --ink:#e8e2d6; --ink2:#97907f; --line:#37322a; --rose:#c98a99; --chg:#e08b84; --barbg:#211e19;}
:root[data-theme="light"]{--paper:#f6f2e9; --ink:#26221c; --ink2:#8a8377; --line:#d9d2c2; --rose:#a5586a; --chg:#b3443f; --barbg:#fffdf7;}
html{background:var(--paper);}
body{margin:0; touch-action:manipulation; background:var(--paper); color:var(--ink); font-family:Georgia,serif;}
[hidden]{display:none !important}
.wrap{max-width:34em; margin:0 auto; padding:calc(14px + env(safe-area-inset-top)) 5vw calc(16vh + env(safe-area-inset-bottom));}
/* The title, once — the pill owns the top-right corner, so the row stops 64px
   short of it (56 is a hair too tight at 390pt; measured on /chunking). */
.app-header{display:flex; align-items:center; min-height:34px; padding-right:64px; margin:0 0 14px;}
.app-header h1{font-family:-apple-system,'Helvetica Neue',sans-serif; font-size:11px; letter-spacing:.34em;
  color:var(--ink2); text-transform:uppercase; font-weight:400; margin:0;}
.state{font-style:italic; color:var(--ink2); text-align:center; padding:4em 0;}
.state.more{padding:1.4em 0;}
/* ── the Assets tab's own widgets, verbatim from chats.html ─────────────── */
.arow{display:flex; align-items:center; gap:10px; margin:0 0 10px;}
.afilter{display:flex; border:1.5px solid var(--line); border-radius:999px; overflow:hidden; background:var(--barbg); flex:none;}
.afilter button{border:none; background:transparent; color:var(--ink2); font-family:-apple-system,sans-serif; font-size:11px;
  letter-spacing:.04em; padding:7px 12px; margin:0; cursor:pointer;}
.afilter button+button{border-left:1px solid var(--line);}
.afilter button.on{background:var(--rose); color:#fff;}
.asearch{position:relative; margin:0 0 12px;}
/* 16px MINIMUM on every input on this page (found live 2026-08-18 on Sophie's
   phone): iOS auto-zooms when an input under 16px gets focus, that zoom
   IGNORES user-scalable=no — and user-scalable=no then blocks pinching back
   out, so one tap on a 15px search box left the whole page stuck zoomed
   ~1.7x, panning sideways. chats.html's search box is 16px for this reason. */
.asearch input{width:100%; box-sizing:border-box; font-family:Georgia,serif;
  font-size:16px; color:var(--ink); background:var(--barbg); border:1.5px solid var(--line); border-radius:6px;
  padding:9px 38px 9px 12px;}
.asearch input:focus{outline:none; border-color:var(--rose);}
.asearch input::-webkit-search-cancel-button{-webkit-appearance:none; appearance:none;}
.qclear{position:absolute; right:2px; top:50%; transform:translateY(-50%); width:32px; height:32px; border:none; background:none; color:var(--ink2); font-size:22px; line-height:1; cursor:pointer; border-radius:6px;}
/* minmax(0,1fr), NOT bare 1fr, and min-width:0 down the chain (found live
   2026-08-18 on Sophie's phone, second visit): a bare 1fr track can never
   shrink below its content's automatic minimum size, and in WebKit the
   nowrap .who line's minimum is the FULL untruncated chat name (~200px) —
   the max-width:100% clamp is indefinite during intrinsic sizing there — so
   every tile blew out to the longest chat name on the page and the grid ran
   ~630pt wide on a 390pt screen ("every image way too big", panning
   sideways). Chromium clamps that minimum, which is why no headless test
   reproduced it. minmax(0,1fr) caps each track at a third of the container
   BY CONSTRUCTION, whatever any engine thinks the content wants. */
.assetgrid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin:.4em 0 2em;}
.assetgrid .acell{min-width:0;}
.assetgrid button{position:relative; margin:0; padding:0; border:none; background:none; cursor:pointer; display:flex; flex-direction:column; text-align:left; min-width:0;}
/* The TILE button needs an explicit width: a <button> shrink-wraps to its
   content even as display:flex (it never stretches like a div), so the
   nowrap chat-name line inflated it to the string's width and the image
   followed at 100% of that. Scoped off the ♥/✕ circles — this selector on
   the bare `button` outranks .vote and a width there stretched the circles
   across the tile (both halves caught by the headless test). */
.assetgrid .acell>button:not(.vote){width:100%;}
.assetgrid img{width:100%; aspect-ratio:1; object-fit:cover; border-radius:6px; border:1px solid var(--line); display:block; background:var(--barbg);}
/* Two lines on the tile, no more (Sophie, Aug 2026) — the full text lives in
   the lightbox caption. */
.assetgrid .lbl{font-size:11px; line-height:1.3; color:var(--ink2); margin-top:3px; text-align:left; word-break:break-word;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-width:0; max-width:100%;}
/* the one addition: whose tab this tile lives in. min-width:0 — a nowrap
   flex item's automatic minimum is the whole string; see the grid note. */
.assetgrid .who{font-family:-apple-system,sans-serif; font-size:9px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink2); opacity:.75; margin-top:2px; text-align:left; max-width:100%; min-width:0; align-self:stretch;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.assetgrid .acell{position:relative;}
.vote{width:29px; height:29px; border-radius:50%; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer;
  background:rgba(250,247,240,.82); color:#6b6357;}
.vote svg{width:15px; height:15px; display:block;}
.vote.heart.on{background:#c96a5e; color:#fff;}
.vote.nope.on{background:#3a3530; color:#fff;}
.assetgrid .vote{position:absolute; top:5px;}
.assetgrid .vote.heart{left:5px;}
.assetgrid .vote.nope{right:5px;}
.assetgrid .acell.nay img{opacity:.35; filter:grayscale(60%);}
.assetgrid .nbadge{position:absolute; top:5px; left:50%; transform:translateX(-50%);
  min-width:18px; height:18px; border-radius:9px; background:#5d7a5a; color:#fff;
  font-family:-apple-system,sans-serif; font-size:11px; line-height:18px; text-align:center; padding:0 4px;}
/* ── the lightbox, verbatim from chats.html ─────────────────────────────── */
#clightbox{position:fixed; inset:0; background:rgba(15,13,10,.93); z-index:30; display:none; align-items:center; justify-content:center; padding:18px; flex-direction:column;}
#clightbox img{max-width:100%; max-height:88vh; border-radius:6px;}
#clightbox.hastalk img{max-height:46vh;}
#clightbox .clcap{color:#b9b2a4; font-size:12px; margin-top:12px; text-align:center; letter-spacing:.02em;}
#clightbox .cltag{color:#8a8377; font-size:11px; margin-top:10px; text-align:center; letter-spacing:.06em; text-transform:uppercase;}
#clightbox .cltag + .clcap{margin-top:4px;}
/* compressed at birth — flat rose, its own element beside the words */
#clightbox .compflag{color:#c98b7a; font-weight:600; letter-spacing:.04em;}
#clightbox .lbptext .compflag{display:block; margin-bottom:6px; font-size:11px; text-transform:uppercase;}
#clightbox .clwho{color:#8a8377; font-family:-apple-system,sans-serif; font-size:10px; margin-top:8px; text-align:center; letter-spacing:.12em; text-transform:uppercase;}
#clightbox .clwrap{position:relative; display:flex; align-items:center; justify-content:center; max-width:100%;}
#clightbox .clwrap.pon{min-width:min(86vw,420px); min-height:min(52vh,420px);}
.lbtop{position:absolute; top:max(18px, env(safe-area-inset-top)); left:22px; right:22px; display:flex; gap:8px; align-items:center; justify-content:space-between; z-index:2;}
.lbtop .vote{width:38px; height:38px;}
.lbtop .vote svg{width:18px; height:18px;}
/* The action icons under the image: open the chat it came from, re-run it in
   the Playground, save to Photos. Small circles, one glyph each. */
.lbacts{display:flex; gap:14px; margin-top:10px; justify-content:center;}
.lbacts button{width:34px; height:34px; border-radius:50%; border:none; cursor:pointer;
  background:rgba(250,247,240,.9); color:#3a3530; display:flex; align-items:center; justify-content:center; padding:0;}
.lbacts button svg{width:17px; height:17px; display:block;}
.promptbtn{border:none; border-radius:6px; background:rgba(250,247,240,.9); color:#26221c; padding:7px 11px; margin:0;
  font-family:-apple-system,sans-serif; font-size:12px; letter-spacing:.06em; text-transform:uppercase; cursor:pointer;}
.promptbtn.on{background:#3a3530; color:#faf7f0;}
.lbp{position:absolute; inset:0; border-radius:6px; background:rgba(15,13,10,.95); display:flex; flex-direction:column;
  padding:56px 16px 16px; box-sizing:border-box;}
.lbp .lbptog{display:flex; gap:6px; flex:none; margin-bottom:10px;}
.lbp .lbptog button{flex:1; margin:0; border:1px solid rgba(250,247,240,.35); border-radius:6px; background:none; color:#c8c1b3;
  font-family:-apple-system,sans-serif; font-size:12px; letter-spacing:.06em; text-transform:uppercase; padding:7px 0; cursor:pointer;}
.lbp .lbptog button.on{background:#faf7f0; border-color:#faf7f0; color:#26221c;}
.lbp .lbptext{flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; color:#ece6da;
  font-size:14px; line-height:1.55; white-space:pre-wrap; word-break:break-word;}
.lbtalk{width:min(92vw,360px); margin-top:12px;}
.lbthread{max-height:26vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
  display:flex; flex-direction:column; gap:6px;}
.lbmsg{max-width:82%; padding:7px 10px; border-radius:6px; font-family:Georgia,serif;
  font-size:14px; line-height:1.45; word-break:break-word; white-space:pre-wrap;}
.lbmsg.me{align-self:flex-end; background:rgba(250,247,240,.92); color:#26221c;}
.lbmsg.them{align-self:flex-start; background:rgba(250,247,240,.14); color:#ece6da;}
.lbmsg.pending{opacity:.55;}
.lbmsg.failed{opacity:1; box-shadow:inset 0 0 0 1px #c96a5e; cursor:pointer;}
.lbnote{display:flex; gap:6px; width:100%; margin-top:8px;}
.lbnote input{flex:1; min-width:0; border:none; border-radius:6px; background:rgba(250,247,240,.92); color:#26221c;
  font-family:Georgia,serif; font-size:16px; padding:9px 11px;}   /* 16px floor — see .asearch */
.lbnote .notesend{width:38px; height:38px; border-radius:50%; border:none; background:rgba(250,247,240,.92); color:#5d7a5a;
  display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none;}
.lbnote .notesend svg{width:18px; height:18px; display:block;}
#toast{position:fixed; bottom:calc(64px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
  background:var(--ink); color:var(--paper); font-family:-apple-system,sans-serif; font-size:13px;
  padding:8px 14px; border-radius:6px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:40; white-space:nowrap;}
</style>
<body>
<div class="wrap">
  <header class="app-header"><h1>Meta Assets</h1></header>
  <div id="content"><div class="state">Loading images&hellip;</div></div>
</div>
<div id="clightbox"></div>
<div id="toast"></div>
<script src="/playground-port.js"></script>
<script>
(function(){   // IIFE — the injected pill runs in global scope; never collide
'use strict';
var STUDIO_TOKEN='__STUDIO_TOKEN__';
var TOKEN=STUDIO_TOKEN.indexOf('__')===0?'':STUDIO_TOKEN;
function api(path,opt){ opt=opt||{}; opt.headers=Object.assign({'x-studio-token':TOKEN,'Content-Type':'application/json'},opt.headers||{}); return fetch(path,opt); }
function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.style.opacity=1; setTimeout(function(){t.style.opacity=0},1800); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function assetThumb(u){ return '/api/story/thumb?w=480&url='+encodeURIComponent(u); }
function scrollStop(){ if(window.__scrollStop) window.__scrollStop(); }
// Any tap PAUSES the autoscroll — and only pauses (found live 2026-08-18 on
// Sophie's phone): __scrollTap is the tap-to-TOGGLE gesture, so wiring it to
// every pointerdown made any tap on non-interactive content START the scroll.
// On a grid you browse by tapping, only the pill may start it. The pill
// itself is exempt so a stop here can't repaint it mid-press and eat its
// click (the Cut Marks bug).
document.addEventListener('pointerdown', function(e){
  if(e.target && e.target.closest && e.target.closest('.float')) return;
  if(window.__scrollStop) window.__scrollStop();
}, true);
// The app's nav-bar chevron asks the page first: close the lightbox if it's
// open, else let the app step back / leave the tool.
window.__navBack=function(){
  var lb=document.getElementById('clightbox');
  if(lb && lb.style.display==='flex'){ if(lb.onclick) lb.onclick(); return true; }
  return false;
};

// ── The house search grammar, the same four-box parser chats.html carries ──
function qparse(q){
  var groups=[], re=/(-|!)?(?:"([^"]*)"|(\S+))/g, m, orNext=false, notNext=false;
  while((m=re.exec(String(q||'')))){
    var quoted=m[2]!==undefined, raw=quoted?m[2]:m[3], bare=!m[1]&&!quoted;
    if(bare&&/^or$/i.test(raw)){ orNext=true; continue; }
    if(bare&&/^and$/i.test(raw)) continue;
    if(bare&&/^not$/i.test(raw)){ notNext=true; continue; }
    var v=String(raw==null?'':raw).toLowerCase().replace(/\s+/g,' ').trim();
    if(!v) continue;
    var rx=null;
    try{ rx=new RegExp((/^[a-z0-9]/i.test(v)?'\\b':'')
      +v.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/ /g,'\\s+'),'i'); }catch(_){ rx=null; }
    if(!rx) continue;
    var neg=!!m[1]||notNext, last=groups[groups.length-1];
    if(orNext&&last&&!last.neg&&!neg) last.terms.push(rx);
    else groups.push({neg:neg, terms:[rx]});
    orNext=false; notNext=false;
  }
  return groups;
}
function qmatch(hay, groups){
  for(var i=0;i<groups.length;i++){
    var g=groups[i], hit=false;
    for(var j=0;j<g.terms.length;j++){ if(g.terms[j].test(hay)){ hit=true; break; } }
    if(g.neg?hit:!hit) return false;
  }
  return true;
}
// Search as she DICTATES — iOS dictation can fill a field without firing
// `input`, so the box polls its value while focused (chats.html's liveInput).
function liveInput(el, fn){
  var last=el.value, timer=null;
  function fire(){ if(el.value===last) return; last=el.value; fn(); }
  ['input','change','compositionupdate','compositionend','keyup','paste']
    .forEach(function(ev){ el.addEventListener(ev, function(){ setTimeout(fire,0); }); });
  el.addEventListener('focus', function(){ clearInterval(timer); timer=setInterval(fire,150); });
  el.addEventListener('blur', function(){ clearInterval(timer); timer=null; fire(); });
  return { sync:function(){ last=el.value; } };
}
// RETURN SENDS THE SEARCH (Aug 2026, Sophie: "only the check mark sends the
// search on its way. I'd like the return button to do the same"). A lone
// <input type=search> outside a <form> has nothing to submit to, so Return did
// nothing at all. It runs the search now and drops the keyboard, so what she is
// left looking at is the pictures. Wired beside liveInput on every search box.
function enterSubmits(el, fn){
  el.addEventListener('keydown', function(e){
    if(e.key!=='Enter' && e.keyCode!==13) return;
    e.preventDefault();
    if(fn) fn();
    el.blur();
  });
}

var XMARK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';
// Lucide messages-square — the Chats tool's bubbles, for "open the chat".
var CHATICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9a2 2 0 0 1-2 2H6l-4 4V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2z"/><path d="M18 9h2a2 2 0 0 1 2 2v11l-4-4h-8a2 2 0 0 1-2-2v-1"/></svg>';
// Lucide arrow-down-to-line — save to Photos (the iOS gallery's own glyph).
var SAVEICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17V3"/><path d="m6 11 6 6 6-6"/><path d="M19 21H5"/></svg>';

// The Playground's own wire-loop drawing (the shared tool glyph — a button

// ── Save to Photos, the Playground's own three-path saver ─────────────────
// 1. In the app, the native forgeSave bridge writes it to the photo library.
// 2. In Safari, the share sheet (needs the blob ALREADY fetched — a download
//    inside the tap handler makes navigator.share reject silently).
// 3. A plain download for a desktop browser.
var lbBlob=null;
function prefetchBlob(url){
  lbBlob=null;
  fetch(url).then(function(r){ return r.blob(); })
    .then(function(b){ lbBlob={url:url, blob:b}; }).catch(function(){});
}
function nativeSaver(){ try{ return window.webkit.messageHandlers.forgeSave; }catch(e){ return null; } }
window.__saveResult=function(ok,msg){ toast(msg||(ok?'Saved to Photos':'Couldn’t save that')); };
function saveImage(url){
  var native=nativeSaver();
  if(native){ native.postMessage(url); toast('Saving…'); return; }
  if(!(lbBlob && lbBlob.url===url)){ toast('Still loading that image — try again'); return; }
  var ext=((lbBlob.blob.type||'').split('/')[1]||'png').replace('jpeg','jpg');
  var file=null;
  try{ file=new File([lbBlob.blob],'image.'+ext,{type:lbBlob.blob.type||'image/png'}); }catch(e){}
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file]})
      .catch(function(err){ if(err&&err.name!=='AbortError') toast('Couldn’t open the share sheet'); });
    return;
  }
  var a=document.createElement('a');
  a.href=URL.createObjectURL(lbBlob.blob); a.download='image.'+ext;
  document.body.appendChild(a); a.click(); a.remove();
}

// ── Open in the Playground: land with this image's settings prefilled ─────
// Only offered when the exact prompt is on file (promptContent) — the same
// query promptlab.html reads (?prompt=&style=&quality=), plus `sameref`.
//
// WHICH TILE, AND WHETHER WE ACTUALLY KNOW, both come from
// /playground-port.js — see its header. `sameref=1` means the filed style
// half names that tile's own reference or quotes its own baked prompt, so
// re-running carries the same reference the picture was made with; `0` means
// nothing identified it and the fallback tile's reference is NOT the one
// behind this picture. The Playground says which, in her words, on arrival.
// This used to be four loose regexes over the style half, which sent 224
// pictures whose prompts merely said "watercolor wash" to the WTR LoRA — a
// different engine — with nothing on screen admitting it was a guess.
function playgroundQuery(it){
  if(!it || !it.promptContent) return null;
  var port=(window.ForgePlaygroundPort||null);
  if(!port) return null;
  var m=port.matchStyle(it.promptStyle, it.prompt);
  var q='prompt='+encodeURIComponent(it.promptContent)+'&style='+m.style
       +'&sameref='+(m.matched?'1':'0');
  var qual=port.matchQuality(it.promptStyle, it.prompt);
  if(qual) q+='&quality='+qual;
  return q;
}

// What she calls the chat — the display name when the registry has one.
function whoLabel(it){ return it.name || it.chat || ''; }

// ── The lightbox — the chat tab's own, with the origin chat named under the
//    caption. Votes and notes go to it.chat, which IS the sync. ────────────
function lightbox(url, asset){
  scrollStop();
  var lbY=window.scrollY;
  var lb=document.getElementById('clightbox');
  lb.innerHTML='<div class="clwrap"><img alt="" src="'+url.replace(/"/g,'&quot;')+'"></div>';
  lb.classList.remove('hastalk');
  prefetchBlob(url);   // so Save has the bytes in hand by the time she taps
  // The action icons, directly under the picture: the chat it came from, the
  // Playground with this prompt prefilled, save to Photos.
  if(asset){
    var acts=document.createElement('div'); acts.className='lbacts';
    acts.onclick=function(e){ e.stopPropagation(); };
    if(asset.chat && !asset.app){
      var cbn=document.createElement('button'); cbn.innerHTML=CHATICON;
      cbn.setAttribute('aria-label','Open the chat');
      cbn.onclick=function(e){ e.stopPropagation(); location.href='/chats?chat='+encodeURIComponent(asset.chat); };
      acts.appendChild(cbn);
    }
    var pq=playgroundQuery(asset);
    if(pq){
      var pbn=document.createElement('button'); pbn.innerHTML=PLAYICON;
      pbn.setAttribute('aria-label','Open in Playground');
      pbn.onclick=function(e){ e.stopPropagation(); location.href='/playground?'+pq; };
      acts.appendChild(pbn);
    }
    var dbn=document.createElement('button'); dbn.innerHTML=SAVEICON;
    dbn.setAttribute('aria-label','Save to Photos');
    dbn.onclick=function(e){ e.stopPropagation(); saveImage(url); };
    acts.appendChild(dbn);
    lb.appendChild(acts);
  }
  var promptBtn=null;
  if(asset && (asset.promptStyle||asset.promptContent)){
    var wrap=lb.querySelector('.clwrap');
    var ov=document.createElement('div'); ov.className='lbp'; ov.style.display='none';
    ov.onclick=function(e){ e.stopPropagation(); };
    var tog=document.createElement('div'); tog.className='lbptog';
    var sb=document.createElement('button'); sb.textContent='Style';
    var cb=document.createElement('button'); cb.textContent='Content';
    var txt=document.createElement('div'); txt.className='lbptext';
    // CONTENT IS THE DEFAULT SIDE (Sophie's rule; style wins only when it is
    // the only half on file).
    var side=asset.promptContent?'content':'style';
    function paintSide(){
      sb.classList.toggle('on', side==='style');
      cb.classList.toggle('on', side==='content');
      txt.textContent=(side==='style'?asset.promptStyle:asset.promptContent)||'';
      // …with "[compressed]" in front of BOTH halves, as its own node so the
      // prompt underneath stays the exact text that was sent to the model.
      if(asset.compressedAtBirth){
        var cf=document.createElement('span'); cf.className='compflag'; cf.textContent='[compressed]';
        txt.insertBefore(cf, txt.firstChild);
      }
      txt.scrollTop=0;
    }
    sb.onclick=function(e){ e.stopPropagation(); side='style'; paintSide(); };
    cb.onclick=function(e){ e.stopPropagation(); side='content'; paintSide(); };
    tog.appendChild(sb); tog.appendChild(cb);
    ov.appendChild(tog); ov.appendChild(txt);
    paintSide();
    wrap.appendChild(ov);
    promptBtn=document.createElement('button');
    promptBtn.className='promptbtn'; promptBtn.textContent='Prompt';
    promptBtn.onclick=function(e){
      e.stopPropagation();
      var open=ov.style.display==='none';
      ov.style.display=open?'flex':'none';
      wrap.classList.toggle('pon', open);
      promptBtn.classList.toggle('on', open);
    };
  }
  if(asset && asset._cast){
    var row=document.createElement('div'); row.className='lbtop';
    row.onclick=function(e){ e.stopPropagation(); };
    var hb=document.createElement('button'); hb.className='vote heart'; hb.innerHTML=HEART;
    var xb=document.createElement('button'); xb.className='vote nope'; xb.innerHTML=XMARK;
    var talk=document.createElement('div'); talk.className='lbtalk';
    talk.onclick=function(e){ e.stopPropagation(); };
    var th=document.createElement('div'); th.className='lbthread';
    function paintThread(){
      th.innerHTML='';
      var msgs=asset.thread||[];
      msgs.forEach(function(m){
        var b=document.createElement('div');
        b.className='lbmsg '+(m.from==='chat'?'them':'me');
        b.textContent=m.text;
        th.appendChild(b);
      });
      th.style.display=msgs.length?'':'none';
      th.scrollTop=th.scrollHeight;
    }
    var nw=document.createElement('div'); nw.className='lbnote';
    var ni=document.createElement('input'); ni.placeholder='Write a note…';
    var ns=document.createElement('button'); ns.className='notesend';
    ns.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg>';
    function sendNote(){
      var t=(ni.value||'').trim();
      if(!t) return;
      ni.value='';
      asset.thread=(asset.thread||[]).concat([{from:'sophie',text:t,at:new Date().toISOString()}]);
      paintThread();
      var el=th.lastChild;
      el.classList.add('pending');
      function attempt(){
        el.classList.remove('failed'); el.classList.add('pending');
        asset._noteSend(t, function(ok){
          el.classList.remove('pending');
          if(ok) return;
          el.classList.add('failed');
          el.title='Not sent — tap to try again';
          el.onclick=function(e){ e.stopPropagation(); attempt(); };
        });
      }
      attempt();
    }
    ns.onclick=function(e){ e.stopPropagation(); sendNote(); };
    ni.onkeydown=function(e){ if(e.key==='Enter'){ e.preventDefault(); sendNote(); } };
    nw.appendChild(ni); nw.appendChild(ns);
    talk.appendChild(th); talk.appendChild(nw);
    paintThread();
    if(asset._markSeen) asset._markSeen();
    asset._lbPaint=function(){
      hb.classList.toggle('on', asset.vote==='like');
      xb.classList.toggle('on', asset.vote==='dislike');
    };
    asset._lbPaint();
    hb.onclick=function(e){ e.stopPropagation(); asset._cast('like'); };
    xb.onclick=function(e){ e.stopPropagation(); asset._cast('dislike'); };
    row.appendChild(hb); if(promptBtn) row.appendChild(promptBtn); row.appendChild(xb);
    lb.appendChild(row);
    lb.appendChild(talk);
    lb.classList.add('hastalk');
  }
  if(promptBtn && !promptBtn.parentNode){
    var prow=document.createElement('div'); prow.className='lbtop';
    prow.style.justifyContent='center';
    prow.onclick=function(e){ e.stopPropagation(); };
    prow.appendChild(promptBtn); lb.appendChild(prow);
  }
  var tag=asset?String(asset.prompt||''):'';
  if(/^from /.test(tag)) tag='';
  var cap=asset?(asset.description||''):'';
  if(!cap && tag){ cap=tag; tag=''; }
  // "[compressed]" leads the MODEL · QUALITY line when this picture's only copy
  // was encoded lossily before it reached us (compressedAtBirth, written by
  // scripts/tag-compressed-at-birth.js). Its own node, never concatenated —
  // and shown even when there is no caption to lead.
  var comp=!!(asset && asset.compressedAtBirth);
  if(comp || tag){
    var tc=document.createElement('div'); tc.className='cltag';
    if(comp){ var cf=document.createElement('span'); cf.className='compflag'; cf.textContent='[compressed]'; tc.appendChild(cf); if(tag) tc.appendChild(document.createTextNode(' ')); }
    if(tag) tc.appendChild(document.createTextNode(tag));
    lb.appendChild(tc);
  }
  if(cap){ var cc=document.createElement('div'); cc.className='clcap'; cc.textContent=cap; lb.appendChild(cc); }
  var who=asset?whoLabel(asset):'';
  if(who){ var wc=document.createElement('div'); wc.className='clwho'; wc.textContent=who; lb.appendChild(wc); }
  lb.style.display='flex'; document.body.style.overflow='hidden';
  lb.onclick=function(){ if(asset) asset._lbPaint=null;
    var f=document.activeElement; if(f && f.blur) f.blur();
    lb.style.display='none'; lb.innerHTML='';
    lb.classList.remove('hastalk'); document.body.style.overflow='';
    window.scrollTo(0,lbY);
    requestAnimationFrame(function(){ window.scrollTo(0,lbY); }); };
}

// ── The page: one grid over every chat, paged as she scrolls ──────────────
var PAGE=150;
var content=document.getElementById('content');
api('/api/gallery/assets/all?limit='+PAGE+'&offset=0')
  .then(function(r){return r.json()})
  .then(function(d){
    var a=(d&&d.assets)||[];
    content.innerHTML='';
    if(!a.length){ content.appendChild(Object.assign(document.createElement('div'),{className:'state',textContent:'No images filed anywhere yet.'})); return; }
    var cells=[], filter=null, q='';
    // ONE object per chat+url, however it arrives (a browse page, a server
    // search, a catch-up refresh) — so a ♥ cast anywhere is the same object
    // everywhere and re-rendering never forks the state.
    var itemByKey={};
    function keyOf(x){ return x.chat+'|'+x.url; }
    function canon(list){
      return (list||[]).map(function(x){
        var k=keyOf(x), e=itemByKey[k];
        if(!e){ itemByKey[k]=x; return x; }
        // fields the page-scoped vote fetch may have found this time
        ['vote','note','thread','unread','done','name','thumb'].forEach(function(f){
          if(e[f]==null && x[f]!=null){ e[f]=x[f]; e._hay=null; }
        });
        return e;
      });
    }
    // Everything written about an image is searchable — its label, the
    // model/quality caption, both prompt halves, the note thread, AND (here)
    // the chat it came from, so "witch" finds a whole chat's tiles.
    function haystack(it){
      if(it._hay==null){
        var t=[it.description, it.prompt, it.promptStyle, it.promptContent, it.note, it.chat, it.name];
        // recording the damage as a FIELD is what makes it findable — typing
        // "compressed" pulls up every picture whose only copy is lossy
        if(it.compressedAtBirth) t.push('[compressed] compressed at birth');
        (it.thread||[]).forEach(function(m){ t.push(m.text); });
        it._hay=t.filter(Boolean).join(' \n ').toLowerCase();
      }
      return it._hay;
    }
    function applyFilter(){
      var shown=0, groups=q?qparse(q):[];
      cells.forEach(function(c){
        var v=c.it.vote||null, show=true;
        if(filter==='new') show=!v;
        else if(filter==='like') show=(v==='like');
        else if(filter==='nox') show=(v!=='dislike');
        if(show && groups.length) show=qmatch(haystack(c.it), groups);
        if(c.it._broken) show=false;
        c.cell.style.display=show?'':'none';
        if(show) shown++;
      });
      none.style.display=(shown||(!cells.length&&!q))?'none':'';
    }
    var seg=document.createElement('div'); seg.className='afilter';
    [['new','New'],['like','♥'],['nox','Hide ✕']].forEach(function(m){
      var sb=document.createElement('button'); sb.textContent=m[1]; sb.dataset.f=m[0];
      sb.onclick=function(){
        filter = filter===m[0] ? null : m[0];
        seg.querySelectorAll('button').forEach(function(x){ x.classList.toggle('on', x.dataset.f===filter); });
        applyFilter();
      };
      seg.appendChild(sb);
    });
    var arow=document.createElement('div'); arow.className='arow';
    arow.appendChild(seg);
    content.appendChild(arow);
    var srow=document.createElement('div'); srow.className='asearch';
    var si=document.createElement('input'); si.type='search';
    si.autocapitalize='none'; si.autocorrect='off';
    var sx=document.createElement('button'); sx.className='qclear'; sx.innerHTML='&times;';
    sx.style.display='none'; sx.setAttribute('aria-label','Clear search');
    // SEARCH ASKS THE SERVER (Aug 2026 — Sophie searched "yarn" and got
    // nothing). The box used to filter only the tiles already loaded, and the
    // grid pages 150 at a time, so anything she hadn't scrolled to was
    // unsearchable. Now: the client filter still runs instantly over what's on
    // screen, and a beat later the server answers over the WHOLE list
    // (same grammar, matched in meta-assets.js) and the grid becomes those
    // results. Clearing the box puts the browse walk back exactly as it was.
    var searchSeq=0, searchTimer=null;
    function serverSearch(){
      var seq=++searchSeq, want=q;
      if(!want){ renderList(browseItems); more.style.display='none'; watchTail(); return; }
      var got=[];
      (function pageIn(off){
        api('/api/gallery/assets/all?q='+encodeURIComponent(want)+'&limit=300&offset='+off)
          .then(function(r){return r.json()})
          .then(function(p){
            if(seq!==searchSeq) return;
            var list=(p&&p.assets)||[];
            got=got.concat(canon(list));
            var tot=(p&&p.total)||got.length;
            if(list.length && got.length<tot && got.length<3000){ pageIn(off+list.length); return; }
            renderList(got);
          })
          .catch(function(){ /* keep the client-filtered view */ });
      })(0);
    }
    function readSearch(){
      q=(si.value||'').trim().toLowerCase();
      sx.style.display=q?'':'none';
      applyFilter();
      clearTimeout(searchTimer);
      searchTimer=setTimeout(serverSearch, 350);
    }
    var siLive=liveInput(si, readSearch);
    // `siLive.sync()` inside it: the blur Return performs would otherwise be
    // liveInput's first sight of dictated text and would filter a second time.
    enterSubmits(si, function(){ readSearch(); siLive.sync(); });
    sx.onclick=function(){ si.value=''; siLive.sync(); readSearch(); si.focus(); };
    srow.appendChild(si); srow.appendChild(sx);
    content.appendChild(srow);
    var none=document.createElement('div'); none.className='state';
    none.textContent='No images match that.'; none.style.display='none';
    content.appendChild(none);
    var io = ('IntersectionObserver' in window) ? new IntersectionObserver(function(ents){
      ents.forEach(function(en){
        if(!en.isIntersecting) return;
        var im=en.target;
        if(im.dataset.src){ im.src=im.dataset.src; im.removeAttribute('data-src'); }
        io.unobserve(im);
      });
    }, {rootMargin:'900px 0px'}) : null;
    var grid=document.createElement('div'); grid.className='assetgrid';
    function voteBtns(cell,it){
      var hb=document.createElement('button'); hb.className='vote heart'; hb.innerHTML=HEART;
      var xb=document.createElement('button'); xb.className='vote nope'; xb.innerHTML=XMARK;
      var nb=document.createElement('div'); nb.className='nbadge';
      function unreadCount(){
        if(!it.unread) return 0;
        var n=0, t=it.thread||[];
        for(var i=t.length-1;i>=0 && t[i].from==='chat';i--) n++;
        return n||1;
      }
      function paint(){
        hb.classList.toggle('on', it.vote==='like');
        xb.classList.toggle('on', it.vote==='dislike');
        cell.classList.toggle('nay', it.vote==='dislike');
        var n=unreadCount();
        nb.textContent=n?String(n):'';
        nb.style.display=n?'':'none';
        if(it._lbPaint) it._lbPaint();
        applyFilter();
      }
      // THE SYNC: the vote is written to the ORIGIN chat's own vote doc
      // (chat+url), so this heart and the one in that chat's Assets tab are
      // one record — either surface shows what the other did.
      function cast(v){
        var next = it.vote===v ? null : v;
        api('/api/gallery/assets/vote',{method:'POST',body:JSON.stringify({chat:it.chat,url:it.url,vote:next})})
          .then(function(r){return r.json()})
          .then(function(d){ if(!d.ok) throw 0; it.vote=next; paint(); })
          .catch(function(){ toast('Couldn’t save that'); });
      }
      it._cast=cast;
      it._noteSend=function(text,cb){
        var t=String(text||'').trim();
        if(!t){ if(cb)cb(false); return; }
        api('/api/gallery/assets/note',{method:'POST',
          body:JSON.stringify({chat:it.chat,url:it.url,text:t,from:'sophie'})})
          .then(function(r){ return r.json().then(function(d){ return {s:r.status,d:d}; }); })
          .then(function(x){
            if(!x.d.ok) throw new Error(x.d.error||'failed');
            it.note=t;
            if(x.d.thread) it.thread=x.d.thread;
            it._hay=null;
            if(cb)cb(true);
          })
          .catch(function(e){ toast((e&&e.message)||'Couldn’t send that note'); if(cb)cb(false); });
      };
      it._markSeen=function(){
        if(!it.unread) return;
        it.unread=false; paint();
        api('/api/gallery/assets/note',{method:'POST',
          body:JSON.stringify({chat:it.chat,url:it.url,seen:true})}).catch(function(){});
      };
      hb.onclick=function(e){ e.stopPropagation(); cast('like'); };
      xb.onclick=function(e){ e.stopPropagation(); cast('dislike'); };
      paint();
      cell.appendChild(hb); cell.appendChild(xb); cell.appendChild(nb);
    }
    function addTiles(list, anchor){ list.forEach(function(it){
      var cell=document.createElement('div'); cell.className='acell';
      var b=document.createElement('button');
      var cap=it.description||'';
      var tag=String(it.prompt||'');
      if(!cap && tag && !/^from /.test(tag)) cap=tag;
      var lbl=cap?'<div class="lbl">'+esc(cap)+'</div>':'';
      var who=whoLabel(it);
      var wl=who?'<div class="who">'+esc(who)+'</div>':'';
      var thumb=it.thumb||assetThumb(it.url), fb=assetThumb(it.url);
      var srcAttr = io ? 'data-src' : 'src';
      b.innerHTML='<img alt="" decoding="async" '+srcAttr+'="'+esc(thumb)+'">'+lbl+wl;
      var img=b.querySelector('img'), triedFb=false;
      img.onerror=function(){
        if(!triedFb && it.thumb){ triedFb=true; img.src=fb; return; }
        it._broken=true; cell.style.display='none'; if(it._lbPaint) it._lbPaint();
      };
      b.onclick=function(){ lightbox(it.url, it); };
      cell.appendChild(b); voteBtns(cell,it);
      if(io) io.observe(img);
      cells.push({cell:cell, it:it});
      if(anchor) grid.insertBefore(cell, anchor); else grid.appendChild(cell);
    }); }
    // Rebuild the grid from one list — search mode in, search mode out.
    function renderList(items){
      grid.innerHTML=''; cells=[];
      addTiles(items);
      applyFilter();
    }
    var browseItems=canon(a);
    addTiles(browseItems);
    content.appendChild(grid);
    var loaded=a.length, total=(d&&d.total)||a.length, busy=false;
    var more=document.createElement('div'); more.className='state more';
    more.style.display='none'; content.appendChild(more);
    function nextPage(){
      if(busy || q || loaded>=total) return;
      busy=true; more.textContent='Loading more…'; more.style.display='';
      api('/api/gallery/assets/all?limit='+PAGE+'&offset='+loaded)
        .then(function(r){return r.json()})
        .then(function(p){
          var got=(p&&p.assets)||[];
          if(p&&p.total) total=p.total;
          loaded+=got.length;
          // dedupe: new filings shift the offset walk, and a server search may
          // have pulled a row in already — never two cells for one picture
          var have={}; browseItems.forEach(function(x){ have[keyOf(x)]=1; });
          var fresh=canon(got).filter(function(x){ return !have[keyOf(x)]; });
          browseItems=browseItems.concat(fresh);
          if(!q){ addTiles(fresh); applyFilter(); }
          busy=false;
          more.style.display='none';
          if(!got.length) loaded=total;
          if(loaded<total) watchTail();
        })
        .catch(function(){ busy=false; more.textContent='Couldn\u2019t load more — scroll to retry.'; });
    }
    var tailIO=null;
    function watchTail(){
      if(loaded>=total) return;
      if(!('IntersectionObserver' in window)){ more.style.display=''; more.textContent='Load more'; more.onclick=nextPage; return; }
      if(tailIO) tailIO.disconnect();
      tailIO=new IntersectionObserver(function(es){
        if(es.some(function(e){return e.isIntersecting;})){ tailIO.disconnect(); nextPage(); }
      },{rootMargin:'800px 0px'});
      var last=grid.lastElementChild;
      if(last) tailIO.observe(last);
    }
    watchTail();
    // COMING BACK pulls anything filed since (Aug 2026 — the list is a 60s
    // server cache and the page never refetched, so an open tab went stale
    // until she reloaded it by hand). Quiet: newest-first means fresh rows
    // belong at the TOP; nothing repaints unless something actually arrived,
    // and a live search is left alone.
    var lastLoadAt=Date.now();
    document.addEventListener('visibilitychange', function(){
      if(document.hidden || q || Date.now()-lastLoadAt<60000) return;
      lastLoadAt=Date.now();
      api('/api/gallery/assets/all?limit='+PAGE+'&offset=0')
        .then(function(r){return r.json()})
        .then(function(p){
          if(q) return;
          var have={}; browseItems.forEach(function(x){ have[keyOf(x)]=1; });
          var fresh=canon((p&&p.assets)||[]).filter(function(x){ return !have[keyOf(x)]; });
          if(!fresh.length) return;
          if(p&&p.total) total=p.total;
          loaded+=fresh.length;               // the walk's offset shifted by this many
          browseItems=fresh.concat(browseItems);
          addTiles(fresh, grid.firstElementChild);
          applyFilter();
        }).catch(function(){});
    });
  })
  .catch(function(){ content.innerHTML='<div class="state">Couldn\u2019t load images.</div>'; });
})();
</script>
</body>
