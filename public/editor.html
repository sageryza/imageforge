<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Episode Editor</title>
<style>
  :root{
    --paper:#FAF7F1; --card:#FFFFFF; --line:#E4DFD4; --ink:#23201B; --soft:#7A7266;
    --gold:#E0A94A; --goldline:#C79633; --bad:#B4462F;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{margin:0; background:var(--paper); color:var(--ink);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    padding-bottom:64px}
  /* The shared autoscroll pill is position:fixed over the top-right corner
     (x 324–374 on an iPhone 13), so the header RESERVES that corner — anything
     laid out under the pill is untappable. Same reservation .thread-head and
     .headbtns carry on /chats; the calc mirrors the pill's own
     right:max(14px,4vw) + its 48px width so it holds at any width.
     z-index stays BELOW the pill's 9 (the house pattern — /writing and
     /storyroom park their sticky bars at 5) and above ordinary content. */
  header{position:sticky; top:0; z-index:5; background:var(--paper);
    border-bottom:1px solid var(--line); padding:12px 14px;
    padding-right:calc(max(14px, 4vw) + 54px); display:flex; align-items:center; gap:10px}
  header h1{font-size:17px; margin:0; font-weight:600; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .wrap{padding:14px; max-width:720px; margin:0 auto}
  svg{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.8;
    stroke-linecap:round; stroke-linejoin:round; display:block}
  button{font:inherit; color:var(--ink); background:var(--card); border:1px solid var(--line);
    border-radius:6px; padding:9px 12px; cursor:pointer}
  button:active{background:#F1ECE2}
  button.gold{background:var(--gold); border-color:var(--goldline); font-weight:600}
  button.ghost{background:transparent}
  button.icon{width:34px; height:34px; padding:0; display:flex; align-items:center; justify-content:center}
  /* An author display rule (like .icon's flex) silently overrides the UA's
     [hidden]{display:none} — which kept the back button visible on the episode
     list, where it goes nowhere. Restate the attribute so hidden ALWAYS wins. */
  [hidden]{display:none !important}
  /* Inside the app the nav bar carries the back chevron (and the tool title),
     so the page's own back button never shows — and on the episode list the
     whole header would only duplicate the bar's title, so it folds away. */
  body.native #back{display:none !important}
  body.native.at-list header{display:none}
  button[disabled]{opacity:.45}
  /* the one circular control on the page: hear this snippet on its own */
  button.play{border-radius:50%; border-color:var(--goldline); color:var(--goldline)}
  button.play.on{background:var(--gold); color:var(--ink)}
  button.play.busy svg{animation:spin 1s linear infinite; opacity:.6}
  @keyframes spin{to{transform:rotate(360deg)}}
  h2.sec{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--soft);
    margin:24px 0 8px; font-weight:600}
  .card{background:var(--card); border:1px solid var(--line); border-radius:6px; padding:12px; margin-bottom:8px}
  .row{display:flex; gap:8px; align-items:center}
  .grow{flex:1; min-width:0}
  .muted{color:var(--soft); font-size:13px}
  .tiny{font-size:12px; color:var(--soft)}
  .clip{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  input[type=text],textarea{font:inherit; width:100%; background:var(--card); color:var(--ink);
    border:1px solid var(--line); border-radius:6px; padding:9px 10px}
  textarea{min-height:74px; resize:vertical}
  /* transcript picker */
  .srcbar{display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:8px}
  .srcbar button{white-space:nowrap; font-size:13px; padding:6px 10px}
  .srcbar button.on{background:var(--gold); border-color:var(--goldline); font-weight:600}
  .script{background:var(--card); border:1px solid var(--line); border-radius:6px; padding:12px;
    max-height:46vh; overflow-y:auto; line-height:2}
  .w{padding:1px 1px; border-radius:3px; cursor:pointer}
  .w.a{background:var(--gold); font-weight:600}
  .w.in{background:#F6E3BE}
  .pickbar{position:sticky; bottom:0; background:var(--paper); border-top:1px solid var(--line);
    padding:10px 0 4px; margin-top:8px}
  /* sequence */
  .seq{border-left:3px solid var(--line); padding-left:8px}
  .seq .card{margin-bottom:6px}
  .kind{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--soft); font-weight:600}
  .kind.clipk{color:var(--goldline)}
  .chip{display:inline-block; border:1px solid var(--line); border-radius:6px; padding:1px 7px;
    font-size:12px; color:var(--soft)}
  .status{border:1px solid var(--line); border-radius:6px; padding:10px 12px; background:var(--card); margin-top:8px}
  .status.err{border-color:var(--bad); color:var(--bad)}
  audio{width:100%; margin-top:8px}
  .modal{position:fixed; inset:0; background:rgba(35,32,27,.42); z-index:50; display:flex;
    align-items:flex-end; justify-content:center}
  .sheet{background:var(--paper); border-top:1px solid var(--line); border-radius:6px 6px 0 0;
    width:100%; max-width:720px; max-height:80vh; overflow-y:auto; padding:14px}
  .empty{color:var(--soft); font-size:14px; padding:10px 0}
  .saving{font-size:12px; color:var(--soft)}
  /* The autoscroll pill itself is appended by the server (public/pill-inject.html,
     built from scripts/pill.py) — never copied here. That snippet ships a
     fallback palette for arbitrary Compare pages, including a dark-mode block;
     this page is fixed light, so pin the pill to the page's own tokens. The
     two-part selector outranks the snippet's plain .float rules. */
  body .float{--paper:#FAF7F1; --ink:#23201B; --ink2:#7A7266; --chg:#C79633; --rose:#B4462F}
  /* The pill's band runs to y≈196, so the top two episode rows sit under it —
     and with only a few episodes the page doesn't scroll, so their 34px delete
     button (flush right, entirely inside the pill's rect) would be permanently
     untappable. Reserve the corner on those rows the same way the header does. */
  #episodes .card:nth-child(-n+2){padding-right:calc(max(14px, 4vw) + 46px)}
</style>
</head>
<body class="at-list">
<header>
  <button class="icon ghost" id="back" hidden aria-label="Back">
    <svg viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
  </button>
  <h1 id="pageTitle">Episode Editor</h1>
  <span class="saving" id="saveFlag"></span>
</header>

<div class="wrap">
  <!-- ── episode list ────────────────────────────────────────────── -->
  <section id="listView">
    <div id="episodes"></div>
    <button class="gold" id="newEp" style="margin-top:10px">
      <span class="row" style="gap:6px"><svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></svg> New episode</span>
    </button>
  </section>

  <!-- ── one episode ─────────────────────────────────────────────── -->
  <section id="epView" hidden>
    <div class="row" style="margin-bottom:4px">
      <button class="icon play" id="playAll" aria-label="Play the whole episode"></button>
      <div class="tiny grow clip" id="playAllStatus">Play the whole episode as it currently is</div>
    </div>

    <h2 class="sec">Transcript</h2>
    <div class="srcbar" id="srcbar"></div>
    <div class="script" id="script"></div>
    <div class="pickbar" id="pickbar"></div>

    <h2 class="sec">Snippets</h2>
    <div id="snips"></div>

    <h2 class="sec">Arrangement</h2>
    <div class="seq" id="seq"></div>
    <div class="row" style="flex-wrap:wrap; margin-top:8px">
      <button id="addClip"><span class="row" style="gap:6px"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><path d="M8.12 8.12 12 12"/><path d="M20 4 8.12 15.88"/><circle cx="6" cy="18" r="3"/><path d="M14.8 14.8 20 20"/></svg> Snippet</span></button>
      <button id="addNar"><span class="row" style="gap:6px"><svg viewBox="0 0 24 24"><path d="M12 19v3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><rect x="9" y="2" width="6" height="13" rx="3"/></svg> Narration</span></button>
      <button id="addGap"><span class="row" style="gap:6px"><svg viewBox="0 0 24 24"><rect x="14" y="3" width="5" height="18" rx="1"/><rect x="5" y="3" width="5" height="18" rx="1"/></svg> Gap</span></button>
    </div>

    <h2 class="sec">Render</h2>
    <button class="gold" id="renderBtn">
      <span class="row" style="gap:6px"><svg viewBox="0 0 24 24"><path d="M2 10v3"/><path d="M6 6v11"/><path d="M10 3v18"/><path d="M14 8v7"/><path d="M18 5v13"/><path d="M22 10v3"/></svg> Render episode</span>
    </button>
    <div id="jobBox"></div>
    <div id="renders" style="margin-top:12px"></div>
  </section>
</div>

<script>
const TOKEN = '__STUDIO_TOKEN__';
const H = { 'content-type': 'application/json' };
if (TOKEN && TOKEN[0] !== '_') H['x-studio-token'] = TOKEN;

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ICON = {
  up:'<svg viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></svg>',
  down:'<svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>',
  x:'<svg viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>',
  pencil:'<svg viewBox="0 0 24 24"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>',
  trash:'<svg viewBox="0 0 24 24"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></svg>',
  play:'<svg viewBox="0 0 24 24"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg>',
  pause:'<svg viewBox="0 0 24 24"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></svg>',
  loader:'<svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>',
};
const prevBtn = id => `<button class="icon play" data-prev="${esc(id)}" aria-label="Play preview">${ICON.play}</button>`;

async function api(path, opts = {}) {
  const res = await fetch('/api/editor' + path, { headers: H, ...opts });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
  return data;
}

let ep = null;          // the open episode
let transcripts = [];   // one window per source
let srcIdx = 0;
let anchor = null, focus = null;  // word selection in the current transcript
let pollTimer = null;

// ── episode list ───────────────────────────────────────────────────
async function showList() {
  // Flip the view FIRST — flushSave/api can take many seconds on a cold
  // server, and a back tap must never look like it did nothing.
  $('#epView').hidden = true; $('#listView').hidden = false;
  $('#back').hidden = true; $('#pageTitle').textContent = 'Episode Editor';
  document.body.classList.add('at-list');
  clearInterval(pollTimer); pollTimer = null;
  previewAudio.pause(); stopPreviewPoll(); previewNow = null;
  stopPlayAll();
  await flushSave();
  ep = null;
  const { episodes } = await api('/');
  $('#episodes').innerHTML = episodes.length ? episodes.map(e => `
    <div class="card" data-open="${esc(e.id)}">
      <div class="row">
        <div class="grow">
          <div style="font-weight:600">${esc(e.title)}</div>
          <div class="tiny">${e.sources} source${e.sources === 1 ? '' : 's'} · ${e.snippets} snippet${e.snippets === 1 ? '' : 's'} · ${e.sequence} card${e.sequence === 1 ? '' : 's'}${e.job && e.job.status === 'running' ? ' · rendering…' : ''}</div>
        </div>
        <button class="icon ghost" data-del="${esc(e.id)}" aria-label="Delete">${ICON.trash}</button>
      </div>
    </div>`).join('') : '<div class="empty">No episodes yet.</div>';
}

$('#episodes').addEventListener('click', async e => {
  const del = e.target.closest('[data-del]');
  if (del) {
    if (!confirm('Delete this episode?')) return;
    await api('/' + del.dataset.del, { method: 'DELETE' });
    return showList();
  }
  const open = e.target.closest('[data-open]');
  if (open) openEpisode(open.dataset.open);
});

$('#newEp').onclick = async () => {
  const title = prompt('Episode title');
  if (!title) return;
  const { episode } = await api('/', { method: 'POST', body: JSON.stringify({ title, sources: [] }) });
  openEpisode(episode.id);
};

$('#back').onclick = () => showList().catch(err => { $('#episodes').innerHTML = '<div class="status err">' + esc(err.message) + '</div>'; });

// ── open one episode ───────────────────────────────────────────────
async function openEpisode(id) {
  await flushSave();
  const data = await api('/' + id);
  ep = data.episode; transcripts = data.transcripts || []; srcIdx = 0;
  anchor = focus = null;
  $('#listView').hidden = true; $('#epView').hidden = false; $('#back').hidden = false;
  document.body.classList.remove('at-list');
  $('#pageTitle').textContent = ep.title;
  renderAll();
  const pending = localStorage.getItem('editor_pending_' + ep.id);
  if (pending || (ep.job && ep.job.status === 'running')) startPolling();
}

$('#pageTitle').onclick = async () => {
  if (!ep) return;
  const t = prompt('Episode title', ep.title);
  if (!t || t === ep.title) return;
  ep.title = t; $('#pageTitle').textContent = t; queueSave();
};

function renderAll() { renderSources(); renderScript(); renderSnips(); renderSeq(); renderRenders(); renderJob(); }

// ── save (debounced, in the background) ────────────────────────────
// Every button updates the page INSTANTLY and the save happens behind it:
// edits are coalesced for 600ms, one PUT is in flight at a time, and the
// response never replaces local state (so a slow save can't undo a tap that
// landed after it was sent). A failed save retries on its own.
let saveTimer = null, saveInflight = null, dirty = false;

function queueSave() {
  dirty = true;
  $('#saveFlag').textContent = 'saving…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { saveTimer = null; doSave(); }, 600);
}

function saveBody() {
  return JSON.stringify({ title: ep.title, snippets: ep.snippets, sequence: ep.sequence });
}

async function doSave() {
  if (!ep || !dirty || saveInflight) return;
  dirty = false;
  const id = ep.id, body = saveBody();
  saveInflight = (async () => {
    try {
      await api('/' + id, { method: 'PUT', body });
      if (!dirty) {
        $('#saveFlag').textContent = 'saved';
        setTimeout(() => { if ($('#saveFlag').textContent === 'saved') $('#saveFlag').textContent = ''; }, 1400);
      }
    } catch (err) {
      dirty = true;
      $('#saveFlag').textContent = 'save failed — retrying';
      setTimeout(doSave, 2500);
    }
  })();
  await saveInflight;
  saveInflight = null;
  if (dirty && !saveTimer) doSave();
}

// Leaving the episode (back button, switching episodes) waits for the pending
// save; leaving the PAGE fires it as a keepalive request so it still lands.
async function flushSave() {
  clearTimeout(saveTimer); saveTimer = null;
  if (dirty) await doSave();
  if (saveInflight) await saveInflight;
}
window.addEventListener('pagehide', () => {
  if (!dirty || !ep) return;
  clearTimeout(saveTimer); saveTimer = null;
  dirty = false;
  fetch('/api/editor/' + ep.id, { method: 'PUT', headers: H, body: saveBody(), keepalive: true }).catch(() => {});
});

// ── 1. transcript picker ───────────────────────────────────────────
function renderSources() {
  $('#srcbar').innerHTML = transcripts.length
    ? transcripts.map((t, i) => `<button data-src="${i}" class="${i === srcIdx ? 'on' : ''}">${esc(t.experiencer || t.videoId)}</button>`).join('')
    : '<span class="empty">This episode has no sources yet.</span>';
}
$('#srcbar').addEventListener('click', e => {
  const b = e.target.closest('[data-src]');
  if (!b) return;
  srcIdx = +b.dataset.src; anchor = focus = null;
  renderSources(); renderScript();
});

function renderScript() {
  const t = transcripts[srcIdx];
  if (!t) { $('#script').innerHTML = '<div class="empty">No transcript.</div>'; $('#pickbar').innerHTML = ''; return; }
  if (!t.words.length) { $('#script').innerHTML = '<div class="empty">No transcript stored for ' + esc(t.videoId) + '.</div>'; $('#pickbar').innerHTML = ''; return; }
  const lo = anchor == null ? -1 : Math.min(anchor, focus == null ? anchor : focus);
  const hi = anchor == null ? -2 : Math.max(anchor, focus == null ? anchor : focus);
  $('#script').innerHTML = t.words.map((w, i) => {
    const cls = (i === anchor || i === focus) ? 'w a' : (i > lo && i < hi ? 'w in' : 'w');
    return `<span class="${cls}" data-i="${i}">${esc(w)}</span>`;
  }).join(' ');
  renderPickbar();
}

function renderPickbar() {
  if (anchor == null) {
    $('#pickbar').innerHTML = '<div class="tiny">Tap the first word, then the last word of the bit you want.</div>';
    return;
  }
  if (focus == null) {
    $('#pickbar').innerHTML = '<div class="row"><div class="tiny grow">Now tap the LAST word.</div><button id="clearSel">Clear</button></div>';
  } else {
    const [a, b] = [Math.min(anchor, focus), Math.max(anchor, focus)];
    const t = transcripts[srcIdx];
    $('#pickbar').innerHTML = `
      <div class="tiny clip" style="margin-bottom:6px">${b - a + 1} words · ${esc(t.words.slice(a, b + 1).join(' ').slice(0, 90))}…</div>
      <div class="row"><input type="text" id="snipName" placeholder="Name this snippet"><button class="gold" id="saveSnip">Save</button><button id="clearSel">Clear</button></div>`;
  }
}

$('#script').addEventListener('click', e => {
  const w = e.target.closest('.w');
  if (!w) return;
  const i = +w.dataset.i;
  if (anchor == null || focus != null) { anchor = i; focus = null; }
  else { focus = i; }
  renderScript();
});

$('#pickbar').addEventListener('click', async e => {
  if (e.target.closest('#clearSel')) { anchor = focus = null; return renderScript(); }
  if (!e.target.closest('#saveSnip')) return;
  const t = transcripts[srcIdx];
  const [a, b] = [Math.min(anchor, focus), Math.max(anchor, focus)];
  const name = ($('#snipName').value || '').trim() || (t.experiencer + ' — ' + t.words[a]);
  ep.snippets.push({
    id: 'sn' + Math.random().toString(16).slice(2, 10),
    name, videoId: t.videoId,
    text: t.words.slice(a, b + 1).join(' '),
    timeSec: t.times[a],
  });
  anchor = focus = null;
  renderScript(); renderSnips();
  queueSave();
});

// ── snippet preview (▶ on every snippet card) ──────────────────────
// Hear ONE snippet exactly as the render will cut it, without rendering the
// episode. The server caches the cut per span, so the first tap may wait on a
// background job and every tap after it is instant. One preview at a time.
const previewAudio = new Audio();
const previewUrls = new Map();   // `${episodeId}:${snippetId}` → url, learned this session
// (keyed by BOTH — seeded episodes share snippet ids like sn00, and keying on
// the id alone made one episode's remembered clip play in another episode)
let previewPoll = null;          // { id, timer } while a cut is being made
let previewNow = null;           // { id, state:'loading'|'playing' }

previewAudio.addEventListener('ended', () => setPreview(null));
previewAudio.addEventListener('error', () => { if (previewNow) { setPreview(null); alert('That preview would not play.'); } });

function setPreview(next) { previewNow = next; paintPreview(); }

function paintPreview() {
  document.querySelectorAll('[data-prev]').forEach(b => {
    const state = previewNow && previewNow.id === b.dataset.prev ? previewNow.state : 'idle';
    b.classList.toggle('busy', state === 'loading');
    b.classList.toggle('on', state === 'playing');
    b.innerHTML = state === 'loading' ? ICON.loader : state === 'playing' ? ICON.pause : ICON.play;
    b.setAttribute('aria-label', state === 'playing' ? 'Stop preview' : 'Play preview');
  });
}

function stopPreviewPoll() {
  if (previewPoll) clearInterval(previewPoll.timer);
  previewPoll = null;
}

function playPreview(id, url) {
  previewUrls.set(ep.id + ':' + id, url);
  previewAudio.src = url;
  setPreview({ id, state: 'playing' });
  previewAudio.play().catch(err => {
    if (err.name === 'AbortError') return;   // superseded by another tap
    setPreview(null);
    alert('Could not play the preview: ' + err.message);
  });
}

async function tapPreview(id) {
  if (epPlay) stopPlayAll();                  // one player at a time
  if (previewNow && previewNow.id === id) {   // tapping the live one stops it
    previewAudio.pause();
    stopPreviewPoll();
    return setPreview(null);
  }
  previewAudio.pause();
  stopPreviewPoll();
  const known = previewUrls.get(ep.id + ':' + id);
  if (known) return playPreview(id, known);   // free + instant on a repeat
  setPreview({ id, state: 'loading' });
  try {
    const r = await api('/' + ep.id + '/preview', { method: 'POST', body: JSON.stringify({ snippetId: id }) });
    if (r.status === 'ready' && r.url) return playPreview(id, r.url);
    if (r.status === 'error') throw new Error(r.error || 'the cut could not be made');
    pollPreview(id);
  } catch (err) {
    setPreview(null);
    alert('Preview failed: ' + err.message);
  }
}

// The cut is a background job (it may have to fetch and listen to the source
// interview), so the button waits on the doc rather than on a held request.
function pollPreview(id) {
  const timer = setInterval(async () => {
    if (!ep || !previewPoll || previewPoll.id !== id) return stopPreviewPoll();
    let r;
    try { r = await api('/' + ep.id + '/preview/' + id); }
    catch (err) { return; }                   // transient — keep polling
    if (r.status === 'running') return;
    stopPreviewPoll();
    const waiting = previewNow && previewNow.id === id;
    if (r.status === 'ready' && r.url) {
      if (waiting) playPreview(id, r.url); else previewUrls.set(ep.id + ':' + id, r.url);
      return;
    }
    if (waiting) setPreview(null);
    alert('Preview failed: ' + (r.error || 'the cut could not be made'));
  }, 3000);
  previewPoll = { id, timer };
}

// ── whole-episode play (▶ at the top) ──────────────────────────────
// Plays the arrangement exactly as it currently stands: clips from the clip
// cache, narration lines from the narration cache (a never-rendered line is
// voiced once — the same cost a render would pay — then cached forever), gaps
// as real pauses. Everything is prepared first, then it plays straight through.
const epAudio = new Audio();
let epPlay = null; // { items:[{kind,name,url?,dur?}], idx, preparing, timer }

function paintPlayAll() {
  const b = $('#playAll');
  if (!b) return;
  b.classList.toggle('on', !!(epPlay && !epPlay.preparing));
  b.classList.toggle('busy', !!(epPlay && epPlay.preparing));
  b.innerHTML = epPlay ? (epPlay.preparing ? ICON.loader : ICON.pause) : ICON.play;
}

function playAllStatus(t) { $('#playAllStatus').textContent = t; }

function stopPlayAll(msg) {
  if (epPlay && epPlay.timer) clearTimeout(epPlay.timer);
  epPlay = null;
  epAudio.pause();
  paintPlayAll();
  playAllStatus(msg || 'Play the whole episode as it currently is');
}

async function ensureClipUrl(id) {
  const key = ep.id + ':' + id;
  if (previewUrls.get(key)) return previewUrls.get(key);
  let r = await api('/' + ep.id + '/preview', { method: 'POST', body: JSON.stringify({ snippetId: id }) });
  const t0 = Date.now();
  while (r.status === 'running' && Date.now() - t0 < 180000) {
    await new Promise(res => setTimeout(res, 3000));
    r = await api('/' + ep.id + '/preview/' + id);
  }
  if (r.status !== 'ready' || !r.url) throw new Error(r.error || 'clip not ready');
  previewUrls.set(key, r.url);
  return r.url;
}

epAudio.addEventListener('ended', () => { if (epPlay) { epPlay.idx++; playNextCard(); } });
epAudio.addEventListener('error', () => { if (epPlay) stopPlayAll('That card would not play.'); });

function playNextCard() {
  if (!epPlay) return;
  const items = epPlay.items;
  if (epPlay.idx >= items.length) return stopPlayAll('Played all ' + items.length + ' cards.');
  const it = items[epPlay.idx];
  playAllStatus(`${epPlay.idx + 1}/${items.length} — ${it.name}`);
  if (it.kind === 'gap') {
    epPlay.timer = setTimeout(() => { if (epPlay) { epPlay.idx++; playNextCard(); } }, it.dur * 1000);
    return;
  }
  epAudio.src = it.url;
  epAudio.play().catch(err => { if (err.name !== 'AbortError') stopPlayAll('Could not play: ' + err.message); });
}

$('#playAll').onclick = async () => {
  if (epPlay) return stopPlayAll();          // tapping the live button stops it
  if (!ep || !ep.sequence.length) return alert('The arrangement is empty.');
  previewAudio.pause(); stopPreviewPoll(); setPreview(null);   // one player at a time
  epPlay = { items: [], idx: 0, preparing: true, timer: null };
  paintPlayAll();
  try {
    const seq = ep.sequence.slice();
    const clipIds = [...new Set(seq.filter(i => i.type === 'clip').map(i => i.snippetId))];
    playAllStatus('Preparing ' + clipIds.length + ' clips…');
    const clipUrls = new Map();
    await Promise.all(clipIds.map(async id => clipUrls.set(id, await ensureClipUrl(id))));
    const narTexts = [...new Set(seq.filter(i => i.type === 'narration').map(i => i.text))];
    const narUrls = new Map();
    for (let i = 0; i < narTexts.length; i++) {
      if (!epPlay) return;                    // stopped while preparing
      playAllStatus(`Preparing narration ${i + 1}/${narTexts.length}…`);
      const { url } = await api('/' + ep.id + '/narration-preview', { method: 'POST', body: JSON.stringify({ text: narTexts[i] }) });
      narUrls.set(narTexts[i], url);
    }
    if (!epPlay) return;
    const items = [];
    for (const item of seq) {
      if (item.type === 'clip') {
        const s = ep.snippets.find(x => x.id === item.snippetId);
        if (s) items.push({ kind: 'clip', name: s.name, url: clipUrls.get(item.snippetId) });
      } else if (item.type === 'narration') {
        items.push({ kind: 'narration', name: 'narration — ' + item.text.slice(0, 50), url: narUrls.get(item.text) });
      } else if (item.type === 'gap') {
        items.push({ kind: 'gap', name: item.dur + 's gap', dur: item.dur });
      }
    }
    epPlay.items = items;
    epPlay.preparing = false;
    paintPlayAll();
    playNextCard();
  } catch (err) {
    stopPlayAll();
    alert('Could not prepare the episode: ' + err.message);
  }
};

// ── 2. snippet library ─────────────────────────────────────────────
function renderSnips() {
  $('#snips').innerHTML = ep.snippets.length ? ep.snippets.map(s => `
    <div class="card">
      <div class="row">
        <div class="grow">
          <div style="font-weight:600">${esc(s.name)}</div>
          <div class="tiny clip">${esc(s.text.slice(0, 80))}</div>
        </div>
        ${prevBtn(s.id)}
        <button class="icon ghost" data-add="${esc(s.id)}" aria-label="Add to arrangement">${ICON.plus}</button>
        <button class="icon ghost" data-ren="${esc(s.id)}" aria-label="Rename">${ICON.pencil}</button>
        <button class="icon ghost" data-dels="${esc(s.id)}" aria-label="Delete">${ICON.trash}</button>
      </div>
    </div>`).join('') : '<div class="empty">Pick a span above to make your first snippet.</div>';
  paintPreview();
}

$('#snips').addEventListener('click', async e => {
  const prev = e.target.closest('[data-prev]');
  if (prev) return tapPreview(prev.dataset.prev);
  const add = e.target.closest('[data-add]');
  if (add) { ep.sequence.push({ type: 'clip', snippetId: add.dataset.add }); renderSeq(); return queueSave(); }
  const ren = e.target.closest('[data-ren]');
  if (ren) {
    const s = ep.snippets.find(x => x.id === ren.dataset.ren);
    const n = prompt('Snippet name', s.name);
    if (!n) return;
    s.name = n; renderSnips(); renderSeq(); return queueSave();
  }
  const del = e.target.closest('[data-dels]');
  if (del) {
    if (!confirm('Delete this snippet? Cards using it are removed too.')) return;
    ep.snippets = ep.snippets.filter(x => x.id !== del.dataset.dels);
    ep.sequence = ep.sequence.filter(i => i.type !== 'clip' || i.snippetId !== del.dataset.dels);
    renderSnips(); renderSeq(); return queueSave();
  }
});

// ── 3. arrangement board ───────────────────────────────────────────
function seqLabel(item) {
  if (item.type === 'clip') {
    const s = ep.snippets.find(x => x.id === item.snippetId);
    if (!s) return { kind: 'clip (missing)', main: item.snippetId, sub: '' };
    return { kind: 'clip', main: s.name, sub: s.text.slice(0, 70) + '…' };
  }
  if (item.type === 'narration') return { kind: 'narration', main: item.text, sub: '' };
  return { kind: 'gap', main: item.dur + 's silence', sub: '' };
}

function renderSeq() {
  $('#seq').innerHTML = ep.sequence.length ? ep.sequence.map((item, i) => {
    const L = seqLabel(item);
    return `<div class="card">
      <div class="row">
        <div class="grow">
          <div class="kind ${item.type === 'clip' ? 'clipk' : ''}">${esc(L.kind)}</div>
          <div>${esc(L.main)}</div>
          ${L.sub ? `<div class="tiny clip">${esc(L.sub)}</div>` : ''}
        </div>
        ${item.type === 'clip' && ep.snippets.some(x => x.id === item.snippetId) ? prevBtn(item.snippetId) : ''}
        <button class="icon ghost" data-up="${i}" aria-label="Move up" ${i === 0 ? 'disabled' : ''}>${ICON.up}</button>
        <button class="icon ghost" data-down="${i}" aria-label="Move down" ${i === ep.sequence.length - 1 ? 'disabled' : ''}>${ICON.down}</button>
        <button class="icon ghost" data-rm="${i}" aria-label="Remove">${ICON.x}</button>
      </div>
    </div>`;
  }).join('') : '<div class="empty">Empty. Add snippets, narration and gaps below.</div>';
  paintPreview();
}

$('#seq').addEventListener('click', async e => {
  const prev = e.target.closest('[data-prev]');
  if (prev) return tapPreview(prev.dataset.prev);
  const up = e.target.closest('[data-up]'), down = e.target.closest('[data-down]'), rm = e.target.closest('[data-rm]');
  if (up) { const i = +up.dataset.up; [ep.sequence[i - 1], ep.sequence[i]] = [ep.sequence[i], ep.sequence[i - 1]]; }
  else if (down) { const i = +down.dataset.down; [ep.sequence[i + 1], ep.sequence[i]] = [ep.sequence[i], ep.sequence[i + 1]]; }
  else if (rm) { ep.sequence.splice(+rm.dataset.rm, 1); }
  else return;
  renderSeq(); queueSave();
});

function sheet(html) {
  const el = document.createElement('div');
  el.className = 'modal';
  el.innerHTML = `<div class="sheet">${html}</div>`;
  document.body.appendChild(el);
  // An overlay freezes the page behind it: background scroll locks AND the
  // shared autoscroll pill stops, so nothing moves under an open sheet.
  if (window.__scrollStop) window.__scrollStop();
  document.body.style.overflow = 'hidden';
  const close = () => { el.remove(); document.body.style.overflow = ''; };
  el.addEventListener('click', e => { if (e.target === el) close(); });
  return { el, close };
}

$('#addClip').onclick = () => {
  if (!ep.snippets.length) return alert('No snippets yet — pick a span of transcript first.');
  const { el, close } = sheet(`<h2 class="sec" style="margin-top:0">Add a snippet</h2>` +
    ep.snippets.map(s => `<div class="card" data-pick="${esc(s.id)}"><div style="font-weight:600">${esc(s.name)}</div><div class="tiny clip">${esc(s.text.slice(0, 70))}</div></div>`).join('') +
    `<button style="margin-top:8px" data-cancel>Cancel</button>`);
  el.addEventListener('click', e => {
    if (e.target.closest('[data-cancel]')) return close();
    const p = e.target.closest('[data-pick]');
    if (!p) return;
    ep.sequence.push({ type: 'clip', snippetId: p.dataset.pick });
    close(); renderSeq(); queueSave();
  });
};

$('#addNar').onclick = () => {
  const { el, close } = sheet(`<h2 class="sec" style="margin-top:0">Narration</h2>
    <textarea id="narText" placeholder="What the narrator says here"></textarea>
    <div class="row" style="margin-top:8px"><button class="gold" data-ok>Add</button><button data-cancel>Cancel</button></div>`);
  el.querySelector('#narText').focus();
  el.addEventListener('click', e => {
    if (e.target.closest('[data-cancel]')) return close();
    if (!e.target.closest('[data-ok]')) return;
    const text = el.querySelector('#narText').value.trim();
    if (!text) return close();
    ep.sequence.push({ type: 'narration', text });
    close(); renderSeq(); queueSave();
  });
};

$('#addGap').onclick = () => {
  const { el, close } = sheet(`<h2 class="sec" style="margin-top:0">Gap</h2>
    <div class="row">${[0.3, 0.6, 1.0].map(d => `<button data-gap="${d}">${d.toFixed(1)}s</button>`).join('')}
    <button data-cancel>Cancel</button></div>`);
  el.addEventListener('click', e => {
    if (e.target.closest('[data-cancel]')) return close();
    const g = e.target.closest('[data-gap]');
    if (!g) return;
    ep.sequence.push({ type: 'gap', dur: +g.dataset.gap });
    close(); renderSeq(); queueSave();
  });
};

// ── 4. render (background job + resumable polling) ─────────────────
$('#renderBtn').onclick = async () => {
  if (!ep.sequence.length) return alert('The arrangement is empty.');
  $('#renderBtn').disabled = true;
  try {
    await api('/' + ep.id + '/render', { method: 'POST', body: JSON.stringify({}) });
    localStorage.setItem('editor_pending_' + ep.id, String(Date.now()));
    ep.job = { status: 'running', label: 'starting', done: 0, total: 0 };
    renderJob(); startPolling();
  } catch (err) {
    alert('Could not start the render: ' + err.message);
    $('#renderBtn').disabled = false;
  }
};

function startPolling() {
  clearInterval(pollTimer);
  const tick = async () => {
    if (!ep) return clearInterval(pollTimer);
    try {
      const data = await api('/' + ep.id + '/job');
      ep.job = data.job; ep.renders = data.renders || [];
      renderJob(); renderRenders();
      if (!ep.job || ep.job.status !== 'running') {
        clearInterval(pollTimer); pollTimer = null;
        localStorage.removeItem('editor_pending_' + ep.id);
        $('#renderBtn').disabled = false;
      }
    } catch (err) { /* transient — keep polling */ }
  };
  pollTimer = setInterval(tick, 3000);
  tick();
}

function renderJob() {
  const j = ep && ep.job;
  if (!j) { $('#jobBox').innerHTML = ''; return; }
  if (j.status === 'running') {
    $('#renderBtn').disabled = true;
    const prog = j.total ? ` (${Math.min(j.done, j.total)}/${j.total})` : '';
    $('#jobBox').innerHTML = `<div class="status">Rendering — ${esc(j.label || 'working')}${prog}. You can keep editing or leave this page; the render uses the cards as they were when you pressed Render.</div>`;
  } else if (j.status === 'error') {
    $('#renderBtn').disabled = false;
    $('#jobBox').innerHTML = `<div class="status err">Render failed — ${esc(j.error || 'unknown error')}</div>`;
  } else {
    $('#renderBtn').disabled = false;
    $('#jobBox').innerHTML = '';
  }
}

function renderRenders() {
  const rs = (ep && ep.renders) || [];
  $('#renders').innerHTML = rs.length ? rs.map((r, i) => `
    <div class="card">
      <div class="row"><div class="grow tiny">${esc(new Date(r.at).toLocaleString())}${r.seconds ? ' · ' + Math.round(r.seconds) + 's' : ''}${r.cards ? ' · ' + r.cards + ' cards' : ''}</div>
      ${i === 0 ? '<span class="chip">newest</span>' : ''}</div>
      <audio controls preload="none" src="${esc(r.url)}"></audio>
    </div>`).join('') : '';
}

// In the app, the native nav bar carries the back chevron + tool title
// (body.native hides this page's own — see the CSS). The chevron asks
// __navBack first: inside an episode it steps back to the list; on the list
// it answers false and the app leaves the tool. Same pattern as /storyroom.
if (window.__nativeNavBar) document.body.classList.add('native');
window.__navBack = () => {
  if (!$('#epView').hidden) {
    showList().catch(err => { $('#episodes').innerHTML = '<div class="status err">' + esc(err.message) + '</div>'; });
    return true;
  }
  return false;
};

showList().catch(err => { $('#episodes').innerHTML = '<div class="status err">' + esc(err.message) + '</div>'; });
</script>
