<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ImageForge</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0e0e0e;
      --surface: #1a1a1a;
      --border: #2a2a2a;
      --accent: #c4a882;
      --accent-dim: #8a7560;
      --text: #e8e0d4;
      --text-dim: #7a7368;
      --danger: #c45a5a;
      --green: #6a9a6a;
      --green-dim: #3a5a3a;
      --star: #d4a843;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
    }

    header {
      padding: 24px 28px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .header-left {
      display: flex;
      align-items: baseline;
      gap: 20px;
      flex-wrap: wrap;
    }

    h1 {
      font-size: 18px;
      font-weight: 300;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
    }

    .tabs { display: flex; gap: 6px; }

    .tab {
      padding: 6px 14px;
      background: transparent;
      color: var(--text-dim);
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      transition: all 0.15s ease;
    }

    .tab.active {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
      font-weight: 600;
    }

    .provider-toggle {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .provider-label {
      font-size: 11px;
      color: var(--text-dim);
      margin-right: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .provider-btn {
      padding: 4px 12px;
      background: transparent;
      color: var(--text-dim);
      border: 1px solid transparent;
      border-radius: 3px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      transition: all 0.15s ease;
    }

    .provider-btn.active {
      background: var(--surface);
      color: var(--text);
      border-color: var(--border);
    }

    .section {
      padding: 28px;
      max-width: 900px;
      display: none;
    }

    .section.active { display: block; }

    label {
      font-size: 11px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
      display: block;
    }

    input, textarea {
      width: 100%;
      padding: 10px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }

    textarea { min-height: 80px; resize: vertical; }

    .btn {
      padding: 10px 24px;
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      transition: all 0.15s ease;
    }

    .btn:disabled {
      background: var(--accent-dim);
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-secondary {
      padding: 10px 24px;
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      transition: all 0.15s ease;
    }

    .btn-secondary:hover { border-color: var(--text-dim); }

    .moment-row {
      margin-bottom: 8px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .moment-num {
      color: var(--text-dim);
      font-size: 12px;
      width: 20px;
      text-align: right;
      flex-shrink: 0;
    }

    .remove-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
    }

    .add-btn {
      background: none;
      border: 1px dashed var(--border);
      color: var(--text-dim);
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      margin-top: 4px;
    }

    .result-img {
      max-width: 100%;
      border-radius: 6px;
      border: 1px solid var(--border);
      margin-top: 24px;
    }

    .download-link {
      display: inline-block;
      margin-top: 10px;
      color: var(--accent);
      font-size: 13px;
      text-decoration: none;
    }

    .error-bar {
      padding: 12px 28px;
      background: #1a1212;
      border-bottom: 1px solid #2a1515;
      display: none;
    }

    .error-bar.show { display: flex; align-items: center; gap: 12px; }

    .error-bar span { color: var(--danger); font-size: 13px; }

    .error-dismiss {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 12px;
    }

    .progress-bar {
      width: 100%;
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 16px;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      transition: width 0.3s ease;
      width: 0%;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      margin-top: 20px;
    }

    .card-item { position: relative; }

    .card-item img {
      width: 100%;
      aspect-ratio: 3/4;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border);
      display: block;
    }

    .card-num {
      position: absolute;
      bottom: 6px;
      right: 8px;
      font-size: 10px;
      color: var(--text-dim);
      background: rgba(0,0,0,0.7);
      padding: 2px 6px;
      border-radius: 3px;
    }

    .deck-count {
      margin-top: 16px;
      font-size: 12px;
      color: var(--text-dim);
    }

    /* ── Deck Flow Steps ─────────────────── */
    .deck-steps {
      display: flex;
      gap: 0;
      margin-bottom: 28px;
    }

    .deck-step {
      flex: 1;
      padding: 10px 16px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dim);
      border-bottom: 2px solid var(--border);
      text-align: center;
    }

    .deck-step.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .deck-step.done {
      color: var(--green);
      border-bottom-color: var(--green);
    }

    .deck-phase { display: none; }
    .deck-phase.active { display: block; }

    /* ── Swipe Card ──────────────────────── */
    .swipe-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 20px;
    }

    .swipe-card {
      width: 320px;
      min-height: 180px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 28px 24px;
      position: relative;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .swipe-card.exit-left {
      transform: translateX(-120%) rotate(-8deg);
      opacity: 0;
    }

    .swipe-card.exit-right {
      transform: translateX(120%) rotate(8deg);
      opacity: 0;
    }

    .swipe-card-subject {
      font-size: 20px;
      font-weight: 500;
      margin-bottom: 14px;
      color: var(--text);
    }

    .swipe-card-fact {
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.5;
    }

    .swipe-counter {
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 12px;
    }

    .swipe-buttons {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .swipe-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .swipe-btn:hover { border-color: var(--text-dim); }
    .swipe-btn.reject { color: var(--danger); }
    .swipe-btn.reject:hover { border-color: var(--danger); background: #1a1515; }
    .swipe-btn.accept { color: var(--green); }
    .swipe-btn.accept:hover { border-color: var(--green); background: #151a15; }
    .swipe-btn.star { color: var(--star); font-size: 20px; }
    .swipe-btn.star:hover { border-color: var(--star); background: #1a1815; }

    .swipe-tally {
      display: flex;
      gap: 24px;
      margin-top: 20px;
      font-size: 12px;
      color: var(--text-dim);
    }

    .tally-accepted { color: var(--green); }
    .tally-rejected { color: var(--danger); }
    .tally-starred { color: var(--star); }

    /* ── Style Picker ────────────────────── */
    .style-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .style-option {
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .style-option:hover { border-color: var(--text-dim); }

    .style-option.selected {
      border-color: var(--accent);
      background: #1a1714;
    }

    .style-option-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
    }

    .style-option-id {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 2px;
    }

    .style-test-results {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .style-test-img {
      width: 200px;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    /* ── Batch Generation ────────────────── */
    .batch-info {
      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 16px;
    }

    .batch-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    /* ── Accepted List ────────────────────── */
    .accepted-list {
      margin-top: 16px;
      max-height: 200px;
      overflow-y: auto;
    }

    .accepted-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    .accepted-item .star-mark {
      color: var(--star);
      font-size: 12px;
    }

    @media (max-width: 600px) {
      header { padding: 16px; }
      .section { padding: 20px 16px; }
      h1 { font-size: 15px; }
      .header-left { gap: 12px; }
      .swipe-card { width: 280px; }
      .style-test-img { width: 140px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <h1>ImageForge</h1>
      <div class="tabs">
        <button class="tab active" data-mode="sticker">Stickers</button>
        <button class="tab" data-mode="deck">Deck</button>
        <button class="tab" data-mode="single">Single</button>
      </div>
    </div>
    <div class="provider-toggle">
      <span class="provider-label">Provider</span>
      <button class="provider-btn active" data-provider="dalle">DALL·E</button>
      <button class="provider-btn" data-provider="replicate">Replicate</button>
    </div>
  </header>

  <div class="error-bar" id="error-bar">
    <span id="error-text"></span>
    <button class="error-dismiss" onclick="hideError()">dismiss</button>
  </div>

  <!-- ═══ Sticker Section ═══ -->
  <div class="section active" id="section-sticker">
    <label>Moments</label>
    <div id="moments-list">
      <div class="moment-row">
        <span class="moment-num">1</span>
        <input type="text" placeholder="A moment or thing you're grateful for...">
        <button class="remove-btn" onclick="removeMoment(this)">×</button>
      </div>
      <div class="moment-row">
        <span class="moment-num">2</span>
        <input type="text" placeholder="A moment or thing you're grateful for...">
        <button class="remove-btn" onclick="removeMoment(this)">×</button>
      </div>
      <div class="moment-row">
        <span class="moment-num">3</span>
        <input type="text" placeholder="A moment or thing you're grateful for...">
        <button class="remove-btn" onclick="removeMoment(this)">×</button>
      </div>
    </div>
    <button class="add-btn" id="add-moment-btn" onclick="addMoment()">+ add moment</button>
    <div style="margin-top: 20px;">
      <button class="btn" id="sticker-btn" onclick="generateStickers()">Generate Sticker Sheet</button>
    </div>
    <div id="sticker-result"></div>
  </div>

  <!-- ═══ Deck Section ═══ -->
  <div class="section" id="section-deck">
    <div class="deck-steps">
      <div class="deck-step active" data-step="1">1 · Subjects</div>
      <div class="deck-step" data-step="2">2 · Style</div>
      <div class="deck-step" data-step="3">3 · Generate</div>
    </div>

    <!-- Phase 1: Theme + Subject Curation -->
    <div class="deck-phase active" id="deck-phase-1">
      <div id="deck-input-area">
        <label>Deck Theme</label>
        <input type="text" id="deck-theme" placeholder='e.g. "insects", "mythical creatures", "dog breeds"'>
        <div style="margin-top: 16px;">
          <button class="btn" id="subjects-btn" onclick="generateSubjects()">Generate Subjects</button>
        </div>
      </div>

      <div id="deck-swipe-area" style="display:none;">
        <div class="swipe-area">
          <div class="swipe-counter" id="swipe-counter">1 / 60</div>
          <div class="swipe-card" id="swipe-card">
            <div class="swipe-card-subject" id="swipe-subject"></div>
            <div class="swipe-card-fact" id="swipe-fact"></div>
          </div>
          <div class="swipe-buttons">
            <button class="swipe-btn reject" onclick="swipe('reject')" title="Reject">✕</button>
            <button class="swipe-btn star" onclick="swipe('star')" title="Accept + Star">★</button>
            <button class="swipe-btn accept" onclick="swipe('accept')" title="Accept">✓</button>
          </div>
          <div class="swipe-tally">
            <span>Accepted: <span class="tally-accepted" id="tally-accepted">0</span></span>
            <span>Starred: <span class="tally-starred" id="tally-starred">0</span></span>
            <span>Rejected: <span class="tally-rejected" id="tally-rejected">0</span></span>
          </div>
        </div>

        <div id="swipe-done" style="display:none; margin-top: 24px; text-align: center;">
          <p style="font-size: 13px; color: var(--text-dim); margin-bottom: 16px;" id="swipe-summary"></p>
          <div style="display: flex; gap: 10px; justify-content: center;">
            <button class="btn" id="to-style-btn" onclick="goToStyle()">Choose Style →</button>
            <button class="btn-secondary" onclick="generateMoreSubjects()">Generate More</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Phase 2: Style Selection -->
    <div class="deck-phase" id="deck-phase-2">
      <label>Pick a Style</label>
      <div class="style-grid" id="style-grid"></div>

      <div style="margin-top: 20px;">
        <button class="btn" id="test-style-btn" onclick="testStyle()">Test Style</button>
        <button class="btn-secondary" style="margin-left: 8px;" onclick="goToGenerate()">Skip Test →</button>
      </div>

      <div id="style-test-area" style="display: none; margin-top: 20px;">
        <label>Style Preview</label>
        <div class="style-test-results" id="style-test-results"></div>
        <div style="margin-top: 16px; display: flex; gap: 10px;">
          <button class="btn" onclick="goToGenerate()">Use This Style →</button>
          <button class="btn-secondary" onclick="clearStyleTest()">Try Another</button>
        </div>
      </div>
    </div>

    <!-- Phase 3: Batch Generation -->
    <div class="deck-phase" id="deck-phase-3">
      <div class="batch-info" id="batch-info"></div>
      <button class="btn" id="batch-btn" onclick="generateBatch()">Generate Next 10</button>
      <div class="progress-bar" id="batch-progress" style="display:none;">
        <div class="progress-fill" id="batch-progress-fill"></div>
      </div>
      <div class="deck-count" id="batch-count-label" style="display:none;"></div>
      <div class="card-grid" id="batch-grid"></div>
      <div id="batch-done-area" style="display:none; margin-top: 20px;">
        <button class="btn" id="batch-next-btn" onclick="generateBatch()">Generate Next 10</button>
      </div>
      <div id="deck-complete" style="display:none; margin-top: 20px;">
        <p style="color: var(--green); font-size: 14px;">All cards generated.</p>
      </div>
    </div>
  </div>

  <!-- ═══ Single Section ═══ -->
  <div class="section" id="section-single">
    <label>Prompt</label>
    <textarea id="single-prompt" placeholder="Describe what you want to generate..."></textarea>
    <div style="margin-top: 20px;">
      <button class="btn" id="single-btn" onclick="generateSingle()">Generate</button>
    </div>
    <div id="single-result"></div>
  </div>

  <script>
    let currentMode = 'sticker';
    let currentProvider = 'dalle';

    // ── Deck state ──────────────────────
    let allSubjects = [];        // all generated subjects
    let swipeIndex = 0;          // current position in swipe stack
    let acceptedCards = [];      // { subject, fact, starred }
    let rejectedCount = 0;
    let selectedModel = null;    // chosen style model id
    let selectedStylePrompt = '';
    let batchIndex = 0;          // how many cards generated so far
    const BATCH_SIZE = 10;
    const TARGET_CARDS = 50;

    // ── Tabs ────────────────────────────
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentMode = tab.dataset.mode;
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById('section-' + currentMode).classList.add('active');
      });
    });

    // ── Provider ────────────────────────
    document.querySelectorAll('.provider-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.provider-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentProvider = btn.dataset.provider;
      });
    });

    // ── Error ───────────────────────────
    function showError(msg) {
      document.getElementById('error-text').textContent = msg;
      document.getElementById('error-bar').classList.add('show');
    }
    function hideError() {
      document.getElementById('error-bar').classList.remove('show');
    }

    // ── Moments (Sticker) ───────────────
    function addMoment() {
      const list = document.getElementById('moments-list');
      const count = list.children.length;
      if (count >= 7) return;
      const row = document.createElement('div');
      row.className = 'moment-row';
      row.innerHTML = `
        <span class="moment-num">${count + 1}</span>
        <input type="text" placeholder="A moment or thing you're grateful for...">
        <button class="remove-btn" onclick="removeMoment(this)">×</button>
      `;
      list.appendChild(row);
      if (count + 1 >= 7) document.getElementById('add-moment-btn').style.display = 'none';
    }

    function removeMoment(btn) {
      const list = document.getElementById('moments-list');
      if (list.children.length <= 1) return;
      btn.parentElement.remove();
      Array.from(list.children).forEach((row, i) => {
        row.querySelector('.moment-num').textContent = i + 1;
      });
      document.getElementById('add-moment-btn').style.display = '';
    }

    // ── Sticker Generation ──────────────
    async function generateStickers() {
      const inputs = document.querySelectorAll('#moments-list input');
      const moments = Array.from(inputs).map(i => i.value.trim()).filter(Boolean);
      if (!moments.length) return;

      const btn = document.getElementById('sticker-btn');
      btn.disabled = true;
      btn.textContent = 'Generating...';
      hideError();
      document.getElementById('sticker-result').innerHTML = '';

      try {
        const res = await fetch('/api/generate/sticker-sheet', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ moments, provider: currentProvider }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        document.getElementById('sticker-result').innerHTML = `
          <img class="result-img" src="${data.url}" alt="Sticker sheet">
          <br><a class="download-link" href="${data.url}" download="sticker-sheet.png" target="_blank">↓ Download</a>
        `;
      } catch (err) {
        showError(err.message);
      }

      btn.disabled = false;
      btn.textContent = 'Generate Sticker Sheet';
    }

    // ══════════════════════════════════════
    //  DECK FLOW
    // ══════════════════════════════════════

    function setDeckStep(step) {
      document.querySelectorAll('.deck-step').forEach(s => {
        const n = parseInt(s.dataset.step);
        s.classList.remove('active', 'done');
        if (n < step) s.classList.add('done');
        if (n === step) s.classList.add('active');
      });
      document.querySelectorAll('.deck-phase').forEach(p => p.classList.remove('active'));
      document.getElementById('deck-phase-' + step).classList.add('active');
    }

    // ── Phase 1: Generate Subjects ──────
    async function generateSubjects() {
      const theme = document.getElementById('deck-theme').value.trim();
      if (!theme) return;

      const btn = document.getElementById('subjects-btn');
      btn.disabled = true;
      btn.textContent = 'Generating...';
      hideError();

      try {
        const res = await fetch('/api/generate/subjects', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ theme, count: 60 }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        allSubjects = data.subjects;
        swipeIndex = 0;
        acceptedCards = [];
        rejectedCount = 0;

        document.getElementById('deck-input-area').style.display = 'none';
        document.getElementById('deck-swipe-area').style.display = 'block';
        document.getElementById('swipe-done').style.display = 'none';
        showCurrentCard();
      } catch (err) {
        showError(err.message);
      }

      btn.disabled = false;
      btn.textContent = 'Generate Subjects';
    }

    async function generateMoreSubjects() {
      const theme = document.getElementById('deck-theme').value.trim();
      const btn = document.querySelector('#swipe-done .btn-secondary');
      btn.disabled = true;
      btn.textContent = 'Generating...';

      try {
        const need = TARGET_CARDS - acceptedCards.length + 10;
        const res = await fetch('/api/generate/subjects', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ theme, count: need }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        // Filter out subjects we already have
        const existing = new Set(acceptedCards.map(c => c.subject));
        const fresh = data.subjects.filter(s => !existing.has(s.subject));
        allSubjects = [...allSubjects, ...fresh];

        document.getElementById('swipe-done').style.display = 'none';
        showCurrentCard();
      } catch (err) {
        showError(err.message);
      }

      btn.disabled = false;
      btn.textContent = 'Generate More';
    }

    function showCurrentCard() {
      if (swipeIndex >= allSubjects.length) {
        finishSwiping();
        return;
      }
      const s = allSubjects[swipeIndex];
      document.getElementById('swipe-subject').textContent = s.subject;
      document.getElementById('swipe-fact').textContent = s.fact;
      document.getElementById('swipe-counter').textContent = `${swipeIndex + 1} / ${allSubjects.length}`;
      updateTally();

      const card = document.getElementById('swipe-card');
      card.classList.remove('exit-left', 'exit-right');
    }

    function swipe(action) {
      const card = document.getElementById('swipe-card');
      const s = allSubjects[swipeIndex];

      if (action === 'reject') {
        card.classList.add('exit-left');
        rejectedCount++;
      } else {
        card.classList.add('exit-right');
        acceptedCards.push({
          subject: s.subject,
          fact: s.fact,
          starred: action === 'star',
        });
      }

      swipeIndex++;
      updateTally();

      // Check if we have enough
      if (acceptedCards.length >= TARGET_CARDS) {
        setTimeout(() => finishSwiping(), 300);
        return;
      }

      setTimeout(() => showCurrentCard(), 300);
    }

    function updateTally() {
      document.getElementById('tally-accepted').textContent = acceptedCards.length;
      document.getElementById('tally-starred').textContent = acceptedCards.filter(c => c.starred).length;
      document.getElementById('tally-rejected').textContent = rejectedCount;
    }

    function finishSwiping() {
      document.getElementById('swipe-card').style.display = 'none';
      document.querySelector('.swipe-buttons').style.display = 'none';
      document.querySelector('.swipe-counter').style.display = 'none';
      document.getElementById('swipe-done').style.display = 'block';

      const need = TARGET_CARDS - acceptedCards.length;
      if (need > 0) {
        document.getElementById('swipe-summary').textContent =
          `${acceptedCards.length} accepted, ${rejectedCount} rejected. Need ${need} more to reach ${TARGET_CARDS}.`;
        document.getElementById('to-style-btn').textContent = `Continue with ${acceptedCards.length} →`;
      } else {
        document.getElementById('swipe-summary').textContent =
          `${acceptedCards.length} cards ready. ${acceptedCards.filter(c => c.starred).length} starred.`;
      }
    }

    // ── Keyboard shortcuts for swiping ──
    document.addEventListener('keydown', (e) => {
      if (currentMode !== 'deck') return;
      const phase1 = document.getElementById('deck-phase-1').classList.contains('active');
      const swiping = document.getElementById('deck-swipe-area').style.display !== 'none';
      const done = document.getElementById('swipe-done').style.display !== 'none';
      if (!phase1 || !swiping || done) return;

      if (e.key === 'ArrowLeft') swipe('reject');
      else if (e.key === 'ArrowRight') swipe('accept');
      else if (e.key === 'ArrowUp' || e.key === 's') swipe('star');
    });

    // ── Phase 2: Style Selection ────────
    function goToStyle() {
      setDeckStep(2);
      loadStyleOptions();
    }

    async function loadStyleOptions() {
      try {
        const res = await fetch('/api/models');
        const models = await res.json();
        const grid = document.getElementById('style-grid');
        grid.innerHTML = '';

        const list = currentProvider === 'replicate' ? models.replicate : models.dalle;
        list.forEach(m => {
          const div = document.createElement('div');
          div.className = 'style-option';
          div.dataset.modelId = m.id;
          div.innerHTML = `
            <div class="style-option-name">${m.name}</div>
            <div class="style-option-id">${m.id}</div>
          `;
          div.addEventListener('click', () => {
            document.querySelectorAll('.style-option').forEach(o => o.classList.remove('selected'));
            div.classList.add('selected');
            selectedModel = m.id;
            selectedStylePrompt = m.stylePrompt || '';
          });
          grid.appendChild(div);
        });
      } catch (err) {
        showError(err.message);
      }
    }

    async function testStyle() {
      if (!selectedModel) {
        showError('Pick a style first');
        return;
      }

      const btn = document.getElementById('test-style-btn');
      btn.disabled = true;
      btn.textContent = 'Testing...';

      const starred = acceptedCards.filter(c => c.starred);
      const testSubjects = (starred.length >= 3 ? starred.slice(0, 3) : acceptedCards.slice(0, 3))
        .map(c => c.subject);

      document.getElementById('style-test-area').style.display = 'block';
      document.getElementById('style-test-results').innerHTML = '';

      try {
        const res = await fetch('/api/generate/style-test', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            subjects: testSubjects,
            provider: currentProvider,
            model: selectedModel,
            stylePrompt: selectedStylePrompt,
          }),
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          const lines = buffer.split('\n');
          buffer = lines.pop() || '';

          for (const line of lines) {
            if (line.startsWith('data: ')) {
              try {
                const event = JSON.parse(line.slice(6));
                if (event.done) break;
                if (event.url) {
                  const results = document.getElementById('style-test-results');
                  const div = document.createElement('div');
                  div.innerHTML = `
                    <img class="style-test-img" src="${event.url}" alt="${event.subject}">
                    <div style="font-size:11px; color:var(--text-dim); margin-top:4px;">${event.subject}</div>
                  `;
                  results.appendChild(div);
                }
              } catch {}
            }
          }
        }
      } catch (err) {
        showError(err.message);
      }

      btn.disabled = false;
      btn.textContent = 'Test Style';
    }

    function clearStyleTest() {
      document.getElementById('style-test-area').style.display = 'none';
      document.querySelectorAll('.style-option').forEach(o => o.classList.remove('selected'));
      selectedModel = null;
    }

    // ── Phase 3: Batch Generation ───────
    function goToGenerate() {
      if (!selectedModel) {
        // Default to first available
        const firstOption = document.querySelector('.style-option');
        if (firstOption) {
          firstOption.click();
        } else {
          showError('Pick a style first');
          return;
        }
      }
      setDeckStep(3);
      batchIndex = 0;
      document.getElementById('batch-grid').innerHTML = '';
      document.getElementById('deck-complete').style.display = 'none';
      updateBatchInfo();
    }

    function updateBatchInfo() {
      const remaining = acceptedCards.length - batchIndex;
      const next = Math.min(BATCH_SIZE, remaining);
      document.getElementById('batch-info').textContent =
        `${batchIndex} of ${acceptedCards.length} cards generated. ${remaining} remaining.`;
      document.getElementById('batch-btn').textContent = `Generate Next ${next}`;
      document.getElementById('batch-btn').style.display = remaining > 0 ? '' : 'none';
      document.getElementById('batch-done-area').style.display = 'none';
    }

    async function generateBatch() {
      const remaining = acceptedCards.length - batchIndex;
      if (remaining <= 0) return;

      const batchCards = acceptedCards.slice(batchIndex, batchIndex + BATCH_SIZE);
      const btn = document.getElementById('batch-btn');
      btn.disabled = true;
      btn.style.display = 'none';

      document.getElementById('batch-progress').style.display = '';
      document.getElementById('batch-count-label').style.display = '';
      document.getElementById('batch-done-area').style.display = 'none';

      try {
        const res = await fetch('/api/generate/deck-batch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            cards: batchCards,
            provider: currentProvider,
            model: selectedModel,
            stylePrompt: selectedStylePrompt,
          }),
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          const lines = buffer.split('\n');
          buffer = lines.pop() || '';

          for (const line of lines) {
            if (line.startsWith('data: ')) {
              try {
                const event = JSON.parse(line.slice(6));
                if (event.done) break;
                if (event.url) {
                  const grid = document.getElementById('batch-grid');
                  const div = document.createElement('div');
                  div.className = 'card-item';
                  div.innerHTML = `
                    <img src="${event.url}" alt="${event.subject}">
                    <span class="card-num">${batchIndex + event.index + 1}</span>
                  `;
                  grid.appendChild(div);
                }
                const pct = ((event.index + 1) / batchCards.length) * 100;
                document.getElementById('batch-progress-fill').style.width = pct + '%';
                document.getElementById('batch-count-label').textContent =
                  `Batch: ${event.index + 1} / ${batchCards.length}`;
              } catch {}
            }
          }
        }
      } catch (err) {
        showError(err.message);
      }

      batchIndex += batchCards.length;
      document.getElementById('batch-progress').style.display = 'none';
      document.getElementById('batch-count-label').style.display = 'none';
      btn.disabled = false;

      if (batchIndex >= acceptedCards.length) {
        document.getElementById('deck-complete').style.display = 'block';
        document.getElementById('batch-btn').style.display = 'none';
      } else {
        updateBatchInfo();
        document.getElementById('batch-done-area').style.display = 'block';
        const next = Math.min(BATCH_SIZE, acceptedCards.length - batchIndex);
        document.getElementById('batch-next-btn').textContent = `Generate Next ${next}`;
      }
    }

    // ── Single Generation ───────────────
    async function generateSingle() {
      const prompt = document.getElementById('single-prompt').value.trim();
      if (!prompt) return;

      const btn = document.getElementById('single-btn');
      btn.disabled = true;
      btn.textContent = 'Generating...';
      hideError();
      document.getElementById('single-result').innerHTML = '';

      try {
        const endpoint = currentProvider === 'replicate' ? '/api/generate/replicate' : '/api/generate/dalle';
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        document.getElementById('single-result').innerHTML = `
          <img class="result-img" src="${data.url}" alt="Generated image">
          <br><a class="download-link" href="${data.url}" download="generated.png" target="_blank">↓ Download</a>
        `;
      } catch (err) {
        showError(err.message);
      }

      btn.disabled = false;
      btn.textContent = 'Generate';
    }
  </script>
</body>
