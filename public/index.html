<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ImageForge</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0e0e0e;
      --surface: #1a1a1a;
      --border: #2a2a2a;
      --accent: #c4a882;
      --accent-dim: #8a7560;
      --text: #e8e0d4;
      --text-dim: #7a7368;
      --danger: #c45a5a;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
    }

    header {
      padding: 24px 28px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .header-left {
      display: flex;
      align-items: baseline;
      gap: 20px;
      flex-wrap: wrap;
    }

    h1 {
      font-size: 18px;
      font-weight: 300;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
    }

    .tabs { display: flex; gap: 6px; }

    .tab {
      padding: 6px 14px;
      background: transparent;
      color: var(--text-dim);
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      transition: all 0.15s ease;
    }

    .tab.active {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
      font-weight: 600;
    }

    .provider-toggle {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .provider-label {
      font-size: 11px;
      color: var(--text-dim);
      margin-right: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .provider-btn {
      padding: 4px 12px;
      background: transparent;
      color: var(--text-dim);
      border: 1px solid transparent;
      border-radius: 3px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      transition: all 0.15s ease;
    }

    .provider-btn.active {
      background: var(--surface);
      color: var(--text);
      border-color: var(--border);
    }

    .section {
      padding: 28px;
      max-width: 900px;
      display: none;
    }

    .section.active { display: block; }

    label {
      font-size: 11px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
      display: block;
    }

    input, textarea {
      width: 100%;
      padding: 10px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }

    textarea { min-height: 80px; resize: vertical; }

    .btn {
      padding: 10px 24px;
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      transition: all 0.15s ease;
    }

    .btn:disabled {
      background: var(--accent-dim);
      opacity: 0.5;
      cursor: not-allowed;
    }

    .moment-row {
      margin-bottom: 8px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .moment-num {
      color: var(--text-dim);
      font-size: 12px;
      width: 20px;
      text-align: right;
      flex-shrink: 0;
    }

    .remove-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
    }

    .add-btn {
      background: none;
      border: 1px dashed var(--border);
      color: var(--text-dim);
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      margin-top: 4px;
    }

    .result-img {
      max-width: 100%;
      border-radius: 6px;
      border: 1px solid var(--border);
      margin-top: 24px;
    }

    .download-link {
      display: inline-block;
      margin-top: 10px;
      color: var(--accent);
      font-size: 13px;
      text-decoration: none;
    }

    .error-bar {
      padding: 12px 28px;
      background: #1a1212;
      border-bottom: 1px solid #2a1515;
      display: none;
    }

    .error-bar.show { display: flex; align-items: center; gap: 12px; }

    .error-bar span { color: var(--danger); font-size: 13px; }

    .error-dismiss {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 12px;
    }

    .deck-row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .deck-row .field-theme { flex: 1 1 300px; }
    .deck-row .field-count { flex: 0 0 100px; }

    .progress-bar {
      width: 100%;
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 16px;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      transition: width 0.3s ease;
      width: 0%;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      margin-top: 20px;
    }

    .card-item {
      position: relative;
    }

    .card-item img {
      width: 100%;
      aspect-ratio: 3/4;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border);
      display: block;
    }

    .card-num {
      position: absolute;
      bottom: 6px;
      right: 8px;
      font-size: 10px;
      color: var(--text-dim);
      background: rgba(0,0,0,0.7);
      padding: 2px 6px;
      border-radius: 3px;
    }

    .deck-count {
      margin-top: 16px;
      font-size: 12px;
      color: var(--text-dim);
    }

    @media (max-width: 600px) {
      header { padding: 16px; }
      .section { padding: 20px 16px; }
      h1 { font-size: 15px; }
      .header-left { gap: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <h1>ImageForge</h1>
      <div class="tabs">
        <button class="tab active" data-mode="sticker">Stickers</button>
        <button class="tab" data-mode="deck">Deck</button>
        <button class="tab" data-mode="single">Single</button>
      </div>
    </div>
    <div class="provider-toggle">
      <span class="provider-label">Provider</span>
      <button class="provider-btn active" data-provider="dalle">DALL·E</button>
      <button class="provider-btn" data-provider="replicate">Replicate</button>
    </div>
  </header>

  <div class="error-bar" id="error-bar">
    <span id="error-text"></span>
    <button class="error-dismiss" onclick="hideError()">dismiss</button>
  </div>

  <!-- Sticker Section -->
  <div class="section active" id="section-sticker">
    <label>Moments</label>
    <div id="moments-list">
      <div class="moment-row">
        <span class="moment-num">1</span>
        <input type="text" placeholder="A moment or thing you're grateful for...">
        <button class="remove-btn" onclick="removeMoment(this)">×</button>
      </div>
      <div class="moment-row">
        <span class="moment-num">2</span>
        <input type="text" placeholder="A moment or thing you're grateful for...">
        <button class="remove-btn" onclick="removeMoment(this)">×</button>
      </div>
      <div class="moment-row">
        <span class="moment-num">3</span>
        <input type="text" placeholder="A moment or thing you're grateful for...">
        <button class="remove-btn" onclick="removeMoment(this)">×</button>
      </div>
    </div>
    <button class="add-btn" id="add-moment-btn" onclick="addMoment()">+ add moment</button>
    <div style="margin-top: 20px;">
      <button class="btn" id="sticker-btn" onclick="generateStickers()">Generate Sticker Sheet</button>
    </div>
    <div id="sticker-result"></div>
  </div>

  <!-- Deck Section -->
  <div class="section" id="section-deck">
    <div class="deck-row">
      <div class="field-theme">
        <label>Theme</label>
        <input type="text" id="deck-theme" placeholder='e.g. "insect deck"'>
      </div>
      <div class="field-count">
        <label>Cards</label>
        <input type="number" id="deck-count" value="50" min="1" max="200">
      </div>
    </div>
    <div style="margin-top: 12px;">
      <label>Style override (optional)</label>
      <input type="text" id="deck-style" placeholder="Custom style prompt for all cards...">
    </div>
    <div style="margin-top: 20px;">
      <button class="btn" id="deck-btn" onclick="generateDeck()">Generate 50 Cards</button>
    </div>
    <div class="progress-bar" id="deck-progress" style="display:none;">
      <div class="progress-fill" id="deck-progress-fill"></div>
    </div>
    <div class="deck-count" id="deck-count-label" style="display:none;"></div>
    <div class="card-grid" id="card-grid"></div>
  </div>

  <!-- Single Section -->
  <div class="section" id="section-single">
    <label>Prompt</label>
    <textarea id="single-prompt" placeholder="Describe what you want to generate..."></textarea>
    <div style="margin-top: 20px;">
      <button class="btn" id="single-btn" onclick="generateSingle()">Generate</button>
    </div>
    <div id="single-result"></div>
  </div>

  <script>
    let currentMode = 'sticker';
    let currentProvider = 'dalle';

    // ── Tabs ────────────────────────────
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentMode = tab.dataset.mode;
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById('section-' + currentMode).classList.add('active');
      });
    });

    // ── Provider ────────────────────────
    document.querySelectorAll('.provider-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.provider-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentProvider = btn.dataset.provider;
      });
    });

    // ── Error ───────────────────────────
    function showError(msg) {
      document.getElementById('error-text').textContent = msg;
      document.getElementById('error-bar').classList.add('show');
    }
    function hideError() {
      document.getElementById('error-bar').classList.remove('show');
    }

    // ── Moments ─────────────────────────
    function addMoment() {
      const list = document.getElementById('moments-list');
      const count = list.children.length;
      if (count >= 7) return;
      const row = document.createElement('div');
      row.className = 'moment-row';
      row.innerHTML = `
        <span class="moment-num">${count + 1}</span>
        <input type="text" placeholder="A moment or thing you're grateful for...">
        <button class="remove-btn" onclick="removeMoment(this)">×</button>
      `;
      list.appendChild(row);
      if (count + 1 >= 7) document.getElementById('add-moment-btn').style.display = 'none';
    }

    function removeMoment(btn) {
      const list = document.getElementById('moments-list');
      if (list.children.length <= 1) return;
      btn.parentElement.remove();
      // renumber
      Array.from(list.children).forEach((row, i) => {
        row.querySelector('.moment-num').textContent = i + 1;
      });
      document.getElementById('add-moment-btn').style.display = '';
    }

    // ── Sticker Generation ──────────────
    async function generateStickers() {
      const inputs = document.querySelectorAll('#moments-list input');
      const moments = Array.from(inputs).map(i => i.value.trim()).filter(Boolean);
      if (!moments.length) return;

      const btn = document.getElementById('sticker-btn');
      btn.disabled = true;
      btn.textContent = 'Generating...';
      hideError();
      document.getElementById('sticker-result').innerHTML = '';

      try {
        const res = await fetch('/api/generate/sticker-sheet', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ moments, provider: currentProvider }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        document.getElementById('sticker-result').innerHTML = `
          <img class="result-img" src="${data.url}" alt="Sticker sheet">
          <br><a class="download-link" href="${data.url}" download="sticker-sheet.png" target="_blank">↓ Download</a>
        `;
      } catch (err) {
        showError(err.message);
      }

      btn.disabled = false;
      btn.textContent = 'Generate Sticker Sheet';
    }

    // ── Deck Generation ─────────────────
    async function generateDeck() {
      const theme = document.getElementById('deck-theme').value.trim();
      if (!theme) return;

      const count = parseInt(document.getElementById('deck-count').value) || 50;
      const stylePrompt = document.getElementById('deck-style').value.trim();
      const btn = document.getElementById('deck-btn');

      btn.disabled = true;
      hideError();
      document.getElementById('card-grid').innerHTML = '';
      document.getElementById('deck-progress').style.display = '';
      document.getElementById('deck-count-label').style.display = '';

      try {
        const res = await fetch('/api/generate/deck', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ theme, count, provider: currentProvider, stylePrompt: stylePrompt || undefined }),
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let generated = 0;

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          const lines = buffer.split('\n');
          buffer = lines.pop() || '';

          for (const line of lines) {
            if (line.startsWith('data: ')) {
              try {
                const event = JSON.parse(line.slice(6));
                if (event.done) break;
                if (event.url) {
                  generated++;
                  const grid = document.getElementById('card-grid');
                  grid.innerHTML += `
                    <div class="card-item">
                      <img src="${event.url}" alt="Card ${event.index + 1}">
                      <span class="card-num">${event.index + 1}</span>
                    </div>
                  `;
                }
                const pct = ((event.index + 1) / event.total) * 100;
                document.getElementById('deck-progress-fill').style.width = pct + '%';
                document.getElementById('deck-count-label').textContent = `${event.index + 1} / ${count} cards`;
                btn.textContent = `Generating ${event.index + 1}/${count}...`;
              } catch {}
            }
          }
        }
      } catch (err) {
        showError(err.message);
      }

      btn.disabled = false;
      btn.textContent = `Generate ${count} Cards`;
    }

    // ── Single Generation ───────────────
    async function generateSingle() {
      const prompt = document.getElementById('single-prompt').value.trim();
      if (!prompt) return;

      const btn = document.getElementById('single-btn');
      btn.disabled = true;
      btn.textContent = 'Generating...';
      hideError();
      document.getElementById('single-result').innerHTML = '';

      try {
        const endpoint = currentProvider === 'replicate' ? '/api/generate/replicate' : '/api/generate/dalle';
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        document.getElementById('single-result').innerHTML = `
          <img class="result-img" src="${data.url}" alt="Generated image">
          <br><a class="download-link" href="${data.url}" download="generated.png" target="_blank">↓ Download</a>
        `;
      } catch (err) {
        showError(err.message);
      }

      btn.disabled = false;
      btn.textContent = 'Generate';
    }

    // Update deck button label on count change
    document.getElementById('deck-count').addEventListener('input', (e) => {
      document.getElementById('deck-btn').textContent = `Generate ${e.target.value || 50} Cards`;
    });
  </script>
</body>
</html>
