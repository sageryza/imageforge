<!doctype html>
<!-- Instagram — the two grid mockups (Aug 2026, Sophie: "an icon button in the
     top right within the existing header space where the tags are, of my update
     tab … that shows an icon that leads to two tabs — two mockups of instagram
     (the dream one is already made by the dream commercials chat so reuse it
     exactly, it plays the films. port the shape for witch videos. only moon
     milk exists)").

     WHAT IT IS: her two Instagram accounts drawn as their profile grids, so she
     can see what the reels look like once they are posted. DREAM is the grid the
     dream-app-commercial chat built and posted into its own Compare tab; WITCH
     is the same shape with the witch account's one existing film in it.

     REUSED, NOT RE-DRAWN. The phone, the 3:4 crop, the tiles that play and the
     current-cut refresh all live in /instagrid.js — a faithful lift of
     scripts/dream-commercials/grid.js — and BOTH that script and this page read
     the same public/instagram-grids.json. A posted Compare page is frozen the
     day it is posted; this page is not. Keeping one data file and one renderer
     is what stops the two mockups of the same account drifting apart.

     TWO HAIRLINE TABS, not a longer page (her standing rule, and the test for
     splitting is REFERENCE: these are two versions of one thing she reads
     against each other). The row measures its own underline — no tab count
     lives anywhere, so adding a third account is a row in the JSON.

     House kit it follows:
       /compare.css   the look AND the five tokens the injected pill reads
       /compare.js    the lightboxes (autoscroll stopped, page locked, scroll
                      position restored on close, video torn down)
       /filmnote.js   tap-to-note on a playing film, on the film's own url in
                      the chat that makes it
       "?"            the explanation, behind the circle — never on the page
     Rules for pages: .claude/skills/new-page. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Instagram</title>
<link rel="stylesheet" href="/compare.css">
<style>
  /* The title row. The injected pill is fixed over x 324-374 / y 14-192, so
     this row — which passes straight under it — reserves 64px on the right
     (56 leaves the last 8px of a control there dead; measured on /brief). */
  .ighead{ display:flex; align-items:center; gap:4px; padding-right:64px;
    margin:0 0 12px; }
  .ighead h1{ margin:0; }

  /* The way back to the UPDATE tab this page is opened from. Hidden when a
     native bar or pagehead.js already draws one — two chevrons in one row is
     one too many. */
  .backch{ flex:0 0 auto; width:26px; height:26px; margin-left:-6px; padding:0;
    border:0; background:transparent; color:var(--ink2); font:inherit;
    font-size:26px; line-height:1; cursor:pointer;
    -webkit-tap-highlight-color:transparent; }
  .backch[hidden]{ display:none !important; }

  /* TWO TABS — the house `.acctabs` idiom verbatim (voice.html, chats.html):
     no boxes, labels over a hairline, the line sliding under the one she is
     reading. It reserves the pill's corner for the TAPS; the line itself is
     MEASURED off the lit tab (tabLine below) and is never told a tab count. */
  .acctabs{ position:relative; display:flex; border-bottom:1px solid var(--line);
    margin:0 0 16px; padding-right:64px; }
  .acctab{ flex:1 1 0; min-width:0; padding:7px 4px 9px; border:none; background:none;
    cursor:pointer; font-family:-apple-system,sans-serif; font-size:10px;
    letter-spacing:.08em; text-transform:uppercase; color:var(--ink2);
    -webkit-tap-highlight-color:transparent; }
  .acctab.on{ color:var(--ink); }      /* the sliding line says which — no bold */
  .acctabs::after{ content:''; position:absolute; left:0; bottom:-1px; height:2px;
    width:var(--tw,0); background:var(--ink); transform:translateX(var(--tx,0)); }
  .acctabs.tl::after{ transition:transform .2s ease, width .2s ease; }

  .igpane[hidden]{ display:none !important; }
  .igstate{ font-size:14px; color:var(--ink2); text-align:center; padding:24px 0; }
</style>

<div class="wrap">
  <div class="ighead">
    <button class="backch" id="back" aria-label="back" hidden>&lsaquo;</button>
    <h1>Instagram</h1>
  </div>

  <div class="acctabs" id="tabs" data-on="0"></div>
  <div id="panes"><div class="igstate" id="state">Loading&hellip;</div></div>
</div>

<script src="/compare.js"></script>
<script src="/filmnote.js"></script>
<script src="/instagrid.js"></script>
<script>
(function () {   /* IIFE — the injected pill runs in global scope declaring var
                    raf / I / playing; a page-level let of the same name kills
                    its script at parse time. */
'use strict';
var tabs = document.getElementById('tabs');
var panes = document.getElementById('panes');

/* The line is MEASURED off the lit tab and written as --tw/--tx, so the tab
   count lives nowhere. An unmeasured row draws NO line rather than a guessed
   one, and the slide is switched on a frame AFTER the first measurement so the
   page opens with the line already in place. */
function tabLine() {
  var on = tabs.querySelector('.acctab.on'); if (!on) return;
  var r = tabs.getBoundingClientRect(), t = on.getBoundingClientRect();
  if (!t.width) return;
  tabs.style.setProperty('--tw', t.width + 'px');
  tabs.style.setProperty('--tx', (t.left - r.left - tabs.clientLeft) + 'px');
  if (!tabs.__tl) { tabs.__tl = 1; requestAnimationFrame(function () { tabs.classList.add('tl'); }); }
}
// A resize SNAPS (only a tap slides) and measures a FRAME LATER: `resize` fires
// before the new layout is committed, so a tab read inside the handler still
// reports its old width.
window.addEventListener('resize', function () {
  tabs.classList.remove('tl'); tabs.__tl = 0; requestAnimationFrame(tabLine);
}, { passive: true });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(tabLine);

function showTab(i) {
  tabs.dataset.on = String(i);
  [].slice.call(tabs.children).forEach(function (b, n) { b.classList.toggle('on', n === i); });
  [].slice.call(panes.children).forEach(function (p, n) { p.hidden = n !== i; });
  tabLine();
}

function build(accounts) {
  tabs.innerHTML = ''; panes.innerHTML = '';
  accounts.forEach(function (a, i) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'acctab' + (i === 0 ? ' on' : '');
    b.textContent = a.tab || a.id;
    b.onclick = function () { showTab(i); };
    tabs.appendChild(b);

    var pane = document.createElement('div');
    pane.className = 'igpane';
    pane.hidden = i !== 0;
    panes.appendChild(pane);
    window.__instaGrid.render(a, pane);
  });
  showTab(0);
  // Both grids ask at once — one request, and a tab she has not opened yet is
  // already current when she gets to it.
  window.__instaGrid.refresh(panes);
}

fetch('/instagram-grids.json')
  .then(function (r) { return r.json(); })
  .then(function (d) {
    var accounts = (d && d.accounts) || [];
    if (!accounts.length) throw new Error('no accounts');
    build(accounts);
  })
  .catch(function () {
    panes.innerHTML = '<div class="igstate">Couldn’t load the grids.</div>';
  });

/* The chevron: this page is opened from the Chats app's UPDATE tab, inside that
   same web view, so the way back is the page's job. Embedded in a native tool
   screen the bar owns it; on the build that hands the header over, pagehead.js
   draws it — so this stays hidden in both cases. */
if (!/[?&]embed=1/.test(location.search) && !window.__forgeLeave) {
  var back = document.getElementById('back');
  back.hidden = false;
  back.addEventListener('click', function () {
    if (history.length > 1) history.back(); else location.href = '/chats?view=news';
  });
}

window.__compareHelp({ html: '<b>What the grid will look like</b> once these are '
  + 'posted — the tiles are cropped 3:4, which is what Instagram does to a reel '
  + 'cover, so the crop here is the crop you get.'
  + '<br><br><b>Tap a tile to play its film.</b> A tap on the film pauses it '
  + 'and a Note button appears — tap it and just talk; Done or pressing play '
  + 'saves the note. Notes send in the background and land in the chat that '
  + 'makes that film.'
  + '<br><br>Each tile resolves its film’s <b>current cut</b> every time this '
  + 'page opens, so a re-cut in another chat shows up here on its own.' });
})();
</script>
