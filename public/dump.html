<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>The Dump — sort & label</title>
<!-- THE LIST · TILES · 3/4 SWITCH — the one shell (/viewswitch.js), linked, never copied -->
<link rel="stylesheet" href="/viewswitch.css">
<style>
  :root{ --bg:#faf9f7; --surface:#fff; --surface2:#f5f0eb; --border:#e8e4df;
    --accent:#b48b6a; --text:#3a3530; --dim:#9e9590; --danger:#d4807a; --r:6px; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,'DM Sans',system-ui,sans-serif; -webkit-text-size-adjust:100%; }
  [hidden]{ display:none !important; }

  /* Page-owned header (the Chats-look eyebrow); top-right corner reserved for
     the autoscroll pill per the house rule. */
  /* The WHOLE control strip pins — title, counts AND the filter/Select chips.
     Scrolling 100 albums must never mean scrolling back up to reach Select. */
  header{ position:sticky; top:0; background:var(--bg); z-index:5;
    padding:calc(14px + env(safe-area-inset-top)) 0 0 0;
    border-bottom:1px solid var(--border); }
  header .top{ padding:0 56px 0 16px; display:flex; align-items:flex-end; gap:10px; }
  header .top .tt{ flex:1; min-width:0; }
  /* the view switch reads this page's tokens; the box sits at the row's end,
     inside the pill's 56px reserve */
  header .top .viewtog{ --vs-line:var(--border); --vs-paper:var(--surface); --vs-ink:var(--accent); }
  .eyebrow{ font-size:12px; font-weight:600; letter-spacing:2.5px; color:#8a8377; }
  .counts{ font-size:12px; color:var(--dim); margin-top:3px; }
  /* ?embed=1 — hosted as the Dump tile's Sort tab, where the native screen
     already carries the title and the safe-area inset. Keep the counts line
     (it's live data, not chrome); drop the eyebrow and the top padding. */
  body.embed header{ padding:8px 0 0 0; }
  body.embed .eyebrow{ display:none; }

  /* FROM ME · FROM CLAUDE — the hairline tab row (chats.html's .acctabs, the
     line MEASURED under the lit word by tabLine() below, never a percentage).
     2026-09-25, Sophie: "hide every single thing a chat has ever uploaded or
     make a new tab. make it like 'from claude' and from me". Opens on FROM ME. */
  .acctabs{ position:relative; display:flex; border-bottom:1px solid var(--border);
    margin:8px 0 0; }
  .acctab{ flex:1 1 0; min-width:0; display:flex; align-items:center; justify-content:center; gap:5px;
    padding:7px 4px 9px; border:none; background:none; cursor:pointer;
    font-family:-apple-system,sans-serif; font-size:10px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--dim); white-space:nowrap; -webkit-tap-highlight-color:transparent; }
  .acctab.on{ color:var(--text); }
  .acctabs::after{ content:''; position:absolute; left:0; bottom:-1px; height:2px;
    width:var(--tw,0); background:var(--text); transform:translateX(var(--tx,0)); }
  .acctabs.tl::after{ transition:transform .2s ease, width .2s ease; }

  /* THE CHIPS WRAP — no second scroll (2026-09-25, Sophie: "there's two
     scrolls!!!"). This row scrolled sideways under a page that scrolls down,
     and 143 dump-date chips made it a scroll she could never reach the end
     of. The dates are ONE chip now that opens a sheet; what is left wraps. */
  .chips{ display:flex; flex-wrap:wrap; gap:6px; padding:10px 16px 8px; }
  .chip{ flex:0 0 auto; font-size:13px; border:1px solid var(--border); border-radius:var(--r);
    padding:6px 12px; background:var(--surface); color:var(--dim); cursor:pointer; user-select:none; }
  .chip.on{ background:var(--accent); border-color:var(--accent); color:#fff; }

  main{ padding:8px 12px calc(40px + env(safe-area-inset-bottom)); }
  /* TILES — album covers `--cols` across, the name under (2026-09-25,
     Sophie: "is there no tiles just list?"). The list is the cards below. */
  .wall{ display:grid; grid-template-columns:repeat(var(--cols,3),1fr); gap:8px; padding:2px 2px 10px; }
  /* min-width:0 — a button's min-content is its nowrap name, and one long
     album name would push the whole row past the screen (PHOTO'd). */
  .wall .tile{ display:block; min-width:0; width:100%; border:0; padding:0; background:none;
    text-align:left; cursor:pointer; font:inherit; color:var(--text); }
  .wall .tile.picked .cv{ outline:3px solid var(--accent); outline-offset:-3px; }
  .wall .cv{ width:100%; aspect-ratio:1; object-fit:cover; border-radius:var(--r); display:block;
    background:var(--surface2); border:1px solid var(--border); }
  .wall .tn{ font-size:12px; font-weight:600; margin-top:4px; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; }
  .wall .ts{ font-size:11px; color:var(--dim); }
  .wall .ts.un{ color:var(--danger); }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:12px;
    margin-bottom:10px; overflow:hidden; }
  .head{ display:flex; align-items:center; gap:12px; padding:10px 12px; cursor:pointer; }
  .cover{ width:56px; height:56px; border-radius:var(--r); object-fit:cover;
    background:var(--surface2); flex:0 0 auto; }
  .meta{ flex:1; min-width:0; }
  .nm{ font-size:15px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sub{ font-size:12px; color:var(--dim); margin-top:2px; }
  .tk{ font-size:11px; border-radius:var(--r); padding:3px 8px; flex:0 0 auto; }
  .tk.set{ background:var(--surface2); color:var(--accent); border:1px solid var(--border); }
  .tk.un{ color:var(--danger); border:1px dashed var(--danger); }

  .body{ border-top:1px solid var(--border); padding:12px; }
  .files{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:12px; }
  .files .f{ position:relative; aspect-ratio:1; border-radius:4px; overflow:hidden;
    background:var(--surface2); border:0; padding:0; cursor:pointer; }
  .files img{ width:100%; height:100%; object-fit:cover; display:block; }
  .files .aud{ display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:4px; color:var(--dim); padding:4px; }
  .files .aud .audm{ font-size:20px; color:var(--accent); line-height:1; }
  .files .aud .audn{ font-size:9px; line-height:1.2; text-align:center; word-break:break-all;
    max-height:2.4em; overflow:hidden; }
  .files .vid::after{ content:'▶'; position:absolute; inset:0; display:flex; align-items:center;
    justify-content:center; color:#fff; font-size:18px; text-shadow:0 1px 4px rgba(0,0,0,.6); }
  label{ display:block; font-size:11px; letter-spacing:1px; text-transform:uppercase;
    color:var(--dim); margin:10px 0 4px; }
  input[type=text], textarea{ width:100%; border:1px solid var(--border); border-radius:var(--r);
    padding:9px 10px; font:inherit; font-size:15px; background:var(--bg); color:var(--text); }
  textarea{ min-height:52px; resize:vertical; }
  .tracks{ display:flex; gap:6px; flex-wrap:wrap; }
  .savebar{ display:flex; gap:10px; align-items:center; margin-top:14px; }
  .save{ background:var(--accent); color:#fff; border:0; border-radius:var(--r);
    padding:10px 20px; font:inherit; font-size:15px; font-weight:600; }
  .save:disabled{ opacity:.5; }
  .hint{ font-size:12px; color:var(--dim); }
  .empty{ text-align:center; color:var(--dim); padding:44px 20px; font-size:14px; }

  /* Select mode: tap whole album cards; the folder is a label on the album,
     so nothing inside it moves. */
  .card.picked{ outline:2px solid var(--accent); }
  .card.picked .head::after{ content:'✓'; width:20px; height:20px; border-radius:50%;
    background:var(--accent); color:#fff; font-size:13px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; }
  #movebar{ position:fixed; left:0; right:0; bottom:0; z-index:15;
    display:flex; gap:10px; align-items:center; padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    background:var(--surface); border-top:1px solid var(--border); }
  #movebar .n{ font-size:14px; color:var(--text); flex:1; }
  #movebar button{ font:inherit; font-size:14px; font-weight:600; border-radius:var(--r); padding:9px 16px; }
  #mvgo{ background:var(--accent); color:#fff; border:0; }
  #mvgo:disabled{ opacity:.5; }
  #mvcancel{ background:transparent; color:var(--dim); border:1px solid var(--border); }
  /* Album-picker sheet */
  #sheet, #datesheet{ position:fixed; inset:0; z-index:25; background:rgba(20,16,12,.45);
    display:flex; align-items:flex-end; }
  #sheetin, .sheetin{ background:var(--surface); border-radius:12px 12px 0 0; width:100%;
    max-height:70vh; overflow-y:auto; padding:16px 16px calc(20px + env(safe-area-inset-bottom)); }
  #sheetin .lab2, .sheetin .lab2{ font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--dim); margin:12px 0 6px; }
  .alb{ display:flex; align-items:center; gap:10px; width:100%; text-align:left; font:inherit;
    background:none; border:0; border-bottom:1px solid var(--border); padding:10px 2px; cursor:pointer; }
  .alb img{ width:38px; height:38px; border-radius:4px; object-fit:cover; background:var(--surface2); }
  .alb .an{ font-size:15px; color:var(--text); flex:1; }
  .alb .ac{ font-size:12px; color:var(--dim); }
  #newrow{ display:flex; gap:8px; margin-top:8px; }
  #newrow input{ flex:1; }
  #newrow button{ font:inherit; font-size:14px; font-weight:600; border-radius:var(--r);
    padding:9px 14px; background:var(--accent); color:#fff; border:0; }

  /* Back to the top — appears once she's scrolled past a screen, sits bottom
     LEFT so it never fights the move bar's buttons or the pill's corner. */
  #totop{ position:fixed; left:14px; bottom:calc(14px + env(safe-area-inset-bottom));
    z-index:14; width:42px; height:42px; border-radius:50%; font-size:19px;
    background:var(--surface); color:var(--accent); border:1px solid var(--border);
    box-shadow:0 2px 8px rgba(0,0,0,.10); cursor:pointer; }
  body.selecting #totop{ bottom:calc(74px + env(safe-area-inset-bottom)); }

  /* Lightbox: freezes the page behind it (house rule — save/restore scroll). */
  #lb{ position:fixed; inset:0; background:rgba(20,16,12,.92); z-index:20;
    display:flex; flex-direction:column; align-items:center; justify-content:center; }
  #lb img, #lb video{ max-width:96vw; max-height:78vh; border-radius:4px; }
  #lb audio{ width:min(92vw,420px); }
  #lb .row{ display:flex; gap:14px; margin-top:16px; }
  #lb button, #lb .row a{ font:inherit; font-size:14px; border-radius:var(--r); padding:9px 18px;
    text-decoration:none; display:inline-block;
    border:1px solid rgba(255,255,255,.5); background:transparent; color:#fff; }
  #lb .del{ border-color:var(--danger); color:var(--danger); }
</style>

<header>
  <div class="top">
    <div class="tt">
      <div class="eyebrow">THE DUMP</div>
      <div class="counts" id="counts">loading…</div>
    </div>
    <div id="viewmount"></div>
  </div>
  <div class="acctabs" id="fromtabs">
    <button class="acctab on" data-from="me">From me</button>
    <button class="acctab" data-from="claude">From Claude</button>
  </div>
  <div class="chips" id="filters"></div>
</header>
<button id="totop" hidden aria-label="Back to the top">&#8593;</button>
<main id="list"><div class="empty">loading the inbox…</div></main>

<div id="movebar" hidden>
  <span class="n" id="mvcount">0 picked</span>
  <button id="mvcancel">Cancel</button>
  <button id="mvgo" disabled>File into…</button>
</div>

<div id="sheet" hidden>
  <div id="sheetin">
    <div class="lab2">File into folder</div>
    <div id="alblist"></div>
    <div class="lab2">Or a new folder</div>
    <div id="newrow"><input type="text" id="newname" placeholder="folder name"><button id="newgo">Move</button></div>
  </div>
</div>

<!-- the dumps by date — one tap on the Date chip, one tap on a dump -->
<div id="datesheet" hidden>
  <div id="sheetin2" class="sheetin">
    <div class="lab2">Which dump</div>
    <div id="datelist"></div>
  </div>
</div>

<div id="lb" hidden>
  <img id="lbimg" alt="" hidden>
  <video id="lbvid" controls playsinline hidden></video>
  <audio id="lbaud" controls hidden></audio>
  <div class="row">
    <button id="lbsave">Save to Photos</button>
    <button class="del" id="lbdel">Delete</button>
    <button id="lbclose">Close</button>
  </div>
  <div class="hint" id="lbhint" style="color:#fff;opacity:.8;margin-top:10px;min-height:1em"></div>
</div>

<script src="/viewswitch.js"></script>
<script>
const TOKEN='__STUDIO_TOKEN__', tok=TOKEN.indexOf('__')===0?'':TOKEN;
if(new URLSearchParams(location.search).get('embed')==='1') document.body.classList.add('embed');
// The Sort tab stays alive behind the Send tab, so a dump that finished while
// it was hidden must show up when she switches back — the host calls this.
window.__dumpRefresh = () => { if(typeof loadSide==='function') loadSide(); };
const api=(p,o={})=>{ if(tok) o.headers={...(o.headers||{}),'x-studio-token':tok};
  return fetch('/api/drop'+p,o).then(async r=>({ok:r.ok,status:r.status,body:await r.json().catch(()=>({}))})); };

// The known tracks; "other…" reveals a free-text box. Deliberately few — a
// track is a project, not a tag cloud.
// The SERVER owns this list now (GET /api/drop/tracks) so the iOS share sheet
// offers the same folders; this copy is the fallback for a failed fetch, and
// scripts/test-dump-session-time.js pins the two equal.
let TRACKS=['crystals','story-art','hoonies','reference','product'];
let sessions=[], curSession='', curFolder='', onlyUnlabelled=false, bundles=[];
// Which side is open: hers, or what chats put here. Memory, never localStorage
// — it opens on FROM ME every time, which is the ask.
let curFrom='me', allBundles=[];

let folders=[];
async function load(){
  const t=await api('/tracks'); if(t.ok&&Array.isArray(t.body.tracks)&&t.body.tracks.length)TRACKS=t.body.tracks;
  await loadSide();
}
// ONE read per side. The page used to call /bundles for the folder list, then
// /bundles again for the list, then again on every chip tap — each a read of
// the whole collection (4,888 files, 2026-09-25). Now the side's albums are
// read once and every chip is a filter over memory.
async function loadSide(){
  const el=document.getElementById('list');
  el.innerHTML='<div class="empty">loading…</div>';
  const q='?from='+encodeURIComponent(curFrom);
  const [s,all]=await Promise.all([api('/sessions'+q), api('/bundles'+q)]);
  sessions=(s.ok&&s.body.sessions)||[];
  allBundles=(all.ok&&all.body.bundles)||[];
  folders=[...new Set(allBundles.map(b=>b.track).filter(Boolean))].sort();
  renderFilters(); loadBundles();
}
function loadBundles(){
  bundles=allBundles.slice();
  if(curSession) bundles=bundles.filter(b=>b.session===curSession);
  if(onlyUnlabelled) bundles=bundles.filter(b=>!b.track);
  // Newest album first — the default, because the thing she just dumped is
  // the thing she wants to label. (seq is arrival order across ALL albums, so
  // it can't answer this; `newest` is the album's latest file.)
  bundles.sort((x,y)=>(y.newest||0)-(x.newest||0));
  if(curFolder) bundles=bundles.filter(b=>(b.track||'')===curFolder);
  const files=bundles.reduce((n,b)=>n+b.files.length,0);
  const un=bundles.filter(b=>!b.track).length;
  document.getElementById('counts').textContent=
    bundles.length+' albums · '+files+' files · '+un+' unlabelled';
  renderList();
}
// The tab row. A tap swaps the side and re-reads it; the chip filters reset,
// since a session or folder on one side means nothing on the other.
document.querySelectorAll('#fromtabs .acctab').forEach(b=>b.onclick=()=>{
  if(b.dataset.from===curFrom) return;
  curFrom=b.dataset.from; curSession=''; curFolder=''; onlyUnlabelled=false;
  document.querySelectorAll('#fromtabs .acctab').forEach(x=>x.classList.toggle('on',x===b));
  tabLine(document.getElementById('fromtabs'));
  loadSide();
});
// The line under the lit tab is MEASURED (chats.html's tabLine, verbatim in
// spirit): the row asks the tab where it is, so a third tab or a wider word
// can never leave the line adrift.
function tabLine(row){
  if(!row) return;
  const on=row.querySelector('.acctab.on'); if(!on) return;
  const r=row.getBoundingClientRect(), t=on.getBoundingClientRect();
  if(!t.width) return;
  row.style.setProperty('--tw', t.width+'px');
  row.style.setProperty('--tx', (t.left-r.left-row.clientLeft)+'px');
  if(!row.__tl){ row.__tl=1; requestAnimationFrame(()=>row.classList.add('tl')); }
}
addEventListener('resize',()=>tabLine(document.getElementById('fromtabs')));
tabLine(document.getElementById('fromtabs'));
function renderFilters(){
  const el=document.getElementById('filters');
  el.innerHTML=
    '<span class="chip'+(selectMode?' on':'')+'" data-sel="1">Select</span>'+
    '<span class="chip'+(curSession?'':' on')+'" data-s="">All</span>'+
    '<span class="chip'+(onlyUnlabelled?' on':'')+'" data-un="1">Unfiled</span>'+
    folders.map(f=>'<span class="chip fold'+(curFolder===f?' on':'')+'" data-f="'+esc(f)+'">'
      +esc(f)+'</span>').join('')+
    // ONE chip for the dumps by date, opening a sheet — 143 date chips in a
    // sideways-scrolling row was the second scroll. Lit, it reads the dump's
    // label: her wall clock, built server-side from the files' real
    // timestamps (sessionLabel in dropbox.js), never the session id.
    (sessions.length?'<span class="chip date'+(curSession?' on':'')+'" data-date="1">'
      +esc(curSession?(sessionLabelOf(curSession)+' ✕'):'Date')+'</span>':'');
  el.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    if(c.dataset.sel){ setSelectMode(!selectMode); return; }
    if(c.dataset.f!==undefined){ curFolder=(curFolder===c.dataset.f)?'':c.dataset.f; }
    else if(c.dataset.un){ onlyUnlabelled=!onlyUnlabelled; }
    else if(c.dataset.date){ if(curSession){ curSession=''; } else { openDates(); return; } }
    else { curSession=''; curFolder=''; }
    renderFilters(); loadBundles();
  });
}
function sessionLabelOf(id){ const s=sessions.find(x=>x.session===id); return (s&&s.label)||id; }
function openDates(){
  const list=document.getElementById('datelist');
  list.innerHTML=sessions.map(s=>
    '<button class="alb" data-s="'+esc(s.session)+'">'+
      (s.cover?'<img src="'+esc(s.cover)+'" loading="lazy" alt="">':'<span style="width:38px"></span>')+
      '<span class="an">'+esc(s.label||s.session)+'</span>'+
      '<span class="ac">'+s.files+' file'+(s.files===1?'':'s')+(s.unlabelled?' · '+s.unlabelled+' unlabelled':'')+'</span></button>').join('');
  list.querySelectorAll('[data-s]').forEach(a=>a.onclick=()=>{
    curSession=a.dataset.s; curFolder='';
    document.getElementById('datesheet').hidden=true;
    renderFilters(); loadBundles();
  });
  document.getElementById('datesheet').hidden=false;
}
document.getElementById('datesheet').onclick=e=>{ if(e.target.id==='datesheet')e.target.hidden=true; };
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

// Select mode: pick whole ALBUMS, then file the lot into a folder. Sophie's
// rule — "don't take it out of the sub folders it's already in": a folder
// CONTAINS albums, it never merges them, so this only writes each album's
// folder label and never touches a single file's place.
let selectMode=false; const picked=new Map(); // bundle key -> the bundle
function setSelectMode(on){
  selectMode=on;
  if(!on) picked.clear();
  document.getElementById('movebar').hidden=!on;
  document.body.classList.toggle('selecting',on);
  document.body.style.paddingBottom=on?'70px':'';
  renderFilters(); renderList();
}
function updateMoveBar(){
  document.getElementById('mvcount').textContent=picked.size+' album'+(picked.size===1?'':'s');
  document.getElementById('mvgo').disabled=!picked.size;
}
const bKey=b=>b.bundle?(b.session+'/'+b.bundle):('loose:'+b.files[0].id);

// LIST · TILES · 3/4 — the one shell. `dump_view` / `dump_cols` are its
// own keys; `--cols` on the root is what the wall reads.
let vs=null;
vs=window.__viewSwitch?window.__viewSwitch({mount:'#viewmount', key:'dump', cols:[3,4],
  onView:()=>{ if(bundles.length) renderList(); }, onCols:()=>{ if(bundles.length) renderList(); }}):null;
function renderList(){
  const el=document.getElementById('list');
  if(vs&&vs.view()==='tiles') return renderTiles();
  if(!bundles.length){ el.innerHTML='<div class="empty">'+(curFrom==='claude'?'Nothing from a chat here.':'Nothing here — dump something from the app first.')+'</div>'; return; }
  el.innerHTML=bundles.map((b,i)=>{
    const nm=b.bundleName||b.name||(b.bundle?b.bundle.replace(/-/g,' '):'loose file');
    const tk=b.track?'<span class="tk set">'+esc(b.track)+'</span>':'<span class="tk un">unlabelled</span>';
    const on=selectMode&&picked.has(bKey(b));
    return '<div class="card'+(on?' picked':'')+'" data-i="'+i+'">'+
      '<div class="head"'+(selectMode?' data-pick="'+i+'"':' onclick="toggle('+i+')"')+'>'+
        '<img class="cover" src="'+esc(b.coverThumb||b.cover||'')+'" loading="lazy" alt="">'+
        '<div class="meta"><div class="nm">'+esc(nm)+'</div>'+
        '<div class="sub">'+b.files.length+' file'+(b.files.length===1?'':'s')+' · '+esc(b.label||b.session)+'</div></div>'+
        tk+'</div>'+
      '<div class="body" id="body'+i+'" hidden></div></div>';
  }).join('');
  if(selectMode){
    el.querySelectorAll('[data-pick]').forEach(h=>h.onclick=()=>{
      const b=bundles[Number(h.dataset.pick)], k=bKey(b);
      if(picked.has(k)){ picked.delete(k); h.closest('.card').classList.remove('picked'); }
      else{ picked.set(k,b); h.closest('.card').classList.add('picked'); }
      updateMoveBar();
    });
    updateMoveBar();
  }
}

// TILES: the album's cover `--cols` across, the name and the count under.
// A tap opens the album the way the list does (the card, with its files),
// switching to the list at that card; in Select mode a tap picks the album.
function renderTiles(){
  const el=document.getElementById('list');
  if(!bundles.length){ el.innerHTML='<div class="empty">'+(curFrom==='claude'?'Nothing from a chat here.':'Nothing here — dump something from the app first.')+'</div>'; return; }
  el.innerHTML='<div class="wall">'+bundles.map((b,i)=>{
    const nm=b.bundleName||b.name||(b.bundle?b.bundle.replace(/-/g,' '):'loose file');
    const on=selectMode&&picked.has(bKey(b));
    return '<button class="tile'+(on?' picked':'')+'" data-i="'+i+'">'+
      '<img class="cv" src="'+esc(b.coverThumb||b.cover||'')+'" loading="lazy" alt="">'+
      '<div class="tn">'+esc(nm)+'</div>'+
      '<div class="ts'+(b.track?'':' un')+'">'+b.files.length+(b.track?' · '+esc(b.track):' · unlabelled')+'</div></button>';
  }).join('')+'</div>';
  el.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{
    const i=Number(t.dataset.i), b=bundles[i], k=bKey(b);
    if(selectMode){
      if(picked.has(k)){ picked.delete(k); t.classList.remove('picked'); }
      else{ picked.set(k,b); t.classList.add('picked'); }
      updateMoveBar(); return;
    }
    vs.setView('list');
    const card=el.querySelector('.card[data-i="'+i+'"]');
    if(card){ toggle(i); card.scrollIntoView({block:'start'}); }
  });
  if(selectMode) updateMoveBar();
}

function toggle(i){
  const body=document.getElementById('body'+i);
  if(!body.hidden){ body.hidden=true; return; }
  const b=bundles[i];
  const other=b.track&&!TRACKS.includes(b.track)?b.track:'';
  body.innerHTML=
    '<div class="files">'+b.files.map(f=>{
      // AUDIO HAS NO PICTURE, so it gets a mark and its filename instead of a
      // broken <img> (2026-08-24, when the Dump learned to take audio). Every
      // older reader asks `=== 'video'` and calls the rest an image, which is
      // exactly the tile this replaces.
      if(f.media==='audio'){
        const nm=String(f.name||f.filename||'audio');
        return '<button class="f aud" data-id="'+esc(f.id)+'" data-url="'+esc(f.url)+'" data-m="audio">'+
          '<span class="audm">♪</span><span class="audn">'+esc(nm)+'</span></button>';
      }
      // A FILE (a zip, a PDF) has no picture either — its name, and a tap
      // saves it (2026-09-16, the LumaFusion zip door).
      if(f.media==='file'){
        const nm=String(f.name||f.filename||'file');
        return '<a class="f aud" href="/api/drop/file/'+esc(f.id)+'" data-m="file">'+
          '<span class="audm">⇩</span><span class="audn">'+esc(nm)+'</span></a>';
      }
      // the display copy, never the original (a 4MB photo at 90px)
      const src=f.thumb||(f.media==='video'?(f.posterUrl||''):f.url);
      return '<button class="f'+(f.media==='video'?' vid':'')+'" data-id="'+esc(f.id)+'" data-url="'+esc(f.url)+'" data-m="'+esc(f.media)+'">'+
        '<img src="'+esc(src)+'" loading="lazy" alt=""></button>';
    }).join('')+'</div>'+
    '<label>Name</label><input type="text" id="nm'+i+'" value="'+esc(b.bundleName||b.name||'')+'">'+
    '<label>Folder — what project is this?</label>'+
    '<div class="tracks" id="tr'+i+'">'+TRACKS.map(t=>
      '<span class="chip'+(b.track===t?' on':'')+'" data-t="'+t+'">'+t+'</span>').join('')+
      '<span class="chip'+(other?' on':'')+'" data-t="__other">other…</span></div>'+
    '<input type="text" id="oth'+i+'" placeholder="track name" value="'+esc(other)+'"'+(other?'':' hidden')+'>'+
    '<label>Notes</label><textarea id="no'+i+'">'+esc(b.notes||'')+'</textarea>'+
    '<div class="savebar"><button class="save" id="sv'+i+'">Save</button><span class="hint" id="hi'+i+'"></span></div>';
  body.hidden=false;

  let track=b.track||'';
  const trEl=document.getElementById('tr'+i), othEl=document.getElementById('oth'+i);
  trEl.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    const t=c.dataset.t;
    if(t==='__other'){ othEl.hidden=!othEl.hidden; if(!othEl.hidden)othEl.focus(); track=othEl.value.trim(); }
    else{
      // tap the lit chip again to clear the track back to unlabelled
      track=(track===t)?'':t; othEl.hidden=true;
    }
    trEl.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',
      x.dataset.t==='__other'?!othEl.hidden:x.dataset.t===track));
  });
  othEl.oninput=()=>{ track=othEl.value.trim(); };

  body.querySelectorAll('.f').forEach(f=>f.onclick=()=>openLB(f.dataset));

  document.getElementById('sv'+i).onclick=async()=>{
    const btn=document.getElementById('sv'+i), hint=document.getElementById('hi'+i);
    btn.disabled=true; hint.textContent='saving…';
    const patch={ bundleName:document.getElementById('nm'+i).value.trim(),
      track:track||null, notes:document.getElementById('no'+i).value.trim() };
    let r;
    if(b.bundle) r=await api('/bundle',{method:'PATCH',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({session:b.session,bundle:b.bundle,...patch})});
    else r=await api('/items/'+b.files[0].id,{method:'PATCH',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:patch.bundleName,track:patch.track,notes:patch.notes})});
    btn.disabled=false;
    if(r.ok){ hint.textContent='saved ✓'; Object.assign(b,{bundleName:patch.bundleName,track:patch.track,notes:patch.notes});
      renderList(); }
    else hint.textContent='failed: '+((r.body&&r.body.error)||r.status);
  };
}

// ── the move itself ──
document.getElementById('mvcancel').onclick=()=>setSelectMode(false);
document.getElementById('mvgo').onclick=()=>{
  const list=document.getElementById('alblist');
  list.innerHTML=folders.map(f=>
    '<button class="alb" data-mv="'+esc(f)+'"><span class="an">'+esc(f)+'</span></button>').join('')
    ||'<div class="empty" style="padding:14px">No folders yet — name one below.</div>';
  list.querySelectorAll('[data-mv]').forEach(a=>a.onclick=()=>doMove(a.dataset.mv));
  document.getElementById('newname').value='';
  document.getElementById('sheet').hidden=false;
};
document.getElementById('sheet').onclick=e=>{ if(e.target.id==='sheet')document.getElementById('sheet').hidden=true; };
document.getElementById('newgo').onclick=()=>{
  const nm=document.getElementById('newname').value.trim();
  if(nm) doMove(nm);
};
// One PATCH per album — each writes the folder onto every file of that album,
// which is what makes the folder a property of the album rather than a move.
async function doMove(folder){
  document.getElementById('sheet').hidden=true;
  const list=[...picked.values()];
  let done=0, failed=0;
  for(const b of list){
    document.getElementById('mvcount').textContent='filing '+(done+1)+' of '+list.length+'…';
    const r=b.bundle
      ? await api('/bundle',{method:'PATCH',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({session:b.session, bundle:b.bundle, track:folder})})
      : await api('/items/'+b.files[0].id,{method:'PATCH',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({track:folder})});
    r.ok?done++:failed++;
  }
  setSelectMode(false);
  await loadSide();
  if(failed) document.getElementById('counts').textContent+=' · '+failed+" couldn't be filed";
}

const toTop=document.getElementById('totop');
addEventListener('scroll',()=>{ toTop.hidden=window.scrollY<400; },{passive:true});
toTop.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});

// Lightbox — freeze the page behind it AND restore the exact scroll position
// on close (overflow:hidden alone doesn't stop programmatic scrolls).
let savedY=0, lbId=null;
function openLB(d){
  savedY=window.scrollY; lbId=d.id;
  if(window.__scrollStop)window.__scrollStop();
  document.body.style.overflow='hidden';
  const img=document.getElementById('lbimg'), vid=document.getElementById('lbvid');
  const aud=document.getElementById('lbaud');
  img.hidden=true; vid.hidden=true; vid.removeAttribute('src');
  aud.hidden=true; aud.removeAttribute('src');
  if(d.m==='video'){ vid.hidden=false; vid.src=d.url; }
  else if(d.m==='audio'){ aud.hidden=false; aud.src=d.url; }
  else{ img.hidden=false; img.src=d.url; }
  lbUrl=d.url; lbKind=d.m||'image'; document.getElementById('lbhint').textContent='';
  document.getElementById('lbsave').hidden=(lbKind!=='image'&&lbKind!=='video');
  document.getElementById('lb').hidden=false;
}
// SAVE GOES TO PHOTOS, NEVER FILES (2026-09-25, Sophie: "things save to files
// shud go to photos never files"). It was a /api/drop/file/:id link — an
// attachment, which iOS puts in Files. Three paths, asset-actions.js's own:
// 1. in the app, the native forgeSave bridge writes it to the photo library
//    (a clip too — ForgeSaveBridge asks the url whether it is a video);
// 2. in Safari, the share sheet with the fetched file, where Save Image /
//    Save Video is the first row;
// 3. a desktop browser downloads it.
let lbUrl='', lbKind='image';
function nativeSaver(){ try{ return window.webkit.messageHandlers.forgeSave; }catch(e){ return null; } }
window.__saveResult=function(ok,msg){ document.getElementById('lbhint').textContent=msg||(ok?'Saved to Photos':'Couldn’t save that'); };
async function saveToPhotos(){
  const hint=document.getElementById('lbhint');
  const native=nativeSaver();
  if(native){ native.postMessage(lbUrl); hint.textContent='Saving…'; return; }
  hint.textContent='Getting the file…';
  let blob=null;
  try{ blob=await (await fetch(lbUrl)).blob(); }catch(e){ hint.textContent='Couldn’t fetch that file'; return; }
  const ext=(lbUrl.match(/\.([a-z0-9]{2,5})(?:$|\?)/i)||[,lbKind==='video'?'mp4':'jpg'])[1];
  let file=null;
  try{ file=new File([blob],'dump.'+ext,{type:blob.type||''}); }catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    hint.textContent='';
    navigator.share({files:[file]}).catch(err=>{ if(err&&err.name!=='AbortError') hint.textContent='Couldn’t open the share sheet'; });
    return;
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='dump.'+ext;
  document.body.appendChild(a); a.click(); a.remove(); hint.textContent='';
}
document.getElementById('lbsave').onclick=saveToPhotos;
function closeLB(){
  document.getElementById('lb').hidden=true;
  const vid=document.getElementById('lbvid'); vid.pause&&vid.pause(); vid.removeAttribute('src');
  const aud=document.getElementById('lbaud'); aud.pause&&aud.pause(); aud.removeAttribute('src');
  document.body.style.overflow=''; window.scrollTo(0,savedY);
}
document.getElementById('lbclose').onclick=closeLB;
document.getElementById('lb').onclick=e=>{ if(e.target.id==='lb')closeLB(); };
document.getElementById('lbdel').onclick=async()=>{
  if(!confirm('Delete this file from the Dump?'))return;
  const r=await api('/items/'+lbId,{method:'DELETE'});
  closeLB();
  if(r.ok) loadSide();
};

load();
</script>
