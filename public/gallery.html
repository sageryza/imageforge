<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ImageForge — Gallery</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #faf9f7;
      --surface: #ffffff;
      --border: #e8e2d9;
      --accent: #b48b6a;
      --text: #3a3530;
      --text-dim: #9a918a;
    }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
    }
    header {
      padding: 24px 28px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }
    h1 {
      font-size: 18px;
      font-weight: 300;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
    }
    .back-link {
      font-size: 13px;
      color: var(--text-dim);
      text-decoration: none;
    }
    .back-link:hover { color: var(--text); }
    .filters {
      padding: 16px 28px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 5px 14px;
      background: transparent;
      color: var(--text-dim);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .filter-btn.active {
      background: var(--surface);
      color: var(--text);
      border-color: var(--text-dim);
    }
    .gallery-grid {
      padding: 0 28px 28px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
    }
    .gallery-item {
      position: relative;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--surface);
    }
    .gallery-item img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
      cursor: pointer;
    }
    .gallery-item-info {
      padding: 6px 8px;
      font-size: 10px;
      color: var(--text-dim);
      display: flex;
      justify-content: space-between;
    }
    .count-label {
      padding: 8px 28px 16px;
      font-size: 12px;
      color: var(--text-dim);
    }
    .loading {
      padding: 40px 28px;
      font-size: 13px;
      color: var(--text-dim);
    }
    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      border-radius: 8px;
    }
    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 24px;
      background: none;
      border: none;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
    }
    .lightbox-download {
      position: absolute;
      bottom: 24px;
      right: 24px;
      color: #fff;
      font-size: 13px;
      text-decoration: none;
      background: rgba(255,255,255,0.15);
      padding: 8px 16px;
      border-radius: 6px;
    }
    @media (max-width: 600px) {
      .gallery-grid { padding: 0 16px 16px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
      header { padding: 16px; }
    }

/* Shared autoscroll pill (scripts/pill.py — keep in sync). The pill CSS speaks
   the forge variable names; alias them to this page's palette on .float. */
.float{--ink:var(--text); --paper:var(--surface); --chg:var(--accent); --ink2:var(--text-dim); --rose:var(--accent);}
.float{position:fixed; top:max(14px, env(safe-area-inset-top)); right:max(14px,4vw); z-index:9; display:flex; flex-direction:column; gap:8px; align-items:center; transform:translateZ(0); will-change:transform;}
.vseg{display:flex; flex-direction:column; width:48px; border:1.5px solid var(--ink); border-radius:999px; overflow:hidden; background:var(--paper); box-shadow:0 2px 10px rgba(0,0,0,.09);}
.vseg button{border:none; background:transparent; color:var(--ink); width:48px; height:52px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; -webkit-tap-highlight-color:transparent; touch-action:manipulation;}
.vseg button + button{border-top:1.5px solid var(--ink);}
.vseg button.on{background:color-mix(in srgb, var(--chg) 18%, var(--paper)); color:var(--chg);}
.vseg button.dim{opacity:.3;}
.vseg button:focus-visible{outline:2px solid var(--rose, #c66); outline-offset:-2px;}
#spd{font-family:-apple-system,sans-serif; font-size:11px; font-weight:600; color:var(--ink2); letter-spacing:.02em;}
/* BACK TO TOP (Aug 2026, Sophie: "add a small back to top arrow … when i
   scroll down. as well as other long scrolls"). The one source is
   scripts/pill.py; THIS page carries an older hand-drifted copy of the pill
   (no conditional-pill pass, tokens without fallbacks), so the button is
   added beside it rather than by re-generating — see the note in CLAUDE.md
   about the gen scripts being out of step with these pages. */
.ptop{box-sizing:border-box; width:38px; height:38px; border:1.5px solid var(--ink, #26221c); border-radius:50%;
  background:var(--paper, #f6f2e9); color:var(--ink, #26221c); padding:0; margin:0; cursor:pointer;
  display:none; align-items:center; justify-content:center; box-shadow:0 2px 10px rgba(0,0,0,.09);
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;}
.ptop.on{display:flex;}
.ptop:focus-visible{outline:2px solid var(--rose, #c66); outline-offset:-2px;}
  </style>
</head>
<body>

<div class="float">
  <div class="vseg">
    <button id="vtop" aria-label="Scroll up, or slower while playing"></button>
    <button id="vmid" aria-label="Play or pause autoscroll"></button>
    <button id="vbot" aria-label="Scroll down, or faster while playing"></button>
  </div>
  <span id="spd">Fast</span>
  <button id="ptop" class="ptop" aria-label="Back to the top" title="Back to the top"></button>
</div>

  <header>
    <h1>Gallery</h1>
    <a href="/" class="back-link">← ImageForge</a>
  </header>
  <div class="filters" id="filters"></div>
  <div class="count-label" id="count-label"></div>
  <div class="loading" id="loading">Loading images...</div>
  <div class="gallery-grid" id="gallery-grid"></div>

  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <button class="lightbox-close" onclick="closeLightbox()">×</button>
    <img id="lightbox-img" src="" alt="">
    <a class="lightbox-download" id="lightbox-download" href="" download target="_blank">↓ Download</a>
  </div>

  <script>

// Shared autoscroll pill (scripts/pill.py \u2014 keep in sync): five discrete
// speeds, Slow / Medium / Fast / Faster / Fastest, starting on Fast.
var SPEEDS=[['Slow',0.5],['Medium',1.0],['Fast',1.9],['Faster',3.2],['Fastest',5.2]];
var playing=false, raf=null, last=null, si=2, dir=1, acc=0;
var vtop=document.getElementById('vtop'), vmid=document.getElementById('vmid'), vbot=document.getElementById('vbot');
var I={
 up:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>',
 down:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
 play:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg>',
 pause:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="4.5" height="16" rx="1"/><rect x="14.5" y="4" width="4.5" height="16" rx="1"/></svg>',
 plus:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
 minus:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 12h14"/></svg>'
};
function spd(){ return SPEEDS[si][1]; }
function showSpd(){ document.getElementById('spd').textContent=SPEEDS[si][0]; }
function paintPill(){
  if(playing){
    vtop.innerHTML=I.minus; vbot.innerHTML=I.plus; vmid.innerHTML=I.pause; vmid.classList.add('on');
    vtop.classList.toggle('dim', si===0); vbot.classList.toggle('dim', si===SPEEDS.length-1);
  } else {
    vtop.innerHTML=I.up; vbot.innerHTML=I.down; vmid.innerHTML=I.play; vmid.classList.remove('on');
    vtop.classList.remove('dim'); vbot.classList.remove('dim');
  }
  showSpd();
}
function stepPill(ts){
  if(!playing) return;
  if(last!=null){
    acc += dir*(ts-last)/1000*42*spd();
    var move = acc>0 ? Math.floor(acc) : Math.ceil(acc);
    if(move!==0){ window.scrollBy(0,move); acc-=move; }
    var atEnd = dir>0 ? (window.innerHeight+window.scrollY>=document.body.scrollHeight-4) : (window.scrollY<=2);
    if(atEnd) scrollStop(); }
  last=ts; raf=requestAnimationFrame(stepPill);
}
function canScroll(d){ return d>0 ? (window.innerHeight+window.scrollY < document.body.scrollHeight-4) : (window.scrollY>2); }
// Pressing play at an end of the page used to do nothing at all: autoscroll
// remembers the direction it stopped in, so after riding UP to the top the next
// play still meant "up" and there was nowhere to go. A direction with no room
// flips to the one that has room, so a press always moves the page.
function scrollStart(d){ if(!canScroll(d) && canScroll(-d)) d=-d;
  dir=d; playing=true; last=null; acc=0; paintPill(); raf=requestAnimationFrame(stepPill); }
function scrollStop(){ playing=false; if(raf) cancelAnimationFrame(raf); paintPill(); }
window.__scrollStop=scrollStop;
window.__scrollStart=scrollStart;
window.__scrollToggle=function(){ playing? scrollStop() : scrollStart(1); };
var PILL_SKIP='a,button,summary,details,input,textarea,select,label,video,audio,[onclick]';
function pillInteractive(t){
  try{ return !!(t && t.closest && t.closest(PILL_SKIP)); }catch(_){ return false; }
}
window.__pillInteractive=pillInteractive;
window.__scrollTap=function(e){
  if(e && pillInteractive(e.target||e.srcElement)) return;
  playing? scrollStop() : scrollStart(1);
};
vtop.onclick=function(){ if(playing){ si=Math.max(0,si-1); paintPill(); } else scrollStart(-1); };
vbot.onclick=function(){ if(playing){ si=Math.min(SPEEDS.length-1,si+1); paintPill(); } else scrollStart(1); };
vmid.onclick=function(){ playing? scrollStop() : scrollStart(dir||1); };
// Leaving the page (tab switch, app background, webview hidden) stops
// autoscroll \u2014 it must never keep scrolling while nobody's looking.
document.addEventListener('visibilitychange',function(){ if(document.hidden) scrollStop(); });
window.addEventListener('pagehide',scrollStop);

// Back to the top — the same control scripts/pill.py now ships; written
// self-contained here because this page's pill copy predates that source.
(function(){
  var b=document.getElementById('ptop');
  if(!b) return;
  b.innerHTML='<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" '+
    'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+
    '<path d="M5 4h14"/><path d="m18 14-6-6-6 6"/><path d="M12 8v12"/></svg>';
  b.onclick=function(){
    if(window.__scrollStop) window.__scrollStop();
    try{ window.scrollTo({top:0, behavior:'smooth'}); }catch(_){ window.scrollTo(0,0); }
  };
  function sync(){ b.classList.toggle('on', window.scrollY > window.innerHeight); }
  window.__pillTopSync=sync;
  window.addEventListener('scroll',sync,{passive:true});
  window.addEventListener('resize',sync,{passive:true});
  sync();
})();
paintPill();

    let allImages = [];
    let activeFilter = 'all';

    async function loadGallery() {
      try {
        const res = await fetch('/api/gallery');
        const data = await res.json();
        allImages = data.images || [];
        buildFilters();
        renderGrid();
      } catch (err) {
        document.getElementById('loading').textContent = 'Failed to load gallery';
      }
    }

    function buildFilters() {
      const folders = [...new Set(allImages.map(i => i.folder))];
      const container = document.getElementById('filters');
      container.innerHTML = '';

      const allBtn = document.createElement('button');
      allBtn.className = 'filter-btn active';
      allBtn.textContent = 'All';
      allBtn.onclick = () => setFilter('all');
      container.appendChild(allBtn);

      folders.forEach(f => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.textContent = f;
        btn.onclick = () => setFilter(f);
        container.appendChild(btn);
      });
    }

    function setFilter(filter) {
      activeFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.toggle('active', b.textContent.toLowerCase() === filter.toLowerCase() || (filter === 'all' && b.textContent === 'All'));
      });
      renderGrid();
    }

    function renderGrid() {
      document.getElementById('loading').style.display = 'none';
      const grid = document.getElementById('gallery-grid');
      grid.innerHTML = '';

      const filtered = activeFilter === 'all'
        ? allImages
        : allImages.filter(i => i.folder === activeFilter);

      document.getElementById('count-label').textContent = `${filtered.length} image${filtered.length !== 1 ? 's' : ''}`;

      filtered.forEach(img => {
        const div = document.createElement('div');
        div.className = 'gallery-item';
        const m = img.meta || {};
        const modelLabel = prettyModel(m.model);
        // Show "ChatGPT 2 · medium" when we know model/quality; else the folder.
        const label = modelLabel
          ? `${modelLabel}${m.quality ? ' · ' + m.quality : ''}`
          : img.folder;
        div.innerHTML = `
          <img src="${thumbFor(img.url)}" loading="lazy" alt="${img.name}" onclick="openLightbox('${img.url}')">
          <div class="gallery-item-info">
            <span>${label}</span>
          </div>
        `;
        grid.appendChild(div);
      });
    }

    // A grid tile loads a DERIVED display copy via the house thumb service
    // (`/api/story/thumb` — sharp once, cached webp, 302 ever after); the
    // originals are full-size generated images, and pulling them for ~180px
    // tiles is what made this page slow. The lightbox and the download button
    // keep the untouched original.
    function thumbFor(u) {
      // The bucket listing includes the thumbs/ folder itself — a thumb of a
      // thumb would bake a pointless second copy, so those pass through.
      if (/\/thumbs\//.test(u || '')) return u;
      return /^https:\/\/(storage|firebasestorage)\.googleapis\.com\//.test(u || '')
        ? '/api/story/thumb?w=480&url=' + encodeURIComponent(u)
        : u;
    }

    // "gpt-image-2" -> "ChatGPT 2", "gpt-image-1.5" -> "ChatGPT 1.5", etc.
    function prettyModel(model) {
      if (!model) return '';
      const m = String(model).match(/gpt-image-([\d.]+)/i);
      return m ? `ChatGPT ${m[1]}` : model;
    }

    function openLightbox(url) {
      if (window.__scrollStop) window.__scrollStop(); // stop autoscroll while viewing
      document.getElementById('lightbox-img').src = url;
      document.getElementById('lightbox-download').href = url;
      document.getElementById('lightbox').classList.add('open');
      document.body.style.overflow = 'hidden'; // lock background scroll too
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
      document.body.style.overflow = ''; // restore scrolling (autoscroll stays paused)
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox();
    });

    loadGallery();
  </script>
</body>
</html>
