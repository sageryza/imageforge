<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panels</title>
<link rel="stylesheet" href="/tool.css">
<link rel="stylesheet" href="/tritoggle.css">
<script src="/tritoggle.js"></script>
<!--
  PANELS — one sheet, drawn once, cut into separate pictures.

  Sophie, 2026-08-23: "i think we copy the playground code for it's own module.
  this has four text boxes, one for each panel — or an option for other grid
  sizes like 9 or 2 (landscape, side by side)."

  THE BOXES SIT WHERE THE PANELS WILL BE. The grid picker reshapes the box
  grid, so four boxes are a 2x2 and two are side by side — she is writing into
  the layout she will get back, not into a numbered list she has to map onto
  one. That is the whole reason this is a page and not a flag on the
  Playground.

  THE PAGE HOLDS NO PRICES AND NO PROMPT TEXT — both are SERVED by
  GET /api/panels/config, the same rule the Playground's /styles route follows:
  server.js owns what is actually sent and what it costs, and a copy baked in
  here is a second source of truth that drifts silently. A test pins it.

  The pill is INJECTED by the server, so this page must NOT add one, must keep
  the top-right corner (64px) clear, and must wrap its script in an IIFE — the
  pill's own script declares `var raf`/`var I` in global scope and a page-level
  `let raf` kills it at parse time.
-->
<style>
  /* ONE palette on the page — the Playground's paper and ink, because the
     controls here are deliberately that tool's controls in a second surface.
     Declared once as tokens: tool.css's chrome (the "?", the help card) reads
     the overridden --ink/--accent/--border, the page's own rules read the same
     vars instead of re-typing the hexes, and the INJECTED pill reads the five
     it needs straight off :root (the settled pill contract — pill-inject.html
     uses var(--x, fallback); nothing out-specifies .float any more). */
  :root { --bg: #faf7f2; --paper: #faf7f2; --surface: #fdfcf9;
    --ink: #2b2622; --ink2: #6b6255; --dim: #6b6255;
    --chg: #b4533a; --rose: #b4533a; --accent: #b4533a;
    --border: #d8d0c4; --line: #e6ded0; }

  .ctrls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding-right: 64px; margin: 0 0 14px; }
  .ctrls .seg { display: flex; border: 1.5px solid var(--ink); border-radius: 6px;
    overflow: hidden; flex: none; height: 34px; }
  .ctrls .seg button { border: 0; background: var(--surface); color: var(--ink);
    font: 600 12px/1 -apple-system, sans-serif; padding: 0 10px; cursor: pointer; }
  .ctrls .seg button + button { border-left: 1.5px solid var(--ink); }
  .ctrls .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .ctrls select { height: 34px; border: 1.5px solid var(--ink); border-radius: 6px;
    background: var(--surface); font: 600 12px -apple-system, sans-serif; padding: 0 6px; flex: none; }

  /* The three-way toggle is /tritoggle.css — the ONE shell (Aug 2026). This
     block used to be "LIFTED VERBATIM from promptlab.html", which is exactly
     the copying Sophie asked to end; the only thing this page still says
     about it is that it wears the Playground's colour and width, because it
     is the same control in a second tool. */
  .tri { --tri-track: #2b2622; --tri-knob: #faf7f2; --tri-w: 78px; --tri-k: 26px; }

  /* Generate: the house star, a 38px square — the same box the Playground's
     is, because a button that spends a model call must read the same in every
     surface (the one-generate-glyph rule). */
  .go { width: 38px; height: 38px; border-radius: 6px; border: 1.5px solid var(--ink);
    background: var(--ink); color: var(--paper); display: inline-flex; align-items: center;
    justify-content: center; margin-left: auto; flex: none; cursor: pointer; padding: 0; }
  .go svg { width: 21px; height: 21px; }
  .go[disabled] { opacity: .4; cursor: default; }

  /* THE BOXES ARE THE GRID. --across is written by the grid picker. */
  .cells { display: grid; grid-template-columns: repeat(var(--across, 2), minmax(0, 1fr));
    gap: 8px; margin: 0 0 12px; }
  .cell { display: flex; flex-direction: column; }
  .cell label { font: 600 10px/1.4 -apple-system, sans-serif; letter-spacing: .06em;
    text-transform: uppercase; color: var(--ink2); margin-bottom: 3px; }
  /* Ships EMPTY — no placeholder, no example (the house rule). The label above
     names the cell, which is a name and not words. */
  .cell textarea { width: 100%; box-sizing: border-box; border: 1px solid var(--border);
    border-radius: 6px; padding: 8px; font: inherit; font-size: 16px;
    background: var(--surface); resize: vertical; min-height: 62px; }
  .cell textarea.want { border-color: var(--chg); }

  .plan { font: 500 12px/1.5 -apple-system, sans-serif; color: var(--ink2); margin: 0 0 12px; }
  .plan b { color: var(--ink); font-weight: 600; }
  #msg { font: 500 12px/1.5 -apple-system, sans-serif; color: var(--chg); min-height: 18px; margin: 0 0 10px; }

  .run { border-top: 1px solid var(--line); padding: 14px 0 4px; }
  .runhead { font: 500 11px/1.5 -apple-system, sans-serif; color: var(--ink2);
    display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .runhead b { color: var(--ink); font-weight: 600; }
  .cuts { display: grid; grid-template-columns: repeat(var(--across, 2), minmax(0, 1fr));
    gap: 6px; align-items: start; }
  .cuts figure { margin: 0; }
  /* No rounded corner and no outline on a PICTURE (Sophie, 2026-08-24) — her
     rounded boxes are for words; a radius on the art reads as a crop. */
  .cuts img, .sheetimg { width: 100%; display: block; background: #efe9dd; }
  .cuts figcaption { font: 500 10px/1.35 -apple-system, sans-serif; color: var(--ink2);
    margin-top: 3px; }
  .sheetwrap { margin-bottom: 8px; }
  .sheetwrap .sheetimg { max-width: 44%; }
</style>

<body class="tool">
<header class="head">
  <div class="eyebrow tool-eyebrow">PANELS</div>
  <button id="help" type="button" aria-label="What this is">?</button>
</header>
<div class="helpcard" id="helpcard" hidden></div>

<main class="wrap">
  <div class="ctrls" id="ctrls"></div>
  <div class="cells" id="cells"></div>
  <p class="plan" id="plan"></p>
  <p id="msg"></p>
  <div id="feed"></div>
</main>

<script>
(function () {
  'use strict';
  // THE AIM RULE LIVES IN /tritoggle.js — the ONE copy, shared with every other
  // three-way toggle. This line is only a floor for the case where that file
  // does not load (a stale cache, a stub harness that serves nothing else): it
  // is the pre-2026-08-24 CYCLE, deliberately not a second implementation of
  // the aim, so a page can never quietly grow its own version of the rule.
  var triNext = window.triNext || function (el, count, ev, cur) {
    return ((cur | 0) + 1 + count) % count;
  };
  var STAR = '<svg viewBox="0 0 100 100" fill="currentColor" stroke="none"><path d="M 55.8 31.9C52.8 32.3 53.9 36.4 53.2 38.5C52.5 44.4 52.0 51.0 47.3 55.3C42.9 59.9 36.4 60.6 30.4 61.3C28.2 61.9 24.2 60.8 23.9 64.0C24.4 67.0 28.4 65.9 30.6 66.6C36.5 67.4 43.0 68.0 47.3 72.6C52.0 76.9 52.5 83.5 53.3 89.4C54.0 91.5 52.7 95.5 55.8 95.9C59.0 95.6 57.9 91.6 58.5 89.4C59.4 83.5 60.0 76.9 64.6 72.6C68.8 68.0 75.4 67.3 81.2 66.5C83.4 65.8 87.4 67.0 87.9 64.0C87.7 60.8 83.6 61.9 81.5 61.2C75.5 60.5 68.9 59.9 64.6 55.2C59.9 51.0 59.3 44.5 58.5 38.5C57.9 36.4 59.0 32.2 55.8 31.9Z"/><path d="M 25.8 21.9C24.5 22.2 25.1 23.9 24.7 24.8C24.4 27.4 24.3 30.3 22.3 32.2C20.4 34.3 17.4 34.4 14.8 34.7C13.9 35.0 12.2 34.5 11.9 35.8C12.0 37.2 13.9 36.8 14.8 37.0C17.4 37.4 20.4 37.4 22.3 39.5C24.3 41.4 24.4 44.3 24.7 46.9C25.0 47.9 24.5 49.6 25.8 49.9C27.2 49.8 26.8 48.0 27.0 47.1C27.4 44.4 27.4 41.4 29.6 39.5C31.5 37.4 34.5 37.4 37.1 37.0C38.0 36.8 39.8 37.2 39.9 35.8C39.6 34.5 37.9 35.0 36.9 34.7C34.3 34.4 31.4 34.3 29.5 32.3C27.4 30.4 27.4 27.4 27.0 24.8C26.8 23.9 27.2 22.0 25.8 21.9Z"/><path d="M 47.9 4.9C47.1 5.1 47.3 6.2 47.2 6.9C47.1 8.5 46.7 10.3 45.5 11.5C44.3 12.7 42.5 13.1 40.8 13.2C40.2 13.3 39.0 13.1 38.9 14.0C39.2 14.8 40.2 14.4 40.8 14.6C42.5 14.7 44.2 15.0 45.4 16.3C46.8 17.5 47.1 19.3 47.2 21.0C47.3 21.6 47.1 22.8 47.9 22.8C48.7 22.7 48.4 21.6 48.6 21.0C48.6 19.3 49.1 17.5 50.4 16.2C51.6 15.0 53.3 14.6 55.0 14.6C55.6 14.4 56.6 14.8 56.8 14.0C56.8 13.1 55.6 13.3 55.0 13.2C53.3 13.1 51.5 12.8 50.3 11.5C49.1 10.3 48.6 8.5 48.6 6.9C48.4 6.2 48.8 5.1 47.9 4.9Z"/></svg>';
  var cfg = null;
  var pick = { grid: 4, shape: 'portrait', res: '4k', quality: 'medium', style: '' };
  var words = {};              // cell index -> her text, kept across grid changes
  var polling = {};

  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); };

  // Pending runs survive leaving the app — the house background-job rule.
  function remember(id) {
    try {
      var a = JSON.parse(localStorage.getItem('forge.panels.pending') || '[]');
      if (a.indexOf(id) < 0) a.push(id);
      localStorage.setItem('forge.panels.pending', JSON.stringify(a.slice(-8)));
    } catch (e) { /* private window */ }
  }
  function forget(id) {
    try {
      var a = JSON.parse(localStorage.getItem('forge.panels.pending') || '[]');
      localStorage.setItem('forge.panels.pending', JSON.stringify(a.filter(function (x) { return x !== id; })));
    } catch (e) { /* private window */ }
  }

  function planNow() {
    if (!cfg) return null;
    return cfg.plans[pick.grid + '|' + pick.shape + '|' + pick.res] || null;
  }

  function paintCtrls() {
    var gridBtns = cfg.grids.map(function (g) {
      return '<button type="button" data-grid="' + g.id + '" aria-pressed="'
        + (pick.grid === g.id) + '">' + g.count + '</button>';
    }).join('');
    var shapeBtns = cfg.shapes.map(function (s) {
      return '<button type="button" data-shape="' + esc(s.id) + '" aria-pressed="'
        + (pick.shape === s.id) + '">' + esc(s.label) + '</button>';
    }).join('');
    var styleOpts = cfg.styles.map(function (s) {
      return '<option value="' + esc(s.id) + '"' + (pick.style === s.id ? ' selected' : '')
        + '>' + esc(s.label) + '</option>';
    }).join('');
    var ri = cfg.tiers.indexOf(pick.res), qi = cfg.qualities.indexOf(pick.quality);
    $('#ctrls').innerHTML =
      '<span class="seg" id="gridseg">' + gridBtns + '</span>'
      + '<span class="seg" id="shapeseg">' + shapeBtns + '</span>'
      + '<select id="stylepick" aria-label="Style">' + styleOpts + '</select>'
      + '<button type="button" class="tri" id="respick" aria-label="Size"'
      + ' data-n="' + ri + '" data-i="' + esc(cfg.tiers[ri].toUpperCase()) + '"></button>'
      + '<button type="button" class="tri" id="qpick" aria-label="Quality"'
      + ' data-n="' + qi + '" data-i="' + esc(pick.quality[0].toUpperCase()) + '"></button>'
      + '<button type="button" class="go" id="go" aria-label="Draw the sheet">' + STAR + '</button>';
  }

  // THE BOXES ARE THE GRID — one per cell, laid out the way the sheet will be.
  // Her words are kept by INDEX across a grid change, so switching 4 -> 9 keeps
  // the four she has written and adds five empty ones rather than wiping them.
  function paintCells() {
    var g = cfg.grids.filter(function (x) { return x.id === pick.grid; })[0];
    var el = $('#cells');
    el.style.setProperty('--across', g.across);
    el.innerHTML = g.cells.map(function (name, i) {
      return '<div class="cell"><label for="c' + i + '">' + esc(name) + '</label>'
        + '<textarea id="c' + i + '" data-i="' + i + '" rows="3"></textarea></div>';
    }).join('');
    g.cells.forEach(function (_, i) {
      var t = document.getElementById('c' + i);
      if (t) t.value = words[i] || '';
    });
  }

  function paintPlan() {
    var p = planNow();
    if (!p) { $('#plan').textContent = ''; return; }
    var c = p.cents && p.cents[pick.quality];
    $('#plan').innerHTML = 'sheet <b>' + esc(p.sheet) + '</b> · '
      + p.count + ' pictures at <b>' + esc(p.cell) + '</b>'
      + (c ? ' · about <b>' + c.sheet + 'c</b> the sheet, <b>' + c.each + 'c</b> each' : '');
  }

  function wire() {
    $('#ctrls').addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.grid) { pick.grid = Number(b.dataset.grid); paintCtrls(); paintCells(); paintPlan(); return; }
      if (b.dataset.shape) { pick.shape = b.dataset.shape; paintCtrls(); paintPlan(); return; }
      if (b.id === 'respick') { step('res', cfg.tiers, function (v) { return v.toUpperCase(); }, b, e); return; }
      if (b.id === 'qpick') { step('quality', cfg.qualities, function (v) { return v[0].toUpperCase(); }, b, e); return; }
      if (b.id === 'go') { start(); }
    });
    $('#ctrls').addEventListener('change', function (e) {
      if (e.target.id === 'stylepick') pick.style = e.target.value;
    });
    // The textareas are painted fresh on every grid change, so the handler
    // lives on the container rather than on each box.
    $('#cells').addEventListener('input', function (e) {
      if (e.target.tagName === 'TEXTAREA') {
        words[Number(e.target.dataset.i)] = e.target.value;
        e.target.classList.remove('want');
      }
    });
  }

  // Nothing counts the notches — the stops come from the served list, so a
  // fourth tier is a row in the config and no change here. WHERE SHE TAPPED IS
  // THE STOP (2026-08-24 — /tritoggle.js); this was a cycle, so a tap on the
  // left of a toggle already on the middle stop went RIGHT.
  function step(key, list, letter, el, ev) {
    var b = el || document.getElementById(key === 'res' ? 'respick' : 'qpick');
    var i = triNext(b, list.length, ev, list.indexOf(pick[key]));
    pick[key] = list[i];
    b.dataset.n = i; b.dataset.i = letter(list[i]);
    paintPlan();
  }

  function start() {
    var p = planNow();
    if (!p) return;
    var missing = [];
    for (var i = 0; i < p.count; i++) if (!(words[i] || '').trim()) missing.push(i);
    if (missing.length) {
      missing.forEach(function (i) {
        var t = document.getElementById('c' + i);
        if (t) t.classList.add('want');
      });
      $('#msg').textContent = 'every panel needs words — the model fills an empty one with whatever it likes, at the sheet’s price';
      return;
    }
    var body = { grid: pick.grid, shape: pick.shape, res: pick.res,
      quality: pick.quality, style: pick.style,
      panels: Array.from({ length: p.count }, function (_, i) { return words[i]; }) };
    $('#go').disabled = true;
    $('#msg').textContent = 'drawing the sheet…';
    fetch('/api/panels', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        $('#go').disabled = false;
        if (j.error) { $('#msg').textContent = j.error; return; }
        $('#msg').textContent = '';
        remember(j.id);
        poll(j.id);
        load();
      })
      .catch(function (e) { $('#go').disabled = false; $('#msg').textContent = e.message; });
  }

  function poll(id) {
    if (polling[id]) return;
    polling[id] = setInterval(function () {
      fetch('/api/panels/' + id).then(function (r) { return r.json(); }).then(function (d) {
        if (d.status === 'done' || d.status === 'failed') {
          clearInterval(polling[id]); delete polling[id]; forget(id);
        }
        load();
      }).catch(function () {});
    }, 4000);
  }

  function runHtml(r) {
    var head = '<div class="runhead"><b>' + r.count + ' × ' + esc(r.cellSize) + '</b>'
      + '<span>sheet ' + esc(r.sheetSize) + '</span>'
      + '<span>' + esc(r.style || '') + ' · ' + esc(r.quality || '') + '</span>'
      + (r.status === 'running' ? '<span>' + esc((r.job && r.job.label) || 'working…') + '</span>' : '')
      + (r.status === 'failed' ? '<span>' + esc(r.error || 'failed') + '</span>' : '')
      + '</div>';
    var sheet = r.sheetUrl
      ? '<div class="sheetwrap"><img class="sheetimg" src="' + esc(r.sheetUrl) + '" alt="the sheet" loading="lazy"></div>'
      : '';
    var g = cfg.grids.filter(function (x) { return x.id === r.grid; })[0];
    var cuts = (r.images || []).map(function (im) {
      return '<figure><img src="' + esc(im.url) + '" alt="' + esc(im.cell) + '" loading="lazy">'
        + '<figcaption>' + esc(im.cell) + '</figcaption></figure>';
    }).join('');
    return '<div class="run">' + head + sheet
      + '<div class="cuts" style="--across:' + ((g && g.across) || 2) + '">' + cuts + '</div></div>';
  }

  function load() {
    fetch('/api/panels?limit=20').then(function (r) { return r.json(); }).then(function (j) {
      $('#feed').innerHTML = (j.runs || []).map(runHtml).join('');
    }).catch(function () {});
  }

  fetch('/api/panels/config').then(function (r) { return r.json(); }).then(function (j) {
    cfg = j;
    pick.grid = j.defaults.grid; pick.shape = j.defaults.shape;
    pick.res = j.defaults.res; pick.quality = j.defaults.quality;
    pick.style = (j.styles.filter(function (s) { return s.id === j.defaults.style; })[0]
      || j.styles[0] || {}).id || '';
    paintCtrls(); paintCells(); paintPlan(); wire(); load();
    try {
      JSON.parse(localStorage.getItem('forge.panels.pending') || '[]').forEach(poll);
    } catch (e) { /* private window */ }
  }).catch(function (e) { $('#msg').textContent = 'could not load the config: ' + e.message; });

  // The "?" card — where every word of explanation lives (the house rule).
  var hc = $('#helpcard');
  hc.innerHTML = '<p>One page is drawn, then cut into separate pictures on our'
    + ' side. That is cheaper than drawing them one at a time twice over: the'
    + ' bill grows slower than the pixels, and the style reference is paid for'
    + ' once instead of once per picture.</p>'
    + '<p>At 4K a quarter comes out bigger than an ordinary Playground picture.'
    + ' At 2K it comes out smaller — cheaper, but smaller.</p>'
    + '<p>Each panel is filed with its own words, captioned <b>1/4 (4K)</b> so'
    + ' the tag says which sheet it came off rather than its own pixel count.</p>';
  $('#help').addEventListener('click', function () { hc.hidden = !hc.hidden; });
  hc.addEventListener('click', function () { hc.hidden = true; });
})();
</script>
