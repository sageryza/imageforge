<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panels</title>
<link rel="stylesheet" href="/tool.css">
<link rel="stylesheet" href="/tritoggle.css">
<script src="/tritoggle.js"></script>
<script src="/feedkit.js"></script>
<script src="/asset-lightbox.js"></script>
<!--
  PANELS — one sheet, drawn once, cut into separate pictures.

  Sophie, 2026-08-23: "i think we copy the playground code for it's own module.
  this has four text boxes, one for each panel — or an option for other grid
  sizes like 9 or 2 (landscape, side by side)."

  THE BOXES SIT WHERE THE PANELS WILL BE. The grid picker reshapes the box
  grid, so four boxes are a 2x2 and two are side by side — she is writing into
  the layout she will get back, not into a numbered list she has to map onto
  one. That is the whole reason this is a page and not a flag on the
  Playground.

  IT IS THE PLAYGROUND'S FEED NOW, NOT A SMALLER ONE (2026-08-26, Sophie:
  "panels has some differences between it and the playground — for example
  there's no heart or X button or I don't think there's a way to leave a note …
  I asked the person who made it to make it exactly the same as the playground
  except that it's panels"). Everything the Playground's feed does, this does:
  ♥/✕ per picture with the badge on the tile, the two mark filters, the search
  box over the WHOLE history, List/Tiles with the 3-or-4 segment, "Older", her
  words on the card behind the house "… more" opener, the put-it-back-in-the-
  boxes button, the toast, the Prompt panel, the bigger-box toggle, the note
  thread and Save/Upscale/Send-to-a-story in the lightbox.
  The pieces both pages share are ONE copy in /feedkit.js — the search grammar,
  liveInput/enterSubmits, the keyed reconcile, the derived display copy and the
  toast — because hand-copying them is exactly what /tritoggle.css was written
  to end.

  WHAT IS DELIBERATELY NOT HERE, and why:
    · LoRA scale, the seed sprout and the x3 button — this tool is gpt-image-2
      only; a sheet has no LoRA to scale and no seed to step.
    · The quality LADDERS (the pyramid and the oval). They draw the same prompt
      at two or three qualities in one tap, which on a sheet means paying for
      the whole page again — a different order of money from the Playground's,
      and hers to ask for rather than ours to assume.
    · The photo reference and the Sophie card. Both are per-RUN attachments the
      server's sheet path does not take yet; they need a route change, not a
      page one.

  THE PAGE HOLDS NO PRICES AND NO PROMPT TEXT — both are SERVED by
  GET /api/panels/config, the same rule the Playground's /styles route follows:
  server.js owns what is actually sent and what it costs, and a copy baked in
  here is a second source of truth that drifts silently. A test pins it.

  The pill is INJECTED by the server, so this page must NOT add one, must keep
  the top-right corner (64px) clear, and must wrap its script in an IIFE — the
  pill's own script declares `var raf`/`var I` in global scope and a page-level
  `let raf` kills it at parse time.
-->
<style>
  /* ONE palette on the page — the Playground's paper and ink, because the
     controls here are deliberately that tool's controls in a second surface.
     Declared once as tokens: tool.css's chrome (the "?", the help card) reads
     the overridden --ink/--accent/--border, the page's own rules read the same
     vars instead of re-typing the hexes, and the INJECTED pill reads the five
     it needs straight off :root (the settled pill contract — pill-inject.html
     uses var(--x, fallback); nothing out-specifies .float any more). */
  :root { --bg: #faf7f2; --paper: #faf7f2; --surface: #fdfcf9;
    --ink: #2b2622; --ink2: #6f675e; --dim: #6f675e;
    --chg: #c25a72; --rose: #c25a72; --accent: #c25a72;
    --border: #d8d0c4; --line: #e6ded0; --cols: 3; }
  /* EVERY VALUE IS THE PLAYGROUND'S OWN (promptlab.html), because this tool is
     that tool's recipe with the run turned inside out and the two sit next to
     each other in her Pictures tab. The accent was #b4533a until 2026-08-24 —
     a colour that appeared in exactly ONE file in the repo, matching neither
     the Playground it was copied from (#c25a72), the studio tan (#b48b6a) nor
     the compare rose (#b3443f). Measured with `node scripts/audit-styles.js`,
     which is what a new value here should be checked against. */

  .ctrls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding-right: 64px; margin: 0 0 14px; }
  /* A ZERO-HEIGHT ROW BREAK, so the two lines are a DECISION rather than
     whatever the wrap happened to do. Measured at 390pt before this: the
     pickers filled two lines and pushed Generate onto a third of its own,
     38px of button in 42px of empty row. Line one is the sheet's geometry
     with Generate at its right end (the Playground's own anchor for the
     button that spends the money), line two is what it costs. flex-wrap is
     still the safety net if a longer style name grows line two. */
  .ctrls .brk { flex: 1 0 100%; height: 0; margin: 0; }
  .ctrls .seg { display: flex; border: 1px solid var(--ink); border-radius: 6px;
    overflow: hidden; flex: none; height: 34px; }
  .ctrls .seg button { border: 0; background: var(--surface); color: var(--ink);
    font: 600 12px/1 -apple-system, sans-serif; padding: 0 10px; cursor: pointer; }
  .ctrls .seg button + button { border-left: 1px solid var(--ink); }
  .ctrls .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .ctrls select { height: 34px; border: 1px solid var(--ink); border-radius: 6px;
    background: var(--surface); font: 600 12px -apple-system, sans-serif; padding: 0 6px; flex: none; }
  /* ONE FAMILY ON THE ROW — black line, paper, 34px (the Playground's own
     2026-08-24 rule, ported with everything else: "the buttons are styled so
     fucking weird. They should have black outlines and they're all different
     sizes"). The line was 1.5px here and 1px there, which is the same drift in
     miniature. */
  .ctrls .txtbtn { height: 34px; box-sizing: border-box; display: inline-flex;
    align-items: center; border: 1px solid var(--ink); border-radius: 6px;
    background: var(--surface); color: var(--ink); font: inherit; font-size: 12.5px;
    padding: 0 10px; cursor: pointer; flex: none; }
  .ctrls .txtbtn.edited { font-weight: 600; }

  /* The three-way toggle is /tritoggle.css — the ONE shell (Aug 2026). This
     block used to be "LIFTED VERBATIM from promptlab.html", which is exactly
     the copying Sophie asked to end; the only thing this page still says
     about it is that it wears the Playground's colour and width, because it
     is the same control in a second tool. PAPER WITH A BLACK LINE and a dark
     KNOB, which is where the Playground's instance moved on 2026-08-24 — this
     one was still the solid ink slab it had copied before that, i.e. the exact
     drift she was looking at when she said the two tools differ. */
  .tri { --tri-fill: #fdfcf9; --tri-line: #2b2622; --tri-knob: #2b2622;
    --tri-ink: #faf7f2; --tri-w: 78px; --tri-k: 26px; }

  /* Generate: the house star, a 38px square — the same box the Playground's
     is, because a button that spends a model call must read the same in every
     surface (the one-generate-glyph rule). */
  .go { width: 38px; height: 38px; border-radius: 6px; border: 1px solid var(--ink);
    background: var(--ink); color: var(--paper); display: inline-flex; align-items: center;
    justify-content: center; margin-left: auto; flex: none; cursor: pointer; padding: 0; }
  .go svg { width: 21px; height: 21px; }
  .go[disabled] { opacity: .4; cursor: default; }

  /* THE BOXES ARE THE GRID. --across is written by the grid picker.
     NAMED `pcell`, NEVER `cell` — tool.css owns `.tool .cell` (the image-grid
     tile: aspect-ratio 1, a grey fill, centred contents, overflow hidden) and
     at (0,0,2) it beats a bare `.cell` here whatever this file says. That is
     the `.morebtn` collision again, and it is exactly what Sophie was looking
     at: every panel box forced square with her writing space shrunk to a
     third of it and the label floating in the middle of a grey tile. A page
     class that shares a name with the shared sheet is a bug waiting for
     someone to notice it, so this one cannot. */
  .cells { display: grid; grid-template-columns: repeat(var(--across, 2), minmax(0, 1fr));
    gap: 10px; margin: 0 0 14px; }
  .pcell { display: flex; flex-direction: column; position: relative; }
  .pcell label { font: 600 10px/1.4 -apple-system, sans-serif; letter-spacing: .06em;
    text-transform: uppercase; color: var(--ink2); margin-bottom: 4px; }
  /* Ships EMPTY — no placeholder, no example (the house rule). The label above
     names the cell, which is a name and not words. */
  .pcell textarea { width: 100%; box-sizing: border-box; border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 8px 34px; font: inherit; font-size: 16px;
    background: var(--surface); resize: vertical; min-height: 84px; }
  .pcell textarea.want { border-color: var(--chg); }

  /* THE BIGGER BOX (2026-08-26, Sophie: "make a button to see the current text
     box that you're working on bigger so you can see what you're writing").
     The Playground's `#bigprompt` answer lifted in SHAPE, not copied — the
     SAME textarea grows, never a second field, so nothing has to be synced.
     WIDTH IS THE HALF THAT MATTERS HERE, and that is a measurement rather
     than a preference: main is 14px either side, so on a 390pt phone a cell
     is 176px at two across and 114px at NINE — the grid where a dictated
     prompt wraps every three or four words. So the open cell takes the whole
     row (`grid-column: 1/-1`) as well as growing tall. The others keep their
     order and stay on screen, because what she wrote in the neighbours is
     the context for the one she is writing.
     ONE AT A TIME: opening another closes it, so the grid never comes apart
     into a column of full-width boxes.
     Deliberately NOT sticky, and reset on a grid change — the boxes ARE the
     grid, and reopening on a layout she did not pick is the opposite of what
     this page is. */
  .pcell.big { grid-column: 1 / -1; }
  .pcell.big textarea { min-height: 46vh; }
  .pbig { position: absolute; right: 6px; bottom: 6px; width: 26px; height: 26px;
    display: flex; align-items: center; justify-content: center; padding: 0; margin: 0;
    border: 1px solid var(--border); border-radius: 6px; background: var(--surface);
    color: var(--ink2); cursor: pointer; }
  .pbig svg { width: 14px; height: 14px; }

  /* The house rule: [hidden] loses to any author display rule without this. */
  [hidden] { display: none !important; }

  /* THE HAIRLINE TABS — Panels · Playground (2026-08-25, Sophie: "the
     playground could be a hairline tab as a toggle"). The two tools are one
     recipe in two shapes and she moves between them mid-thought, which is
     exactly the reference test the hairline rule sets. PLAYGROUND navigates —
     the Playground is its own page and embedding it would double every pill
     and toggle on screen. */
  .toptabs { display: flex; gap: 18px; border-bottom: 1px solid var(--line);
    margin: 0 0 14px; padding-right: 64px; }
  .toptabs button { border: 0; background: none; padding: 0 2px 7px; margin-bottom: -1px;
    cursor: pointer; font: 600 11px/1 -apple-system, sans-serif; letter-spacing: .08em;
    text-transform: uppercase; color: var(--ink2); border-bottom: 2px solid transparent; }
  .toptabs button.on { color: var(--ink); border-bottom-color: var(--ink); }

  /* THE PROMPT PANEL — what is wrapped around her words, and editable (the
     Playground's, ported; the server has taken `prefix`/`suffix` overrides
     since this module shipped and nothing was showing them). It opens under
     the control row, above the boxes, because that is where the wrapping
     happens. The GRID SENTENCE this tool adds sits between them, read-only:
     it is derived from the grid she picked, so editing it would only let the
     sheet's own cut lines disagree with the picture. */
  .ppanel { display: none; margin: 0 0 14px; border: 1px solid var(--border);
    border-radius: 6px; background: var(--surface); padding: 10px; }
  .ppanel.on { display: block; }
  .ppanel .plab { font: 600 10.5px/1.4 -apple-system, sans-serif; letter-spacing: .12em;
    text-transform: uppercase; color: #9a9186; margin: 0 0 4px; }
  .ppanel .plab + .plab, .ppanel .yours + .plab, .ppanel .fixed + .plab { margin-top: 10px; }
  .ppanel textarea { width: 100%; box-sizing: border-box; font: inherit; font-size: 16px;
    line-height: 1.4; color: var(--ink); background: #fff; border: 1px solid var(--border);
    border-radius: 6px; padding: 8px; resize: vertical; min-height: 66px; }
  .ppanel .yours, .ppanel .fixed { font: 500 12px/1.4 -apple-system, sans-serif;
    color: var(--ink2); border-left: 2px solid var(--border); padding: 2px 0 2px 8px; margin: 4px 0 0; }
  .ppanel .yours { font-style: italic; }
  .ppanel .prow { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .ppanel .prow button { border: 1px solid var(--border); border-radius: 6px;
    background: var(--surface); color: var(--ink2); font: inherit; font-size: 12.5px;
    padding: 6px 10px; cursor: pointer; }
  .ppanel .pnote { font: 500 11.5px/1.4 -apple-system, sans-serif; color: #9a9186;
    margin-left: auto; text-align: right; }

  /* THE FEED BAR — the Playground's, whole: List/Tiles/3-or-4, the two mark
     filters, the search box. STICKY so it is reachable from anywhere in a long
     feed, and its z-index stays BELOW the injected pill's 9 (the house
     pattern) or its paper background paints over the pill's top button. */
  .feedbar { position: sticky; top: 0; z-index: 5; display: flex;
    padding: 8px 56px 8px 0; background: var(--paper); margin-bottom: 4px; }
  .viewtog { display: flex; border: 1px solid var(--border); border-radius: 6px;
    overflow: hidden; background: var(--surface); flex: none; }
  .viewtog button { border: 0; background: none; font: inherit; font-size: 12px;
    letter-spacing: .07em; text-transform: uppercase; color: var(--ink2); padding: 7px 11px; }
  .viewtog button + button { border-left: 1px solid var(--border); }
  .viewtog button.on { background: var(--ink); color: var(--paper); font-weight: 600; }
  /* THREE OR FOUR ACROSS — the third segment of the view switch, never wearing
     `.on` (it is not a third view). It says the NUMBER, because at 16px a
     bar-count picture is a grey smudge.
     ONE DELIBERATE DIFFERENCE FROM THE PLAYGROUND: there `--cols` governs the
     tile wall AND a run's own row of pictures, so the button is live in both
     views. Here a run's row is the SHEET's own grid — four cuts of a 2x2 sit
     two across because that is what the page looked like — so forcing three
     would draw a picture of a sheet that was never made. The number governs
     the WALL, which is one tap away and is where scanning happens. */
  .viewtog .colseg { font-weight: 600; font-size: 13px; letter-spacing: 0;
    padding: 7px 12px; min-width: 34px; box-sizing: border-box; }
  /* The two mark filters, one segmented box. LIT, THEY MUST NOT MATCH: the
     heart keeps only what it names and the ✕ drops it, so the ✕ takes the GREY
     of the dislike badge rather than the rose. */
  .filttog { margin-left: 8px; display: flex; flex: none; border: 1px solid var(--border);
    border-radius: 6px; overflow: hidden; background: var(--surface); }
  .likefilt { display: flex; align-items: center; justify-content: center; width: 34px;
    border: 0; background: none; color: var(--ink2); padding: 0; cursor: pointer; }
  .likefilt + .likefilt { border-left: 1px solid var(--border); }
  .likefilt svg { width: 16px; height: 16px; }
  .likefilt.on { background: var(--chg); color: #fff; }
  .xfilt.on { background: #9a938a; color: #fff; }
  /* 16px is a FLOOR, not a taste: iOS auto-zooms a focused input under 16px. */
  .feedsearch { flex: 1; min-width: 0; margin-left: 8px; position: relative; display: flex; }
  .feedsearch input { width: 100%; min-width: 0; font: inherit; font-size: 16px;
    color: var(--ink); background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 9px; }
  .feedsearch input.hasq { padding-right: 28px; }
  .feedsearch input:focus { outline: none; border-color: var(--chg); }
  .feedsearch input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
  /* CLEAR, not dismiss: it empties the box and keeps her in it. */
  .qclear { position: absolute; right: 0; top: 0; height: 100%; width: 28px; border: 0;
    background: none; color: #8a8177; font-size: 18px; line-height: 1; padding: 0; }

  #tiles { display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr));
    gap: 6px; align-items: start; }
  /* A tile / a cut. NEVER `.cell` — see the .pcell note above. */
  .pic { position: relative; display: block; }
  .pic img { width: 100%; display: block; background: #efe9dd; cursor: pointer; }
  .badge { position: absolute; top: 4px; right: 4px; width: 20px; height: 20px;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    pointer-events: none; }
  .badge.like { background: var(--chg); color: #fff; }
  .badge.dislike { background: #9a938a; color: #fff; }
  .badge svg { width: 12px; height: 12px; }
  /* A picture still being drawn holds its place, breathing — a flat empty box
     in a wall of pictures reads as a broken image rather than one on its way. */
  .pic.ph { background: #f0ebe3; border: 1px solid var(--line); border-radius: 6px;
    aspect-ratio: var(--ar, 2 / 3); animation: plwait 1.5s ease-in-out infinite; }
  @keyframes plwait { 0%, 100% { background: #f0ebe3; } 50% { background: #e4dbcd; } }

  .plan { font: 500 12px/1.5 -apple-system, sans-serif; color: var(--ink2); margin: 0 0 12px; }
  .plan b { color: var(--ink); font-weight: 600; }
  #msg { font: 500 12px/1.5 -apple-system, sans-serif; color: var(--chg); min-height: 18px; margin: 0 0 10px; }
  .emptynote { font: 500 13px/1.5 -apple-system, sans-serif; color: #8a8177;
    padding: 18px 0; text-align: center; }
  #tiles .emptynote { grid-column: 1 / -1; }

  .run { border-top: 1px solid var(--line); padding: 14px 0 4px; }
  .runhead { font: 500 11px/1.5 -apple-system, sans-serif; color: var(--ink2);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; margin-bottom: 8px; }
  .runhead b { color: var(--ink); font-weight: 600; }
  /* HER WORDS ON THE CARD, behind the house "… more" opener — the Playground's
     `.p.clamp` machinery, ported verbatim in shape. The card used to carry
     only the geometry and the style, so the one thing that tells two runs
     apart — what she asked for — was nowhere on the feed at all.
     The opener rides ON THE LAST LINE of the words, never parked beside them:
     a max-height clamp plus a right float with `clear:both` sitting below a
     zero-width float one line SHORT of the cap. Both floats come BEFORE the
     text in DOM order, so neither is clipped by the clamp. `fold` is added by
     JS and only where the words really were cut. */
  .runhead .p { display: block; font: 600 14px/20px -apple-system, sans-serif;
    color: var(--ink); flex: 1 1 100%; min-width: 70%; --lh: 20px; --lines: 2; }
  .runhead .p.clamp { max-height: calc(var(--lines) * var(--lh)); overflow: hidden; }
  .runhead .p.clamp.fold::before { content: ''; float: left; width: 0;
    height: calc((var(--lines) - 1) * var(--lh)); }
  .runhead .p > .moretxt { float: right; clear: both; margin-left: 8px; height: var(--lh);
    display: inline-flex; align-items: baseline; }
  .runhead .p:not(.clamp) > .moretxt { float: none; margin-left: 6px; }
  /* THE HOUSE OPENER FOR TRUNCATED TEXT — an underlined word, never a button
     (docs/design-rules.md). Still a <button> ELEMENT; the rule is about paint. */
  .moretxt { display: inline; border: 0; background: none; margin: 0; padding: 0;
    font: inherit; font-size: 12.5px; color: var(--ink2); text-decoration: underline;
    -webkit-tap-highlight-color: transparent; cursor: pointer; }
  .copybtn { flex: none; width: 24px; height: 24px; display: inline-flex; align-items: center;
    justify-content: center; padding: 0; border: none; background: none; color: #8a8177;
    cursor: pointer; }
  .copybtn svg { width: 14px; height: 14px; }
  .cuts { display: grid; grid-template-columns: repeat(var(--across, 2), minmax(0, 1fr));
    gap: 6px; align-items: start; }
  .cuts figure { margin: 0; }
  /* No rounded corner and no outline on a PICTURE (Sophie, 2026-08-24) — her
     rounded boxes are for words; a radius on the art reads as a crop. */
  .cuts img, .sheetimg { width: 100%; display: block; background: #efe9dd; }
  .cuts figcaption { font: 500 10px/1.35 -apple-system, sans-serif; color: var(--ink2);
    margin-top: 3px; }
  .sheetwrap { margin-bottom: 8px; position: relative; display: inline-block; max-width: 44%; }
  .sheetwrap .sheetimg { width: 100%; }

  /* "Older" — the way further back through the feed. Hugs its text, rounded
     rectangle (no pills), centred under whichever view is showing. */
  #more { display: flex; justify-content: center; padding: 4px 0 22px; }
  .morebtn { border: 1px solid var(--border); border-radius: 6px; padding: 9px 18px;
    font: inherit; font-size: 14px; background: var(--surface); color: var(--ink2); cursor: pointer; }
  .morebtn[disabled] { opacity: .55; }

  /* One line, bottom centre. Above the lightbox — Save reports from in there. */
  #toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: var(--ink); color: var(--paper); font: 500 13.5px/1.4 -apple-system, sans-serif;
    border-radius: 6px; padding: 9px 14px; z-index: 70; opacity: 0; pointer-events: none;
    transition: opacity .18s; max-width: 84vw; text-align: center; }
  #toast.on { opacity: 1; }

</style>

<body class="tool">
<header class="head">
  <div class="eyebrow tool-eyebrow">PANELS</div>
  <button id="help" type="button" aria-label="What this is">?</button>
</header>
<div class="helpcard" id="helpcard" hidden></div>

<main>
  <nav class="toptabs">
    <button type="button" class="on">Panels</button>
    <button type="button" id="tab-playground">Playground</button>
  </nav>
  <div class="ctrls" id="ctrls"></div>
  <div class="ppanel" id="ppanel"></div>
  <div class="cells" id="cells"></div>
  <p class="plan" id="plan"></p>
  <p id="msg"></p>
  <div class="feedbar">
    <div class="viewtog" id="viewseg">
      <button type="button" data-view="list">List</button><button type="button" data-view="tiles">Tiles</button><button type="button" class="colseg" id="v-cols"></button>
    </div>
    <div class="filttog" role="group" aria-label="Filters">
      <button class="likefilt" id="v-liked" type="button" aria-label="Show only the ones you hearted" title="Hearts only"></button>
      <button class="likefilt xfilt" id="v-hidex" type="button" aria-label="Hide the ones you have crossed out" title="Hide the crossed-out"></button>
    </div>
    <div class="feedsearch">
      <input id="q" type="search" placeholder="Search" aria-label="Search your sheets"
             autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="search">
      <button class="qclear" id="qclear" type="button" aria-label="Clear search" hidden>&times;</button>
    </div>
  </div>
  <div id="feed"></div>
  <div id="tiles" hidden></div>
  <div id="more"></div>
</main>

<div id="toast"></div>


<script>
(function () {
  'use strict';
  var FK = window.FeedKit;
  // THE AIM RULE LIVES IN /tritoggle.js — the ONE copy, shared with every other
  // three-way toggle. This line is only a floor for the case where that file
  // does not load (a stale cache, a stub harness that serves nothing else): it
  // is the pre-2026-08-24 CYCLE, deliberately not a second implementation of
  // the aim, so a page can never quietly grow its own version of the rule.
  var triNext = window.triNext || function (el, count, ev, cur) {
    return ((cur | 0) + 1 + count) % count;
  };

    if (!p) return;
    var missing = [];
    for (var i = 0; i < p.count; i++) if (!(words[i] || '').trim()) missing.push(i);
    if (missing.length) {
      missing.forEach(function (i) {
        var t = document.getElementById('c' + i);
        if (t) t.classList.add('want');
      });
      $('#msg').textContent = 'every panel needs words — the model fills an empty one with whatever it likes, at the sheet’s price';
      return;
    }
    var body = { grid: pick.grid, shape: pick.shape, res: pick.res,
      quality: pick.quality, style: pick.style,
      panels: Array.from({ length: p.count }, function (_, i) { return words[i]; }) };
    // Only send a half she actually changed — an absent field keeps the house
    // text, which is what makes an ordinary run byte-for-byte what it was.
    var over = overrideFor(pick.style);
    if (over) { body.prefix = over.prefix; body.suffix = over.suffix; }
    $('#go').disabled = true;
    $('#msg').textContent = 'drawing the sheet…';
    fetch('/api/panels', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        $('#go').disabled = false;
        if (j.error) { $('#msg').textContent = j.error; return; }
        $('#msg').textContent = '';
        remember(j.id);
        poll(j.id);
        load();
      })
      .catch(function (e) { $('#go').disabled = false; $('#msg').textContent = e.message; });
  }

  function poll(id) {
    if (polling[id]) return;
    polling[id] = setInterval(function () {
      fetch('/api/panels/' + id).then(function (r) { return r.json(); }).then(function (d) {
        if (d.status === 'done' || d.status === 'failed') {
          clearInterval(polling[id]); delete polling[id]; forget(id);
        }
        load();
      }).catch(function () {});
    }, 4000);
  }

  // ── THE VIEWS AND THE FILTERS ───────────────────────────────────────────
  // All four are STICKY, exactly as the Playground's are, so a reload keeps
  // what she was looking at. The search deliberately is NOT: a query typed
  // yesterday silently hiding most of the feed on open is a worse surprise
  // than re-typing four letters.
  var view = ls.get('forge.panels.view', 'list') === 'tiles' ? 'tiles' : 'list';
  function likedOnly() { return ls.get('forge.panels.liked', '') === '1'; }
  function hideX() { return ls.get('forge.panels.hidex', '') === '1'; }
  var COLS = [3, 4];
  function curCols() {
    var n = parseInt(ls.get('forge.panels.cols', '3'), 10);
    return COLS.indexOf(n) >= 0 ? n : 3;
  }
  function applyCols() {
    var n = curCols(), next = COLS[(COLS.indexOf(n) + 1) % COLS.length];
    document.documentElement.style.setProperty('--cols', String(n));
    var b = document.getElementById('v-cols');
    b.textContent = String(n);
    b.setAttribute('aria-label', n + ' pictures a row on the wall — tap for ' + next);
    b.title = n + ' a row';
  }
  function paintView() {
    Array.prototype.forEach.call(document.querySelectorAll('#viewseg button[data-view]'), function (b) {
      b.classList.toggle('on', b.dataset.view === view);
    });
    $('#feed').hidden = view !== 'list';
    $('#tiles').hidden = view !== 'tiles';
    // Coming back to the list: anything drawn while it was hidden measured 0/0
    // and is still undecided, so measure it now that it has a box.
    if (view === 'list') resyncClamps();
  }
  $('#viewseg').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    if (b.id === 'v-cols') {
      ls.set('forge.panels.cols', String(COLS[(COLS.indexOf(curCols()) + 1) % COLS.length]));
      applyCols();
      return;
    }
    if (!b.dataset.view) return;
    view = b.dataset.view;
    ls.set('forge.panels.view', view);
    paintView();
  });
  document.getElementById('v-liked').innerHTML = ICONS.heart;
  document.getElementById('v-hidex').innerHTML = ICONS.x;
  function paintFilters() {
    document.getElementById('v-liked').classList.toggle('on', likedOnly());
    document.getElementById('v-hidex').classList.toggle('on', hideX());
  }
  document.getElementById('v-liked').addEventListener('click', function () {
    ls.set('forge.panels.liked', likedOnly() ? '' : '1'); paintFilters(); render();
  });
  document.getElementById('v-hidex').addEventListener('click', function () {
    ls.set('forge.panels.hidex', hideX() ? '' : '1'); paintFilters(); render();
  });

  // ── SEARCH ──────────────────────────────────────────────────────────────
  // The house grammar (FeedKit, shared with the Playground): bare words AND
  // within one run, `OR` for either, `-word` to exclude, "quoted" for a
  // phrase. It reads the WHOLE history, not the page she is looking at — the
  // Assets tab's lesson, which this feed would have re-lived the moment she
  // had more sheets than one page of them. The loaded runs are filtered
  // INSTANTLY meanwhile, with the same regexes, so the two can never disagree.
  var query = '', qGroups = [], hits = null, qSeq = 0, qTimer = null;
  function runHay(r) {
    var shape = r.shape === 'landscape' ? 'landscape side by side'
      : (r.shape === 'square' ? 'square' : 'portrait');
    return [(r.panels || []).join('  '), styleLabel(r.style), r.style, r.quality,
      r.res, r.sheetSize, r.cellSize, shape, r.count + ' panels',
      r.status === 'failed' ? 'failed' : ''].filter(Boolean).join('  ');
  }
  function visibleRuns() {
    if (!qGroups.length) return feed;
    if (hits) return hits;
    return feed.filter(function (r) { return FK.qmatch(runHay(r), qGroups); });
  }
  function runSearch() {
    var seq = ++qSeq, want = query;
    if (!want) { hits = null; return; }
    fetch('/api/panels?q=' + encodeURIComponent(want) + '&limit=200')
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (seq !== qSeq) return;                  // she typed on; this answer is stale
        var runs = d.runs || [];
        runs.forEach(function (r) { runsById[r.id] = r; });
        hits = runs;
        render();
      })
      .catch(function () { /* the client-filtered view stands */ });
  }
  function readSearch() {
    var box = document.getElementById('q');
    query = (box.value || '').trim();
    qGroups = FK.qparse(query);
    document.getElementById('qclear').hidden = !query;
    box.classList.toggle('hasq', !!box.value);     // the ✕'s padding, only while it shows
    hits = null;                                   // the loaded feed answers meanwhile
    clearTimeout(qTimer);
    if (query) qTimer = setTimeout(runSearch, 350);
    else qSeq++;                                   // and any answer still coming is dropped
    render();
  }
  var qLive = FK.liveInput(document.getElementById('q'), readSearch);
  // `qLive.sync()` inside it: the blur Return performs would otherwise be
  // liveInput's first sight of dictated text and would search a second time.
  FK.enterSubmits(document.getElementById('q'), function () { readSearch(); qLive.sync(); });
  document.getElementById('qclear').addEventListener('click', function () {
    var box = document.getElementById('q');
    box.value = ''; qLive.sync(); readSearch(); box.focus();
  });

  // ── ♥ / ✕ ───────────────────────────────────────────────────────────────
  // The mark lives on the RUN doc, keyed by CELL NAME, and the route mirrors
  // it onto the Assets record for the same picture — so the feed, the wall,
  // the lightbox and Meta Assets are one answer. Tapping the mark she is
  // already on clears it. Painted OPTIMISTICALLY: the picture is under her
  // thumb and a round trip before the badge appears reads as a dead button.
  function voteOf(r, cell) { return (r && r.votes && r.votes[cell]) || ''; }
  function castVote(runId, cell, kind) {
    var r = runsById[runId];
    if (!r) return;
    var votes = r.votes = r.votes || {};
    var next = votes[cell] === kind ? null : kind;
    if (next === null) delete votes[cell]; else votes[cell] = next;
    render();
    fetch('/api/panels/' + runId + '/vote', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ cell: cell, vote: next || '' }),
    }).then(function (res) { return res.json(); })
      .then(function (j) { if (j && j.error) FK.toast(j.error); })
      .catch(function () { FK.toast('Couldn’t save that — try again'); });
    return next;
  }

  // ── THE FEED, RECONCILED NEVER REBUILT ──────────────────────────────────
  // (2026-08-25, Sophie: "once I send it to be made it flashes like every two
  // seconds".) FeedKit.syncChildren keys every node, so a picture already on
  // screen is never touched — it is the Playground's own rule and now the same
  // code. The head line repaints, the sheet lands once, a new cut is appended.
  function styleLabel(id) {
    var s = (cfg && cfg.styles.filter(function (x) { return x.id === id; })[0]) || null;
    return (s && s.label) || id || '';
  }
  function disp(url, w) { return FK.thumbFor(url, w || 480); }

  function runTags(r) {
    return [r.count + ' × ' + (r.cellSize || ''), 'sheet ' + (r.sheetSize || ''),
      styleLabel(r.style), r.quality,
      r.status === 'running' ? ((r.job && r.job.label) || 'working…') : '',
      r.status === 'failed' ? (r.error || 'failed') : ''].filter(Boolean);
  }
  // HER WORDS, one line, cells joined — the thing that tells two sheets apart.
  function runWords(r) { return (r.panels || []).map(function (p) { return String(p).trim(); })
    .filter(Boolean).join(' · '); }

  function headHtml(r) {
    return '<span class="p clamp">' + esc(runWords(r)) + '</span>'
      + '<button type="button" class="copybtn" data-copy="' + esc(r.id) + '"'
      + ' aria-label="Put these prompts back in the boxes">' + ICONS.copy + '</button>'
      + runTags(r).map(function (t) { return '<span>' + esc(t) + '</span>'; }).join('');
  }
  function badgeFor(vote) {
    if (!vote) return '';
    return '<span class="badge ' + vote + '">' + (vote === 'like' ? ICONS.heart : ICONS.x) + '</span>';
  }

  // One cut = one figure. The picture is the DERIVED display copy; the
  // ORIGINAL rides on data-full and is what the lightbox and Save open.
  function makeCut() {
    var fig = document.createElement('figure');
    fig.className = 'pic';
    fig.innerHTML = '<img loading="lazy"><figcaption></figcaption>';
    return fig;
  }
  function updateCut(el, it) {
    var img = el.querySelector('img');
    if (img.getAttribute('src') !== it.src) img.setAttribute('src', it.src);
    img.alt = it.cell;
    img.dataset.full = it.full; img.dataset.cell = it.cell; img.dataset.run = it.runId;
    el.querySelector('figcaption').textContent = it.cell;
    var have = el.querySelector('.badge');
    var was = have ? (have.classList.contains('like') ? 'like' : 'dislike') : '';
    if (was !== it.vote) {
      if (have) have.remove();
      if (it.vote) el.insertAdjacentHTML('afterbegin', badgeFor(it.vote));
    }
  }
  function makeTile(it) {
    var d = document.createElement('div');
    d.className = it.ph ? 'pic ph' : 'pic';
    if (it.ph) { d.style.setProperty('--ar', it.ar || '2 / 3'); return d; }
    d.innerHTML = '<img loading="lazy">';
    return d;
  }
  function updateTile(el, it) {
    if (it.ph) return;
    var img = el.querySelector('img');
    if (img.getAttribute('src') !== it.src) img.setAttribute('src', it.src);
    img.alt = it.cell;
    img.dataset.full = it.full; img.dataset.cell = it.cell; img.dataset.run = it.runId;
    var have = el.querySelector('.badge');
    var was = have ? (have.classList.contains('like') ? 'like' : 'dislike') : '';
    if (was !== it.vote) {
      if (have) have.remove();
      if (it.vote) el.insertAdjacentHTML('beforeend', badgeFor(it.vote));
    }
  }

  // The cuts a run shows AFTER the two mark filters. A run left with nothing
  // showing drops out of the feed entirely, the Playground's rule.
  function cutsOf(r) {
    var only = likedOnly(), nox = hideX();
    return (r.images || []).filter(function (im) {
      var v = voteOf(r, im.cell);
      if (only && v !== 'like') return false;
      if (nox && v === 'dislike') return false;
      return true;
    }).map(function (im) {
      return { key: r.id + '|' + im.cell, cell: im.cell, runId: r.id,
        src: disp(im.url, 480), full: im.url, vote: voteOf(r, im.cell) };
    });
  }

  function makeRun() {
    var d = document.createElement('div');
    d.className = 'run';
    d.innerHTML = '<div class="runhead"></div><div class="sheetwrap" hidden>'
      + '<img class="sheetimg" alt="the sheet" loading="lazy"></div><div class="cuts"></div>';
    return d;
  }
  function updateRun(el, it) {
    var r = it.run;
    if (el.__head !== it.headHtml) {
      el.querySelector('.runhead').innerHTML = it.headHtml;
      el.__head = it.headHtml;
      applyClamps(el);
    }
    var sw = el.querySelector('.sheetwrap');
    var si = sw.querySelector('img');
    sw.hidden = !r.sheetUrl;
    if (r.sheetUrl && si.dataset.full !== r.sheetUrl) {
      si.src = disp(r.sheetUrl, 720); si.dataset.full = r.sheetUrl;
      si.dataset.run = r.id; si.dataset.cell = 'sheet';
    }
    if (r.sheetUrl) {
      var have = sw.querySelector('.badge');
      var v = voteOf(r, 'sheet');
      var was = have ? (have.classList.contains('like') ? 'like' : 'dislike') : '';
      if (was !== v) { if (have) have.remove(); if (v) sw.insertAdjacentHTML('beforeend', badgeFor(v)); }
    }
    var cuts = el.querySelector('.cuts');
    cuts.style.setProperty('--across', it.across);
    FK.syncChildren(cuts, it.cuts, makeCut, updateCut);
  }

  function emptyNote() {
    if (qGroups.length) return '<div class="emptynote">Nothing matches that</div>';
    if (likedOnly()) return '<div class="emptynote">Nothing hearted yet</div>';
    if (hideX()) return '<div class="emptynote">Everything here is crossed out</div>';
    return '';
  }

  function render() {
    var runs = visibleRuns();
    var only = likedOnly(), nox = hideX();
    var items = [];
    runs.forEach(function (r) {
      runsById[r.id] = r;
      var g = (cfg.grids.filter(function (x) { return x.id === r.grid; })[0] || {});
      var cuts = cutsOf(r);
      // A filter that empties a run takes the run with it — but a run still
      // DRAWING has no pictures to have been hearted yet, so it is dropped by
      // the heart the way an unmarked picture is, and kept otherwise.
      if ((only || nox) && !cuts.length && r.status !== 'running') return;
      if (only && r.status === 'running') return;
      items.push({ key: r.id, run: r, cuts: cuts, across: (g.across || 2),
        headHtml: headHtml(r) });
    });
    var box = $('#feed');
    if (!items.length) box.innerHTML = emptyNote();
    else FK.syncChildren(box, items, makeRun, updateRun);
    renderTiles(runs);
    renderMoreBtn();
    if (lbOpen) lbRepaint();
  }

  // THE TILE WALL — every cut panel, newest run first, reading order within a
  // run, each at its own natural shape (the Playground's no-crop lesson). A
  // run still drawing holds one breathing square per panel at the FRONT, so
  // the wall is the whole feed and a picture on its way has its place in it
  // before it lands.
  function renderTiles(runs) {
    var items = [];
    var only = likedOnly();
    runs.forEach(function (r) {
      if (r.status === 'running' && !only) {
        var landed = (r.images || []).length;
        for (var i = landed; i < (r.count || 0); i++) {
          items.push({ key: 'ph|' + r.id + '|' + i, ph: true, ar: arCss(r.cellAspectRatio) });
        }
      }
      cutsOf(r).forEach(function (c) { items.push(c); });
    });
    var box = $('#tiles');
    if (!items.length) box.innerHTML = emptyNote();
    else FK.syncChildren(box, items, makeTile, updateTile);
  }
  // '2:3' -> '2 / 3'. Parsed rather than passed through — it lands in a style.
  function arCss(a) {
    var m = /^(\d{1,3}):(\d{1,3})$/.exec(String(a || ''));
    return m ? m[1] + ' / ' + m[2] : '2 / 3';
  }

  // ── "OLDER" ─────────────────────────────────────────────────────────────
  // Deliberately a TAP, never load-on-scroll: the autoscroll pill would run
  // the page to the bottom on its own and pull page after page of pictures
  // over her data without her asking for any of them. A search is already
  // answered over the whole history, so there is nothing behind it to page in.
  function renderMoreBtn() {
    var el = $('#more');
    if (qGroups.length || !feed.length || !feedMore) { el.innerHTML = ''; return; }
    el.innerHTML = '<button type="button" class="morebtn"' + (paging ? ' disabled' : '') + '>'
      + (paging ? 'Loading…' : 'Older') + '</button>';
  }
  $('#more').addEventListener('click', function (e) {
    if (!e.target.closest('.morebtn')) return;
    if (paging || !feedMore) return;
    var oldest = 0;
    for (var i = feed.length - 1; i >= 0; i--) { if (feed[i].ms) { oldest = feed[i].ms; break; } }
    if (!oldest) return;
    paging = true; renderMoreBtn();
    fetch('/api/panels?limit=' + PAGE + '&before=' + oldest)
      .then(function (r) { return r.json(); })
      .then(function (d) { paging = false; feedMore = !!d.more; merge(d.runs || []); render(); })
      .catch(function () { paging = false; renderMoreBtn(); });
  });

  // Fold a page into the feed. Fresh copies WIN (a vote or a status moved) and
  // the whole list is re-sorted by time, so a head refresh and an Older page
  // can arrive in any order without scrambling it.
  function merge(fresh) {
    var byId = {};
    feed.forEach(function (r) { byId[r.id] = r; });
    fresh.forEach(function (r) { byId[r.id] = r; });
    feed = Object.keys(byId).map(function (k) { return byId[k]; })
      .sort(function (a, b) { return (b.ms || 0) - (a.ms || 0); });
    Object.keys(byId).forEach(function (k) { runsById[k] = byId[k]; });
  }

  var loadBusy = false;
  function load() {
    if (loadBusy) return;
    loadBusy = true;
    fetch('/api/panels?limit=' + PAGE).then(function (r) { return r.json(); }).then(function (j) {
      loadBusy = false;
      if (feed.length <= PAGE) feedMore = !!j.more;
      merge(j.runs || []);
      render();
    }).catch(function () { loadBusy = false; });
  }

  // ── THE "… more" OPENER ─────────────────────────────────────────────────
  // Added only where the two-line cap really cut the words — scrollHeight
  // against clientHeight is the only honest test — and A BOX WITH NO LAYOUT IS
  // LEFT UNDECIDED: #feed is hidden in tiles view, so a card drawn while she
  // was on the wall measures 0/0, which reads as "nothing was cut". The head
  // html never changes again, so without this those cards would carry no
  // opener forever (the Playground measured 0 of 36 before its own fix).
  function applyClamps(root) {
    var ps = root.querySelectorAll('.p.clamp');
    Array.prototype.forEach.call(ps, function (el) {
      if (el.querySelector('.moretxt')) return;      // a repaint, already folded
      if (!el.clientHeight) return;                  // no layout — ask again later
      if (el.scrollHeight - el.clientHeight <= 1) return;
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'moretxt';
      btn.textContent = '… more';
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var open = el.classList.toggle('clamp') === false;
        el.classList.toggle('fold', !open);
        btn.textContent = open ? 'less' : '… more';
        // It rides at the END of the words when they are open and at the FRONT
        // when they are folded — the float only reaches the last line from in
        // front of the text, and unfloated at the front it would read before
        // the first word.
        if (open) el.appendChild(btn); else el.insertBefore(btn, el.firstChild);
      });
      el.insertBefore(btn, el.firstChild);
      el.classList.add('fold');
    });
  }
  function resyncClamps() { applyClamps($('#feed')); }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(resyncClamps);

  // PUT THESE PROMPTS BACK IN THE BOXES — the Playground's copy button, in the
  // shape this tool needs: a sheet's words are N boxes, so it restores the
  // GRID she drew it on as well, or the words would land in the wrong cells.
  $('#feed').addEventListener('click', function (e) {
    var cp = e.target.closest('[data-copy]');
    if (!cp) return;
    var r = runsById[cp.dataset.copy];
    if (!r) return;
    pick.grid = r.grid || pick.grid;
    pick.shape = r.shape || pick.shape;
    words = {};
    (r.panels || []).forEach(function (p, i) { words[i] = p; });
    paintCtrls(); paintCells(); paintPlan();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    FK.toast('Prompts are back in the boxes');
  });

  // ── THE LIGHTBOX ────────────────────────────────────────────────────────
  // THE ONE SHARED ASSETS LIGHTBOX (asset-lightbox.js) — never a fourth copy.
  // It draws the ♥/✕ and the note thread as soon as a caller wires `_cast`
  // and `_noteSend`, which is exactly what was missing here: the lightbox was
  // opened read-only, so there was no way to mark a panel and no way to leave
  // a note on one.
  //   the ♥/✕ goes to THIS run's doc, and the route mirrors it to the Assets
  //   record — so a mark here and a mark in Meta Assets are one answer.
  //   the note goes to the picture's own thread in `my-creations`, where every
  //   panel is filed, so a chat sweeping its notes finds it where it expects.
  var lbOpen = null;      // { runId, cell } while it is open
  var lbAsset = null;
  var noteCache = {};     // url -> thread, so re-opening a picture is free

  function styleHalf(r) {
    var gl = (cfg.gridLines || {})[r.grid] || '';
    var pre = [r.prefix, gl].filter(Boolean).join('\n\n');
    if (!pre && !r.suffix) return '';
    return [pre, '[content]', r.suffix].filter(Boolean).join('\n\n');
  }
  // UPSCALE IN THE PLAYGROUND (her ask, 2026-08-25: "being able to upscale
  // each panel individually as its own image so this could copy the text into
  // the playground"). The action carries the panel's own words, the tile it
  // was really drawn on (server `evan` is the page's `chatgpt` key — the Aug
  // 2026 rename moved only the label), its quality, and res=4k — a cut panel
  // is ~1K of pixels, and redrawing it alone at 4K is the upscale. sameref=1:
  // the reference and baked style prompt ARE this tile's own; only the grid
  // machinery differed.
  function upscaleUrl(r, im) {
    return '/playground?prompt=' + encodeURIComponent(im.prompt || '')
      + '&style=' + encodeURIComponent(r.style === 'evan' ? 'chatgpt' : (r.style || ''))
      + '&quality=' + encodeURIComponent(r.quality || 'medium')
      + '&res=4k&sameref=1&from=panels';
  }
  // SAVE TO PHOTOS — the Playground's three paths, in order: the app's native
  // bridge (the only reliable one in a WKWebView), the share sheet's "Save
  // Image", then a plain download for a desktop browser. Every path says what
  // happened; a failure is never silence.
  window.__saveResult = function (ok, msg) { FK.toast(msg || (ok ? 'Saved to Photos' : 'Couldn’t save that')); };
  function nativeSaver() {
    try { return window.webkit.messageHandlers.forgeSave; } catch (e) { return null; }
  }
  function saveToPhotos(url) {
    var native = nativeSaver();
    if (native) { native.postMessage(url); FK.toast('Saving…'); return; }
    FK.toast('Getting it ready…');
    fetch(url).then(function (r) { return r.blob(); }).then(function (blob) {
      // Named after the BYTES, not after what this tool usually makes: a .webp
      // name on png bytes is what the share sheet saves it as, and Photos
      // rejects webp outright.
      var ext = ((blob.type || '').split('/')[1] || 'png').replace('jpeg', 'jpg');
      var file = null;
      try { file = new File([blob], 'panel.' + ext, { type: blob.type || 'image/png' }); } catch (e) {}
      if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
        return navigator.share({ files: [file] }).catch(function (err) {
          if (err && err.name !== 'AbortError') FK.toast('Couldn’t open the share sheet');
        });
      }
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'panel.' + ext;
      document.body.appendChild(a); a.click(); a.remove();
      return null;
    }).catch(function () { FK.toast('Couldn’t fetch that picture'); });
  }

  function lbRepaint() {
    if (!lbOpen || !lbAsset || !lbAsset._lbPaint) return;
    lbAsset.vote = voteOf(runsById[lbOpen.runId], lbOpen.cell) || null;
    lbAsset._lbPaint();
  }

  function openFromImg(img) {
    if (!window.__assetLightbox) return;
    var r = runsById[img.dataset.run];
    if (!r) return;
    var cell = img.dataset.cell;
    var isSheet = cell === 'sheet';
    var im = isSheet ? null : (r.images || []).filter(function (x) { return x.cell === cell; })[0];
    if (!isSheet && !im) return;
    var url = img.dataset.full || img.src;
    var tier = String(r.res || '').toUpperCase();
    lbOpen = { runId: r.id, cell: cell };
    var asset = {
      description: isSheet ? 'the sheet — ' + r.count + ' panels' : (im.prompt || cell),
      prompt: (cfg.model || 'gpt-image-2') + ' · ' + (r.quality || '')
        + ' · ' + (isSheet ? tier : '1/' + r.count + ' (' + tier + ')'),
      promptStyle: styleHalf(r),
      promptContent: isSheet
        ? (r.panels || []).map(function (p) { return String(p).trim(); }).join('\n')
        : (im.prompt || ''),
      vote: voteOf(r, cell) || null,
      thread: noteCache[url] || [],
      _cast: function (kind) {
        asset.vote = castVote(r.id, cell, kind) || null;
        if (asset._lbPaint) asset._lbPaint();
      },
      _noteSend: function (text, cb) {
        fetch('/api/gallery/assets/note', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ chat: ASSET_CHAT, url: url, text: text, from: 'sophie' }),
        }).then(function (res) { return res.json(); })
          .then(function (j) {
            if (j && j.thread) noteCache[url] = j.thread;
            cb(!(j && j.error));
          })
          .catch(function () { cb(false); });
      },
      actions: [
        { label: 'Save to Photos', icon: ICONS.download,
          onClick: function () { saveToPhotos(url); } },
        { label: 'Send to the Story Room', icon: ICONS.share,
          onClick: function () { sendToStory(r.id, cell); } },
      ],
    };
    if (!isSheet) {
      asset.actions.push({ label: 'Upscale in the Playground', icon: PLAY_ICON,
        onClick: function () { location.href = upscaleUrl(r, im); } });
    }
    lbAsset = asset;
    window.__assetLightbox(url, asset);
    // The thread is ONE doc read, asked for after the picture is already up —
    // the sibling /notes route answers with a whole chat's worth and would be
    // the wrong thing to fetch to open one picture.
    fetch('/api/gallery/assets/note?chat=' + encodeURIComponent(ASSET_CHAT)
      + '&url=' + encodeURIComponent(url))
      .then(function (res) { return res.json(); })
      .then(function (j) {
        if (!j || j.error || !j.thread || !j.thread.length) return;
        noteCache[url] = j.thread;
        // Only repaint the picture she is still looking at.
        if (lbOpen && lbOpen.runId === r.id && lbOpen.cell === cell) {
          window.__assetLightbox(url, Object.assign(asset, { thread: j.thread }));
        }
      })
      .catch(function () {});
  }
  function lbTap(e) {
    var img = e.target.closest('img[data-run]');
    if (img) openFromImg(img);
  }
  $('#feed').addEventListener('click', lbTap);
  $('#tiles').addEventListener('click', lbTap);

  // ── SEND TO THE STORY ROOM ──────────────────────────────────────────────
  // IT WALKS THERE, IT DOES NOT POP UP (2026-08-26, Sophie, about the
  // Playground's own version of this button: "rather than this weird pop-up,
  // it should take me to the story room so I can pick myself"). The sheet she
  // retired was a second, worse copy of the shelf and of the placing step, so
  // this is a NAVIGATION into the room: her real shelf, the real covers, and
  // the same placement every other picture gets. `from=panels` is what tells
  // the room which feed to re-read the provenance out of, and the CELL is the
  // key here rather than an index — a resume re-cuts only the missing panels.
  function sendToStory(runId, cell) {
    location.href = '/storyroom?send=' + encodeURIComponent(runId)
      + '&cell=' + encodeURIComponent(cell) + '&from=panels';
  }

  // The app's nav-bar chevron asks the page first: close what is open, else
  // let the app leave the tool.
  window.__navBack = function () {
    var lb = document.getElementById('clightbox');
    if (lb && lb.classList.contains('on')) { lb.click(); return true; }
    return false;
  };

  // The Playground, one hairline tab away (her ask, 2026-08-25). A NAVIGATION,
  // not an embed — the Playground is its own page, and an iframe would double
  // every pill and toggle on screen.
  $('#tab-playground').addEventListener('click', function () {
    location.href = '/playground?from=panels';
  });

  // For the headless test only — the diff rule ("an image on screen is never
  // touched") can only be asserted by driving the render directly.
  window.__panelsRender = function (runs) { feed = runs.slice(); render(); };

  paintFilters(); applyCols(); paintView();

  fetch('/api/panels/config').then(function (r) { return r.json(); }).then(function (j) {
    cfg = j;
    pick.grid = j.defaults.grid; pick.shape = j.defaults.shape;
    pick.res = j.defaults.res; pick.quality = j.defaults.quality;
    pick.style = (j.styles.filter(function (s) { return s.id === j.defaults.style; })[0]
      || j.styles[0] || {}).id || '';
    paintCtrls(); paintCells(); paintPlan(); wire(); load();
    try {
      JSON.parse(localStorage.getItem('forge.panels.pending') || '[]').forEach(poll);
    } catch (e) { /* private window */ }
  }).catch(function (e) { $('#msg').textContent = 'could not load the config: ' + e.message; });

  // The "?" card — where every word of explanation lives (the house rule).
  var hc = $('#helpcard');
  hc.innerHTML = '<p>One page is drawn, then cut into separate pictures on our'
    + ' side. That is cheaper than drawing them one at a time twice over: the'
    + ' bill grows slower than the pixels, and the reference is paid for'
    + ' once instead of once per picture.</p>'
    + '<p>At 4K a quarter comes out bigger than an ordinary Playground picture.'
    + ' At 2K it comes out smaller — cheaper, but smaller.</p>'
    + '<p>Each panel is filed with its own words, captioned <b>1/4 (4K)</b> so'
    + ' the tag says which sheet it came off rather than its own pixel count.</p>'
    + '<p>Tap a picture to heart it, cross it out, read its prompt, leave a'
    + ' note on it, save it, send it to a story, or redraw it on its own at 4K'
    + ' in the Playground.</p>';
  $('#help').addEventListener('click', function () { hc.hidden = !hc.hidden; });
  hc.addEventListener('click', function () { hc.hidden = true; });
})();
</script>
