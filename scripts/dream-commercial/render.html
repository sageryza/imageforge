<!doctype html>
<!-- The dream-commercial chat renderer: a fake iOS group chat stepped by a
     Playwright driver (render.js) one message at a time. Not a served page —
     opened as file:// by the driver only, so none of the compare-page/house
     chrome contracts apply; it deliberately mimics Apple's Messages, because
     it is a filmed prop of that UI, not a surface of ours.
     API: window.__load(script) builds the steps; window.__setStep(i, p) shows
     steps 0..i-1 settled and step i at animation progress p (0..1). -->
<html><head><meta charset="utf-8">
<style>
  html, body { margin:0; padding:0; width:540px; height:960px; overflow:hidden;
    background:#000; font-family:'Liberation Sans','Helvetica Neue',Arial,'Noto Color Emoji',sans-serif;
    -webkit-font-smoothing:antialiased; }
  #phone { position:absolute; inset:0; background:#000; color:#fff; }

  /* status bar */
  #status { position:absolute; top:0; left:0; right:0; height:30px; z-index:30;
    display:flex; justify-content:space-between; align-items:center; padding:8px 22px 0; box-sizing:border-box;
    font-size:14px; font-weight:bold; }
  #status .icons { display:flex; gap:6px; align-items:center; }

  /* header */
  #hdr { position:absolute; top:30px; left:0; right:0; height:84px; z-index:20;
    background:#111114; border-bottom:0.5px solid #2c2c2e;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; }
  #hdr .back { position:absolute; left:14px; top:20px; }
  #hdr .avirc { width:38px; height:38px; border-radius:50%; background:#5e5ce6; color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:bold; }
  #hdr .gname { font-size:12.5px; color:#e5e5ea; }
  #hdr .gname .chev { color:#8e8e93; font-size:13px; }

  /* chat scroll area */
  #chat { position:absolute; top:114px; bottom:62px; left:0; right:0; overflow-y:auto; padding:10px 12px 6px; box-sizing:border-box; }
  #chat::-webkit-scrollbar { display:none; }

  .stamp { text-align:center; color:#8e8e93; font-size:11px; margin:10px 0 6px; }
  .stamp b { font-weight:bold; }

  .row { display:flex; align-items:flex-end; margin-top:2px; }
  .row.gap { margin-top:10px; }
  .row .av { width:26px; height:26px; border-radius:50%; flex:0 0 26px; margin-right:7px;
    color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:bold;
    visibility:hidden; }
  .row .stack { max-width:76%; display:flex; flex-direction:column; align-items:flex-start; }
  .row .who { color:#8e8e93; font-size:10.5px; margin:0 0 2px 12px; display:none; }
  .bub { background:#26252a; color:#fff; font-size:16px; line-height:1.28;
    padding:8px 13px; border-radius:18px; word-wrap:break-word; }
  .row.you { justify-content:flex-end; }
  .row.you .av { display:none; }
  .row.you .stack { align-items:flex-end; }
  .row.you .bub { background:#0a84ff; }
  .bub.img { padding:0; background:none; border-radius:14px; overflow:hidden; line-height:0; }
  .bub.img img { width:335px; display:block; }

  /* input bar */
  #inbar { position:absolute; left:0; right:0; bottom:0; height:62px; background:#111114;
    display:flex; align-items:center; gap:10px; padding:0 12px 12px; box-sizing:border-box; }
  #inbar .plus { width:32px; height:32px; border-radius:50%; background:#26252a; color:#8e8e93;
    display:flex; align-items:center; justify-content:center; font-size:20px; }
  #inbar .field { flex:1; height:34px; border:1px solid #3a3a3c; border-radius:17px;
    color:#8e8e93; font-size:15px; display:flex; align-items:center; padding:0 14px; }

  /* full-screen cards */
  .card { position:absolute; inset:0; z-index:50; display:none; align-items:center; justify-content:center;
    text-align:center; }
  .card .line { font-family:'Newsreader','Liberation Serif',Georgia,serif; font-style:italic; font-size:42px; }
  #endcard { display:none; position:absolute; inset:0; z-index:50; background:#14131a; text-align:center; }
  #endcard .moon { width:120px; height:120px; border-radius:50%; background:#e9e4d6; margin:250px auto 0; }
  #endcard .star { position:absolute; border-radius:50%; }
  #endcard .name { font-family:'Newsreader','Liberation Serif',Georgia,serif; font-style:italic;
    color:#f4f0e5; font-size:40px; margin-top:64px; }
  #endcard .url { color:#d9b3c0; font-size:15px; letter-spacing:3px; margin-top:18px; }
</style></head>
<body>
<div id="phone">
  <div id="status">
    <div>9:41</div>
    <div class="icons">
      <svg width="17" height="11" viewBox="0 0 17 11"><g fill="#fff"><rect x="0" y="7" width="3" height="4" rx="0.8"/><rect x="4.5" y="5" width="3" height="6" rx="0.8"/><rect x="9" y="2.5" width="3" height="8.5" rx="0.8"/><rect x="13.5" y="0" width="3" height="11" rx="0.8"/></g></svg>
      <svg width="16" height="11" viewBox="0 0 16 11"><path fill="#fff" d="M8 9.5 L5.8 7.2 C6.4 6.6 7.2 6.3 8 6.3 C8.8 6.3 9.6 6.6 10.2 7.2 Z M3.9 5.2 C5 4.1 6.5 3.4 8 3.4 C9.5 3.4 11 4.1 12.1 5.2 L13.9 3.4 C12.3 1.8 10.2 0.9 8 0.9 C5.8 0.9 3.7 1.8 2.1 3.4 Z"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3" fill="none" stroke="#fff" stroke-opacity="0.4"/><rect x="2" y="2" width="18" height="8" rx="1.6" fill="#fff"/><path fill="#fff" fill-opacity="0.4" d="M23 4 C24 4.3 24.5 5 24.5 6 C24.5 7 24 7.7 23 8 Z"/></svg>
    </div>
  </div>
  <div id="hdr">
    <div class="back"><svg width="12" height="21" viewBox="0 0 12 21"><path d="M10.5 1.5 L2 10.5 L10.5 19.5" stroke="#0a84ff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="avirc" id="gavatar"></div>
    <!-- a plain ›, not U+25B6 — that glyph renders as the orange emoji play
         button under Noto Color Emoji -->
    <div class="gname"><span id="gname"></span> <span class="chev">&#8250;</span></div>
  </div>
  <div id="chat"></div>
  <div id="inbar">
    <div class="plus">+</div>
    <div class="field">iMessage</div>
  </div>
  <div class="card" id="titlecard"><div class="line"></div></div>
  <div id="endcard">
    <div class="moon"></div>
    <div class="name"></div>
    <div class="url"></div>
  </div>
</div>
<script>
  let SCRIPT = null;
  const chat = document.getElementById('chat');

  function easeOutBack(t) {
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }

  window.__load = function (script) {
    SCRIPT = script;
    document.getElementById('gname').textContent = script.chatName;
    document.getElementById('gavatar').textContent = script.chatAvatar || script.chatName[0];
    const end = script.steps.find(s => s.type === 'end');
    if (end) {
      document.querySelector('#endcard .name').textContent = end.name;
      document.querySelector('#endcard .url').textContent = end.url;
      // a few flat stars around the moon, deterministic
      const stars = [[70, 190, 3, '#d9b3c0'], [430, 150, 2, '#e9e4d6'], [360, 300, 2.5, '#d9b3c0'],
        [120, 330, 2, '#e9e4d6'], [470, 390, 3, '#e9e4d6'], [60, 480, 2, '#d9b3c0']];
      for (const [x, y, r, c] of stars) {
        const d = document.createElement('div');
        d.className = 'star';
        d.style.cssText = `left:${x}px;top:${y}px;width:${r * 2}px;height:${r * 2}px;background:${c}`;
        document.getElementById('endcard').appendChild(d);
      }
    }
    return SCRIPT.steps.length;
  };

  // Build the chat DOM for the messages visible at step i (settled ones plus
  // the entering one), recomputing run grouping so sender names show on the
  // first bubble of a run and the avatar sits on the last.
  function rebuild(msgs) {
    chat.innerHTML = '';
    let lastStamp = null;
    msgs.forEach((m, idx) => {
      if (m.stamp && m.stamp !== lastStamp) {
        lastStamp = m.stamp;
        const st = document.createElement('div');
        st.className = 'stamp';
        st.innerHTML = '<b>Today</b> ' + m.stamp;
        chat.appendChild(st);
      }
      const prev = msgs[idx - 1], next = msgs[idx + 1];
      const firstOfRun = !prev || prev.from !== m.from || (next && next.stamp !== m.stamp && false) || (prev.stamp !== m.stamp);
      const lastOfRun = !next || next.from !== m.from || next.stamp !== m.stamp;
      const row = document.createElement('div');
      row.className = 'row' + (m.side === 'you' ? ' you' : '') + (firstOfRun ? ' gap' : '');
      const p = SCRIPT.people[m.from] || {};
      if (m.side !== 'you') {
        const av = document.createElement('div');
        av.className = 'av';
        av.style.background = p.color || '#666';
        av.textContent = (p.name || m.from)[0].toUpperCase();
        if (lastOfRun) av.style.visibility = 'visible';
        row.appendChild(av);
      }
      const stack = document.createElement('div');
      stack.className = 'stack';
      if (m.side !== 'you' && firstOfRun) {
        const who = document.createElement('div');
        who.className = 'who';
        who.style.display = 'block';
        who.textContent = p.name || m.from;
        stack.appendChild(who);
      }
      const bub = document.createElement('div');
      bub.className = 'bub' + (m.img ? ' img' : '');
      if (m.img) { const im = document.createElement('img'); im.src = m.img; bub.appendChild(im); }
      else bub.textContent = m.text;
      stack.appendChild(bub);
      row.appendChild(stack);
      row.dataset.i = m._i;
      chat.appendChild(row);
    });
  }

  window.__setStep = function (i, p) {
    const steps = SCRIPT.steps;
    const step = steps[i];
    // cards overlay whatever chat state precedes them
    const title = document.getElementById('titlecard');
    const endc = document.getElementById('endcard');
    title.style.display = 'none';
    endc.style.display = 'none';

    // collect visible messages: all msg steps at index <= i, minus anything
    // before the most recent clear/card-with-clear at or before i
    let start = 0;
    for (let k = 0; k <= i; k++) if (steps[k].clear) start = k;
    const msgs = [];
    for (let k = start; k <= i; k++) {
      const s = steps[k];
      if (s.type === 'msg') msgs.push({ ...s, _i: k });
    }
    rebuild(msgs);

    if (step.type === 'msg') {
      const row = chat.querySelector(`.row[data-i="${i}"]`);
      if (row && p < 1) {
        const e = easeOutBack(p);
        const bub = row.querySelector('.stack');
        bub.style.transform = `scale(${0.5 + 0.5 * e}) translateY(${(1 - e) * 14}px)`;
        bub.style.transformOrigin = step.side === 'you' ? 'bottom right' : 'bottom left';
        bub.style.opacity = Math.min(1, p * 2.5);
      }
    } else if (step.type === 'card') {
      title.style.display = 'flex';
      title.style.background = step.bg;
      title.style.opacity = p;
      const line = title.querySelector('.line');
      line.textContent = step.text;
      line.style.color = step.fg;
    } else if (step.type === 'end') {
      endc.style.display = 'block';
      endc.style.opacity = p;
    }
    chat.scrollTop = chat.scrollHeight;
  };

  window.__imagesReady = function () {
    const imgs = [...document.images];
    return imgs.every(im => im.complete && im.naturalWidth > 0);
  };
</script>
</body></html>
